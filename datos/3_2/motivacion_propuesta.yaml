motivacion:
  s1: |-
    Una aplicación lineal $f:\mathbb R^2\to\mathbb R^2$ puede dejar la imagen en una sola recta: muchos vectores distintos acaban en el mismo punto. ¿Qué vectores se «pierden» en el origen y qué puntos se pueden alcanzar de verdad?
  s2: |-
    Aplicas $f$ a todos los vectores del plano. ¿Qué forma tiene el conjunto de resultados: un trozo cualquiera, o siempre un subespacio? ¿Y cómo describirlo sin recorrer infinitos vectores?
  s3: |-
    Si $f(x,y,z)=(x,y)$, ¿qué vectores de $\mathbb R^3$ se aplastan en $(0,0)$? ¿Basta mirar el cero, o hay una recta entera que desaparece? ¿Qué pasa con la suma de dos vectores que desaparecen?
  s4: |-
    Una aplicación de $\mathbb R^3$ en $\mathbb R^2$ no puede ser «perfecta»: algo tiene que perderse. Si la imagen ocupa un plano de $\mathbb R^3$ de partida, ¿cuánto espacio sobra para el núcleo? ¿Hay una cuenta que lo ligue?
  s5: |-
    Dos vectores distintos que acaban en el mismo punto, o un punto del destino que nadie alcanza: ¿cómo se traducen esos dos fallos en el núcleo y en la imagen? ¿Cuándo no falla ninguno?
  s6: |-
    Te dan una aplicación como una matriz $3\times4$ y te piden núcleo, imagen y dimensiones. ¿Es posible sacar todo con una única escalonada, sin resolver dos problemas por separado?
consignas:
  - animacion: |-
      Interactivo: núcleo e imagen de una aplicación de
    consigna: |-
      Con la matriz inicial mueve el vector $x$ y fíjate en cómo se mueve su imagen; después arrastra $x$ a lo largo de la recta verde discontinua y mira qué ocurre en el punto de llegada. Prueba luego «Isomorfismo» y «Aplicación nula».
    pregunta: |-
      ¿Qué pasa con el núcleo y la imagen en cada caso, y cuánto suman sus dimensiones?
  - animacion: |-
      Interactivo 3D
    consigna: |-
      Pulsa cada caso preparado y mueve el vector $x$ fijándote en qué figura forman el núcleo (lo que se aplasta) y la imagen (lo que se alcanza).
    pregunta: |-
      ¿Cuánto vale siempre la suma de la dimensión del núcleo y la de la imagen?
  - animacion: |-
      Interactivo: rango por Gauss
    consigna: |-
      Avanza paso a paso y fíjate en qué filas quedan nulas y en qué columnas tienen pivote. Después cambia algún número de la matriz y mira cómo varía el rango.
    pregunta: |-
      ¿Cuántos parámetros libres tiene el núcleo en cada caso y qué relación guardan con el rango?
