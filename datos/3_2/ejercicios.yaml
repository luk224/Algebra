  nivel: 2
  titulo: |-
    Ejercicio 3.20 — matriz, núcleo y dimensión de la imagen, $\mathbb R^4\to P_2$
  enunciado: |-
    Si las imágenes por una aplicación lineal $f$ de los vectores de la base canónica de $\mathbb R^4$ en $P_2$ son $(1,0,-1)$, $(2,-4,1)$, $(-1,0,-2)$, $(2,-2,-2)$, se pide: A) Matriz y ecuaciones de $f$ en las bases canónicas. B) Ecuaciones y una base de $\operatorname{Nuc}(f)$. C) Dimensión de $\operatorname{Im}(f)$. D) Instrucciones de MAXIMA que permiten encontrar una base y la dimensión del núcleo de $f$.
  pista: |-
    Las imágenes de la base canónica son las columnas de $A$ (en la base $1,x,x^2$). Escalona: el núcleo sale de $AX=0$ y la dimensión de la imagen es el rango.
  cuerpo:
  - html: |-
      <p><i>Interpretación.</i> $P_2$ son los polinomios de grado $\le2$, con base canónica $\{1,x,x^2\}$. Las ternas son <b>coordenadas</b> en esa base: $f(e_1)=1-x^2$, $f(e_2)=2-4x+x^2$, $f(e_3)=-1-2x^2$, $f(e_4)=2-2x-2x^2$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Matriz, base y ecuaciones del núcleo, y dimensión de la imagen, de $f:\mathbb R^4\to P_2$.
      - - |-
          Cómo lo pienso
        - |-
          La matriz tiene por columnas las coordenadas de las imágenes de la base canónica. El núcleo son las soluciones de $AX=0$; con 4 incógnitas y rango como mucho 3, habrá al menos un parámetro libre. La dimensión de la imagen sale del teorema de las dimensiones.
      - - |-
          Qué uso
        - |-
          <b>Matriz asociada (Def. 3.4, U p.116):</b> la columna $j$ son las coordenadas de $f(e_j)$ en la base de llegada; entonces $f(x)=Ax$. <b>Núcleo (Def. 3.3, U p.109):</b> $\operatorname{Nuc}f=\{v:f(v)=\bar0\}=$ soluciones del sistema homogéneo $Ax=0$. Es subespacio de $V$. <b>Teorema de las dimensiones (Teor. 3.1):</b> $\operatorname{Dim}\operatorname{Nuc}f+\operatorname{Dim}\operatorname{Im}f=\operatorname{Dim}V$ (V = espacio de <i>partida</i>); $\operatorname{Dim}\operatorname{Im}f=\operatorname{rang}A$.
      - - |-
          Por dónde empiezo
        - |-
          Matriz por columnas, escalono para resolver el homogéneo y resto de $4$.
  - pasos:
    - |-
      <b>A) Matriz</b> (columna $j$ = coordenadas de $f(e_j)$, Def. 3.4, U p.116) y ecuaciones $Y=AX$ (U p.117):
            $$A=\begin{pmatrix}1&2&-1&2\\0&-4&0&-2\\-1&1&-2&-2\end{pmatrix}.$$
            <p>Las ecuaciones de $f$ son</p>
            $$\begin{cases}y_1=x_1+2x_2-x_3+2x_4\\y_2=-4x_2-2x_4\\y_3=-x_1+x_2-2x_3-2x_4\end{cases}$$
            <p>donde $(y_1,y_2,y_3)$ son las coordenadas de $f(x)=y_1+y_2x+y_3x^2$.</p>
    - |-
      <b>B) Ecuaciones del núcleo.</b> $x\in\operatorname{Nuc}(f)\iff f(x)$ es el polinomio nulo $\iff y_1=y_2=y_3=0$ (Def. 3.3, U p.109): el sistema $AX=0$.
    - |-
      <b>Gauss.</b> Con $F_3\to F_3+F_1$ (para anular el $-1$ de la primera columna):
            $$\begin{pmatrix}1&2&-1&2\\0&-4&0&-2\\0&3&-3&0\end{pmatrix}$$
            <p>que equivale al sistema</p>
            $$\begin{cases}x_1+2x_2-x_3+2x_4=0\\-4x_2-2x_4=0\ \Rightarrow\ x_4=-2x_2\\3x_2-3x_3=0\ \Rightarrow\ x_3=x_2\end{cases}$$
            <p>Hay tres pivotes (rango 3) y cuatro incógnitas: <b>un parámetro libre</b>, $x_2=\alpha$.</p>
    - |-
      <b>Resolver hacia arriba.</b> $x_3=\alpha$, $x_4=-2\alpha$ y, de la 1.ª ecuación,
            $$x_1=-2x_2+x_3-2x_4=-2\alpha+\alpha+4\alpha=3\alpha.$$
            <p>En forma vectorial:</p>
            $$(x_1,x_2,x_3,x_4)=\alpha\,(3,1,1,-2).$$
            <p><b>Base de $\operatorname{Nuc}(f)$: $\{(3,1,1,-2)\}$</b>, $\operatorname{Dim}\operatorname{Nuc}(f)=1$. Ecuaciones cartesianas reducidas: $x_1=3x_2$, $x_3=x_2$, $x_4=-2x_2$. Comprobación:</p>
            $$A\,(3,1,1,-2)^T=(3+2-1-4,\ -4+4,\ -3+1-2+4)=(0,0,0)\ ✓$$
    - |-
      <b>C) Dimensión de la imagen</b> (Teor. 3.1, U p.111):
            $$\operatorname{Dim}\operatorname{Im}(f)=\operatorname{Dim}\mathbb R^4-\operatorname{Dim}\operatorname{Nuc}(f)=4-1=3$$
            <p>(coincide con el rango de $A$). <b>Consecuencia:</b> una base de $\operatorname{Im}(f)$ son 3 vectores libres de $P_2$, que tiene dimensión 3, luego (Teor. 2.6) <b>$\operatorname{Im}(f)=P_2$</b>.</p>
    - |-
      <b>D) Maxima</b> (fuera de examen): <code>nullspace(A)</code> (base del núcleo) y <code>nullity(A)</code> (dimensión). En sympy: <code>A.nullspace()</code>, <code>len(A.nullspace())</code>.
  - resultado: |-
      $\operatorname{Nuc}(f)=\langle(3,1,1,-2)\rangle$, $\operatorname{Dim}\operatorname{Im}(f)=3$ e $\operatorname{Im}(f)=P_2$. <i>(Verificado con sympy: rango 3; el núcleo que da sympy, $(-\tfrac32,-\tfrac12,-\tfrac12,1)$, es $-\tfrac12(3,1,1,-2)$, el mismo subespacio.)</i>
  - receta: |-
      núcleo = soluciones de $AX=0$: escalona, despeja en función de los parámetros libres y saca un vector por parámetro. $\operatorname{Dim}\operatorname{Im}=n-\operatorname{Dim}\operatorname{Nuc}=\operatorname{rang}A$; si coincide con la dimensión del espacio final, la imagen es todo ese espacio.
  - error: |-
      olvidar que la base del núcleo está en el espacio <b>inicial</b> ($\mathbb R^4$, 4 coordenadas), mientras que la imagen está en $P_2$ (3 coordenadas); o dar las 4 columnas como base de la imagen (son ligadas: el rango es 3).
  - teoria: |-
      Def. 3.3 y Teor. 3.1, U p.109-111 · Def. 3.4, U p.116
