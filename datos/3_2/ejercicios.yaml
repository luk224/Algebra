      Ejercicios de Álgebra, Ej. 3.25, p. 101
    texto: |-
      E p.101
  problema:
  - matriz
  - imagen
  nivel: 1
  titulo: |-
    Ejercicio 3.25 — matriz de la derivada en $P_3$ e imagen
  enunciado: |-
    Si $P_3(x)$ es el espacio vectorial de los polinomios reales de una variable y grado $\le3$, y $f$ es el endomorfismo de $P_3(x)$ que asigna a cada polinomio su primera derivada, se pide: matriz de la aplicación, una base y dimensión de $\operatorname{Im}(f)$.
  pista: |-
    Deriva cada vector de la base $1,x,x^2,x^3$ y escribe el resultado en coordenadas: esas son las columnas. La imagen son las columnas independientes.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Matriz de la derivada en $P_3$ y base y dimensión de su imagen.
      - - |-
          Cómo lo pienso
        - |-
          Derivar baja el grado: la imagen son los polinomios de grado $\le2$. La matriz tiene una diagonal desplazada con $1,2,3$ y una columna nula (la derivada de una constante).
      - - |-
          Qué uso
        - |-
          <b>Matriz asociada (Def. 3.4, U p.116):</b> la columna $j$ son las coordenadas de $f(e_j)$ en la base de llegada; entonces $f(x)=Ax$. Base canónica de $P_3$: $\{1,x,x^2,x^3\}$. <b>Imagen:</b> $\operatorname{Im}f=\{f(v)\}$ = subespacio generado por las columnas de $A$ (los $f(e_j)$). Es subespacio de $W$.
      - - |-
          Por dónde empiezo
        - |-
          Derivo cada vector de la base canónica y pongo las coordenadas por columnas.
  - pasos:
    - |-
      <b>¿Es lineal?</b>
            $$(p+\lambda q)'=p'+\lambda q':$$
            <p>cumple la Def. 3.1 (U p.101). Además la derivada de un polinomio de grado $\le3$ tiene grado $\le2$, luego está en $P_3(x)$: es un endomorfismo.</p>
    - |-
      <b>Imágenes de la base canónica $\{1,x,x^2,x^3\}$:</b>
            $$f(1)=0,\quad f(x)=1,\quad f(x^2)=2x,\quad f(x^3)=3x^2.$$
            <p>En coordenadas: $(0,0,0,0)$, $(1,0,0,0)$, $(0,2,0,0)$, $(0,0,3,0)$.</p>
    - |-
      <b>Matriz</b> (esas coordenadas en <b>columnas</b>, Def. 3.4, U p.116):
            $$D=\begin{pmatrix}0&1&0&0\\0&0&2&0\\0&0&0&3\\0&0&0&0\end{pmatrix}.$$
            <p>Comprobación: $p=a+bx+cx^2+dx^3\mapsto D(a,b,c,d)^T=(b,2c,3d,0)$, que son las coordenadas de $b+2cx+3dx^2=p'$ ✓.</p>
    - |-
      <b>Imagen.</b>
            $$\operatorname{Im}(f)=\langle f(1),f(x),f(x^2),f(x^3)\rangle=\langle0,\,1,\,2x,\,3x^2\rangle=\langle1,x,x^2\rangle$$
            <p>(se suprime el $0$ y se dividen los generadores por $2$ y $3$, lo que no cambia el subespacio generado: Teor. 2.1-2.2, U p.79).</p>
    - |-
      <b>Base y dimensión.</b> $\{1,x,x^2\}$ es libre (parte de la base canónica: $\alpha+\beta x+\gamma x^2=0$ para todo $x$ implica $\alpha=\beta=\gamma=0$). <b>Base: $\{1,x,x^2\}$; $\operatorname{Dim}\operatorname{Im}(f)=3$; $\operatorname{Im}(f)=P_2(x)$.</b> (Sentido: todo polinomio de grado $\le2$ es la derivada de alguno de grado $\le3$, su primitiva.)
  - resultado: |-
      matriz $D$ como arriba; $\operatorname{Im}(f)=P_2(x)$, base $\{1,x,x^2\}$, dimensión 3. <i>(Verificado con sympy: rango 3.)</i>
  - receta: |-
      en espacios de polinomios, calcula la imagen de cada elemento de la base canónica, escribe sus coordenadas en <b>columna</b> (matriz) y trata la imagen como en $\mathbb R^n$; al final, vuelve a escribir los vectores como polinomios.
  - error: |-
      poner las coordenadas en <b>filas</b> (sale la traspuesta, que es la matriz de otra aplicación); o decir que $\operatorname{Im}(f)=P_3$ porque «es un endomorfismo».
  - teoria: |-
      Def. 3.1, U p.101 · Def. 3.2 y Ej. 3.11, U p.106-109
- id: ej3-26
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 3.26, p. 102
    texto: |-
      E p.102
  problema:
  - nucleo
  nivel: 1
  titulo: |-
    Ejercicio 3.26 — núcleo de la derivada en $P_3$
  enunciado: |-
    Si $f$ es el endomorfismo de $P_3(x)$ del Ejercicio 3.25, se pide: A) Subespacio $\operatorname{Nuc}(f)$. B) Una base de $\operatorname{Nuc}(f)$. C) Dimensión de $\operatorname{Nuc}(f)$.
  pista: |-
    ¿Qué polinomios tienen derivada cero? Puedes razonarlo directamente o resolver $AX=0$ con la matriz del ejercicio anterior.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Núcleo de la derivada en $P_3$.
      - - |-
          Cómo lo pienso
        - |-
          ¿Qué polinomios tienen derivada nula? Pensando en el cálculo: las constantes. Lo demuestro igualando coeficientes.
      - - |-
          Qué uso
        - |-
          <b>Núcleo (Def. 3.3, U p.109):</b> $\operatorname{Nuc}f=\{v:f(v)=\bar0\}=$ soluciones del sistema homogéneo $Ax=0$. Es subespacio de $V$.
      - - |-
          Por dónde empiezo
        - |-
          Impongo $p'=0$ y reviso coeficientes.
  - pasos:
    - |-
      <b>A)</b> Por la Def. 3.3 (U p.109): $p=a+bx+cx^2+dx^3\in\operatorname{Nuc}(f)$ si y solo si $p'$ es el polinomio nulo:
            $$p'=b+2cx+3dx^2=0\iff b=0,\ 2c=0,\ 3d=0\iff p=a$$
            <p>(un polinomio es nulo si y solo si todos sus coeficientes son 0). <b>$\operatorname{Nuc}(f)=\{a: a\in\mathbb R\}=P_0(x)$</b>, los polinomios constantes. (Matricialmente $D(a,b,c,d)^T=(b,2c,3d,0)^T=0$.)</p>
    - |-
      <b>B)</b> Todo elemento es $a\cdot1$ y $\{1\}$ es libre ($1\neq0$): <b>base $\{1\}$</b>.
    - |-
      <b>C)</b> <b>$\operatorname{Dim}\operatorname{Nuc}(f)=1$.</b> Comprobación con el Teor. 3.1 (U p.111) y el Ej. 3.25:
            $$3+1=4=\operatorname{Dim}P_3(x)\ ✓$$
  - resultado: |-
      $\operatorname{Nuc}(f)=P_0(x)$ (constantes), base $\{1\}$, dimensión 1. <i>(Verificado con sympy: <code>D.nullspace()=[(1,0,0,0)]</code>.)</i>
  - receta: |-
      núcleo de una aplicación entre polinomios: iguala la imagen al polinomio nulo, es decir, <b>cada coeficiente a 0</b>, y resuelve el sistema en los coeficientes del original.
  - error: |-
      responder $\operatorname{Nuc}(f)=\{0\}$ confundiendo «derivada nula» con «polinomio nulo»: las constantes no nulas también tienen derivada 0.
  - teoria: |-
      Def. 3.3, U p.109 · Teor. 3.1, U p.111
- id: ej3-27
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 3.27, p. 102
    texto: |-
      E p.102
  problema:
  - compuesta
  - imagen
  - nucleo
  nivel: 3
  titulo: |-
    Ejercicio 3.27 — imagen y núcleo de la derivada segunda
  enunciado: |-
    Si $f$ es el endomorfismo de $P_3(x)$ del Ejercicio 3.25, se pide: A) Subespacio $\operatorname{Im}(f\circ f)$. B) Subespacio $\operatorname{Nuc}(f\circ f)$. C) Relación entre las dimensiones de los subespacios anteriores.
  pista: |-
    Calcula primero la matriz de $f\circ f$ (producto de la matriz de $f$ por sí misma) o deriva dos veces cada vector de la base. Después, imagen y núcleo como siempre, y comprueba el teorema de las dimensiones.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Imagen y núcleo de la derivada segunda en $P_3$ y su relación.
      - - |-
          Cómo lo pienso
        - |-
          Derivo dos veces: se pierden dos grados. Espero que el núcleo sean los polinomios de grado $\le1$ y que imagen y núcleo coincidan, lo que es posible porque estamos en un endomorfismo.
      - - |-
          Qué uso
        - |-
          <b>Composición:</b> $(f\circ f)(p)=f(f(p))=p''$. <b>Núcleo (Def. 3.3, U p.109):</b> $\operatorname{Nuc}f=\{v:f(v)=\bar0\}=$ soluciones del sistema homogéneo $Ax=0$. Es subespacio de $V$. <b>Imagen:</b> $\operatorname{Im}f=\{f(v)\}$ = subespacio generado por las columnas de $A$ (los $f(e_j)$). Es subespacio de $W$. <b>Teorema de las dimensiones (Teor. 3.1):</b> $\operatorname{Dim}\operatorname{Nuc}f+\operatorname{Dim}\operatorname{Im}f=\operatorname{Dim}V$ (V = espacio de <i>partida</i>); $\operatorname{Dim}\operatorname{Im}f=\operatorname{rang}A$.
      - - |-
          Por dónde empiezo
        - |-
          Calculo $p''$ para un polinomio genérico y leo imagen y núcleo.
  - pasos:
    - |-
      <b>Qué es $f\circ f$.</b> Por la Def. 3.11 (U p.124, <a href="tema_3_4_operaciones_aplicaciones_matrices.html#s3">tema 3.4</a>), $(f\circ f)(p)=f(f(p))=(p')'=p''$: la derivada segunda. Es lineal ($(p+\lambda q)''=p''+\lambda q''$). Para $p=a+bx+cx^2+dx^3$:
            $$p'=b+2cx+3dx^2,\qquad p''=2c+6dx.$$
    - |-
      <b>A) Imagen.</b>
            $$\operatorname{Im}(f\circ f)=\{2c+6dx: c,d\in\mathbb R\}=\langle2,6x\rangle=\langle1,x\rangle.$$
            <p>Como $c,d$ son arbitrarios, $2c$ y $6d$ toman cualquier valor: <b>$\operatorname{Im}(f\circ f)=P_1(x)$</b>, base $\{1,x\}$, dimensión 2.</p>
    - |-
      <b>B) Núcleo.</b>
            $$p''=0\iff2c=0\ \text{y}\ 6d=0\iff c=d=0\iff p=a+bx.$$
            <p><b>$\operatorname{Nuc}(f\circ f)=P_1(x)$</b>, base $\{1,x\}$, dimensión 2.</p>
    - |-
      <b>C)</b>
            $$\operatorname{Dim}\operatorname{Im}(f\circ f)+\operatorname{Dim}\operatorname{Nuc}(f\circ f)=2+2=4=\operatorname{Dim}P_3(x)$$
            <p>(Teor. 3.1, U p.111) ✓. Curiosidad: aquí <b>imagen y núcleo coinciden</b> ($=P_1$); nada lo impide, porque en un endomorfismo ambos son subespacios del mismo espacio.</p>
  - resultado: |-
      $\operatorname{Im}(f\circ f)=\operatorname{Nuc}(f\circ f)=P_1(x)$, ambos de dimensión 2. <i>(Verificado con sympy: $D^2$ tiene rango 2, núcleo $\langle(1,0,0,0),(0,1,0,0)\rangle$.)</i>
  - receta: |-
      para $f\circ f$ calcula primero la fórmula de la composición (o la matriz $A^2$, <a href="tema_3_4_operaciones_aplicaciones_matrices.html#s3">tema 3.4</a>) y luego aplica el método habitual de imagen y núcleo.
  - error: |-
      pensar que imagen y núcleo son siempre «complementarios» (sin vectores no nulos en común): el Teorema 3.1 solo habla de <b>dimensiones</b>.
  - teoria: |-
      Def. 3.11, U p.124 · Defs. 3.2-3.3 y Teor. 3.1, U §3.2
