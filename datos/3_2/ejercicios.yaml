  nivel: 1
  titulo: |-
    Ejercicio 3.23 — ecuaciones y bases de $\operatorname{Im}$ y $\operatorname{Nuc}$, $\mathbb R^2\to\mathbb R^3$
  enunciado: |-
    Si $f$ es la aplicación lineal del Ejercicio 3.2 ($f:\mathbb R^2\to\mathbb R^3$, $f(x_1,x_2)=(2x_1,\ 3x_1+x_2,\ x_1+x_2)$), se pide: A) Ecuaciones y base del subespacio $\operatorname{Im}(f)$. B) Ecuaciones y base del subespacio $\operatorname{Nuc}(f)$. C) Relación entre las dimensiones de $\operatorname{Im}(f)$ y $\operatorname{Nuc}(f)$.
  pista: |-
    Matriz con $f(e_1)$ y $f(e_2)$ por columnas. La imagen sale de las columnas independientes; el núcleo, del sistema $AX=0$.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Ecuaciones y bases de imagen y núcleo de $f:\mathbb R^2\to\mathbb R^3$ y relación entre sus dimensiones.
      - - |-
          Cómo lo pienso
        - |-
          La imagen está generada por dos vectores de $\mathbb R^3$: un plano si son independientes, con una ecuación cartesiana. El núcleo en $\mathbb R^2$ puede ser solo el origen.
      - - |-
          Qué uso
        - |-
          <b>Imagen:</b> $\operatorname{Im}f=\{f(v)\}$ = subespacio generado por las columnas de $A$ (los $f(e_j)$). Es subespacio de $W$. <b>Núcleo (Def. 3.3, U p.109):</b> $\operatorname{Nuc}f=\{v:f(v)=\bar0\}=$ soluciones del sistema homogéneo $Ax=0$. Es subespacio de $V$. <b>Cartesianas de un subespacio</b> $\langle S\rangle\subset\mathbb R^n$ de rango $r$: $n-r$ ecuaciones; $x\in\langle S\rangle\iff\operatorname{rang}(S\mid x)=r$ (menores orlados). <b>Teorema de las dimensiones (Teor. 3.1):</b> $\operatorname{Dim}\operatorname{Nuc}f+\operatorname{Dim}\operatorname{Im}f=\operatorname{Dim}V$ (V = espacio de <i>partida</i>); $\operatorname{Dim}\operatorname{Im}f=\operatorname{rang}A$.
      - - |-
          Por dónde empiezo
        - |-
          Separo por $x_1,x_2$, ecuación del plano por determinante y resuelvo $f=0$.
  - pasos:
    - |-
      <b>Generadores de la imagen.</b> Separando los coeficientes de $x_1$ y $x_2$:
            $$f(x_1,x_2)=x_1\begin{pmatrix}2\\3\\1\end{pmatrix}+x_2\begin{pmatrix}0\\1\\1\end{pmatrix}.$$
            <p>Así $\operatorname{Im}(f)=\langle(2,3,1),(0,1,1)\rangle$ (Def. 3.2, U p.106; igual que el Ej. 3.9, U p.107).</p>
    - |-
      <b>Base y dimensión.</b> Los dos vectores son independientes: el menor
            $$\begin{vmatrix}2&0\\3&1\end{vmatrix}=2\neq0,$$
            <p>luego el rango es 2 (Teor. 2.5, U p.88). <b>Base: $\{(2,3,1),(0,1,1)\}$, $\operatorname{Dim}\operatorname{Im}(f)=2$.</b></p>
    - |-
      <b>Ecuaciones paramétricas:</b>
            $$y_1=2\alpha,\quad y_2=3\alpha+\beta,\quad y_3=\alpha+\beta,\qquad\alpha,\beta\in\mathbb R.$$
    - |-
      <b>Ecuación cartesiana (por qué un determinante).</b> $(y_1,y_2,y_3)\in\operatorname{Im}(f)\iff$ existe $(x_1,x_2)$ con $f(x_1,x_2)=(y_1,y_2,y_3)\iff$ el sistema
            $$\left(\begin{array}{cc|c}2&0&y_1\\3&1&y_2\\1&1&y_3\end{array}\right)$$
            <p>es <b>compatible</b>, es decir (Rouché-Frobenius, U p.30) la matriz de coeficientes y la ampliada tienen el mismo rango. La de coeficientes tiene rango 2, así que la ampliada ($3\times3$) debe tener rango 2: determinante nulo. Desarrollando por la 1.ª fila,</p>
            $$\begin{aligned}\begin{vmatrix}2&0&y_1\\3&1&y_2\\1&1&y_3\end{vmatrix}&=2\,(y_3-y_2)-0+y_1\,(3-1)\\&=2y_1-2y_2+2y_3\\&=0\iff\boxed{y_2=y_1+y_3}.\end{aligned}$$
            <p>Comprobación: $(2,3,1)$: $3=2+1$ ✓; $(0,1,1)$: $1=0+1$ ✓. Hay $3-2=1$ ecuación, como corresponde a un plano por el origen en $\mathbb R^3$.</p>
    - |-
      <b>Núcleo.</b> Por la Def. 3.3 (U p.109), $f(x_1,x_2)=(0,0,0)$:
            $$2x_1=0,\qquad3x_1+x_2=0,\qquad x_1+x_2=0.$$
            <p>De la 1.ª, $x_1=0$; en la 2.ª, $x_2=0$ (la 3.ª se cumple). <b>$\operatorname{Nuc}(f)=\{(0,0)\}$</b>, ecuaciones $x_1=0$, $x_2=0$, y <b>no tiene base</b> (o: base vacía) con $\operatorname{Dim}=0$, por convenio (U p.112): el vector $\bar0$ no puede estar en una base.</p>
    - |-
      <b>C) Relación.</b> Teor. 3.1 (U p.111):
            $$\operatorname{Dim}\operatorname{Im}(f)+\operatorname{Dim}\operatorname{Nuc}(f)=\operatorname{Dim}\mathbb R^2:\quad2+0=2\ ✓$$
  - resultado: |-
      $\operatorname{Im}(f)=\{y_2=y_1+y_3\}$, base $\{(2,3,1),(0,1,1)\}$; $\operatorname{Nuc}(f)=\{0\}$; $2+0=2$. <i>(Verificado con sympy: rango 2, núcleo vacío, determinante $=2y_1-2y_2+2y_3$.)</i>
  - html: |-
      <div class="recipe"><b>Receta (ecuación cartesiana de la imagen):</b> coloca los generadores de $\operatorname{Im}(f)$ como columnas, añade la columna $(y_1,\dots,y_n)$ y exige que el rango <b>no aumente</b>: anula los menores orlados (o escalona y pide que las filas que se anulan a la izquierda tengan ceros a la derecha). Nº de ecuaciones $=n-\operatorname{Dim}\operatorname{Im}(f)$.</div>
  - error: |-
      escribir las ecuaciones de $f$ ($y_1=2x_1,\dots$) como si fueran las cartesianas de la imagen: estas no deben contener las $x_i$, solo relaciones entre las $y_j$. Otro: decir que la base del núcleo es $\{(0,0)\}$.
  - teoria: |-
      Defs. 3.2-3.3 y Teor. 3.1, U p.106-111 · Rouché, U p.30
- id: ej3-24
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 3.24, p. 101
    texto: |-
      E p.101
  problema:
  - dimensiones
  - nucleo
  nivel: 2
  titulo: |-
    Ejercicio 3.24 — el núcleo de $\lambda f$ (V/F)
  enunciado: |-
    Si $f$ es una aplicación lineal entre los espacios vectoriales $V$ y $W$, y $\lambda$ cualquier número real no nulo, se pide elegir las correctas: A) $\operatorname{Nuc}(\lambda f)=\lambda\operatorname{Nuc}(f)$. B) $\operatorname{Dim}\operatorname{Nuc}(\lambda f)\gt \operatorname{Dim}\operatorname{Nuc}(f)$ cuando $\lambda\gt 1$. C) $\operatorname{Dim}\operatorname{Nuc}(\lambda f)\lt \operatorname{Dim}\operatorname{Nuc}(f)$ cuando $\lambda\lt 1$.
  pista: |-
    Ver si $v$ está en $\operatorname{Nuc}(\lambda f)$ es mirar si $\lambda f(v)=0$. Como $\lambda\neq0$, ¿cuándo ocurre eso? Con eso decides cada afirmación.
  cuerpo:
  - html: |-
      <p><i>Notación.</i> $(\lambda f)(v)=\lambda f(v)$ (Def. 3.8, U p.120); $\lambda\operatorname{Nuc}(f)=\{\lambda v: v\in\operatorname{Nuc}(f)\}$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Comparar el núcleo de $\lambda f$ con el de $f$ para $\lambda\neq0$.
      - - |-
          Cómo lo pienso
        - |-
          Multiplicar por un escalar no nulo no puede hacer que se anulen más vectores ni menos: las condiciones $\lambda f(v)=0$ y $f(v)=0$ son equivalentes.
      - - |-
          Qué uso
        - |-
          <b>Núcleo (Def. 3.3, U p.109):</b> $\operatorname{Nuc}f=\{v:f(v)=\bar0\}=$ soluciones del sistema homogéneo $Ax=0$. Es subespacio de $V$. $(\lambda f)(v)=\lambda f(v)$ (definición de $\lambda f$).
      - - |-
          Por dónde empiezo
        - |-
          Doble implicación $v\in\operatorname{Nuc}(\lambda f)\iff v\in\operatorname{Nuc}(f)$.
  - pasos:
    - |-
      <b>$\operatorname{Nuc}(\lambda f)=\operatorname{Nuc}(f)$.</b> Para $v\in V$:
            $$v\in\operatorname{Nuc}(\lambda f)\iff(\lambda f)(v)=\bar0\iff\lambda f(v)=\bar0\iff f(v)=\bar0\iff v\in\operatorname{Nuc}(f).$$
            <p>El paso central usa $\lambda\neq0$: multiplicando por $\tfrac1\lambda$, $\lambda f(v)=\bar0\Rightarrow f(v)=\bar0$ (el recíproco es obvio).</p>
    - |-
      <b>$\lambda\operatorname{Nuc}(f)=\operatorname{Nuc}(f)$.</b> «$\subseteq$»: $\operatorname{Nuc}(f)$ es subespacio (Def. 3.3, U p.109), luego es cerrado para el producto por escalares: $v\in\operatorname{Nuc}(f)\Rightarrow\lambda v\in\operatorname{Nuc}(f)$. «$\supseteq$»: si $u\in\operatorname{Nuc}(f)$, entonces
            $$u=\lambda\cdot\big(\tfrac1\lambda u\big)\quad\text{con}\quad\tfrac1\lambda u\in\operatorname{Nuc}(f).$$
    - |-
      <b>A) Cierta</b>, por 1 y 2:
            $$\operatorname{Nuc}(\lambda f)=\operatorname{Nuc}(f)=\lambda\operatorname{Nuc}(f).$$
    - |-
      <b>B) y C) Falsas</b>, porque por el paso 1, $\operatorname{Dim}\operatorname{Nuc}(\lambda f)=\operatorname{Dim}\operatorname{Nuc}(f)$ para todo $\lambda\neq0$: nunca es mayor ni menor. Contraejemplo concreto: $f(x_1,x_2)=(x_1,0)$ y $\lambda=2$:
            $$\operatorname{Nuc}(f)=\operatorname{Nuc}(2f)=\langle(0,1)\rangle,$$
            <p>ambos de dimensión 1.</p>
  - resultado: |-
      solo A es correcta. <i>(Verificado: $\operatorname{Nuc}(2f)=\operatorname{Nuc}(f)$ en el contraejemplo.)</i>
  - receta: |-
      para igualdades entre conjuntos (núcleos, imágenes), demuestra la doble pertenencia «$v\in X\iff v\in Y$» partiendo de la <b>definición</b> y señalando dónde se usa cada hipótesis ($\lambda\neq0$, ser subespacio…).
  - error: |-
      creer que multiplicar la aplicación por un número «agranda» o «encoge» el núcleo: el núcleo depende de <b>dónde</b> se anula $f$, y $\lambda f$ se anula exactamente en los mismos vectores.
  - teoria: |-
      Def. 3.3, U p.109 · Def. 3.8, U p.120
- id: ej3-25
  clase: libro
  fuentes:
  - l: E
