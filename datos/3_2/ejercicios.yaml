  nivel: 2
  titulo: |-
    Ejercicio 3.21 — matriz, base de la imagen y núcleo, $\mathbb R^3\to\mathcal M_{2\times2}$
  enunciado: |-
    Si $f:\mathbb R^3\to\mathcal M_{2\times2}$ es la aplicación lineal tal que
      $$f(1,0,0)=\begin{pmatrix}2&-1\\3&0\end{pmatrix};\quad f(0,1,0)=\begin{pmatrix}1&0\\4&2\end{pmatrix};\quad f(0,0,1)=\begin{pmatrix}5&1\\0&1\end{pmatrix},$$
      se pide calcular: A) La matriz asociada a $f$. B) Base de $\operatorname{Im}(f)$. C) Núcleo de $f$.
  pista: |-
    Escribe cada matriz $2\times2$ como un vector de $\mathbb R^4$ (sus 4 entradas) y úsalo como columna. Con esa $A$ de $4\times3$ todo lo demás es rango y sistema homogéneo.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Matriz, base de la imagen y núcleo de $f:\mathbb R^3\to\mathcal M_{2\times2}$.
      - - |-
          Cómo lo pienso
        - |-
          Las matrices son vectores de 4 coordenadas. La imagen está generada por tres matrices en un espacio de dimensión 4: no puede ser todo. El núcleo depende de si las tres son independientes.
      - - |-
          Qué uso
        - |-
          <b>Matriz asociada (Def. 3.4, U p.116):</b> la columna $j$ son las coordenadas de $f(e_j)$ en la base de llegada; entonces $f(x)=Ax$. Las matrices $2\times2$ se escriben como vectores de 4 coordenadas respecto de la base canónica de $\mathcal M_{2\times2}$. <b>Imagen:</b> $\operatorname{Im}f=\{f(v)\}$ = subespacio generado por las columnas de $A$ (los $f(e_j)$). Es subespacio de $W$. <b>Núcleo (Def. 3.3, U p.109):</b> $\operatorname{Nuc}f=\{v:f(v)=\bar0\}=$ soluciones del sistema homogéneo $Ax=0$. Es subespacio de $V$.
      - - |-
          Por dónde empiezo
        - |-
          Matriz $4\times3$ por columnas; rango para la base de la imagen; si el rango es 3, el núcleo es $\{0\}$.
  - pasos:
    - |-
      <b>Coordenadas en $\mathcal M_{2\times2}$.</b> Con la base canónica $\{E_{11},E_{12},E_{21},E_{22}\}$, la matriz $\begin{pmatrix}a&b\\c&d\end{pmatrix}$ tiene coordenadas $(a,b,c,d)$ (Def. 2.10, U p.85).
    - |-
      <b>A) Matriz asociada</b> ($4\times3$: 3 columnas porque $\operatorname{Dim}\mathbb R^3=3$, 4 filas porque $\operatorname{Dim}\mathcal M_{2\times2}=4$; Def. 3.4, U p.116):
            $$A=\begin{pmatrix}2&1&5\\-1&0&1\\3&4&0\\0&2&1\end{pmatrix}.$$
    - |-
      <b>Imagen de un vector cualquiera.</b>
            $$f(x_1,x_2,x_3)=x_1f(e_1)+x_2f(e_2)+x_3f(e_3)=\begin{pmatrix}2x_1+x_2+5x_3&-x_1+x_3\\3x_1+4x_2&2x_2+x_3\end{pmatrix}.$$
            <p>Por tanto $\operatorname{Im}(f)=\langle f(e_1),f(e_2),f(e_3)\rangle$ (Def. 3.2, U p.106).</p>
    - |-
      <b>B) ¿Son independientes los tres generadores?</b> Su rango es el de $A$ (Teor. 2.5, U p.88). El menor de las tres primeras filas vale
            $$\begin{vmatrix}2&1&5\\-1&0&1\\3&4&0\end{vmatrix}=2(0-4)-1(0-3)+5(-4-0)=-8+3-20=-25\neq0,$$
            <p>así que $\operatorname{rang}A=3$: los tres generadores son libres. <b>Base de $\operatorname{Im}(f)$: las tres matrices $f(e_1),f(e_2),f(e_3)$</b>, $\operatorname{Dim}\operatorname{Im}(f)=3$. ($\operatorname{Im}(f)\neq\mathcal M_{2\times2}$: le falta una dimensión.)</p>
    - |-
      <b>C) Núcleo.</b> $f(x)=\begin{pmatrix}0&0\\0&0\end{pmatrix}$ equivale a
            $$2x_1+x_2+5x_3=0,\quad-x_1+x_3=0,\quad3x_1+4x_2=0,\quad2x_2+x_3=0.$$
            <p>De la 2.ª, $x_3=x_1$; de la 3.ª, $x_2=-\tfrac34x_1$; en la 4.ª:</p>
            $$-\tfrac32x_1+x_1=-\tfrac12x_1=0\ \Rightarrow\ x_1=0,$$
            <p>y entonces $x_2=x_3=0$. <b>$\operatorname{Nuc}(f)=\{(0,0,0)\}$.</b> (Alternativa: sistema homogéneo con $\operatorname{rang}A=3=$ nº de incógnitas $\Rightarrow$ solo la solución nula, U p.30.)</p>
    - |-
      <b>Coherencia (Teor. 3.1):</b> $3+0=3=\operatorname{Dim}\mathbb R^3$ ✓.
  - resultado: |-
      $A$ como arriba; $\operatorname{Dim}\operatorname{Im}(f)=3$ con base $\{f(e_1),f(e_2),f(e_3)\}$; $\operatorname{Nuc}(f)=\{0\}$. <i>(Verificado con sympy: rango 3, núcleo vacío, menor $=-25$.)</i>
  - receta: |-
      si el espacio final son matrices (o polinomios), <b>pásalas a coordenadas</b> y trabaja con la matriz de columnas; al final traduce los vectores de vuelta a matrices. Para afirmar que unos generadores son base hay que <b>comprobar su independencia</b> (rango).
  - error: |-
      dar como base de la imagen los generadores sin comprobar que son libres; o mezclar el orden de las coordenadas $(a,b,c,d)$ (por filas) con $(a,c,b,d)$ (por columnas): vale cualquiera si se usa siempre el mismo.
  - teoria: |-
      Defs. 3.2-3.4, U p.106-116 · Teor. 2.5, U p.88 · Rouché, U p.30
