kicker: |-
  Módulo 3 · Aplicaciones lineales y matrices · Tema 3.2
h1: |-
  Imagen y núcleo
resumen: |-
  Toda aplicación lineal $f:V\to W$ lleva asociados dos subespacios: el <b>núcleo</b> (lo que $f$ aplasta en el cero, vive en $V$) y la <b>imagen</b> (lo que $f$ alcanza, vive en $W$). El <b>teorema de las dimensiones</b> los une: $\operatorname{Dim}\operatorname{Im}(f)+\operatorname{Dim}\operatorname{Nuc}(f)=\operatorname{Dim}V$.
