ejercicios:
- id: ej3-16
  nivel: 2
  problema: [imagen, matriz]
  pista: |-
    Los vectores que generan la imagen son las columnas de la matriz, es decir, los $f(e_j)$. Ya los tienes: quita los sobrantes y, para las cartesianas, impón que $(y_1,y_2)$ no suba el rango.
- id: ej3-20
  nivel: 2
  problema: [matriz, nucleo, dimensiones]
  pista: |-
    Las imágenes de la base canónica son las columnas de $A$ (en la base $1,x,x^2$). Escalona: el núcleo sale de $AX=0$ y la dimensión de la imagen es el rango.
- id: ej3-21
  nivel: 2
  problema: [matriz, imagen, nucleo]
  pista: |-
    Escribe cada matriz $2\times2$ como un vector de $\mathbb R^4$ (sus 4 entradas) y úsalo como columna. Con esa $A$ de $4\times3$ todo lo demás es rango y sistema homogéneo.
- id: ej3-22
  nivel: 2
  problema: [dimensiones]
  pista: |-
    Antes de calcular nada pregúntate qué espacio es $V$ en el teorema de las dimensiones: ¿el de salida o el de llegada? Luego mira cuántas columnas tiene $A$ y cuál es su rango.
- id: ej3-23
  nivel: 1
  problema: [imagen, nucleo]
  pista: |-
    Matriz con $f(e_1)$ y $f(e_2)$ por columnas. La imagen sale de las columnas independientes; el núcleo, del sistema $AX=0$.
- id: ej3-24
  nivel: 2
  problema: [dimensiones, nucleo]
  pista: |-
    Ver si $v$ está en $\operatorname{Nuc}(\lambda f)$ es mirar si $\lambda f(v)=0$. Como $\lambda\neq0$, ¿cuándo ocurre eso? Con eso decides cada afirmación.
- id: ej3-25
  nivel: 1
  problema: [matriz, imagen]
  pista: |-
    Deriva cada vector de la base $1,x,x^2,x^3$ y escribe el resultado en coordenadas: esas son las columnas. La imagen son las columnas independientes.
- id: ej3-26
  nivel: 1
  problema: [nucleo]
  pista: |-
    ¿Qué polinomios tienen derivada cero? Puedes razonarlo directamente o resolver $AX=0$ con la matriz del ejercicio anterior.
- id: ej3-27
  nivel: 3
  problema: [compuesta, imagen, nucleo]
  pista: |-
    Calcula primero la matriz de $f\circ f$ (producto de la matriz de $f$ por sí misma) o deriva dos veces cada vector de la base. Después, imagen y núcleo como siempre, y comprueba el teorema de las dimensiones.
- id: ej3-28
  nivel: 3
  problema: [nucleo, matriz]
  pista: |-
    Una base del núcleo se lee de la descripción $\{ax+bx^2\}$. Para completarla hasta una base de $P_3$ añade los vectores canónicos que falten; ¿se puede fijar la matriz sabiendo solo el núcleo?
- id: ej3-29
  nivel: 3
  problema: [compuesta, matriz]
  pista: |-
    Evalúa cada apartado por separado. Deriva dos veces los vectores de la base de $P_4$ para obtener la matriz de $f\circ f$, y de ella saca imagen y núcleo para contrastar las afirmaciones.
- id: sol-3_2-12
  nivel: 1
  problema: [nucleo, imagen]
  pista: |-
    Matriz $2\times3$ con los coeficientes de $x,y,z$. Núcleo: sistema homogéneo. Imagen: columnas independientes.
- id: sol-3_2-13
  nivel: 3
  problema: [nucleo, imagen]
  pista: |-
    El valor especial de $a$ es el que anula el determinante: ahí el rango baja. Calcula $\det A$ y estudia por separado el caso general y el caso especial.
- id: sol-3_2-14
  nivel: 2
  problema: [nucleo, imagen]
  pista: |-
    Tomando la base $1,x,x^2$, $f$ es una matriz $2\times3$: evalúa $1$, $x$ y $x^2$ en $0$ y en $1$. Para «¿es único?» piensa en qué hace el núcleo.
- id: ex-feb18a-3
  nivel: 1
  problema: [nucleo]
  pista: |-
    Iguala a cero las tres componentes de $f(x,y,z)$ y resuelve el sistema: ¿qué incógnita queda libre?
- id: ex-sep19a-3
  nivel: 2
  problema: [nucleo]
  pista: |-
    Forma la matriz $4\times4$ con los coeficientes de cada incógnita, escalónala y cuenta los parámetros libres: cada uno te da un vector de la base.
- id: ex-feb26-2p7
  nivel: 2
  problema: [nucleo, matriz]
  pista: |-
    Las filas de $A$ son los coeficientes de cada componente. Escalona hasta la forma reducida y lee en ella los pivotes y los parámetros libres para armar la base.
- id: ex-sep25-p3
  nivel: 2
  problema: [nucleo]
  pista: |-
    Que $(10,a,b)$ esté en el núcleo significa $M\cdot(10,a,b)^t=0$: sistema de tres ecuaciones con incógnitas $a$ y $b$.
- id: ex-sep17a-pb
  nivel: 2
  problema: [nucleo, dimensiones]
  pista: |-
    La matriz es de $3\times2$. Calcula su rango: te dice a la vez la dimensión de la imagen y, por el teorema de las dimensiones, si el núcleo es trivial y cómo son sus cartesianas.
- id: ex-feb23-2p3
  nivel: 1
  problema: [nucleo, imagen]
  pista: |-
    Las dos componentes son iguales: ¿qué multiplicas por $(1,1)$? Eso te da la imagen. El núcleo es la recta $5x+3y=0$.
- id: ex-sep22-3
  nivel: 1
  problema: [imagen, nucleo]
  pista: |-
    Saca factor común $x_1$ en $f(x_1,x_2)$: la imagen es el generado por un solo vector. La dimensión del núcleo sale de $\operatorname{Dim}\mathbb R^2-\operatorname{Dim}\operatorname{Im}$.
- id: ex-feb25-1p7
  nivel: 2
  problema: [imagen, nucleo]
  pista: |-
    Para $g$, las dos componentes son proporcionales: escribe $f(x,y,z)=(x+y+z)\cdot$ un vector fijo. En el apartado de si es lineal, mira si $f(0)=0$.
- id: ex-sep23-p7
  nivel: 3
  problema: [imagen, nucleo]
  pista: |-
    Imagen: columnas independientes de la matriz. Un subespacio propio de la imagen es, por ejemplo, el generado por uno solo de los vectores de su base; después pásalo a implícitas.
- id: ex-feb19a-pa
  nivel: 2
  problema: [nucleo, imagen]
  pista: |-
    Escalona la matriz: el rango da $\operatorname{Dim}\operatorname{Im}$ y el resto es $\operatorname{Dim}\operatorname{Nuc}$. Para las cartesianas del núcleo usa $AX=0$; para las de la imagen, que $(y_1,y_2,y_3)$ no suba el rango.
- id: ex-feb24-1p3
  nivel: 2
  problema: [imagen]
  pista: |-
    La imagen es el generado por $f(1,0)$ y $f(0,1)$. Basta comprobar si esos dos vectores cumplen la ecuación del plano; ¿qué pasa con las combinaciones lineales?
- id: ex-feb17-2pc
  nivel: 2
  problema: [imagen, nucleo, matriz]
  pista: |-
    Identifica $a+bx+cx^2$ con $(a,b,c)$ y escribe la matriz de la derivada. La imagen y el núcleo se describen en esas coordenadas.
- id: ex-feb23-1p7
  nivel: 2
  problema: [nucleo, imagen, matriz]
  pista: |-
    Deriva tres veces cada $x^k$ de la base: casi todas dan cero. Las que no, son las columnas de la matriz $2\times5$ y te dicen qué se alcanza.
- id: ex-feb22a-3
  nivel: 2
  problema: [nucleo, imagen]
  pista: |-
    Identifica una matriz diagonal con sus dos entradas: $f(x,y)\leftrightarrow(x,\ x-y)$. Después es un núcleo y una imagen en $\mathbb R^2$ normales.
- id: ex-sep18a-pb
  nivel: 2
  problema: [nucleo, dimensiones]
  pista: |-
    Pasa las entradas de la matriz a un vector de $\mathbb R^4$ y haz el sistema $f=0$; las paramétricas son su solución general. La dimensión de la imagen es el rango.
- id: ex-feb20-1b3
  nivel: 1
  problema: [dimensiones]
  pista: |-
    Teorema de las dimensiones: ¿cuántas columnas tiene $A$ (dimensión del espacio inicial)? Resta la dimensión del núcleo.
- id: ex-sep25-p2
  nivel: 2
  problema: [imagen, dimensiones]
  pista: |-
    Escribe la matriz $4\times4$ por coordenadas $(a,b,c,d)$ y calcula su rango: es la dimensión de la imagen. Cuidado con un posible determinante nulo.
- id: ex-feb26-1p7
  nivel: 3
  problema: [compuesta, imagen]
  pista: |-
    Para $\operatorname{Nuc}(g\circ f)$ calcula antes la matriz de $g\circ f$ (cuidado con el orden del producto) o resuelve $g(f(v))=0$ directamente. La afirmación del último apartado se contrasta con las dimensiones.
- id: ex-feb24-2p7
  nivel: 3
  problema: [compuesta, imagen]
  pista: |-
    Calcula la matriz de $f$, su rango y luego la de $f\circ f=f^2$. La relación del último apartado es el teorema de las dimensiones aplicado a $f\circ f$.
- id: ex-feb19b-pc
  nivel: 3
  problema: [dimensiones]
  pista: |-
    Es una demostración: parte de una combinación $\alpha f(v_1)+\beta f(v_2)=0$, usa la linealidad para meterlo todo dentro de $f$ y aprovecha que el núcleo es solo el vector cero.
esencial:
  intro: |-
    Todo el tema se resume en dos subespacios y una fórmula; con una matriz y Gauss sale todo.
  items:
  - |-
    <b>Núcleo</b> $=\{v\in V: f(v)=0\}$ vive en el espacio de <b>salida de las incógnitas</b> $V$ y se calcula resolviendo $AX=0$. Su dimensión es el número de parámetros libres $=m-\operatorname{rang}A$.
  - |-
    <b>Imagen</b> $=\{f(v)\}$ vive en $W$ y está generada por las <b>columnas de $A$</b> (las imágenes de la base). Una base: las columnas con pivote <b>de la $A$ original</b>. Su dimensión es $\operatorname{rang}A$.
  - |-
    <b>Teorema de las dimensiones:</b> $\operatorname{Dim}\operatorname{Im}(f)+\operatorname{Dim}\operatorname{Nuc}(f)=\operatorname{Dim}V$, donde $V$ es el espacio <b>inicial</b>.
  - |-
    <b>Inyectiva</b> $\iff\operatorname{Nuc}(f)=\{0\}$; <b>sobreyectiva</b> $\iff\operatorname{Im}(f)=W$. En un endomorfismo ambas cosas equivalen y significan $\det A\neq0$.
tipos:
- id: nucleo
  nombre: |-
    Calcular el núcleo (base, ecuaciones, dimensión)
  receta: |-
    Resuelve el sistema homogéneo $f(x)=0$; un vector de la base por cada parámetro libre.
  senal: |-
    El enunciado pide «núcleo», «Nuc», «vectores que se anulan» o «una base/ecuaciones del núcleo».
  pasos:
  - |-
    Escribe $f(x)=0$ componente a componente (o $AX=0$ con la matriz $A$).
  - |-
    Escalona y señala las incógnitas sin pivote: son los parámetros.
  - |-
    Escribe la solución general como combinación de vectores, uno por parámetro: esos vectores son una base.
  - |-
    Dimensión del núcleo = nº de parámetros $=m-\operatorname{rang}A$; si no hay ninguno, $\operatorname{Nuc}(f)=\{0\}$.
  ejemplo: |-
    $f(x,y,z)=(x+y,\ y+z)$: $x+y=0,\ y+z=0\Rightarrow(x,y,z)=\lambda(1,-1,1)$, luego $\operatorname{Nuc}(f)=\langle(1,-1,1)\rangle$ (dimensión 1).
  fallos: |-
    Resolver $AX=b$ en vez de $AX=0$ · escribir el núcleo con vectores de $W$ en vez de $V$ (tiene las componentes de las incógnitas) · dar la ecuación como «base»
- id: imagen
  nombre: |-
    Calcular la imagen (base, cartesianas, dimensión)
  receta: |-
    La imagen está generada por las columnas de $A$; quita las dependientes y, para las cartesianas, impón que $y$ no suba el rango.
  senal: |-
    Piden «imagen», «Im», «valores que toma $f$» o una condición del tipo «¿se alcanza este vector?».
  pasos:
  - |-
    Escribe las imágenes de los vectores de una base de $V$ (las columnas de $A$).
  - |-
    Escalona y quédate con las columnas de la $A$ original que tienen pivote: base de $\operatorname{Im}(f)$.
  - |-
    Dimensión de la imagen $=\operatorname{rang}A$.
  - |-
    Cartesianas: $y\in\operatorname{Im}(f)$ si el rango no sube al añadir $y$; salen $n-\operatorname{rang}A$ ecuaciones.
  ejemplo: |-
    $A=\begin{pmatrix}1&2&3\\2&4&6\end{pmatrix}$: todas las columnas son múltiplos de $(1,2)$, luego $\operatorname{Im}=\langle(1,2)\rangle$, de dimensión 1 y ecuación $2y_1-y_2=0$.
  fallos: |-
    Coger las columnas de la matriz escalonada en vez de las de la original · decir que la dimensión es el nº de columnas · escribir la imagen en $V$ en lugar de en $W$
- id: matriz
  nombre: |-
    Obtener la matriz asociada (también en polinomios y matrices)
  receta: |-
    Las columnas son las coordenadas de $f(e_1),\dots,f(e_m)$ en la base de llegada.
  senal: |-
    La aplicación viene dada por fórmulas, por una derivada, por las imágenes de la base o entre espacios de polinomios o matrices.
  pasos:
  - |-
    Fija una base de $V$ y otra de $W$ (si no dicen nada, las canónicas).
  - |-
    Calcula $f$ de cada vector de la base de $V$.
  - |-
    Escribe esas imágenes en coordenadas de la base de $W$: cada una es una columna de $A$.
  - |-
    Con $A$ ya puedes calcular rango, núcleo e imagen como en cualquier matriz.
  ejemplo: |-
    $f(p)=p'$ en $\wp_2$ (base $1,x,x^2$): $f(1)=0$, $f(x)=1$, $f(x^2)=2x$, luego $A=\begin{pmatrix}0&1&0\\0&0&2\end{pmatrix}$.
  fallos: |-
    Poner las imágenes por filas en vez de por columnas · olvidar una componente nula de la coordenada · mezclar el orden de la base
- id: dimensiones
  nombre: |-
    Usar el teorema de las dimensiones (y V/F sobre rangos)
  receta: |-
    $\operatorname{Dim}\operatorname{Im}(f)+\operatorname{Dim}\operatorname{Nuc}(f)=\operatorname{Dim}V$ y $\operatorname{Dim}\operatorname{Im}(f)=\operatorname{rang}A$.
  senal: |-
    Dan una dimensión (del núcleo, de la imagen) y piden otra, o piden justificar una afirmación sobre dimensiones, inyectividad o rango.
  pasos:
  - |-
    Identifica $V$ (espacio inicial), cuya dimensión es el nº de columnas de $A$.
  - |-
    Aplica la fórmula para despejar la dimensión que falta.
  - |-
    Para V/F, busca el caso concreto que lo contradiga o razona con el rango y con $\operatorname{Nuc}(f)=\{0\}\iff$ inyectiva.
  ejemplo: |-
    $f:\mathbb R^5\to\mathbb R^3$ con $\operatorname{rang}A=2$: $\operatorname{Dim}\operatorname{Nuc}(f)=5-2=3$.
  fallos: |-
    Usar la dimensión de $W$ en lugar de la de $V$ · pensar que la imagen puede tener más dimensión que $V$ · aplicar la fórmula sin que $f$ sea lineal
- id: compuesta
  nombre: |-
    Núcleo e imagen de una composición ($g\circ f$, $f\circ f$)
  receta: |-
    Halla la matriz de la composición (producto en el orden correcto) y aplica los métodos de núcleo e imagen a ese producto.
  senal: |-
    Aparecen $f\circ f$, $f^2$, «derivada segunda» o $g\circ f$.
  pasos:
  - |-
    Escribe las matrices de $f$ y $g$ en las mismas bases.
  - |-
    La matriz de $g\circ f$ es $B\cdot A$ (primero actúa $f$, que va a la derecha).
  - |-
    Calcula núcleo e imagen de $BA$ como en los tipos anteriores.
  - |-
    Comprueba con el teorema de las dimensiones; recuerda $\operatorname{Nuc}(f)\subset\operatorname{Nuc}(g\circ f)$ e $\operatorname{Im}(g\circ f)\subset\operatorname{Im}(g)$.
  ejemplo: |-
    $f(x,y)=(y,0)$: $f\circ f(x,y)=f(y,0)=(0,0)$. Entonces $\operatorname{Nuc}(f\circ f)=\mathbb R^2$ mientras que $\operatorname{Nuc}(f)=\langle(1,0)\rangle$ (dimensión 1): el núcleo crece al componer.
  fallos: |-
    Multiplicar las matrices al revés ($AB$ en vez de $BA$) · suponer $\operatorname{Nuc}(g\circ f)=\operatorname{Nuc}(f)$ · calcular $f(g(x))$ sin darse cuenta
quiz:
- p: |-
    $f:\mathbb R^3\to\mathbb R^2$ es lineal y $\operatorname{Dim}\operatorname{Im}(f)=2$. ¿Cuál es la dimensión de $\operatorname{Nuc}(f)$?
  opciones:
  - t: '0'
    ok: false
    why: |-
      Has restado de la dimensión de $W$ ($2-2$); hay que restar de la del espacio inicial $V=\mathbb R^3$.
  - t: '1'
    ok: true
  - t: '2'
    ok: false
    why: |-
      Has confundido las dos dimensiones: el núcleo no es igual a la imagen salvo coincidencia.
  - t: '3'
    ok: false
    why: |-
      Con núcleo de dimensión 3 sería $f=0$ y la imagen tendría dimensión 0.
  fb: |-
    Teorema 3.1: $2+\operatorname{Dim}\operatorname{Nuc}(f)=\operatorname{Dim}\mathbb R^3=3$, luego $\operatorname{Dim}\operatorname{Nuc}(f)=1$.
- p: |-
    La matriz $A=\begin{pmatrix}1&1&2\\0&1&1\\1&2&3\end{pmatrix}$ (rango 2) es la de $f:\mathbb R^3\to\mathbb R^3$. ¿Cuál es una base de $\operatorname{Im}(f)$?
  opciones:
  - t: |-
      $\{(1,0,1),\ (1,1,2)\}$
    ok: true
  - t: |-
      $\{(1,0,0),\ (0,1,0)\}$
    ok: false
    why: |-
      Son las columnas de la matriz <i>escalonada</i>; Gauss cambia el espacio generado por las columnas. Hay que coger las de la matriz original.
  - t: |-
      $\{(1,1,2),\ (1,2,3)\}$
    ok: false
    why: |-
      Son las filas, no las columnas. La imagen está generada por las columnas.
  - t: |-
      $\{(1,0,1),\ (1,1,2),\ (2,1,3)\}$
    ok: false
    why: |-
      Son las tres columnas, pero la tercera es suma de las otras dos: no es libre, y una base no puede tener 3 vectores si el rango es 2.
  fb: |-
    Al escalonar hay pivotes en las columnas 1 y 2, así que se toman esas columnas de $A$: $(1,0,1)$ y $(1,1,2)$. La tercera es $c_1+c_2$.
- p: |-
    ¿Cuál de estos vectores está en el núcleo de $f(x,y,z)=(x+y+z,\ x-z)$?
  opciones:
  - t: |-
      $(1,2,1)$
    ok: false
    why: |-
      $f(1,2,1)=(4,0)$: la primera componente no se anula.
  - t: |-
      $(1,-2,1)$
    ok: true
  - t: |-
      $(1,-1,1)$
    ok: false
    why: |-
      $f(1,-1,1)=(1,0)$: la primera componente vale 1, no 0.
  - t: |-
      $(0,0,1)$
    ok: false
    why: |-
      $f(0,0,1)=(1,-1)$: no es el cero.
  fb: |-
    $f(1,-2,1)=(1-2+1,\ 1-1)=(0,0)$. El núcleo es la recta $\langle(1,-2,1)\rangle$.
- p: |-
    ¿Puede ser inyectiva una aplicación lineal $f:\mathbb R^4\to\mathbb R^3$?
  opciones:
  - t: |-
      Sí, si su matriz tiene rango 3
    ok: false
    why: |-
      Con rango 3 la imagen es todo $\mathbb R^3$ (sobreyectiva), pero el núcleo tiene dimensión $4-3=1$, así que no es inyectiva.
  - t: |-
      No, nunca
    ok: true
  - t: |-
      Sí, si su matriz tiene rango 4
    ok: false
    why: |-
      Una matriz $3\times4$ no puede tener rango 4: el rango es como mucho el menor de filas y columnas.
  - t: |-
      Depende solo de la base elegida
    ok: false
    why: |-
      Que sea inyectiva o no no depende de las bases, sino de $\operatorname{Nuc}(f)$.
  fb: |-
    $\operatorname{Dim}\operatorname{Im}(f)\le3$, luego $\operatorname{Dim}\operatorname{Nuc}(f)=4-\operatorname{Dim}\operatorname{Im}(f)\ge1$: siempre hay vectores no nulos que van al cero.
- p: |-
    Si $\operatorname{Nuc}(f)=\langle(1,-1)\rangle$ y $\lambda=3$, ¿cuál es $\operatorname{Nuc}(3f)$?
  opciones:
  - t: |-
      $\langle(1,-1)\rangle$
    ok: true
  - t: |-
      $\{0\}$
    ok: false
    why: |-
      Multiplicar por 3 no hace que nada deje de anularse: $3f(v)=0\iff f(v)=0$.
  - t: |-
      $\mathbb R^2$
    ok: false
    why: |-
      El núcleo no crece al multiplicar por un escalar no nulo.
  - t: |-
      $\langle(3,-3)\rangle$, porque «se multiplica por 3»
    ok: false
    why: |-
      El núcleo no se multiplica por $\lambda$: esa recta coincide con la original solo por casualidad, y el razonamiento es incorrecto.
  fb: |-
    Si $\lambda\neq0$, $3f(v)=0\iff f(v)=0$: $\operatorname{Nuc}(\lambda f)=\operatorname{Nuc}(f)$.
- p: |-
    $f:\mathbb R^2\to\mathbb R^2$, $f(x,y)=(y,0)$. ¿Cuál es $\operatorname{Nuc}(f\circ f)$?
  opciones:
  - t: |-
      $\langle(1,0)\rangle$, igual que $\operatorname{Nuc}(f)$
    ok: false
    why: |-
      Al componer el núcleo puede crecer: $f\circ f(x,y)=f(y,0)=(0,0)$ para todo $(x,y)$.
  - t: |-
      $\{0\}$
    ok: false
    why: |-
      Si $\operatorname{Nuc}(f)\neq\{0\}$, entonces $\operatorname{Nuc}(f\circ f)\supset\operatorname{Nuc}(f)\neq\{0\}$.
  - t: |-
      $\mathbb R^2$
    ok: true
  - t: |-
      $\langle(0,1)\rangle$
    ok: false
    why: |-
      Como $f\circ f$ es la aplicación nula, se anulan todos los vectores, no solo los de esa recta.
  fb: |-
    $f\circ f(x,y)=(0,0)$ para todo $(x,y)$, luego el núcleo es todo $\mathbb R^2$ (dimensión 2) y la imagen es $\{0\}$: $0+2=2$.
