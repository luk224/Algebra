esencial:
  intro: |-
    Las simétricas son las matrices que se diagonalizan sin torcer los ejes: eso es lo que hay que saber de este tema.
  items:
  - |-
    <b>Teoremas 5.7 y 5.8:</b> si $A=A^t$ es real, existe $P$ ortogonal con $P^tAP=\Lambda$ (y $P^{-1}=P^t$). Sus valores propios son reales y siempre $d_i=\alpha_i$.
  - |-
    <b>Valores propios distintos, ejes perpendiculares:</b> $L_{\lambda_1}\perp L_{\lambda_2}$ si $\lambda_1\neq\lambda_2$. Dentro de un mismo $L_\lambda$ de dimensión $\ge2$ hay que aplicar Gram-Schmidt.
  - |-
    <b>Receta:</b> valores propios, bases de $L_\lambda$, Gram-Schmidt dentro de cada $L_\lambda$, normalizar, $P$ y $\Lambda$ en el mismo orden. Sin normalizar no sale $P^tAP=\Lambda$.
  - |-
    <b>Recíproco:</b> diagonalizable ortogonalmente $\iff$ simétrica (real). Diagonalizable no implica simétrica.
  - |-
    <b>Usos:</b> $A=\sum\lambda_ju_ju_j^t$ (reconstruir $A$) y $A^n=P\Lambda^nP^t$.
tipos:
- id: diag
  nombre: |-
    Diagonalizar ortogonalmente una simétrica
  receta: |-
    Valores propios, base de cada $L_\lambda$, Gram-Schmidt dentro de cada $L_\lambda$ si hace falta, normalizar y $P^tAP=\Lambda$.
  senal: |-
    «diagonaliza ortogonalmente», «halla una matriz de paso ortogonal $P$ tal que $P^tAP$ sea diagonal», «$P^{-1}=P^t$».
  pasos:
  - |-
    Comprueba que $A=A^t$ y halla los valores propios con $|A-\lambda I|=0$ (control: suma = traza, producto = determinante).
  - |-
    Para cada $\lambda$ calcula una base de $L_\lambda=\operatorname{Nuc}(A-\lambda I)$; debe salir $\dim L_\lambda=\alpha_\lambda$.
  - |-
    Si algún $L_\lambda$ tiene dimensión $\ge2$ y la base no es ortogonal, aplica Gram-Schmidt solo dentro de ese subespacio.
  - |-
    Divide cada vector por su norma y colócalos como columnas de $P$; escribe $\Lambda$ con los valores propios en el mismo orden.
  - |-
    Comprueba $P^tP=I$ y $AP=P\Lambda$.
  ejemplo: |-
    $A=\begin{pmatrix}2&1\\1&2\end{pmatrix}$: $\lambda=1$ con $(-1,1)$ y $\lambda=3$ con $(1,1)$ (perpendiculares). Normalizando, $P=\frac1{\sqrt2}\begin{pmatrix}-1&1\\1&1\end{pmatrix}$ y $P^tAP=\operatorname{diag}(1,3)$.
  fallos: |-
    no normalizar (sale $\operatorname{diag}(\|v_i\|^2\lambda_i)$) · aplicar Gram-Schmidt a vectores de valores propios distintos · desordenar las columnas de $P$ respecto de $\Lambda$ · calcular $P^{-1}$ por Gauss-Jordan en vez de trasponer.
- id: teoria
  nombre: |-
    ¿Es diagonalizable ortogonalmente? Justificar propiedades
  receta: |-
    Mira si $A=A^t$ (y real): si sí, valores propios reales y ejes perpendiculares; si no, no es diagonalizable ortogonalmente.
  senal: |-
    «pruébese que es simétrica», «¿por qué tiene valores propios reales?», «¿es diagonalizable ortogonalmente?», «explique en qué consiste…».
  pasos:
  - |-
    Decide si $A$ es real y simétrica ($a_{ij}=a_{ji}$).
  - |-
    Si lo es, cita el teorema que da lo pedido: valores propios reales, $L_{\lambda_1}\perp L_{\lambda_2}$ si $\lambda_1\neq\lambda_2$, Teor. 5.7 o 5.8.
  - |-
    Para una demostración, usa $A^t=A$ y la identidad $Ax\cdot y=x\cdot Ay$ (o traspón $P\Lambda P^t$).
  - |-
    Si no es simétrica, busca el vector propio que no sea perpendicular a otro, o recuerda el recíproco: diagonalizable ortogonalmente implica simétrica.
  ejemplo: |-
    $\begin{pmatrix}1&2\\0&3\end{pmatrix}$ es diagonalizable ($\lambda=1,3$) pero no simétrica; sus vectores propios $(1,0)$ y $(1,1)$ no son perpendiculares, luego no es diagonalizable ortogonalmente.
  fallos: |-
    confundir «diagonalizable» con «diagonalizable ortogonalmente» · decir que todos los vectores propios son ortogonales (solo los de valores propios distintos) · confundir simétrica con ortogonal · olvidar que la matriz debe ser real.
- id: construir
  nombre: |-
    Construir o completar una simétrica con datos
  receta: |-
    Usa $A=\sum\lambda_iu_iu_i^t=P\Lambda P^t$, o impón simetría y la condición de vector propio.
  senal: |-
    «halla la matriz simétrica con valores propios… y vector propio…», «completa $A$ sabiendo que $(\ldots)$ es vector propio».
  pasos:
  - |-
    Si faltan entradas, usa $A=A^t$ para rellenar las que se deducen por simetría.
  - |-
    Impón $Av=\lambda v$ para el vector propio dado y resuelve el sistema (o usa traza y determinante).
  - |-
    Si te dan valores y subespacios propios, obtén vectores unitarios y escribe $A=\sum\lambda_iu_iu_i^t$ (o $P\Lambda P^t$).
  - |-
    Comprueba que $A$ es simétrica y que $Av=\lambda v$.
  ejemplo: |-
    $\lambda=3$ con $u=\frac1{\sqrt2}(1,1)$ y $\lambda=1$ con $w=\frac1{\sqrt2}(1,-1)$: $A=3uu^t+ww^t=\begin{pmatrix}2&1\\1&2\end{pmatrix}$.
  fallos: |-
    usar vectores propios sin normalizar en $\sum\lambda_iu_iu_i^t$ · olvidar que un valor propio doble pide el plano completo (complemento ortogonal) · obtener una matriz no simétrica.
- id: potencia
  nombre: |-
    Potencias y raíces de una simétrica
  receta: |-
    Diagonaliza con $P$ ortogonal y escribe $A^n=P\Lambda^nP^t$ (y $\sqrt A=P\Lambda^{1/2}P^t$).
  senal: |-
    «calcula $A^n$», «halla una raíz cuadrada de $A$», «¿es diagonalizable $A^{51}$?».
  pasos:
  - |-
    Diagonaliza ortogonalmente: $A=P\Lambda P^t$.
  - |-
    Eleva solo la diagonal: $\Lambda^n=\operatorname{diag}(\lambda_i^n)$ (para la raíz, $\sqrt{\lambda_i}$, con $\lambda_i\ge0$).
  - |-
    Reconstruye $A^n=P\Lambda^nP^t$ multiplicando; no hace falta calcular $P^{-1}$.
  ejemplo: |-
    $A=\begin{pmatrix}5&4\\4&5\end{pmatrix}$ tiene $\lambda=9$ con $(1,1)$ y $\lambda=1$ con $(1,-1)$: $A^n=\frac12\begin{pmatrix}9^n+1&9^n-1\\9^n-1&9^n+1\end{pmatrix}$.
  fallos: |-
    elevar a $n$ cada entrada de $A$ · usar $P$ sin normalizar y olvidar $P^{-1}$ · tomar raíz de un valor propio negativo.
- id: semcong
  nombre: |-
    ¿Semejantes y/o congruentes?
  receta: |-
    Dos simétricas con los mismos valores propios (con multiplicidades) son semejantes y también congruentes.
  senal: |-
    «¿son congruentes?», «¿son semejantes?», «mismo polinomio característico».
  pasos:
  - |-
    Comprueba si las matrices son simétricas y halla sus valores propios.
  - |-
    Si dos simétricas tienen los mismos valores propios, las dos son semejantes a la misma $\Lambda$ y, como $P^{-1}=P^t$, también congruentes.
  - |-
    Si no, compara las propiedades que no cambian: la semejanza conserva traza, determinante y valores propios; la congruencia, el signo de los valores propios (signatura).
  - |-
    Si una matriz no es simétrica, no concluyas por el polinomio: busca, por ejemplo, el número de vectores propios independientes.
  ejemplo: |-
    $A=\begin{pmatrix}1&1\\1&1\end{pmatrix}$ y $B=\operatorname{diag}(2,0)$: ambas simétricas con valores propios $2$ y $0$, luego son semejantes y congruentes.
  fallos: |-
    creer que mismo polinomio característico implica semejantes (falla si no son diagonalizables) · confundir semejanza con congruencia · pensar que $P^tAP$ conserva los valores propios si $P$ no es ortogonal.
quiz:
- p: |-
    ¿Cuál de estas matrices es diagonalizable ortogonalmente?
  opciones:
  - t: |-
      $\begin{pmatrix}1&2\\0&3\end{pmatrix}$
    ok: false
    why: |-
      Es diagonalizable (valores propios $1$ y $3$), pero no es simétrica: sus vectores propios no son perpendiculares.
  - t: |-
      $\begin{pmatrix}1&2\\2&1\end{pmatrix}$
    ok: true
  - t: |-
      $\begin{pmatrix}1&1\\0&1\end{pmatrix}$
    ok: false
    why: |-
      Ni siquiera es diagonalizable: el valor propio $1$ es doble y solo tiene una recta de vectores propios.
  - t: |-
      $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$
    ok: false
    why: |-
      Es ortogonal (un giro), pero no simétrica: ortogonal no es simétrica y no tiene valores propios reales.
  fb: |-
    Solo la segunda es simétrica y real, y eso equivale a ser diagonalizable ortogonalmente.
- p: |-
    Para $A=\begin{pmatrix}3&1\\1&3\end{pmatrix}$ se toma $P=\begin{pmatrix}1&1\\1&-1\end{pmatrix}$ (columnas $(1,1)$ y $(1,-1)$, sin normalizar). ¿Cuánto vale $P^tAP$?
  opciones:
  - t: |-
      $\begin{pmatrix}4&0\\0&2\end{pmatrix}$
    ok: false
    why: |-
      Esa sería la $\Lambda$ correcta, pero solo se obtiene con columnas normalizadas.
  - t: |-
      $\begin{pmatrix}8&0\\0&4\end{pmatrix}$
    ok: true
  - t: |-
      $\begin{pmatrix}3&1\\1&3\end{pmatrix}$
    ok: false
    why: |-
      $P$ no es ortogonal, así que $P^tAP$ no es $A$; esa conclusión sería válida con $P=I$.
  fb: |-
    Cada columna tiene norma $\sqrt2$, así que cada valor propio sale multiplicado por $\|v_i\|^2=2$: $\operatorname{diag}(8,4)$. Dividiendo por $\sqrt2$, $P^tAP=\operatorname{diag}(4,2)$.
- p: |-
    Una simétrica $3\times3$ tiene polinomio característico $-(\lambda-2)^2(\lambda+1)$. ¿Cuánto vale $\dim L(2)$?
  opciones:
  - t: '1'
    ok: false
    why: |-
      Eso puede pasar en matrices no simétricas, pero en una simétrica real $d_i=\alpha_i$.
  - t: '2'
    ok: true
  - t: '3'
    ok: false
    why: |-
      La dimensión de $L(2)$ es $2$ (la multiplicidad); $3$ ocuparía todo el espacio, pero queda el valor propio $-1$.
  fb: |-
    En una simétrica real $d_i=\alpha_i$ (Teor. 5.7): $\dim L(2)=2$ y $\dim L(-1)=1$.
- p: |-
    $A$ es simétrica y tiene vectores propios $(1,2)$ de valor propio $1$ y $(a,1)$ de valor propio $3$. ¿Cuánto vale $a$?
  opciones:
  - t: |-
      $a=2$
    ok: false
    why: |-
      Con $a=2$ el producto escalar es $4\neq0$: los vectores no serían perpendiculares.
  - t: |-
      $a=-2$
    ok: true
  - t: |-
      $a=-\tfrac12$
    ok: false
    why: |-
      Es la pendiente perpendicular, pero aquí la condición es $(1,2)\cdot(a,1)=a+2=0$.
  fb: |-
    Como los valores propios son distintos, los vectores propios son ortogonales: $a+2=0$, $a=-2$.
- p: |-
    En $L(\lambda)$ hay la base $\{(1,1,0),(1,0,1)\}$. Para diagonalizar ortogonalmente, ¿qué hay que hacer con ella?
  opciones:
  - t: |-
      Nada: normalizarla basta, porque los vectores propios de una simétrica son ortogonales.
    ok: false
    why: |-
      $(1,1,0)\cdot(1,0,1)=1\neq0$: solo son ortogonales los de valores propios distintos.
  - t: |-
      Aplicar Gram-Schmidt dentro de $L(\lambda)$ y luego normalizar.
    ok: true
  - t: |-
      Aplicar Gram-Schmidt junto con los vectores de los otros valores propios.
    ok: false
    why: |-
      Es innecesario: los de otros valores propios ya son perpendiculares y mezclarlos puede sacar vectores de su subespacio.
  fb: |-
    Los dos vectores no son perpendiculares ($1\neq0$), pero ambos están en el mismo $L(\lambda)$: Gram-Schmidt ahí da vectores todavía propios.
- p: |-
    Sea $A=\begin{pmatrix}5&4\\4&5\end{pmatrix}$. ¿Cuánto vale la traza de $A^3$?
  opciones:
  - t: |-
      $250$
    ok: false
    why: |-
      Es $5^3+5^3$: elevar la diagonal de $A$ al cubo no da la diagonal de $A^3$.
  - t: |-
      $730$
    ok: true
  - t: |-
      $27$
    ok: false
    why: |-
      Es $3^3$; no es ninguna traza de esta matriz.
  fb: |-
    $A$ tiene valores propios $9$ y $1$; $\operatorname{tr}A^3=9^3+1^3=730$.
capa: true
que_cae_nota: |-
  La mayoría de ejercicios son de dos clases: diagonalizar ortogonalmente o justificar por qué una matriz simétrica cumple (o no) una propiedad; reconstruir una simétrica y calcular potencias son los de nivel más alto.
