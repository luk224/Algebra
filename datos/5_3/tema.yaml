h1: |-
  Diagonalización de matrices simétricas
resumen: |-
  Las matrices simétricas son las únicas que se diagonalizan <b>sin deformar el espacio</b>: sus vectores propios forman unos ejes <b>perpendiculares</b>, así que la matriz de paso es ortogonal ($P^{-1}=P^t$) y $P^tAP=\Lambda$. Aprenderás por qué sus valores propios son siempre reales, por qué los ejes salen perpendiculares, la receta de cinco pasos (con Gram-Schmidt dentro de cada subespacio propio) y qué hace el teorema espectral.
