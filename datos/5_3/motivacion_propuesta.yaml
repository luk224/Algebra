motivacion:
  s1: |-
    Si tomas la matriz $\begin{pmatrix}2&1\\1&2\end{pmatrix}$ y la miras en un espejo que intercambia filas y columnas, ves exactamente la misma matriz. ¿Qué tiene de especial una matriz que no cambia al reflejarla así y por qué importa al estirar figuras?
  s2: |-
    Una matriz con números reales puede no tener ningún valor propio real (un giro de $90^\circ$, por ejemplo). ¿Cabe esperar que una matriz simétrica se comporte mejor y siempre tenga direcciones que solo se estiran?
  s3: |-
    Diagonalizar suele exigir calcular $P^{-1}$, que es un trabajo pesado. ¿Se puede encontrar una base de vectores propios cuya matriz de paso se invierta con solo darle la vuelta?
  s4: |-
    Tienes una matriz simétrica $3\times3$ con un valor propio doble. ¿Cómo eliges, paso a paso, tres vectores propios que además sean perpendiculares entre sí y de longitud 1?
consignas:
  - animacion: |-
      Animación: matriz simétrica
    consigna: |-
      Cambia las entradas $a$, $b$, $c$ de la matriz y mueve el deslizador del punto $x$ sobre la circunferencia. Fíjate en la elipse imagen, en sus ejes propios y en el ángulo que forman.
    pregunta: |-
      ¿Qué ocurre con el ángulo entre los ejes propios al desmarcar la casilla «simétrica» y poner una matriz cualquiera?
  - animacion: |-
      Animación 3D: esfera
    consigna: |-
      Prueba los presets, cambia las entradas de la matriz simétrica y mueve el deslizador $t$ para deformar la esfera en el elipsoide. Fíjate en las flechas $u_1,u_2,u_3$, en $P^tP$ y en qué pasa con las rectas propias cuando hay un valor propio doble.
    pregunta: |-
      ¿Por qué los tres ejes del elipsoide son siempre perpendiculares, y qué ocurre con ellos si un valor propio se repite?
