motivacion:
  s1: |-
    Una esfera, un cono y una silla de montar se escriben como ecuaciones de segundo grado en $x_1,x_2,x_3$. ¿Cómo se guardan todos los coeficientes (cuadráticos, cruzados, lineales y el término independiente) en una sola matriz para tratarlos a la vez?
  s2: |-
    La ecuación $x_1^2+x_2^2-x_3^2=1$ y la ecuación $x_1^2+x_2^2-x_3^2=-1$ solo se distinguen en un signo, pero una es una superficie de una pieza y la otra tiene dos piezas separadas. ¿Qué formas distintas puede tener una cuádrica cuando está bien colocada, con el centro en el origen y los ejes alineados?
  s3: |-
    Una cuádrica con un término $x_2x_3$ y términos lineales aparece inclinada y desplazada, y no se reconoce a simple vista. ¿Qué movimientos del espacio (girar y trasladar) la dejan «bien colocada» sin deformarla, y cómo se encuentran?
  s4: |-
    A veces solo se pregunta qué superficie es, sin necesidad de calcular giros ni traslaciones. ¿Qué números calculados directamente de la matriz de la ecuación permiten decir si es un elipsoide, un cono o un paraboloide?
  receta: |-
    Ante una ecuación de segundo grado en tres variables hay dos caminos: reducirla con giro y traslación, o clasificarla solo con invariantes. ¿Cuándo conviene cada uno y en qué orden se hacen los pasos?
consignas:
  - animacion: |-
      Animación 3D: una cuádrica, su ecuación y su clasificación
    consigna: |-
      Con $x_1^2+x_2^2-x_3^2=1$ cargada, cambia la constante $c$ a $+1$ y luego a $0$, y fíjate en cómo cambia el nombre de la superficie y los números de la clasificación.
    pregunta: |-
      ¿Qué pasa con la superficie en el valor de $c$ que separa una hoja de dos hojas?
  - animacion: |-
      Animación 3D: giro + traslación en el ejercicio E 6.41
    consigna: |-
      Mueve primero el deslizador de giro y luego el de traslación, y fíjate en qué ejes se enderezan y adónde va el centro hasta que se llega a la ecuación reducida.
    pregunta: |-
      ¿Qué hace cada movimiento: quita los términos cruzados o los lineales?
  - animacion: |-
      Animación 3D: los paraboloides (cuádricas sin centro)
    consigna: |-
      Cambia el signo de uno de los coeficientes de $x_1^2$ o $x_2^2$ y fíjate en cómo pasa el cuenco a silla de montar, y en el valor de los invariantes.
    pregunta: |-
      ¿Qué invariante cambia de signo al pasar de paraboloide elíptico a hiperbólico?
