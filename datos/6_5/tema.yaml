kicker: |-
  Módulo 6 · Formas bilineales y cuadráticas · Tema 6.5
h1: |-
  Cuádricas
resumen: |-
  Una <b>cuádrica</b> es la «cónica del espacio»: la superficie de $\mathbb R^3$ que cumple una ecuación de segundo grado en $x_1,x_2,x_3$ (elipsoides, hiperboloides, paraboloides, conos, cilindros…). Aprenderás los dos caminos que ya conoces de las cónicas, ahora con una matriz $4\times4$: <b>mover los ejes</b> (un giro que elimina los productos cruzados y una traslación que elimina los términos lineales, hasta la <i>ecuación reducida</i>) y <b>clasificar sin dibujar</b>, con cuatro números que no cambian al mover los ejes (los <i>invariantes</i> $\operatorname{rang}A$, $I_a$, $A_{00}$, $J_a$).
chips:
- |-
  Libro oficial: Álgebra para Ingenieros, §6.5 (pp. 288-306)
- |-
  Ejercicios: E Ej. 6.33–6.42 (pp. 228-238)
- |-
  ⏱ ~8 h de estudio
