- id: ej6-33
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.33, p. 229
    texto: |-
      E p.229
  problema:
  - param
  - clasif
  nivel: 3
  titulo: |-
    Ejercicio 6.33 — ¿para qué $\lambda$ es un cono $x_1^2-x_2^2+2\lambda x_1x_3-x_2x_3=0$?
  enunciado: |-
    Para que $x_1^2-x_2^2+2\lambda x_1x_3-x_2x_3=0$ sea la ecuación de un cono, el valor de $\lambda$ debe ser: A) $\lambda=\tfrac12$. B) $\lambda=-1$. C) $\lambda=\tfrac12$ ó $\lambda=-\tfrac12$.
  pista: |-
    Escribe la matriz $A$ de $4\times4$ con $\lambda$ dentro (no hay términos lineales ni constante). Un cono necesita rango 3: ¿qué debe cumplir $|A|$, y qué pasa con $A_{00}$?
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Valor de $\lambda$ para que sea un cono.
      - - |-
          Qué se usa
        - |-
          <b>Ecuación matricial de una cuádrica (U p.288-300):</b> $(1\ x_1\ x_2\ x_3)A\,(1\ x_1\ x_2\ x_3)^t=0$ con $A$ simétrica $4\times4$ y parte cuadrática $A_{00}=M$ ($3\times3$). <b>Invariantes:</b> $\operatorname{rang}A$, $|A|$, $|A_{00}|$, $I_a=\operatorname{tr}A_{00}$ y $J_a$ (suma de menores principales $2\times2$ de $A_{00}$). Cono $\iff|A|=0$ y $|A_{00}|\neq0$.
      - - Plan
        - |-
          Imponer $|A|=0$ y comprobar $|A_{00}|\neq0$.
  - pasos:
    - |-
      <b>Matriz:</b> $a_{11}=1$, $a_{22}=-1$, $a_{33}=0$, $a_{12}=0$, $2a_{13}=2\lambda\Rightarrow a_{13}=\lambda$, $2a_{23}=-1\Rightarrow a_{23}=-\tfrac12$; sin parte lineal ni constante: $$A=\begin{pmatrix}0&0&0&0\\0&1&0&\lambda\\0&0&-1&-\tfrac12\\0&\lambda&-\tfrac12&0\end{pmatrix}.$$
    - |-
      <b>$|A|=0$ para todo $\lambda$</b> (primera fila nula) y, como la fila y la columna 0 son nulas, $\operatorname{rang}A=\operatorname{rang}M$.
    - |-
      <p><b>$A_{00}=|M|$</b> (1.ª fila):</p>
            $$1\big(0-\tfrac14\big)-0+\lambda(0+\lambda)=\lambda^2-\tfrac14.$$
    - |-
      <b>Cono</b> ⇔ rango 3 y $A_{00}\neq0$ (cuadro, U p.300) ⇔ $\lambda^2\neq\tfrac14$ ⇔ $\lambda\neq\pm\tfrac12$.
    - |-
      <b>Opciones.</b> A) $\lambda=\tfrac12$: $A_{00}=0$ y rango 2 ⇒ par de planos ($J_a=-\tfrac{4\lambda^2+5}4<0$: reales secantes): <b>falsa</b>. C) incluye $\lambda=\tfrac12$: <b>falsa</b>. B) $\lambda=-1$: $A_{00}=\tfrac34\neq0$, rango 3 ⇒ cono; y como $I_a=1-1+0=0$ hay signos mezclados ⇒ <b>cono real</b>: <b>verdadera</b>.
  - receta: |-
      ecuación homogénea (sin lineales ni constante) ⇒ $|A|=0$ siempre; es cono si $A_{00}\neq0$. Con parámetro: resuelve $A_{00}=0$ y excluye esos valores.
  - error: |-
      creer que «cono» exige un valor concreto de $\lambda$; o aceptar $A_{00}=0$ como cono.
- id: ej6-34
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.34, p. 230
    texto: |-
      E p.230
  problema:
  - clasif
  nivel: 2
  titulo: |-
    Ejercicio 6.34 — qué se deduce del polinomio $p^3+2p^2+p+5$
  enunciado: |-
    Sea $p^3+2p^2+p+5$ la ecuación de tercer grado asociada a una cuádrica. Entonces esa cuádrica: A) No tiene centro. B) Es un cono. C) No puede ser un par de planos imaginarios.
  pista: |-
    El polinomio de tercer grado es $p^3-I_a p^2+J_a p-A_{00}$. Identifica $I_a$, $J_a$ y $A_{00}$ comparando coeficientes y mira qué dice cada opción sobre $A_{00}$ y el rango.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Qué se deduce del polinomio característico de la parte cuadrática.
      - - |-
          Cómo lo pienso
        - |-
          Los signos de las raíces de $p^3+2p^2+p+5$ dicen la signatura; y si el término independiente es no nulo, $0$ no es raíz, luego $|A_{00}|\neq0$ y hay centro.
      - - |-
          Qué uso
        - |-
          <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide.
      - - |-
          Por dónde empiezo
        - |-
          Regla de signos de Descartes.
  - pasos:
    - |-
      <b>Identificar los invariantes</b> comparando con $p^3-I_ap^2+J_ap-A_{00}$ (U p.299): $-I_a=2\Rightarrow I_a=-2$; $J_a=1$; $-A_{00}=5\Rightarrow A_{00}=-5$.
    - |-
      <b>Rango.</b> $A_{00}\neq0$ ⇒ $\operatorname{rang}A\ge3$ (hecho (R)): es 3 ó 4; sin $|A|$ no se decide.
    - |-
      <b>A) Falsa.</b> $A_{00}\neq0$ ⇒ <b>centro único</b> (U p.299).
    - |-
      <b>B) Falsa</b> (no se puede asegurar): es cono solo si $|A|=0$; con $|A|\neq0$ sería un elipsoide o un hiperboloide.
    - |-
      <b>C) Verdadera.</b> Un par de planos exige rango 2 (cuadro), imposible porque el rango es $\ge3$.
  - receta: |-
      del polinomio se leen $I_a$, $J_a$, $A_{00}$ (¡signos alternos!) y nada más: $A_{00}\neq0$ ⇒ centro y rango $\ge3$; para decidir entre rango 3 y 4 hace falta $|A|$.
  - error: |-
      leer $A_{00}=5$ (sin cambiar el signo) o $I_a=2$.
- id: ej6-35
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.35, p. 230
    texto: |-
      E p.230
  problema:
  - clasif
  nivel: 2
  titulo: |-
    Ejercicio 6.35 — $x_1^2-2x_2^2+x_3^2-2x_1x_2+3x_1x_3-4x_2x_3+\lambda=0$ con $\lambda=0$
  enunciado: |-
    Si $\lambda=0$, la cuádrica de ecuación $x_1^2-2x_2^2+x_3^2-2x_1x_2+3x_1x_3-4x_2x_3+\lambda=0$ es: A) Un paraboloide. B) Un cono. C) Un par de planos.
  pista: |-
    Con $\lambda=0$ no hay parte lineal ni constante: la fila y la columna 0 de $A$ son nulas, así que $|A|=0$. Calcula $A_{00}=|M|$ y recorre el cuadro por rango.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Clasificar una cuádrica concreta con $\lambda=0$.
      - - |-
          Qué se usa
        - |-
          <b>Ecuación matricial de una cuádrica (U p.288-300):</b> $(1\ x_1\ x_2\ x_3)A\,(1\ x_1\ x_2\ x_3)^t=0$ con $A$ simétrica $4\times4$ y parte cuadrática $A_{00}=M$ ($3\times3$). <b>Invariantes:</b> $\operatorname{rang}A$, $|A|$, $|A_{00}|$, $I_a=\operatorname{tr}A_{00}$ y $J_a$ (suma de menores principales $2\times2$ de $A_{00}$). <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide.
      - - Plan
        - |-
          Calcular $|A|$ y $|A_{00}|$.
  - pasos:
    - |-
      <b>Matriz:</b> $a_{12}=-1$, $a_{13}=\tfrac32$, $a_{23}=-2$, sin lineales, $a_{00}=\lambda$: $$A=\begin{pmatrix}\lambda&0&0&0\\0&1&-1&\tfrac32\\0&-1&-2&-2\\0&\tfrac32&-2&1\end{pmatrix}.$$
    - |-
      <p><b>$|A|=\lambda\,|M|$</b> (desarrollo por la 1.ª fila).</p>
            $$|M|=1(-2-4)-(-1)(-1+3)+\tfrac32(2+3)=-6+2+\tfrac{15}2=\tfrac72.$$
            <p>Así $A_{00}=\tfrac72$ y $|A|=\tfrac72\lambda$.</p>
    - |-
      <b>Para $\lambda=0$:</b> $|A|=0$ y $A_{00}=\tfrac72\neq0$ ⇒ rango 3 (hecho (R)) ⇒ <b>cono</b>. Respuesta <b>B</b>.
    - |-
      <b>Real o imaginario</b> (completa la clasificación): $I_a=1-2+1=0$ ⇒ signos mezclados ⇒ <b>cono real</b> (valores propios $\approx3{,}36;\,-0{,}35;\,-3{,}01$).
    - |-
      A) falsa: un paraboloide exige rango 4 y $A_{00}=0$. C) falsa: un par de planos exige rango 2.
  - html: |-
      <p><b>Comentario.</b> Una ecuación <b>homogénea</b> de grado 2 con $A_{00}\neq0$ siempre es un cono con vértice en el origen: si $X$ la cumple, $tX$ también.</p>
  - receta: |-
      $A$ por bloques ($a_{00}$ aislado en la esquina): $|A|=a_{00}\,A_{00}$; si $a_{00}=0$ y $A_{00}\neq0$, cono.
  - error: |-
      olvidar los factores 2: $-2x_1x_2$ da $a_{12}=-1$ y $3x_1x_3$ da $a_{13}=\tfrac32$.
- id: ej6-36
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.36, p. 231
    texto: |-
      E p.231
  problema:
  - param
  - clasif
  nivel: 3
  titulo: |-
    Ejercicio 6.36 — familia con parámetro $a$: centro, cilindro, paraboloide
  enunciado: |-
    La cuádrica $x_1^2+x_2^2+x_3^2+4x_1x_2+2ax_1x_3+4x_2x_3+2x_1+4x_2+6x_3=0$, con $a\in\mathbb R$, verifica que: A) Es una cuádrica con centro para cualquier valor de $a$. B) No puede ser un cilindro. C) Siempre es un paraboloide.
  pista: |-
    Calcula $A_{00}=|M|$ como polinomio en $a$ y mira sus raíces: fuera de ellas hay centro. Después estudia por separado cada valor de $a$ que lo anula.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Estudiar una familia en $a$: centro, cilindro, paraboloide.
      - - |-
          Qué se usa
        - |-
          <b>Familias con parámetros:</b> calcular $|A|$, $|A_{00}|$ y los signos de los valores propios de $M$ en función del parámetro; los valores críticos son las raíces de esos determinantes. <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide.
      - - Plan
        - |-
          Estudiar $|A_{00}|$ y $|A|$ según $a$.
  - pasos:
    - |-
      <b>Matriz:</b> $a_{12}=2$, $a_{13}=a$, $a_{23}=2$, $a_{01}=1$, $a_{02}=2$, $a_{03}=3$, $a_{00}=0$: $$A=\begin{pmatrix}0&1&2&3\\1&1&2&a\\2&2&1&2\\3&a&2&1\end{pmatrix},\qquad M=\begin{pmatrix}1&2&a\\2&1&2\\a&2&1\end{pmatrix}.$$
    - |-
      <b>$A_{00}$</b> (1.ª fila): $1(1-4)-2(2-2a)+a(4-a)=-a^2+8a-7=-(a-1)(a-7)$: se anula en $a=1$ y $a=7$.
    - |-
      <b>$|A|=4a^2-26a+34=2(2a^2-13a+17)$</b>, con raíces $a=\tfrac{13\pm\sqrt{33}}4\approx1{,}81;\ 4{,}69$ (ninguna es 1 ni 7).
    - |-
      <b>Casos:</b>
            <ul>
              <li>$a\in\{1,7\}$: $A_{00}=0$ y $|A|=12$ ($a=1$) ó $48$ ($a=7$), $\neq0$ ⇒ rango 4 ⇒ <b>paraboloide</b>; $J_a=-a^2-5<0$ ⇒ hiperbólico.</li>
              <li>$a=\tfrac{13\pm\sqrt{33}}4$: $|A|=0$ y $A_{00}\approx4{,}22;\ 8{,}53\neq0$ ⇒ rango 3 (hecho (R)) ⇒ <b>cono</b>.</li>
              <li>Resto: $|A|\neq0$, $A_{00}\neq0$ ⇒ ordinaria con centro.</li>
            </ul>
    - |-
      <b>Opciones.</b> A) <b>falsa</b>: para $a=1,7$ no hay centro. C) <b>falsa</b>: solo para $a=1,7$. <b>B) verdadera</b>: un cilindro exige rango 3 <b>y</b> $A_{00}=0$; pero cuando $A_{00}=0$ el rango es 4, y cuando el rango es 3, $A_{00}\neq0$. Nunca ocurren a la vez.
  - html: |-
      <div class="recipe"><b>Receta (con parámetro):</b> (1) $|A|$ y $A_{00}$ como polinomios; (2) sus raíces parten la recta en casos; (3) en cada caso, rango (con (R)) y cuadro; (4) $J_a$ o los signos para el subtipo; (5) si hay cilindro, real/imaginario con $d=F(c)$.</div>
  - error: |-
      concluir «cono» con $|A|=0$ sin ver que $A_{00}\neq0$ allí; o «cilindro» sin comprobar que el rango es 3.
- id: ej6-37
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.37, p. 232
    texto: |-
      E p.232
  problema:
  - param
  - clasif
  nivel: 3
  titulo: |-
    Ejercicio 6.37 — ¿para qué $m$ es un paraboloide elíptico?
  enunciado: |-
    Para que la cuádrica de ecuación $x_1^2+mx_2^2+2x_3^2+2x_1-4x_2-(m+1)=0$ resulte un paraboloide elíptico, debe ser: A) $m>0$. B) $m<0$. C) $m=0$.
  pista: |-
    Un paraboloide pide $A_{00}=0$ y $|A|\neq0$, y el signo de $J_a$ decide si es elíptico. Impón esas condiciones sobre $m$ y comprueba que se cumplen.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Valores de $m$ para paraboloide elíptico.
      - - |-
          Cómo lo pienso
        - |-
          Paraboloide ⇔ $|A_{00}|=0$ y $|A|\neq0$; elíptico ⇔ los dos valores propios no nulos tienen el mismo signo.
      - - |-
          Qué uso
        - |-
          <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide.
      - - |-
          Por dónde empiezo
        - |-
          $|A_{00}|=0$ y signos.
  - pasos:
    - |-
      <b>Matriz:</b> $a_{00}=-(m+1)$, $a_{01}=1$, $a_{02}=-2$, $a_{03}=0$, $M=\operatorname{diag}(1,m,2)$: $$A=\begin{pmatrix}-(m+1)&1&-2&0\\1&1&0&0\\-2&0&m&0\\0&0&0&2\end{pmatrix}.$$
    - |-
      <p><b>$|A|$</b> (por la 4.ª fila):</p>
            $$2\begin{vmatrix}-(m+1)&1&-2\\1&1&0\\-2&0&m\end{vmatrix}=2\,[-m(m+1)-4-m]=-2(m^2+2m+4).$$
            <p>Como $m^2+2m+4=(m+1)^2+3>0$, <b>$|A|\neq0$ siempre</b>: rango 4.</p>
    - |-
      <b>$A_{00}=2m$.</b> Paraboloide (rango 4 y $A_{00}=0$) ⇔ $m=0$.
    - |-
      <p><b>$J_a$</b></p>
            $$=\begin{vmatrix}m&0\\0&2\end{vmatrix}+\begin{vmatrix}1&0\\0&2\end{vmatrix}+\begin{vmatrix}1&0\\0&m\end{vmatrix}=3m+2;$$
            <p>para $m=0$, $J_a=2>0$ ⇒ <b>elíptico</b>. Respuesta <b>C</b>.</p>
    - |-
      <p><b>Comprobación</b> ($m=0$):</p>
            $$x_1^2+2x_3^2+2x_1-4x_2-1=0\iff(x_1+1)^2+2x_3^2=4\big(x_2+\tfrac12\big):$$
            <p>paraboloide elíptico de eje paralelo a $x_2$.</p>
  - receta: |-
      paraboloide elíptico ⇔ $A_{00}=0$, $|A|\neq0$ y $J_a>0$.
  - error: |-
      imponer solo $A_{00}=0$ sin comprobar $|A|\neq0$ (podría ser un cilindro).
- id: ej6-38
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.38, p. 233
    texto: |-
      E p.233
  problema:
  - param
  nivel: 2
  titulo: |-
    Ejercicio 6.38 — ¿qué $a$ hace paraboloide a $x_1^2+x_2^2+ax_3^2+2x_1+2x_2+x_3=a$?
  enunciado: |-
    Calcúlese el valor de $a$ para que la cuádrica $x_1^2+x_2^2+ax_3^2+2x_1+2x_2+x_3=a$ sea un paraboloide.
  pista: |-
    Pasa $a$ al primer miembro para tener $a_{00}=-a$ y escribe $A$. ¿Qué dos condiciones sobre $A_{00}$ y $|A|$ definen un paraboloide?
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Valor de $a$ para paraboloide.
      - - |-
          Qué se usa
        - |-
          <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide.
      - - Plan
        - |-
          $|A_{00}|=0$ por $a=0$.
  - pasos:
    - |-
      <b>Todo a un miembro</b> (la matriz exige «$=0$»): $x_1^2+x_2^2+ax_3^2+2x_1+2x_2+x_3-a=0$. Entonces $a_{00}=-a$, $a_{01}=a_{02}=1$, $2a_{03}=1\Rightarrow a_{03}=\tfrac12$: $$A=\begin{pmatrix}-a&1&1&\tfrac12\\1&1&0&0\\1&0&1&0\\\tfrac12&0&0&a\end{pmatrix},\qquad M=\operatorname{diag}(1,1,a).$$
    - |-
      <b>Paraboloide</b> ⇔ rango 4 y $A_{00}=0$. $A_{00}=1\cdot1\cdot a=a$ ⇒ $A_{00}=0\iff a=0$.
    - |-
      <p><b>$|A|$</b> (por la 4.ª fila):</p>
            $$-\tfrac12\begin{vmatrix}1&1&\tfrac12\\1&0&0\\0&1&0\end{vmatrix}+a\begin{vmatrix}-a&1&1\\1&1&0\\1&0&1\end{vmatrix}=-\tfrac14+a(-a-2)=-\tfrac14-a^2-2a.$$
            <p>Para $a=0$: $|A|=-\tfrac14\neq0$ ⇒ rango 4 ✓.</p>
    - |-
      <b>Respuesta: $a=0$.</b> Y $J_a=1\cdot0+1\cdot0+1\cdot1=1>0$ ⇒ <b>paraboloide elíptico</b>. Comprobación: con $a=0$, $(x_1+1)^2+(x_2+1)^2=2-x_3$, paraboloide de revolución de vértice $(-1,-1,2)$.
  - receta: |-
      «$=a$» al primer miembro; paraboloide ⇔ rango 4 y $A_{00}=0$; $J_a$ da el tipo.
  - error: |-
      dejar la $a$ del segundo miembro fuera de $a_{00}$.
- id: ej6-39
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.39, p. 233-234
    texto: |-
      E p.233-234
  problema:
  - param
  - clasif
  nivel: 3
  titulo: |-
    Ejercicio 6.39 — familia con $\lambda$: ordinaria, cilindro, cono
  enunciado: |-
    Si se consideran las cuádricas de ecuación $\lambda x_1^2+x_2^2+2x_3^2+4x_1x_3-2x_2x_3+\lambda x_1+2x_3-1=0$, el valor de $\lambda$ para que: A) Se trate de una cuádrica ordinaria es que $\lambda\neq4$ ó $\lambda\neq-4$ y en ambos casos con centro. B) Sea un cilindro es que $\lambda=4$. C) Sea un cono hiperbólico es que $\lambda=-4$.
  pista: |-
    Calcula $|A|$ y $A_{00}$ como polinomios en $\lambda$: sus raíces separan los casos. Cada afirmación habla de un valor concreto; compruébala con el rango y el cuadro.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Estudiar una familia en $\lambda$: ordinaria, cilindro, cono.
      - - |-
          Qué se usa
        - |-
          <b>Familias con parámetros:</b> calcular $|A|$, $|A_{00}|$ y los signos de los valores propios de $M$ en función del parámetro; los valores críticos son las raíces de esos determinantes.
      - - Plan
        - |-
          Determinantes en función de $\lambda$.
  - pasos:
    - |-
      <b>Matriz:</b> $a_{11}=\lambda$, $a_{22}=1$, $a_{33}=2$, $a_{12}=0$, $a_{13}=2$, $a_{23}=-1$, $a_{01}=\tfrac\lambda2$, $a_{02}=0$, $a_{03}=1$, $a_{00}=-1$: $$A=\begin{pmatrix}-1&\tfrac\lambda2&0&1\\\tfrac\lambda2&\lambda&0&2\\0&0&1&-1\\1&2&-1&2\end{pmatrix}.$$
    - |-
      <p><b>Invariantes:</b> $|A|=\tfrac14(4-\lambda)(4+\lambda)$; $A_{00}=\lambda(2-1)-0+2(0-2)=\lambda-4$; $I_a=\lambda+3$;</p>
            $$J_a=\begin{vmatrix}1&-1\\-1&2\end{vmatrix}+\begin{vmatrix}\lambda&2\\2&2\end{vmatrix}+\begin{vmatrix}\lambda&0\\0&1\end{vmatrix}=1+(2\lambda-4)+\lambda=3\lambda-3.$$
    - |-
      <b>$\lambda\neq\pm4$:</b> $|A|\neq0$ ⇒ rango 4 (ordinaria) y $A_{00}=\lambda-4\neq0$ ⇒ con centro (elipsoide o hiperboloide).
    - |-
      <p><b>$\lambda=4$:</b> $|A|=0$, $A_{00}=0$; el menor de filas y columnas $\{0,2,3\}$ vale</p>
            $$\begin{vmatrix}-1&0&1\\0&1&-1\\1&-1&2\end{vmatrix}=-2\neq0$$
            <p>⇒ rango 3. Rango 3 y $A_{00}=0$ ⇒ <b>cilindro</b>. $J_a=9>0$ ⇒ elíptico. <b>¿Real o imaginario?</b> (apartado 4): se busca un punto del eje, $Mc=-(a_{01},a_{02},a_{03})^t=(-2,0,-1)^t$, con $c=(-\tfrac12-\tfrac t2,t,t)$, y $d=F(c)=-2$. La ecuación queda $\lambda_1y_1^2+\lambda_2y_2^2-2=0$ con $\lambda_{1,2}=\tfrac{7\pm\sqrt{13}}2>0$ ⇒ <b>cilindro elíptico real</b>, de eje en la dirección $(-1,2,2)$.</p>
    - |-
      <b>$\lambda=-4$:</b> $|A|=0$, $A_{00}=-8\neq0$ ⇒ rango 3 ⇒ <b>cono</b>; $J_a=-15<0$ ⇒ signos mezclados ⇒ <b>cono real</b> (valores propios $\approx-4{,}62;\ 0{,}57;\ 3{,}05$).
    - |-
      <b>Opciones:</b> A) <b>falsa</b>. B) <b>verdadera</b>. C) <b>verdadera</b>: es un cono real.
  - receta: |-
      $|A|$, $A_{00}$, $I_a$, $J_a$ en función del parámetro; casos $|A|=0$ por separado, con rango (menor no nulo) y $A_{00}$; real/imaginario del cilindro con $d$.
  - error: |-
      dar por buena la frase de A) con «ó»; o decir «cilindro» sin comprobar el rango 3.
- id: ej6-40
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.40, p. 235
    texto: |-
      E p.235
  problema:
  - param
  - clasif
  nivel: 3
  titulo: |-
    Ejercicio 6.40 — dos parámetros $a,b$: paraboloide, hiperboloide, cono
  enunciado: |-
    Sea la cuádrica $3x^2+2y^2+az^2+4xy+2x+2bz+1=0$, con $a,b\in\mathbb R$. Entonces: A) Si $a=0$ y $b\neq0$ se trata de un paraboloide elíptico. B) Si $a=0$ y $b=0$ se trata de un hiperboloide elíptico. C) Si $a=2$ y $b\neq0$ se trata de un cono imaginario.
  pista: |-
    Hay dos parámetros: para cada afirmación sustituye los valores que da y clasifica esa cuádrica concreta con $|A|$, $A_{00}$, $J_a$ y los signos de los valores propios.
  cuerpo:
  - html: |-
      <div class="box warn"><span class="h">Nota</span><p>Resultado: A <b>verdadera</b>, B y C <b>falsas</b>.</p></div>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Dos parámetros: paraboloide, hiperboloide, cono.
      - - |-
          Qué se usa
        - |-
          <b>Familias con parámetros:</b> calcular $|A|$, $|A_{00}|$ y los signos de los valores propios de $M$ en función del parámetro; los valores críticos son las raíces de esos determinantes. <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide.
      - - Plan
        - |-
          Casos de $a$ y $b$ por determinantes.
  - pasos:
    - |-
      <b>Matriz</b> ($x,y,z$ por $x_1,x_2,x_3$): $a_{11}=3$, $a_{22}=2$, $a_{33}=a$, $a_{12}=2$, $a_{13}=a_{23}=0$, $a_{01}=1$, $a_{02}=0$, $a_{03}=b$, $a_{00}=1$: $$A=\begin{pmatrix}1&1&0&b\\1&3&2&0\\0&2&2&0\\b&0&0&a\end{pmatrix}.$$
    - |-
      <p><b>Invariantes:</b></p>
            $$A_{00}=a\begin{vmatrix}3&2\\2&2\end{vmatrix}=2a;$$
            <p>$I_a=5+a$; $J_a=2a+3a+(6-4)=5a+2$. $|A|$ por la 4.ª fila: el adjunto de $a$ es</p>
            $$\begin{vmatrix}1&1&0\\1&3&2\\0&2&2\end{vmatrix}=1(6-4)-1(2-0)=0,$$
            <p>y el término de $b$ (posición $(4,1)$) es</p>
            $$b(-1)^5\begin{vmatrix}1&0&b\\3&2&0\\2&2&0\end{vmatrix}=-b\cdot b(6-4)=-2b^2.$$
            <p>Luego <b>$|A|=-2b^2$</b>, independiente de $a$.</p>
    - |-
      <b>A) Verdadera.</b> $a=0$, $b\neq0$: $|A|=-2b^2\neq0$ (rango 4), $A_{00}=0$ ⇒ paraboloide; $J_a=2>0$ ⇒ elíptico.
    - |-
      <b>B) Falsa.</b> $a=b=0$: $|A|=0$ y $A_{00}=0$, y hay menores $2\times2$ no nulos (p. ej. $\begin{vmatrix}1&1\\1&3\end{vmatrix}=2$) pero todos los $3\times3$ son nulos ⇒ $\operatorname{rang}A=2$; con $J_a=2>0$ ⇒ <b>par de planos imaginarios secantes</b> (cuadro). No puede ser un hiperboloide (rango 4). <i>Comprobación:</i> la ecuación no contiene $z$; en el plano $xy$ es la cónica $3x^2+4xy+2y^2+2x+1=0$, degenerada con $A_{00}=2>0$ (rectas imaginarias que se cortan en el punto real $(-1,1)$). Los únicos puntos reales forman la recta $\{(-1,1,z)\}$.
    - |-
      <b>C) Falsa.</b> $a=2$, $b\neq0$: $|A|=-2b^2<0$ (rango 4), $A_{00}=4\neq0$ ⇒ con centro; $I_a=7>0$, $J_a=12>0$, $A_{00}>0$ ⇒ signos $+++$ (hecho (S)) ⇒ elipsoide; $|A|<0$ ⇒ <b>elipsoide real</b>. Un cono exigiría rango 3.
  - html: |-
      <div class="recipe"><b>Receta (dos parámetros):</b> calcula $|A|$, $A_{00}$, $J_a$ en función de ambos y sustituye cada caso. Si una variable no aparece en la ecuación, la superficie es un cilindro (o planos) sobre la cónica que queda.</div>
  - error: |-
      con $a=b=0$ decir «paraboloide» por ser $A_{00}=0$, sin comprobar $|A|\neq0$.
- id: ej6-41
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.41, p. 236-237
    texto: |-
      E p.236-237
  problema:
  - reducida
  nivel: 2
  titulo: |-
    Ejercicio 6.41 — ecuación reducida de $x_1^2-x_2x_3-2x_1+4x_3+5=0$
  enunciado: |-
    Calcúlese la ecuación reducida de la cuádrica $x_1^2-x_2x_3-2x_1+4x_3+5=0$.
  pista: |-
    Primero diagonaliza la parte cuadrática (el término $-x_2x_3$ obliga a girar). Después te quedará una parte lineal que hay que girar también antes de completar cuadrados.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Ecuación reducida de una cuádrica.
      - - |-
          Qué se usa
        - |-
          <b>Ecuación reducida:</b> diagonalizar $M$ ortogonalmente (giro), trasladar al centro o vértice y reconocer $\pm\frac{y_1^2}{a^2}\pm\frac{y_2^2}{b^2}\pm\frac{y_3^2}{c^2}=\{1,0\}$ o $y_3=\pm\frac{y_1^2}{a^2}\pm\frac{y_2^2}{b^2}$.
      - - Plan
        - |-
          Diagonalizar, trasladar y reconocer.
  - pasos:
    - |-
      <p><b>Matriz:</b> $a_{11}=1$, $a_{22}=a_{33}=0$, $2a_{23}=-1\Rightarrow a_{23}=-\tfrac12$, $a_{01}=-1$, $a_{02}=0$, $a_{03}=2$, $a_{00}=5$.</p>
            $$M=\begin{pmatrix}1&0&0\\0&0&-\tfrac12\\0&-\tfrac12&0\end{pmatrix}.$$
    - |-
      <b>Por qué hace falta un giro:</b> el término $x_2x_3$ impide completar cuadrados variable a variable.
    - |-
      <b>Valores propios:</b> $|M-\lambda I|=(1-\lambda)\big(\lambda^2-\tfrac14\big)$ ⇒ $\lambda=1,\ \tfrac12,\ -\tfrac12$.
    - |-
      <b>Vectores propios.</b> $\lambda=-\tfrac12$: $\tfrac32x_1=0$, $\tfrac12x_2-\tfrac12x_3=0$ ⇒ $(0,1,1)$. $\lambda=\tfrac12$: $x_1=0$, $-\tfrac12x_2-\tfrac12x_3=0$ ⇒ $(0,1,-1)$. $\lambda=1$: $x_2=x_3=0$ ⇒ $(1,0,0)$. Ortogonales dos a dos (valores propios distintos).
    - |-
      <b>Matriz de paso ortonormal</b> (orden $-\tfrac12,\tfrac12,1$): $$P=\begin{pmatrix}0&0&-1\\\tfrac1{\sqrt2}&\tfrac1{\sqrt2}&0\\\tfrac1{\sqrt2}&-\tfrac1{\sqrt2}&0\end{pmatrix},\qquad P^tMP=\operatorname{diag}\big(-\tfrac12,\tfrac12,1\big).$$ ($\det P=1$.)
    - |-
      <p><b>Parte lineal girada:</b></p>
            $$2(-1,0,2)P=2\big(\tfrac2{\sqrt2},-\tfrac2{\sqrt2},1\big)=(2\sqrt2,-2\sqrt2,2).$$
            <p>Con $X=PX'$:</p>$$-\tfrac12x_1'^2+\tfrac12x_2'^2+x_3'^2+2\sqrt2\,x_1'-2\sqrt2\,x_2'+2x_3'+5=0.$$
    - |-
      <p><b>Completar cuadrados:</b></p>
            $$-\tfrac12\big(x_1'^2-4\sqrt2x_1'\big)=-\tfrac12(x_1'-2\sqrt2)^2+4;$$
            $$\ \tfrac12\big(x_2'^2-4\sqrt2x_2'\big)=\tfrac12(x_2'-2\sqrt2)^2-4;$$
            <p>$\ x_3'^2+2x_3'=(x_3'+1)^2-1$. Constante: $4-4-1+5=4$.</p>
    - |-
      <b>Traslación</b> $x_1''=x_1'-2\sqrt2$, $x_2''=x_2'-2\sqrt2$, $x_3''=x_3'+1$:
          $$-\tfrac12x_1''^2+\tfrac12x_2''^2+x_3''^2+4=0.$$
          <b>Controles.</b> $d=|A|/A_{00}=(-1)/(-\tfrac14)=4$ ✓. Centro en coordenadas originales: $X=P(2\sqrt2,2\sqrt2,-1)^t=(1,4,0)$, que anula las derivadas parciales ($2x_1-2=0$, $-x_3=0$, $-x_2+4=0$) ✓.
    - |-
      <b>Qué superficie es:</b> pasando la constante y dividiendo entre $-4$, $\dfrac{x_2''^2}{8}+\dfrac{x_3''^2}{4}-\dfrac{x_1''^2}{8}=-1$ ⇒ <b>hiperboloide de dos hojas</b> (elíptico, no reglado), con eje en la dirección $(0,1,1)$ (el vector propio de $\lambda=-\tfrac12$). Por invariantes: rango 4 ($|A|=-1$), $A_{00}=-\tfrac14\neq0$, signos $(-,+,+)$ ⇒ hiperboloide; $|A|<0$ ⇒ dos hojas ✓.
  - html: |-
      <div class="recipe"><b>Receta (reducida):</b> (1) valores y vectores propios de $M$ ⇒ $P$ ortonormal ($\det P=1$); (2) parte lineal $\times P$; (3) completar cuadrados sacando el coeficiente; (4) trasladar; (5) dividir por la constante y comparar con U Def. 6.22; (6) controlar con $d=|A|/A_{00}$.</div>
  - error: |-
      multiplicar la parte lineal por $P^t$ en vez de por $P$; olvidar el factor 2 de la parte lineal; o equivocarse al completar cuadrados con coeficiente negativo ($-\tfrac12(\dots)^2$ <i>suma</i> $+4$).
- id: ej6-42
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.42, p. 238
    texto: |-
      E p.238
  problema:
  - clasif
  nivel: 1
  titulo: |-
    Ejercicio 6.42 — invariantes y valores propios de $6x_1^2+3x_2^2+3x_3^2+4x_1x_2-4x_1x_3-2x_2x_3-4x_1-8x_2+9=0$
  enunciado: |-
    Se pide hallar los invariantes de la cuádrica $6x_1^2+3x_2^2+3x_3^2+4x_1x_2-4x_1x_3-2x_2x_3-4x_1-8x_2+9=0$ y calcular los valores propios de la matriz asociada a la forma cuadrática.
  pista: |-
    Arma $A$ y $M$ dividiendo entre 2 los términos cruzados y lineales. Los invariantes son $\operatorname{rang}A$, la traza de $M$, $|M|$ y la suma de menores principales $2\times2$; los valores propios salen del polinomio $p^3-I_ap^2+J_ap-A_{00}$.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Invariantes y valores propios de una cuádrica.
      - - |-
          Qué se usa
        - |-
          <b>Ecuación matricial de una cuádrica (U p.288-300):</b> $(1\ x_1\ x_2\ x_3)A\,(1\ x_1\ x_2\ x_3)^t=0$ con $A$ simétrica $4\times4$ y parte cuadrática $A_{00}=M$ ($3\times3$). <b>Invariantes:</b> $\operatorname{rang}A$, $|A|$, $|A_{00}|$, $I_a=\operatorname{tr}A_{00}$ y $J_a$ (suma de menores principales $2\times2$ de $A_{00}$).
      - - Plan
        - |-
          Matrices $A$ y $A_{00}$ y sus invariantes.
  - pasos:
    - |-
      <b>Coeficientes:</b> $a_{11}=6$, $a_{22}=3$, $a_{33}=3$; $a_{12}=2$, $a_{13}=-2$, $a_{23}=-1$; $a_{01}=-2$, $a_{02}=-4$, $a_{03}=0$ (no hay término en $x_3$); $a_{00}=9$.
    - |-
      <b>Matrices:</b> $$A=\begin{pmatrix}9&-2&-4&0\\-2&6&2&-2\\-4&2&3&-1\\0&-2&-1&3\end{pmatrix},\qquad M=\begin{pmatrix}6&2&-2\\2&3&-1\\-2&-1&3\end{pmatrix}.$$
    - |-
      <b>$I_a=6+3+3=12$.</b>
    - |-
      <b>$A_{00}=|M|$</b> (1.ª fila): $6(9-1)-2(6-2)+(-2)(-2+6)=48-8-8=32$.
    - |-
      <p><b>$J_a$:</b></p>
            $$\begin{vmatrix}3&-1\\-1&3\end{vmatrix}+\begin{vmatrix}6&-2\\-2&3\end{vmatrix}+\begin{vmatrix}6&2\\2&3\end{vmatrix}=8+14+14=36.$$
    - |-
      <b>$|A|$.</b> Hacer ceros en la 4.ª columna: $F_2\leftarrow F_2-2F_3$ da $(6,2,-4,0)$; $F_4\leftarrow F_4+3F_3$ da $(-12,4,8,0)$ (no cambian el determinante). Ahora la 4.ª columna solo tiene el $-1$ de la fila 3, de signo $(-1)^{3+4}=-1$: $$|A|=(-1)(-1)\begin{vmatrix}9&-2&-4\\6&2&-4\\-12&4&8\end{vmatrix}=4\begin{vmatrix}9&-2&-4\\6&2&-4\\-3&1&2\end{vmatrix}=4\,[9(4+4)+2(12-12)-4(6+6)]=4\cdot24=96.$$
    - |-
      <b>Valores propios de $M$:</b> $p^3-12p^2+36p-32=0$. $p=2$ lo anula ($8-48+72-32=0$) y $p^3-12p^2+36p-32=(p-2)(p^2-10p+16)=(p-2)^2(p-8)$. <b>Valores propios: $2$ (doble) y $8$.</b>
    - |-
      <p><b>Qué superficie es:</b> $|A|\neq0$ ⇒ rango 4; $A_{00}\neq0$ ⇒ con centro; signos $+++$ ⇒ elipsoide; <b>$|A|=96>0$ ⇒ elipsoide imaginario</b>. <i>Comprobación con el centro:</i> $Mc=-(a_{01},a_{02},a_{03})^t=(2,4,0)^t$ tiene solución $c=(0,\tfrac32,\tfrac12)$; el valor en el centro es $d=3$ y $|A|/A_{00}=96/32=3$ ✓. En ejes principales: $2x_1''^2+2x_2''^2+8x_3''^2+3=0$, imposible en $\mathbb R$ (suma de términos $\ge0$ más 3); en la forma de U:</p>
            $$\frac{x_1''^2}{3/2}+\frac{x_2''^2}{3/2}+\frac{x_3''^2}{3/8}=-1.$$
  - receta: |-
      $I_a$ = traza de $M$; $A_{00}=|M|$; $J_a$ = suma de los tres menores principales $2\times2$; $|A|$ haciendo ceros en la columna que ya tenga uno. Control: $|A|=d\cdot A_{00}$ con $d$ = valor en el centro.
  - error: |-
      fiarse de un $|A|$ sin comprobarlo: decide <i>real o imaginario</i>.
- id: ej-propio-1
  clase: propio
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio; completar cuadrados y cuadro de U p. 300; verificado con sympy
    texto: propio
  problema:
  - centro
  - clasif
  nivel: 1
  titulo: |-
    Propio 1 — esfera: centro y radio, y el cuadro como control de $x_1^2+x_2^2+x_3^2-2x_1+4x_2-4=0$
  enunciado: |-
    Halla el centro y el radio de la superficie $x_1^2+x_2^2+x_3^2-2x_1+4x_2-4=0$ y comprueba con los invariantes y el cuadro que es un elipsoide real.
  pista: |-
    Completa los tres cuadrados para leer el centro y el radio, y luego comprueba con el cuadro que los invariantes dan «elipsoide real».
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Centro y radio de una esfera y comprobación con el cuadro.
      - - |-
          Qué se usa
        - |-
          <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide. <b>Ecuación reducida:</b> diagonalizar $M$ ortogonalmente (giro), trasladar al centro o vértice y reconocer $\pm\frac{y_1^2}{a^2}\pm\frac{y_2^2}{b^2}\pm\frac{y_3^2}{c^2}=\{1,0\}$ o $y_3=\pm\frac{y_1^2}{a^2}\pm\frac{y_2^2}{b^2}$.
      - - Plan
        - |-
          Completar cuadrados.
  - pasos:
    - |-
      <p><b>Completar cuadrados:</b></p>
            $$(x_1-1)^2-1+(x_2+2)^2-4+x_3^2-4=0\iff(x_1-1)^2+(x_2+2)^2+x_3^2=9:$$
            <p><b>esfera</b> de centro $(1,-2,0)$ y radio $3$ (elipsoide real con $a=b=c=3$, Def. 6.22).</p>
    - |-
      <p><b>Control por invariantes:</b></p>
            $$A=\begin{pmatrix}-4&-1&2&0\\-1&1&0&0\\2&0&1&0\\0&0&0&1\end{pmatrix},$$
            <p>$A_{00}=1$, signos $+++$, $|A|=-9<0$ ⇒ elipsoide real ✓; $d=|A|/A_{00}=-9$ ✓ (el $-9$ que pasa al otro miembro).</p>
  - receta: |-
      sin términos cruzados no hace falta giro: completar cuadrados da centro y tipo.
- id: ej-propio-2
  clase: propio
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio; real o imaginario con d = F(c); verificado con sympy
    texto: propio
  problema:
  - centro
  - clasif
  nivel: 3
  titulo: |-
    Propio 2 — cilindro elíptico, ¿real o imaginario? $x_1^2+x_2^2+2x_2x_3+x_3^2-2x_1+c_0=0$
  enunciado: |-
    Estudia la cuádrica $x_1^2+x_2^2+2x_2x_3+x_3^2-2x_1+c_0=0$ para $c_0=-3$ y para $c_0=5$: ¿en qué caso es un cilindro elíptico real y en cuál imaginario?
  pista: |-
    Aquí los signos de los valores propios no distinguen real de imaginario. Busca un punto del eje (resuelve $Mc=-b$) y mira el signo de la constante $d=F(c)$ frente al de los valores propios no nulos.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Cilindro elíptico real o imaginario.
      - - |-
          Qué se usa
        - |-
          <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide.
      - - Plan
        - |-
          Signo de la constante reducida.
  - pasos:
    - |-
      $$M=\begin{pmatrix}1&0&0\\0&1&1\\0&1&1\end{pmatrix}:$$
            <p>$A_{00}=1\cdot(1-1)=0$, $I_a=3$, $J_a=0+1+1=2$; valores propios $1,2,0$. Con $c_0=-3$ y con $c_0=5$ el rango es 3 ($|A|=0$; hay un menor $3\times3$ no nulo) ⇒ rango 3 y $A_{00}=0$ ⇒ <b>cilindro</b>; $J_a>0$ ⇒ <b>elíptico</b>.</p>
    - |-
      <b>Real o imaginario.</b> Centros: $Mc=(1,0,0)^t$ ⇒ $c_1=1$, $c_2+c_3=0$ (una recta, el eje). En $c=(1,0,0)$: $F(c)=1-2+c_0=c_0-1$.
            <ul>
              <li>$c_0=-3$: $d=-4$, signo opuesto al de los valores propios ⇒ <b>cilindro elíptico real</b>: $(x_1-1)^2+(x_2+x_3)^2=4$.</li>
              <li>$c_0=5$: $d=4$ ⇒ $(x_1-1)^2+(x_2+x_3)^2=-4$: <b>cilindro elíptico imaginario</b> (vacío).</li>
            </ul>
    - |-
      <b>Moraleja:</b> $J_a$ no distingue estos dos casos; hay que mirar la constante en el eje.
  - receta: |-
      cilindro elíptico ⇒ punto del eje ($Mc=-(a_{0i})$) ⇒ $d=F(c)$ ⇒ real si $d$ tiene signo opuesto a $\lambda_1,\lambda_2$.
- id: ej-propio-3
  clase: propio
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio; método de E 6.41 y U Ej. 6.40; verificado con sympy
    texto: propio
  problema:
  - reducida
  nivel: 3
  titulo: |-
    Propio 3 — elipsoide de revolución con giro: valor propio doble y Gram-Schmidt
  enunciado: |-
    Halla la ecuación reducida de $2x_1^2+2x_2^2+2x_3^2+2x_1x_2+2x_1x_3+2x_2x_3-8x_1-8x_2-8x_3+8=0$.
  pista: |-
    Hay un valor propio doble: su subespacio es un plano y los dos vectores propios que elijas deben ortogonalizarse (Gram-Schmidt). Después gira también la parte lineal.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Elipsoide de revolución con giro: valor propio doble.
      - - |-
          Qué se usa
        - |-
          <b>Ecuación reducida:</b> diagonalizar $M$ ortogonalmente (giro), trasladar al centro o vértice y reconocer $\pm\frac{y_1^2}{a^2}\pm\frac{y_2^2}{b^2}\pm\frac{y_3^2}{c^2}=\{1,0\}$ o $y_3=\pm\frac{y_1^2}{a^2}\pm\frac{y_2^2}{b^2}$.
      - - Plan
        - |-
          Gram-Schmidt en el subespacio doble y reducida.
  - pasos:
    - |-
      $$M=\begin{pmatrix}2&1&1\\1&2&1\\1&1&2\end{pmatrix},$$
            <p>$(a_{01},a_{02},a_{03})=(-4,-4,-4)$, $a_{00}=8$. Como $M=I+\mathbf 1\mathbf 1^t$: valores propios $4$ (vector $(1,1,1)$) y $1$ doble (plano $x_1+x_2+x_3=0$). Control: $I_a=6=4+1+1$, $A_{00}=4=4\cdot1\cdot1$.</p>
    - |-
      <p><b>Base ortonormal.</b> $u_1=\tfrac1{\sqrt3}(1,1,1)$; en el plano propio de $\lambda=1$: $(1,-1,0)$ y $(1,1,-2)$, ortogonales entre sí (si se parte de $(1,-1,0),(1,0,-1)$, Gram-Schmidt da $(1,0,-1)-\tfrac12(1,-1,0)=\tfrac12(1,1,-2)$).</p>
            $$P=\big(u_1\ \ \tfrac1{\sqrt2}(1,-1,0)\ \ \tfrac1{\sqrt6}(1,1,-2)\big),$$
            <p>$P^tP=I$, $\det P=1$, $P^tMP=\operatorname{diag}(4,1,1)$.</p>
    - |-
      <b>Parte lineal girada:</b> $2(-4,-4,-4)P=(-8\sqrt3,0,0)$ ⇒ $4y_1^2-8\sqrt3\,y_1+y_2^2+y_3^2+8=0$ ⇒ $4(y_1-\sqrt3)^2+y_2^2+y_3^2=4$.
    - |-
      <b>Reducida:</b> $y_1''=y_1-\sqrt3$, $y_2''=y_2$, $y_3''=y_3$: $\dfrac{y_2''^2}{4}+\dfrac{y_3''^2}{4}+\dfrac{y_1''^2}{1}=1$, un <b>elipsoide real de revolución</b> (semiejes $2,2,1$) con centro $X=P(\sqrt3,0,0)^t=(1,1,1)$. Control: $|A|=-16$, $A_{00}=4$, $d=-4$ ✓.
  - receta: |-
      valor propio doble ⇒ cualquier base ortonormal del plano propio sirve; la parte lineal queda solo en la dirección del otro vector propio.
- id: modelo-p1
  clase: propio
  fuentes:
  - l: P
    ref: |-
      Modelo propio en formato examen, sobre el patrón de las preguntas de cónicas (X Feb. 2019 B ej. 6); verificado con sympy
    texto: propio
  problema:
  - clasif
  - centro
  nivel: 2
  titulo: |-
    Modelo P1 (1 punto) — clasificar $x_1^2+x_2^2-x_3^2-2x_1+4x_3-4=0$ y hallar su centro, por dos caminos
  enunciado: |-
    Clasifique la cuádrica $x_1^2+x_2^2-x_3^2-2x_1+4x_3-4=0$ y halle su centro.
  pista: |-
    Clasifica con $|A|$, $A_{00}$, $I_a$, $J_a$; para el centro resuelve $Mc=-b$ (o completa cuadrados, ya que $M$ es diagonal).
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Clasificar una cuádrica y hallar su centro.
      - - |-
          Qué se usa
        - |-
          <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide.
      - - Plan
        - |-
          Centro por derivadas parciales o por completar cuadrados.
  - pasos:
    - |-
      <b>Coeficientes:</b> $a_{11}=a_{22}=1$, $a_{33}=-1$, sin cruzados; $2a_{01}=-2\Rightarrow a_{01}=-1$; $a_{02}=0$; $2a_{03}=4\Rightarrow a_{03}=2$; $a_{00}=-4$.
    - |-
      <p><b>Matriz:</b></p>
            $$A=\begin{pmatrix}-4&-1&0&2\\-1&1&0&0\\0&0&1&0\\2&0&0&-1\end{pmatrix}.$$
    - |-
      <p><b>Invariantes.</b> $A_{00}=|M|=1\cdot1\cdot(-1)=-1\neq0$ ⇒ centro único. $|A|$ (por la 3.ª fila, que solo tiene un elemento):</p>
            $$|A|=\begin{vmatrix}-4&-1&2\\-1&1&0\\2&0&-1\end{vmatrix}=(4+0+0)-(4+0-1)=1$$
            <p>⇒ rango 4.</p>
    - |-
      <b>Signos:</b> $M$ ya es diagonal, valores propios $1,1,-1$: «$++-$» ⇒ hiperboloide. $|A|=1>0$ ⇒ <b>hiperboloide de una hoja</b> (hiperbólico, reglado).
    - |-
      <p><b>Comprobación completando cuadrados:</b></p>
            $$(x_1-1)^2-1+x_2^2-(x_3-2)^2+4-4=0\iff(x_1-1)^2+x_2^2-(x_3-2)^2=1:$$
            <p>es la reducida de la Def. 6.22 con $a=b=c=1$, $p=1$ ✓. <b>Centro</b> $(1,0,2)$; control $d=|A|/A_{00}=-1$ ✓.</p>
  - receta: |-
      sin productos cruzados no hace falta giro; completar cuadrados da centro y tipo, y los invariantes sirven de control.
  - error: |-
      olvidar que el $+4$ de $-(x_3-2)^2=-x_3^2+4x_3-4$ también se compensa (suma y resta con el signo del coeficiente de $x_3^2$).
- id: modelo-p2
  clase: propio
  fuentes:
  - l: P
    ref: |-
      Modelo propio en formato examen; parte cuadrática de X Feb. 2018 tipo A, problema b) (forma canónica con valores propios 1, 0, 4); verificado con sympy
    texto: propio
  problema:
  - clasif
  - reducida
  nivel: 3
  titulo: |-
    Modelo P2 (2 puntos) — paraboloide con giro: $x_1^2+2x_2^2+4x_2x_3+2x_3^2-2x_1+2x_2-2x_3=0$
  enunciado: |-
    a) Clasifique la cuádrica por invariantes. b) Halle su ecuación reducida y la matriz del giro.
  pista: |-
    En el apartado a) fíjate en si $A_{00}$ se anula. En el b), si no hay centro, no se puede centrar: tras el giro la variable del valor propio nulo queda lineal y se usa para absorber la constante.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Paraboloide con giro: invariantes y ecuación reducida.
      - - |-
          Qué se usa
        - |-
          <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide. <b>Ecuación reducida:</b> diagonalizar $M$ ortogonalmente (giro), trasladar al centro o vértice y reconocer $\pm\frac{y_1^2}{a^2}\pm\frac{y_2^2}{b^2}\pm\frac{y_3^2}{c^2}=\{1,0\}$ o $y_3=\pm\frac{y_1^2}{a^2}\pm\frac{y_2^2}{b^2}$.
      - - Plan
        - |-
          Giro, traslación al vértice.
  - pasos:
    - |-
      <b>Matriz:</b> $a_{23}=2$, $a_{01}=-1$, $a_{02}=1$, $a_{03}=-1$, $a_{00}=0$: $$A=\begin{pmatrix}0&-1&1&-1\\-1&1&0&0\\1&0&2&2\\-1&0&2&2\end{pmatrix},\qquad M=\begin{pmatrix}1&0&0\\0&2&2\\0&2&2\end{pmatrix}.$$
    - |-
      <p><b>a) Invariantes.</b> $A_{00}=1\cdot(4-4)=0$ ⇒ sin centro único. $|A|=-8$ (restar la 3.ª fila a la 4.ª deja la fila $(-2,0,0,0)$ y se desarrolla por ella) ⇒ rango 4. Rango 4 y $A_{00}=0$ ⇒ <b>paraboloide</b>.</p>
            $$J_a=\begin{vmatrix}2&2\\2&2\end{vmatrix}+\begin{vmatrix}1&0\\0&2\end{vmatrix}+\begin{vmatrix}1&0\\0&2\end{vmatrix}=0+2+2=4>0$$
            <p>⇒ <b>paraboloide elíptico</b>.</p>
    - |-
      <p><b>b) Giro.</b></p>
            $$|M-\lambda I|=(1-\lambda)[(2-\lambda)^2-4]=(1-\lambda)\lambda(\lambda-4)$$
            <p>⇒ $\lambda=1,4,0$ (control: suma $5=I_a$, $1\cdot4=4=J_a$). Vectores: $\lambda=1$: $(1,0,0)$; $\lambda=4$: $(0,1,1)$; $\lambda=0$: $(0,-1,1)$. Normalizados y ordenados para $\det P=+1$:</p>$$P=\begin{pmatrix}1&0&0\\0&\tfrac1{\sqrt2}&-\tfrac1{\sqrt2}\\0&\tfrac1{\sqrt2}&\tfrac1{\sqrt2}\end{pmatrix},\ P^tP=I,\ \det P=1,\ P^tMP=\operatorname{diag}(1,4,0).$$
    - |-
      <b>Parte lineal girada:</b> $2(-1,1,-1)P=2(-1,0,-\sqrt2)$ (el término en $x_2'$ desaparece porque $(-1,1,-1)\cdot(0,1,1)=0$). En $X=PX'$: $$x_1'^2+4x_2'^2-2x_1'-2\sqrt2\,x_3'=0.$$
    - |-
      <p><b>Traslación:</b></p>
            $$(x_1'-1)^2+4x_2'^2=2\sqrt2\,x_3'+1=2\sqrt2\big(x_3'+\tfrac1{2\sqrt2}\big).$$
            <p>Con $x_1''=x_1'-1$, $x_2''=x_2'$, $x_3''=x_3'+\tfrac1{2\sqrt2}$:</p>$$x_3''=\frac{x_1''^2}{2\sqrt2}+\frac{x_2''^2}{1/\sqrt2},$$ reducida del paraboloide elíptico ($a^2=2\sqrt2\ge b^2=\tfrac1{\sqrt2}$). <b>Vértice</b> en $X'=(1,0,-\tfrac1{2\sqrt2})$, es decir $X=PX'=(1,\tfrac14,-\tfrac14)$ (se anula la ecuación ahí).
  - receta: |-
      paraboloide ⇒ el vector propio del valor propio 0 marca el eje; la componente de la parte lineal sobre él <b>no</b> se elimina (queda como término de grado 1); las otras dos se eliminan completando cuadrados.
  - error: |-
      intentar «completar el cuadrado» en $x_3'$ (no hay $x_3'^2$); o dar una $P$ con $\det P=-1$ y llamarla giro.
- id: modelo-p3
  clase: propio
  fuentes:
  - l: P
    ref: |-
      Modelo propio en formato examen; patrón de X Feb. 2019 A ej. 6 (familia con parámetro en cónicas); verificado con sympy
    texto: propio
  problema:
  - param
  - clasif
  nivel: 3
  titulo: |-
    Modelo P3 (test o 2 puntos) — todos los casos de $x_1^2+x_2^2+kx_3^2+2x_3+1=0$
  enunciado: |-
    Clasifique, según los valores de $k\in\mathbb R$, la cuádrica $x_1^2+x_2^2+kx_3^2+2x_3+1=0$.
  pista: |-
    Calcula $|A|$ y $A_{00}$ en función de $k$ y localiza los valores donde cambian de signo o se anulan. Estudia cada intervalo y cada valor aislado.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Clasificar según $k$ todos los casos.
      - - |-
          Qué se usa
        - |-
          <b>Familias con parámetros:</b> calcular $|A|$, $|A_{00}|$ y los signos de los valores propios de $M$ en función del parámetro; los valores críticos son las raíces de esos determinantes. <b>Clasificación (cuadro de U p.300):</b> si $|A_{00}|\neq0$ hay centro (elipsoide, hiperboloides, cono); si $|A_{00}|=0$ no hay centro único (paraboloides, cilindros, planos). Con $|A|=0$ es cono, cilindro o planos (degenerada); con $|A|\neq0$ y $|A_{00}|=0$ es paraboloide.
      - - Plan
        - |-
          Casos $k>0$, $k=0$, $k<0$, y valores críticos.
  - pasos:
    - |-
      <p><b>Matriz:</b></p>
            $$A=\begin{pmatrix}1&0&0&1\\0&1&0&0\\0&0&1&0\\1&0&0&k\end{pmatrix},$$
            <p>$M=\operatorname{diag}(1,1,k)$.</p>
    - |-
      <b>Invariantes:</b> $|A|=k-1$ (desarrollo por las filas 2 y 3: queda $\begin{vmatrix}1&1\\1&k\end{vmatrix}$), $A_{00}=k$, $J_a=1+k+k=2k+1$; valores propios $1,1,k$.
    - |-
      <b>Casos</b> (cuadro):
            <ul>
              <li>$k=0$: $A_{00}=0$, $|A|=-1\neq0$ ⇒ <b>paraboloide</b>; $J_a=1>0$ ⇒ <b>elíptico</b> ($x_1^2+x_2^2=-2(x_3+\tfrac12)$).</li>
              <li>$k&lt;0$: $A_{00}&lt;0$, signos $(+,+,-)$ ⇒ hiperboloide; $|A|=k-1&lt;0$ ⇒ <b>dos hojas</b>.</li>
              <li>$0&lt;k&lt;1$: signos $+++$, $|A|&lt;0$ ⇒ <b>elipsoide real</b>.</li>
              <li>$k=1$: $|A|=0$, $A_{00}=1\neq0$ ⇒ rango 3, cono; signos $+++$ ⇒ <b>cono imaginario</b> (único punto real: el vértice $(0,0,-1)$).</li>
              <li>$k&gt;1$: $+++$, $|A|&gt;0$ ⇒ <b>elipsoide imaginario</b>.</li>
            </ul>
    - |-
      <b>Comprobación</b> ($k\neq0$, completando cuadrados): $x_1^2+x_2^2+k\big(x_3+\tfrac1k\big)^2=\tfrac{1-k}k$; el signo del segundo miembro frente a los signos $1,1,k$ reproduce los cinco casos (p. ej. $k=1$: $x_1^2+x_2^2+(x_3+1)^2=0$).
  - receta: |-
      $|A|$, $A_{00}$, $J_a$ como polinomios en el parámetro; marca sus raíces en la recta real y recorre el cuadro en cada intervalo y en cada raíz por separado.
  - error: |-
      tratar solo los intervalos y olvidar los valores aislados ($k=0$, $k=1$), que son justo donde cambia el rango o se anula $A_{00}$.
