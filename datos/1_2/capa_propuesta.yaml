ejercicios:
- id: ej1-6
  nivel: 2
  problema: [producto]
  pista: |-
    Calcula $A^2$ primero y luego $A^3=A^2A$. Las identidades $\cos^2x+\operatorname{sen}^2x=1$ simplifican muchas entradas; mira si el resultado es una matriz sencilla.
- id: ej1-7
  nivel: 2
  problema: [producto, propiedades]
  pista: |-
    Calcula $A^2$ y $A^3$ con $a,b,c$ sin sustituir números. Fíjate en qué posiciones quedan las entradas distintas de cero. Para la parte B, piensa cuánto vale $A^4$ en función de $A^3$.
- id: ej1-8
  nivel: 2
  problema: [producto]
  pista: |-
    No puedes despejar $A$ y $B$ a ciegas con productos: empieza hallando $A$ y $B$ a partir de la suma y la diferencia, y luego prueba cada opción.
- id: ej1-9
  nivel: 2
  problema: [producto]
  pista: |-
    Saca $A$ factor común (por la izquierda) de la suma; como $B$ es diagonal, sus potencias se calculan entrada a entrada. ¿Qué tipo de suma queda en cada posición de la diagonal?
- id: ej1-10
  nivel: 3
  problema: [propiedades]
  pista: |-
    Busca una matriz $X$ (una suma de potencias de $A$) tal que $(I-A)X=I$. Piensa en cómo se factoriza $1-t^3$ y qué le pasa a $A^3$.
- id: ej1-11
  nivel: 3
  problema: [propiedades]
  pista: |-
    Parte A: si $A$ es regular, puedes multiplicar $AB=A$ por $A^{-1}$ por la izquierda. Parte B: combina las dos igualdades dadas sustituyendo una dentro de la otra.
- id: ej1-12
  nivel: 1
  problema: [elementales]
  pista: |-
    Recuerda la definición: una elemental sale de hacer <i>una</i> operación elemental sobre $I_n$. ¿Qué pasa con su tamaño y con la operación inversa?
- id: ej1-13
  nivel: 1
  problema: [elementales]
  pista: |-
    Para cada matriz, pregúntate si se obtiene de la identidad con <i>una sola</i> operación (intercambio, escalar una fila o sumar un múltiplo de otra). Primero mira si es cuadrada.
- id: ej1-14
  nivel: 2
  problema: [escalonada]
  pista: |-
    Haz ceros por columnas de izquierda a derecha, anotando cada operación. Después normaliza los pivotes y, por último, haz ceros también por encima.
- id: ej1-15
  nivel: 1
  problema: [elementales]
  pista: |-
    Calcula los productos y mira qué hace cada elemental: multiplicar por la izquierda actúa sobre las filas de $A$, por la derecha sobre sus columnas.
- id: ej1-16
  nivel: 1
  problema: [inversa]
  pista: |-
    Forma $(A\mid I_3)$ y opera solo por filas hasta que a la izquierda quede $I_3$. Esta matriz ya tiene muchos ceros: empieza por el intercambio de filas que te coloca el pivote.
- id: ej1-17
  nivel: 1
  problema: [propiedades, escalonada]
  pista: |-
    Una igualdad «para todo $A,B$» se desmiente con un solo ejemplo. Prueba con matrices muy sencillas, por ejemplo $B=-A$.
- id: ej1-18
  nivel: 1
  problema: [escalonada]
  pista: |-
    Mira primero qué tipo de matriz es cada $A_i$. Si ya es escalonada, cuenta sus filas no nulas; si no, escalónala antes de contar.
- id: ej1-19
  nivel: 2
  problema: [propiedades, escalonada]
  pista: |-
    Una equivalencia por filas es un producto por elementales a la izquierda y por columnas a la derecha. ¿Cambia el rango al multiplicar por una matriz regular?
- id: ej1-20
  nivel: 2
  problema: [elementales, propiedades]
  pista: |-
    Escribe $P$ y $Q$ como productos de elementales: $P$ actúa por filas y $Q$ por columnas. ¿Alguna de esas operaciones puede cambiar el rango?
- id: ejp-1
  nivel: 1
  problema: [producto]
  pista: |-
    Calcula $AB$ y $BA$ con la regla fila por columna. Para $A^n$, calcula $A^2$, $A^3$ y busca el patrón.
- id: sol-1_2-17
  nivel: 2
  problema: [inversa]
  pista: |-
    Forma $(A\mid I_3)$ y haz ceros columna a columna. Para el apartado (b), mira qué pasa si en algún momento una fila de la parte izquierda se anula.
- id: sol-1_2-18
  nivel: 3
  problema: [escalonada]
  pista: |-
    Escalona sin dividir por pivotes que puedan ser cero. En (b), los pasos dependen de $k$: ¿para qué valores de $k$ se anula un pivote?
- id: ex-feb18a
  nivel: 2
  problema: [producto]
  pista: |-
    $A^2-B^2$ no es $(A+B)(A-B)$ en general. Mira cómo se desarrolla ese producto y cómo despejar $A^2-B^2$ a partir de él.
- id: ex-sep24
  nivel: 2
  problema: [producto]
  pista: |-
    Calcula primero $A$ y $B$ (suma y diferencia dividida entre 2) o desarrolla $(A+B)(A-B)$ y $(A-B)(A+B)$ y mira qué combinación da $A^2-B^2$.
- id: ex-sep18a
  nivel: 2
  problema: [producto, elementales]
  pista: |-
    Desarrolla $(A-B)(A+B)$ sin suponer que el producto conmuta. Para las elementales, elige dos operaciones de tipos distintos y escríbelas sobre $I$.
- id: ex-sep25
  nivel: 2
  problema: [producto]
  pista: |-
    Es un sistema de dos ecuaciones con matrices como incógnitas: trabájalo igual que uno de números (suma, resta, escalares). Quizá no necesites despejar $X$ e $Y$ por separado.
- id: ex-feb17a2
  nivel: 2
  problema: [propiedades]
  pista: |-
    Aplica las reglas $(AB)^{-1}=B^{-1}A^{-1}$ y $(AB)^t=B^tA^t$ (el orden se invierte) para simplificar cada factor antes de multiplicar.
- id: ex-feb22a1
  nivel: 2
  problema: [propiedades]
  pista: |-
    Parte de $A^2=A$ y usa la hipótesis de regularidad: multiplica por $A^{-1}$.
- id: ex-feb20a
  nivel: 2
  problema: [propiedades]
  pista: |-
    Parte de $A^t=A$ y calcula $(A^{-1})^t$ con la regla de la traspuesta de una inversa.
- id: ex-feb24b
  nivel: 3
  problema: [propiedades]
  pista: |-
    Traduce «$AB$ simétrica» a una igualdad con traspuestas y desarrolla $(AB)^t$ usando que $A$ y $B$ son simétricas.
- id: ex-feb23b
  nivel: 2
  problema: [elementales]
  pista: |-
    Compara cada fila de $B$ con las filas de $A$: ¿de cuál sale y con qué factor? Esas son las filas de $M$ (o descomponla en elementales).
- id: ex-feb25a
  nivel: 2
  problema: [elementales]
  pista: |-
    La fila $i$ de $M$ dice cómo se forma la fila $i$ de $B$ a partir de las filas de $A$. Escribe esa combinación para cada fila.
- id: ex-sep19a1
  nivel: 2
  problema: [elementales]
  pista: |-
    Prueba con ejemplos concretos de elementales de 3×3; recuerda que una elemental es regular y fíjate en qué le pasa a la suma de dos de ellas.
- id: ex-feb19a1
  nivel: 1
  problema: [escalonada]
  pista: |-
    El primer elemento de la primera fila es 0: necesitas un intercambio de filas antes de hacer ceros. Cuenta las filas no nulas al terminar.
- id: ex-feb17a2b
  nivel: 2
  problema: [escalonada]
  pista: |-
    Usa la primera fila (pivote 1) para hacer ceros debajo en la primera columna y continúa. El rango son las filas no nulas de la escalonada final.
- id: ex-sep22b
  nivel: 2
  problema: [escalonada]
  pista: |-
    Escalona con Gauss; el pivote de la primera fila vale 1, así que haz ceros debajo sin fracciones. Rango = filas no nulas.
- id: ex-feb26a
  nivel: 2
  problema: [escalonada]
  pista: |-
    Escalona primero, normaliza los pivotes y haz ceros también por encima de cada pivote. Anota cada operación para razonar el proceso.
- id: ex-feb26b
  nivel: 2
  problema: [escalonada]
  pista: |-
    Aquí los pivotes no están en la diagonal: escalona columna a columna saltando la columna que no tiene pivote, y luego haz ceros por encima.
- id: ex-sep22e1
  nivel: 2
  problema: [escalonada, elementales]
  pista: |-
    Recuerda qué parte de la forma escalonada es única y cuál no. Para la segunda, ¿qué tipo de operaciones relacionan dos sistemas equivalentes?
esencial:
  intro: |-
    Lo imprescindible del álgebra matricial; todo lo demás del curso se apoya en esto.
  items:
  - |-
    <b>El producto no conmuta.</b> $AB$ existe si las columnas de $A$ son tantas como las filas de $B$, y en general $AB\neq BA$. Por eso $(A+B)^2=A^2+AB+BA+B^2$ y $(A-B)(A+B)=A^2+AB-BA-B^2$: las identidades notables solo valen si $AB=BA$.
  - |-
    <b>El orden se invierte:</b> $(AB)^t=B^tA^t$ y $(AB)^{-1}=B^{-1}A^{-1}$ (con $A,B$ regulares). Una matriz cuadrada es <b>regular</b> si tiene inversa; entonces se puede «simplificar» multiplicando por $A^{-1}$ por el lado correcto.
  - |-
    <b>Operar por filas = multiplicar por la izquierda</b> por una matriz elemental $E$ (la identidad con esa operación hecha); por columnas = multiplicar por la derecha. Las elementales son regulares y su inversa deshace la operación.
  - |-
    <b>Inversa por Gauss-Jordan:</b> $(A\mid I)\to(I\mid A^{-1})$ solo con operaciones por filas. Si a la izquierda aparece una fila nula, $A$ es singular.
  - |-
    <b>Rango = número de filas no nulas de una escalonada</b> (cuéntalas solo cuando la matriz ya esté escalonada). La escalonada <b>reducida</b> es única; la escalonada a secas no. Multiplicar por matrices regulares no cambia el rango.
que_cae_nota: |-
  Cada ejercicio se ha clasificado por su pregunta principal; varios mezclan tipos (por ejemplo, los de matrices elementales también usan el rango).
tipos:
- id: producto
  nombre: Calcular con productos de matrices (potencias, $A^2-B^2$, sistemas con matrices)
  receta: |-
    Respeta el orden en cada producto, calcula fila por columna y no uses identidades que supongan $AB=BA$.
  senal: |-
    Piden $A^n$, $AB$, $BA$, $A^2-B^2$ o una expresión con matrices dadas (a veces solo conoces $A+B$ y $A-B$).
  pasos:
  - |-
    Comprueba que los tamaños permiten el producto (columnas de la primera = filas de la segunda).
  - |-
    Desarrolla las expresiones paréntesis a paréntesis, <b>sin conmutar</b>: $(A+B)^2=A^2+AB+BA+B^2$.
  - |-
    Si solo conoces sumas y diferencias, despeja las matrices ($A=\frac12[(A+B)+(A-B)]$) o busca qué combinación da lo pedido.
  - |-
    Para potencias, calcula $A^2$, $A^3$ y busca el patrón; compruébalo con el producto siguiente.
  ejemplo: |-
    $A=\begin{pmatrix}1&2\\0&1\end{pmatrix}$, $B=\begin{pmatrix}2&0\\1&1\end{pmatrix}$: $AB=\begin{pmatrix}4&2\\1&1\end{pmatrix}$ pero $BA=\begin{pmatrix}2&4\\1&3\end{pmatrix}$, así que $AB\neq BA$.
  fallos: |-
    Escribir $(A+B)^2=A^2+2AB+B^2$ · multiplicar entrada a entrada en vez de fila por columna · cambiar el orden de los factores · olvidar comprobar que el producto existe
- id: propiedades
  nombre: Propiedades de la inversa, la traspuesta y V/F con matrices
  receta: |-
    Usa las reglas de inversa y traspuesta (el orden se invierte), multiplica por $A^{-1}$ por el lado correcto y, para refutar, busca un contraejemplo pequeño.
  senal: |-
    «Demostrar que…», «razonar si es cierto que…», «simplificar la expresión», con $A,B$ genéricas (regulares, simétricas…).
  pasos:
  - |-
    Escribe las hipótesis como igualdades ($A^2=A$, $A^t=A$, $AB=A$…).
  - |-
    Aplica $(AB)^t=B^tA^t$, $(AB)^{-1}=B^{-1}A^{-1}$ y $(A^{-1})^t=(A^t)^{-1}$ para reescribir la expresión.
  - |-
    Si $A$ es regular, multiplica la igualdad por $A^{-1}$ <b>en el mismo lado</b> en los dos miembros.
  - |-
    Si la afirmación parece falsa, busca un contraejemplo $2\times2$ (con $I$, $-I$ o matrices con ceros); si parece cierta, demuéstrala con las hipótesis.
  ejemplo: |-
    Si $A$ es regular y $A^2=A$: multiplicando por $A^{-1}$, $A^{-1}A^2=A^{-1}A$, luego $A=I$. Y $(AB)^{-1}=B^{-1}A^{-1}$: con $A=\begin{pmatrix}1&1\\0&1\end{pmatrix}$, $B=\begin{pmatrix}1&0\\1&1\end{pmatrix}$, ambos lados valen $\begin{pmatrix}1&-1\\-1&2\end{pmatrix}$.
  fallos: |-
    Escribir $(AB)^{-1}=A^{-1}B^{-1}$ · simplificar $AB=AC\Rightarrow B=C$ sin que $A$ sea regular · multiplicar por $A^{-1}$ a un lado de una igualdad y al otro lado de la otra · «demostrar» una afirmación falsa con un ejemplo en lugar de refutarla
- id: elementales
  nombre: Matrices elementales y matriz $M$ con $MA=B$
  receta: |-
    Cada operación por filas es una multiplicación por la izquierda por una elemental; la fila $i$ de $M$ dice cómo se forma la fila $i$ de $B$.
  senal: |-
    «¿Es elemental?», «escribe una matriz elemental», «halla $M$ tal que $MA=B$ sea cual sea $A$», o interpretar $EA$ y $AE$.
  pasos:
  - |-
    Una elemental sale de $I_n$ con <b>una sola</b> operación (intercambio, escalar una fila, sumar un múltiplo de otra fila) y siempre es regular.
  - |-
    Para $MA=B$, mira cada fila de $B$: ¿es una fila de $A$, multiplicada por un número o combinada con otras? Eso da la fila correspondiente de $M$.
  - |-
    Alternativa: identifica las operaciones $O_1,\dots,O_p$ que pasan de $A$ a $B$ y calcula $M=E_p\cdots E_1$ (la última a la izquierda).
  - |-
    Por columnas se multiplica por la <b>derecha</b>: $AE$ opera sobre las columnas de $A$.
  ejemplo: |-
    Si las filas de $B$ son $F_2$, $3F_1$, $F_3$ de $A$, entonces $M=\begin{pmatrix}0&1&0\\3&0&0\\0&0&1\end{pmatrix}$ (comprobado: $MA$ tiene por filas $F_2,\ 3F_1,\ F_3$).
  fallos: |-
    Llamar elemental a una matriz que necesita dos operaciones · multiplicar por la derecha cuando la operación es por filas · escribir las elementales en orden contrario en el producto · pensar que la suma de dos elementales es elemental
- id: inversa
  nombre: Calcular la inversa por operaciones elementales
  receta: |-
    Forma $(A\mid I)$ y opera por filas hasta obtener $(I\mid A^{-1})$; si a la izquierda aparece una fila nula, $A$ no tiene inversa.
  senal: |-
    «Calcula la inversa de…», «¿es regular?», «halla $A^{-1}$ mediante operaciones elementales».
  pasos:
  - |-
    Escribe la matriz ampliada $(A\mid I_n)$ con la línea divisoria.
  - |-
    Haz ceros por debajo de los pivotes (Gauss) y luego por encima (Jordan), usando <b>solo operaciones por filas</b>.
  - |-
    Normaliza cada pivote a $1$ dividiendo su fila.
  - |-
    Si a la izquierda queda $I$, a la derecha está $A^{-1}$; comprueba que $AA^{-1}=I$. Si aparece una fila nula a la izquierda, $A$ es singular.
  ejemplo: |-
    $\left(\begin{array}{cc|cc}1&1&1&0\\1&2&0&1\end{array}\right)\xrightarrow{F_2\to F_2-F_1}\left(\begin{array}{cc|cc}1&1&1&0\\0&1&-1&1\end{array}\right)\xrightarrow{F_1\to F_1-F_2}\left(\begin{array}{cc|cc}1&0&2&-1\\0&1&-1&1\end{array}\right)$, luego $A^{-1}=\begin{pmatrix}2&-1\\-1&1\end{pmatrix}$.
  fallos: |-
    Mezclar operaciones por filas y por columnas · no aplicar a la parte derecha lo que haces a la izquierda · olvidar un signo al restar filas · no comprobar $AA^{-1}=I$
- id: escalonada
  nombre: Escalonar, hallar la reducida y calcular el rango
  receta: |-
    Escalona por filas (pivotes de izquierda a derecha), cuenta las filas no nulas para el rango y, si piden la reducida, normaliza los pivotes y haz ceros también encima.
  senal: |-
    «Halla una escalonada de…», «la forma escalonada reducida», «calcula el rango», «discute el rango según $k$».
  pasos:
  - |-
    Elige el pivote de la primera columna (con un intercambio de filas si hace falta) y haz ceros por debajo.
  - |-
    Repite con la siguiente columna que tenga un elemento distinto de cero por debajo de la fila ya usada; los pivotes no tienen por qué estar en la diagonal.
  - |-
    Cuando la matriz es <b>escalonada</b>, el rango es el número de filas no nulas.
  - |-
    Para la reducida: divide cada fila por su pivote y haz ceros por encima de cada pivote. Es única.
  ejemplo: |-
    $\begin{pmatrix}1&2&1\\2&4&3\\1&2&2\end{pmatrix}\xrightarrow{F_2-2F_1,\ F_3-F_1}\begin{pmatrix}1&2&1\\0&0&1\\0&0&1\end{pmatrix}\xrightarrow{F_3-F_2}\begin{pmatrix}1&2&1\\0&0&1\\0&0&0\end{pmatrix}$: rango $2$. Reducida: $F_1-F_2$ da $\begin{pmatrix}1&2&0\\0&0&1\\0&0&0\end{pmatrix}$.
  fallos: |-
    Contar filas no nulas antes de que la matriz esté escalonada · dividir por un pivote que puede ser $0$ en el caso con parámetro · creer que la escalonada es única · olvidar hacer ceros por encima al pedir la reducida
quiz:
- p: |-
    $A$ y $B$ son cuadradas del mismo orden. ¿Cuándo vale $(A+B)^2=A^2+2AB+B^2$?
  opciones:
  - t: |-
      Siempre
    ok: false
    why: |-
      Eso es lo que pasa con números, pero con matrices $(A+B)^2=A^2+AB+BA+B^2$ y $AB$ no siempre es igual a $BA$.
  - t: |-
      Cuando $AB=BA$
    ok: true
  - t: |-
      Solo cuando $A=B$
    ok: false
    why: |-
      Basta con que conmuten; $A=B$ es solo un caso particular.
  - t: |-
      Nunca
    ok: false
    why: |-
      Si $A=I$ (o cualquier matriz que conmute con $B$) sí se cumple.
  fb: |-
    $(A+B)^2=A^2+AB+BA+B^2$. Es igual a $A^2+2AB+B^2$ exactamente cuando $AB+BA=2AB$, es decir, $AB=BA$.
- p: |-
    Con $A=\begin{pmatrix}1&1\\0&1\end{pmatrix}$ y $B=\begin{pmatrix}1&0\\1&1\end{pmatrix}$ se tiene $(AB)^{-1}=\begin{pmatrix}1&-1\\-1&2\end{pmatrix}$. ¿Cuál es la fórmula general?
  opciones:
  - t: |-
      $(AB)^{-1}=A^{-1}B^{-1}$
    ok: false
    why: |-
      Con estas matrices $A^{-1}B^{-1}=\begin{pmatrix}2&-1\\-1&1\end{pmatrix}\neq(AB)^{-1}$: el orden se invierte.
  - t: |-
      $(AB)^{-1}=B^{-1}A^{-1}$
    ok: true
  - t: |-
      $(AB)^{-1}=A^{-1}+B^{-1}$
    ok: false
    why: |-
      La inversa no se reparte sobre la suma ni sobre el producto como una suma; lo que hay que hacer es multiplicar las inversas en orden contrario.
  - t: |-
      $(AB)^{-1}=(A^{t}B^{t})^{-1}$
    ok: false
    why: |-
      Eso mezcla traspuesta e inversa sin motivo; $(AB)^{t}=B^{t}A^{t}$ y $(AB)^{-1}=B^{-1}A^{-1}$ son reglas distintas.
  fb: |-
    $B^{-1}A^{-1}=\begin{pmatrix}1&0\\-1&1\end{pmatrix}\begin{pmatrix}1&-1\\0&1\end{pmatrix}=\begin{pmatrix}1&-1\\-1&2\end{pmatrix}$. Se «deshace» primero lo último que se hizo.
- p: |-
    ¿Cuál de estas matrices $3\times3$ es una matriz elemental?
  opciones:
  - t: |-
      $\begin{pmatrix}1&0&0\\0&1&0\\2&0&1\end{pmatrix}$
    ok: true
  - t: |-
      $\begin{pmatrix}2&0&0\\0&3&0\\0&0&1\end{pmatrix}$
    ok: false
    why: |-
      Necesita dos operaciones ($F_1\to2F_1$ y $F_2\to3F_2$) para salir de $I$.
  - t: |-
      $\begin{pmatrix}0&1&0\\0&0&1\\1&0&0\end{pmatrix}$
    ok: false
    why: |-
      Es una permutación cíclica: requiere dos intercambios de filas, no uno.
  - t: |-
      $\begin{pmatrix}0&1&0\\1&0&0\\0&0&0\end{pmatrix}$
    ok: false
    why: |-
      Tiene una fila nula, luego no es regular; una elemental siempre es regular.
  fb: |-
    La primera sale de $I_3$ con $F_3\to F_3+2F_1$: una sola operación. Las demás necesitan dos operaciones o son singulares.
- p: |-
    $A$ es $3\times3$ y $E=\begin{pmatrix}0&1&0\\1&0&0\\0&0&1\end{pmatrix}$. ¿Qué hace el producto $AE$?
  opciones:
  - t: |-
      Intercambia las filas 1 y 2 de $A$
    ok: false
    why: |-
      Eso es $EA$ (por la izquierda). Con $E$ a la derecha se actúa sobre columnas.
  - t: |-
      Intercambia las columnas 1 y 2 de $A$
    ok: true
  - t: |-
      Multiplica por $2$ la fila 1
    ok: false
    why: |-
      $E$ no tiene ningún factor distinto de $1$; solo permuta.
  - t: |-
      Deja $A$ igual
    ok: false
    why: |-
      $E\neq I$ y $A$ es genérica: $AE$ cambia $A$.
  fb: |-
    Multiplicar por la derecha opera por columnas: $AE$ tiene las columnas 1 y 2 de $A$ intercambiadas. Por la izquierda, $EA$ intercambia las filas.
- p: |-
    ¿Cuál es el rango de $\begin{pmatrix}1&2&1\\2&4&3\\1&2&2\end{pmatrix}$?
  opciones:
  - t: |-
      $1$
    ok: false
    why: |-
      Tras escalonar quedan dos filas no nulas, no una: $F_2-2F_1=(0,0,1)$ no es cero.
  - t: |-
      $2$
    ok: true
  - t: |-
      $3$
    ok: false
    why: |-
      Has contado las filas de la matriz original sin escalonar. Al escalonar, $F_3-F_1-(F_2-2F_1)$ da una fila nula.
  - t: |-
      No se puede saber sin calcular el determinante
    ok: false
    why: |-
      El rango se obtiene directamente escalonando y contando filas no nulas.
  fb: |-
    $F_2-2F_1=(0,0,1)$, $F_3-F_1=(0,0,1)$, $F_3-F_2=(0,0,0)$: quedan 2 filas no nulas, rango $2$.
- p: |-
    Al aplicar Gauss-Jordan a $(A\mid I)$ con $A=\begin{pmatrix}1&2&3\\2&4&7\\1&2&4\end{pmatrix}$, en la parte izquierda aparece una fila de ceros. ¿Qué concluyes?
  opciones:
  - t: |-
      $A$ es regular y su inversa tiene una fila nula
    ok: false
    why: |-
      Una matriz con fila nula no puede ser la inversa de nada: si $A^{-1}$ existiera sería regular.
  - t: |-
      Se ha cometido un error de cálculo
    ok: false
    why: |-
      Aquí es normal: $F_2-2F_1=(0,0,1)$ y $F_3-F_1=(0,0,1)$, luego $F_3-F_1-(F_2-2F_1)=0$. Es una pista, no un fallo.
  - t: |-
      $A$ es singular (rango $2<3$): no tiene inversa
    ok: true
  - t: |-
      Hay que continuar normalizando la fila nula
    ok: false
    why: |-
      Una fila nula no tiene pivote que normalizar; el algoritmo se detiene.
  fb: |-
    Con una fila nula a la izquierda, el rango de $A$ es menor que $3$ (aquí vale $2$), por lo que $A$ es singular y $A^{-1}$ no existe.
