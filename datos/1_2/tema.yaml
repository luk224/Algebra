h1: |-
  Álgebra matricial
resumen: |-
  Cómo se suman, multiplican e invierten matrices; qué es una matriz elemental y por qué sirve para escalonar y para calcular la inversa; qué es el rango. Es la base algebraica de todo lo que viene después: sistemas de ecuaciones, aplicaciones lineales y diagonalización.
