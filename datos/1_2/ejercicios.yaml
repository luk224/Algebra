  problema:
  - escalonada
  nivel: 2
  titulo: |-
    Sept. 2022, problema a) — rango de una $3\times5$ y su reducida
  enunciado: |-
    Calcular, por el método de Gauss, el rango de $\begin{pmatrix}1&1&2&2&-1\\1&2&0&3&1\\1&0&4&1&-3\end{pmatrix}$.
  pista: |-
    Escalona con Gauss; el pivote de la primera fila vale 1, así que haz ceros debajo sin fracciones. Rango = filas no nulas.
  cuerpo:
  - pasos:
    - |-
      Es la matriz anterior sin la cuarta fila; mismo método (U p.20-22).
    - |-
      $F_2\to F_2-F_1$, $F_3\to F_3-F_1$: $\begin{pmatrix}1&1&2&2&-1\\0&1&-2&1&2\\0&-1&2&-1&-2\end{pmatrix}$.
    - |-
      $F_3\to F_3+F_2$: $\begin{pmatrix}1&1&2&2&-1\\0&1&-2&1&2\\0&0&0&0&0\end{pmatrix}$.
    - |-
      Dos filas no nulas: <b>rango 2</b>. Para quien quiera la reducida (única, U p.21), $F_1\to F_1-F_2$ da $\begin{pmatrix}1&0&4&1&-3\\0&1&-2&1&2\\0&0&0&0&0\end{pmatrix}$.
  - receta: |-
      la de Feb. 2019 (A). Justifica el final diciendo que la matriz <b>ya es escalonada</b> y contando sus filas no nulas (el examen dice solo «no se puede seguir escalonando»).
- id: ex-feb26a
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Feb. 2026 (1.ª sem.), pregunta 1
    texto: |-
      X Feb. 2026 (1.ª)
  problema:
  - escalonada
  nivel: 2
  titulo: |-
    Feb. 2026 (1.ª sem.), pregunta 1 — forma escalonada reducida de una $3\times3$
  enunciado: |-
    Calcule de manera razonada la forma escalonada reducida de $A=\begin{pmatrix}1&2&-3\\0&2&1\\-1&0&3\end{pmatrix}$.
  pista: |-
    Escalona primero, normaliza los pivotes y haz ceros también por encima de cada pivote. Anota cada operación para razonar el proceso.
  cuerpo:
  - pasos:
    - |-
      <b>Qué se busca</b> (Def. 1.3, U p.20): escalonada con pivotes iguales a 1 y ceros por encima y por debajo de cada pivote; es única (U p.21).
    - |-
      $F_3\to F_3+F_1$ (anula el $-1$ bajo el pivote): $\begin{pmatrix}1&2&-3\\0&2&1\\0&2&0\end{pmatrix}$.
    - |-
      $F_3\to F_3-F_2$ (anula el 2 bajo el pivote de la columna 2): $\begin{pmatrix}1&2&-3\\0&2&1\\0&0&-1\end{pmatrix}$. Ya es escalonada; falta normalizar y subir.
    - |-
      $F_3\to-F_3$: $\begin{pmatrix}1&2&-3\\0&2&1\\0&0&1\end{pmatrix}$.
    - |-
      $F_2\to F_2-F_3$ y $F_1\to F_1+3F_3$ (ceros <b>encima</b> del pivote de la columna 3): $\begin{pmatrix}1&2&0\\0&2&0\\0&0&1\end{pmatrix}$.
    - |-
      $F_2\to\tfrac12F_2$: $\begin{pmatrix}1&2&0\\0&1&0\\0&0&1\end{pmatrix}$.
    - |-
      $F_1\to F_1-2F_2$: $I_3$.
    - |-
      <b>Conclusión:</b> la reducida es $I_3$, luego $A$ es regular (U p.22). Comprobación: $\det A=-2\ne0$.
  - resultado: |-
      la escalonada reducida de $A$ es $I_3$.
  - html: |-
      <div class="recipe"><b>Receta (Gauss-Jordan):</b> (1) escalona hacia abajo; (2) normaliza cada pivote a 1; (3) anula hacia arriba empezando por el <b>último</b> pivote, para no estropear los ceros ya logrados.</div>
  - html: |-
      <p><b>Notación:</b> $\leftrightarrow$ es solo para <b>intercambiar</b> filas; la sustitución se escribe $F_3\to F_3+F_1$ (U p.14).</p>
- id: ex-feb26b
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Feb. 2026 (2.ª sem.), problema 7, segundo apartado
    texto: |-
      X Feb. 2026 (2.ª)
  problema:
  - escalonada
  nivel: 2
  titulo: |-
    Feb. 2026 (2.ª sem.), problema 7 (apartado de la reducida) — pivotes que no están en la diagonal
  enunciado: |-
    Para la aplicación lineal $f(x,y,z,t)=(x+2y-z+3t,\ 2x+4y+6t,\ -x-2y+z-3t)$, la matriz asociada es $A=\begin{pmatrix}1&2&-1&3\\2&4&0&6\\-1&-2&1&-3\end{pmatrix}$. Halle la forma escalonada reducida de $A$. <i>(El examen pide antes hallar $A$ a partir de $f$; ese apartado es del tema 3.)</i>
  pista: |-
    Aquí los pivotes no están en la diagonal: escalona columna a columna saltando la columna que no tiene pivote, y luego haz ceros por encima.
  cuerpo:
  - pasos:
    - |-
      <b>Columna 1</b> (pivote 1): $F_2\to F_2-2F_1$, $F_3\to F_3+F_1$: $\begin{pmatrix}1&2&-1&3\\0&0&2&0\\0&0&0&0\end{pmatrix}$. La columna 2 no tiene pivote (bajo el 2 de la fila 1 solo hay ceros); el siguiente pivote es el 2 de la columna 3. Ya es escalonada, de rango 2.
    - |-
      $F_2\to\tfrac12F_2$ (normalizar): $\begin{pmatrix}1&2&-1&3\\0&0&1&0\\0&0&0&0\end{pmatrix}$.
    - |-
      $F_1\to F_1+F_2$ (anula el $-1$ encima del pivote de la columna 3): $$A_r=\begin{pmatrix}1&2&0&3\\0&0&1&0\\0&0&0&0\end{pmatrix}.$$
    - |-
      Comprobación con sympy (<code>rref</code>): coincide con $A_r$, columnas pivote 1 y 3 ✓. <i>(Los apartados de matriz asociada y núcleo son del tema 3.)</i>
  - receta: |-
      la de Gauss-Jordan del ejercicio anterior. Si una columna no tiene pivote, se salta y se sigue con la siguiente: los pivotes no tienen por qué estar en la diagonal.
  - html: |-
      <p><b>Fallos comunes</b> (literal del examen): la escalonada reducida no es una «triangular inferior equivalente»; y hay que indicar <b>sobre qué fila</b> se hace cada operación (no basta escribir «$F_1+F_2$»).</p>
- id: ex-sep22e1
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Sept. 2022, ejercicio 1
    texto: |-
      X Sept. 2022 (ej. 1)
  problema:
  - escalonada
  - elementales
  nivel: 2
  titulo: |-
    Sept. 2022, ejercicio 1 — ¿es única la reducida? ¿equivalen las transformaciones elementales de ecuaciones? (V/F)
  enunciado: |-
    Razonar si son ciertas: A) «La matriz escalonada reducida de una matriz $A$ no es única»; B) «Se puede obtener un sistema equivalente a uno dado mediante transformaciones elementales en sus ecuaciones».
  pista: |-
    Recuerda qué parte de la forma escalonada es única y cuál no. Para la segunda, ¿qué tipo de operaciones relacionan dos sistemas equivalentes?
  cuerpo:
  - pasos:
    - |-
      <b>A) Falsa.</b> U p.21: la escalonada <i>no</i> es única, pero la escalonada <b>reducida sí</b> lo es. Ejemplo (U Ej. 1.13-1.14): $\begin{pmatrix}1&2\\2&3\\1&1\end{pmatrix}$ tiene varias escalonadas, como $\begin{pmatrix}1&2\\0&-1\\0&0\end{pmatrix}$ o $\begin{pmatrix}1&2\\0&1\\0&0\end{pmatrix}$, pero una única reducida, $\begin{pmatrix}1&0\\0&1\\0&0\end{pmatrix}$. Lo que no es única es la escalonada «a secas»; la reducida queda determinada porque sus pivotes valen 1 y tiene ceros encima y debajo.
    - |-
      <b>B) Verdadera.</b> Es el resultado sobre sistemas equivalentes (U p.31-32), desarrollado completo en el <a href="tema_1_4_sistemas_ecuaciones.html#ex-sep22e1">tema 1.4</a>: se apoya en que las matrices elementales son regulares (U p.16).
  - receta: |-
      en un V/F de teoría, cita el resultado exacto de U y añade un ejemplo pequeño.
