motivacion:
  s1: |-
    Una tienda lleva el stock de 3 productos en 4 almacenes. ¿Cómo lo anotarías para poder operar con toda la tabla de una vez y no número a número? ¿Qué formas «especiales» de tabla (cuadrada, con ceros bajo la diagonal…) crees que serán útiles?
  s2: |-
    Si la semana pasada vendiste la tabla de unidades $A$ y esta semana $B$, ¿cómo sacas el total? ¿Y si los precios suben el 10 %? ¿Qué condición deben cumplir dos tablas para poder sumarlas?
  s3: |-
    Tienes las unidades de cada producto por pedido y el precio de cada producto. ¿Cómo combinas las dos tablas para obtener lo que cuesta cada pedido? ¿Crees que $AB$ y $BA$ darán lo mismo?
  s4: |-
    Si $A$ «transforma» unos datos, ¿existe una matriz que deshaga exactamente lo que hizo $A$, como la resta deshace la suma? ¿Toda matriz no nula tendrá una así?
  s5: |-
    Al resolver un sistema de ecuaciones restas filas, intercambias ecuaciones o multiplicas una por un número. ¿Se puede conseguir cada uno de esos pasos multiplicando por una matriz concreta?
  s6: |-
    Sabes que calcular $A^{-1}$ por fórmulas es muy pesado para tamaños grandes. ¿Y si bastara con los mismos pasos que usas para resolver sistemas, aplicados a $A$ y a $I$ a la vez?
  s7: |-
    Dos matrices pueden parecer muy distintas y esconder el mismo sistema de ecuaciones. ¿Cómo decidir, sin resolver nada, si una se puede convertir en la otra con operaciones por filas?
  s8: |-
    Cuando escalonas una matriz buscas una forma «de escalera» cada vez más simple. ¿Cómo tiene que ser esa escalera para que se lean de un vistazo las soluciones o los pivotes?
  s9: |-
    Un sistema de 3 ecuaciones puede esconder en realidad solo 2 ecuaciones independientes. ¿Cómo medir cuántas filas aportan información nueva y cuántas sobran?
consignas:
  - animacion: |-
      Animación: el producto fila × columna
    consigna: |-
      Cambia las entradas de $A$ y $B$ y recorre con el selector cada posición del resultado. Fíjate en qué fila de $A$ y qué columna de $B$ se usan para cada entrada de $AB$.
    pregunta: |-
      ¿Por qué el número de columnas de $A$ debe coincidir con el de filas de $B$?
  - animacion: |-
      Animación: el algoritmo de la inversa
    consigna: |-
      Avanza paso a paso con el stepper y observa cómo cambia cada bloque de $(A\mid I)$ en cada operación. Fíjate en qué entrada se anula en cada paso y en qué se convierte el bloque derecho cuando el izquierdo llega a $I$.
    pregunta: |-
      Prueba con una matriz de filas proporcionales: ¿qué pasa y por qué no hay inversa?
  - animacion: |-
      Animación: escalonar para calcular el rango
    consigna: |-
      Avanza por las operaciones con el stepper hasta la forma escalonada y fíjate en las filas nulas que aparecen. Cambia una entrada para hacer una fila combinación de otras y mira cómo varía el resultado.
    pregunta: |-
      ¿Qué relación hay entre el número de filas no nulas final y el rango?
