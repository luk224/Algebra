motivacion:
  s1: |-
    Una transformación del plano estira, aplasta o gira casi todos los vectores y los saca de su recta. ¿Existirá alguna dirección que la transformación respete, de modo que un vector de esa recta siga en ella después de transformarlo?
  s2: |-
    Si un vector $x$ queda en su misma recta al aplicarle $A$, entonces $Ax$ es solo $x$ estirado o encogido por un número. ¿Cómo darías nombre a ese número y a esos vectores especiales? ¿Qué pasa con todos los vectores que comparten el mismo número?
  s3: |-
    Buscar a ojo los vectores que $A$ no desvía solo funciona en ejemplos muy sencillos. ¿Se puede convertir la búsqueda en una ecuación en una sola incógnita, de modo que sus raíces sean los únicos números posibles?
  s4: |-
    El polinomio que acabas de calcular se obtuvo con una base concreta. Si describes la misma aplicación lineal con otra base, la matriz cambia por completo. ¿Cambiará también el polinomio y, con él, los valores propios?
  s5: |-
    Una raíz del polinomio característico puede aparecer repetida, por ejemplo $(\lambda-2)^2$. ¿Eso significa que hay dos direcciones independientes con ese valor propio, o puede haber solo una?
  s6: |-
    Ya tienes todas las piezas sueltas: polinomio, raíces, subespacios. Si te dan una matriz $3\times3$ en un examen, ¿en qué orden las usas para llegar a una descripción completa de sus valores y vectores propios sin perderte?
consignas:
  - animacion: |-
      ¿cuándo $x$ y $Ax$ están en la misma recta?
    consigna: |-
      Con $A$ del Ejemplo 4.6, mueve el vector $x$ hasta ponerlo en $(2,1)$ y luego en $(1,1)$, y fíjate en cuándo $Ax$ queda alineado con $x$ y cuál es el factor de estiramiento. Después pulsa «Giro 90°» y «Doble con d = 1» y observa qué ocurre con los valores y vectores propios.
    pregunta: |-
      ¿Por qué un giro de 90° no deja ninguna dirección fija en el plano?
