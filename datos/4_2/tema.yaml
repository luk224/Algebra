esencial:
  intro: |-
    Lo que tienes que llevarte del 4.2: qué es un vector propio, cómo se calcula y qué se sabe de él sin calcular.
  items:
  - |-
    <b>Vector propio:</b> $x\neq0$ con $Ax=\lambda x$; el número $\lambda$ es su <b>valor propio</b>. El vector $0$ nunca es propio, pero $\lambda=0$ sí puede ser valor propio (cuando $A$ es singular).
  - |-
    <b>Valores propios = raíces reales de $|A-\lambda I|=0$.</b> Para cada uno, el <b>subespacio propio</b> es $L_\lambda=\operatorname{Nuc}(A-\lambda I)$: se resuelve el sistema homogéneo.
  - |-
    <b>Atajos:</b> en una triangular los valores propios son la diagonal; $\operatorname{tr}A=\sum\lambda_i$ y $|A|=\prod\lambda_i$ (con multiplicidades); $|A-kI|$ es el polinomio evaluado en $\lambda=k$.
  - |-
    <b>Multiplicidades:</b> $\alpha$ = veces que $\lambda$ es raíz; $d=n-\operatorname{rang}(A-\lambda I)$. Siempre $1\le d\le\alpha$, y si $\alpha=1$ entonces $d=1$. Que $d<\alpha$ pueda ocurrir es lo que decide la diagonalización (tema 4.3).
  - |-
    <b>Semejantes</b> ($A'=P^{-1}AP$) tienen el mismo polinomio característico, traza, determinante y $d$ (Teor. 4.4); el recíproco es falso.
tipos:
- id: comprobar
  nombre: |-
    ¿Es propio este vector? ¿Con qué valor propio?
  receta: |-
    Multiplica $A$ por el vector y mira si el resultado es un múltiplo del vector.
  senal: |-
    El enunciado te da un vector concreto y pregunta si es propio, o cuál es su valor propio.
  pasos:
  - |-
    Calcula $Ax$ con el vector $x$ dado.
  - |-
    Comprueba que $x\neq0$ y que $Ax=\lambda x$ con el mismo $\lambda$ en todas las componentes.
  - |-
    Si lo es, $\lambda$ es el cociente de cualquier componente no nula de $Ax$ entre la de $x$.
  - |-
    Con dos vectores propios distintos, cada uno tiene su propio $\lambda$.
  ejemplo: |-
    $A=\begin{pmatrix}4&1\\2&3\end{pmatrix}$, $x=(1,1)$: $Ax=(5,5)=5x$, es propio con $\lambda=5$. Con $x=(1,0)$: $Ax=(4,2)$ no es múltiplo de $x$, no es propio.
  fallos: |-
    Aceptar el vector $0$ · Mirar solo una componente · Usar el mismo $\lambda$ para dos vectores propios distintos
- id: inverso
  nombre: |-
    Hallar parámetros o construir una matriz con propiedades dadas
  receta: |-
    Traduce cada dato ($Ax=\lambda x$, $|A-\lambda I|=0$, $L_\lambda$ dado) en ecuaciones en las incógnitas.
  senal: |-
    La matriz tiene letras ($a,b,c,m$) o hay que «escribir una matriz tal que…», con vectores o valores propios dados.
  pasos:
  - |-
    Escribe cada dato como ecuación: «$x$ es propio de $\lambda$» $\Rightarrow AX=\lambda X$; «$\lambda$ es valor propio» $\Rightarrow|A-\lambda I|=0$.
  - |-
    Desarrolla: cada fila de $AX=\lambda X$ da una ecuación lineal en las incógnitas.
  - |-
    Añade las condiciones extra (simétrica, singular, subespacio propio dado).
  - |-
    Resuelve y comprueba que se cumple $AX=\lambda X$.
  ejemplo: |-
    ¿Para qué $m$ es $3$ valor propio de $A=\begin{pmatrix}1&m\\2&1\end{pmatrix}$? $|A-3I|=(-2)(-2)-2m=4-2m=0\Rightarrow m=2$; entonces los valores propios son $3$ y $-1$.
  fallos: |-
    Suponer el mismo $\lambda$ para vectores distintos · Olvidar las condiciones extra (simétrica, singular) · No comprobar al final
- id: valores
  nombre: |-
    Calcular los valores propios y sus multiplicidades
  receta: |-
    Resuelve $|A-\lambda I|=0$ y cuenta cuántas veces sale cada raíz.
  senal: |-
    «Halla los valores propios», «autovalores», o interpretar la salida de Maxima.
  pasos:
  - |-
    Forma $A-\lambda I$ (restas $\lambda$ solo en la diagonal).
  - |-
    Calcula $|A-\lambda I|$: en $2\times2$ vale $\lambda^2-(\operatorname{tr}A)\lambda+|A|$; en triangulares, el producto de la diagonal; si no, opera por líneas hasta sacar factor.
  - |-
    Factoriza (divisores del término independiente y Ruffini). Cada raíz real es un valor propio y su exponente es $\alpha$.
  - |-
    Controla: $\sum\lambda_i=\operatorname{tr}A$ y $\prod\lambda_i=|A|$.
  ejemplo: |-
    $A=\begin{pmatrix}3&1\\-1&1\end{pmatrix}$: $\lambda^2-4\lambda+4=(\lambda-2)^2$. Un único valor propio, $\lambda=2$, con $\alpha=2$.
  fallos: |-
    Restar $\lambda$ en todas las entradas · Reducir $A$ por filas antes de calcular · Dar por hecho que hay raíces reales · Olvidar contar las multiplicidades
  series:
  - tipo: polcar22
    titulo: |-
      Valores propios de una 2×2
    n: 5
- id: subespacio
  nombre: |-
    Hallar el subespacio propio, su base y $d$
  receta: |-
    Resuelve $(A-\lambda I)X=0$ para cada valor propio y cuenta parámetros.
  senal: |-
    «Vectores propios», «subespacio propio», «base», «ecuaciones cartesianas o paramétricas», «multiplicidad geométrica».
  pasos:
  - |-
    Sustituye $\lambda$ en $A-\lambda I$ y calcula su rango.
  - |-
    Escalona el sistema homogéneo y escribe las ecuaciones cartesianas de $L_\lambda$.
  - |-
    Despeja con $d=n-\operatorname{rang}(A-\lambda I)$ parámetros y saca una base.
  - |-
    Comprueba $1\le d\le\alpha$ y verifica $AX=\lambda X$ con un vector de la base.
  ejemplo: |-
    $A=\begin{pmatrix}3&1\\-1&1\end{pmatrix}$, $\lambda=2$: $A-2I=\begin{pmatrix}1&1\\-1&-1\end{pmatrix}$ tiene rango $1$, ecuación $x+y=0$, $L_2=\langle(1,-1)\rangle$, $d=1<\alpha=2$.
  fallos: |-
    Confundir $\operatorname{rang}A$ con $\operatorname{rang}(A-\lambda I)$ · Dar una base como si fuera todo el conjunto de vectores propios · Incluir el vector $0$ como propio
- id: propiedades
  nombre: |-
    Razonar sin calcular (traza, determinante, semejanza, potencias)
  receta: |-
    Usa lo que se conserva y cómo cambian los valores propios, en lugar de calcular la matriz.
  senal: |-
    El enunciado da el polinomio característico o los valores propios y pregunta por un determinante, una potencia, la inversa, o si algo es «cierto o falso».
  pasos:
  - |-
    Identifica los datos: polinomio $p(\lambda)=|A-\lambda I|$, valores propios o $Av=\lambda v$.
  - |-
    Traduce la pregunta: $|A-kI|=p(k)$; $|A|=\prod\lambda_i$; $\operatorname{tr}A=\sum\lambda_i$.
  - |-
    Si $Av=\lambda v$: $A^kv=\lambda^kv$, $A^{-1}v=\lambda^{-1}v$ (si $A$ es regular), $q(A)v=q(\lambda)v$.
  - |-
    Para falso, busca un contraejemplo; para verdadero, deduce con la definición.
  ejemplo: |-
    $A=\begin{pmatrix}4&1\\2&3\end{pmatrix}$ tiene valores $5,2$. Entonces $A^2-3A+I$ tiene valores $5^2-15+1=11$ y $2^2-6+1=-1$, y $A^{-1}$ tiene $\tfrac15,\tfrac12$.
  fallos: |-
    Signo mal en $|A+kI|$ (es $p(-k)$) · Creer «mismo polinomio $\Rightarrow$ semejantes» · Usar $A^{-1}$ sin ser regular · Ignorar el caso del vector $0$
quiz:
- p: |-
    Sea $A=\begin{pmatrix}2&1\\0&3\end{pmatrix}$. ¿Cuál de estos vectores es vector propio de $A$?
  opciones:
  - t: |-
      $(1,0)$
    ok: true
  - t: |-
      $(0,1)$
    ok: false
    why: |-
      $A(0,1)^t=(1,3)^t$ no es múltiplo de $(0,1)$: cambia de dirección.
  - t: |-
      $(1,2)$
    ok: false
    why: |-
      $A(1,2)^t=(4,6)^t$, que no es proporcional a $(1,2)$.
  - t: |-
      $(0,0)$
    ok: false
    why: |-
      El vector $0$ cumple $A0=\lambda0$ para todo $\lambda$, pero la definición lo excluye.
  fb: |-
    $A(1,0)^t=(2,0)^t=2(1,0)^t$: es propio con $\lambda=2$.
- p: |-
    Una matriz $2\times2$ tiene traza $5$ y determinante $6$. ¿Cuáles son sus valores propios?
  opciones:
  - t: |-
      $2$ y $3$
    ok: true
  - t: |-
      $1$ y $6$
    ok: false
    why: |-
      Suman $7$, no $5$: has usado el determinante como suma.
  - t: |-
      $-2$ y $-3$
    ok: false
    why: |-
      Su producto es $6$, pero suman $-5$: no cumplen la traza.
  - t: |-
      $5$ y $6$
    ok: false
    why: |-
      Has copiado traza y determinante como si fueran los valores propios.
  fb: |-
    Suma $=5$ y producto $=6$: son raíces de $\lambda^2-5\lambda+6=(\lambda-2)(\lambda-3)$.
- p: |-
    El polinomio característico de $A$ ($3\times3$) es $p(\lambda)=|A-\lambda I|=(\lambda-3)^2(\lambda+1)$. ¿Cuánto vale $|A-I|$?
  opciones:
  - t: |-
      $8$
    ok: true
  - t: |-
      $0$
    ok: false
    why: |-
      Eso es $|A+I|$ (en $\lambda=-1$) o $|A-3I|$: aquí hay que evaluar en $\lambda=1$.
  - t: |-
      $4$
    ok: false
    why: |-
      Has olvidado el factor $(\lambda+1)=2$.
  - t: |-
      $-72$
    ok: false
    why: |-
      Eso es $p(-3)=|A+3I|$: confundes $|A-kI|$ con $|A+kI|$.
  fb: |-
    $|A-I|=p(1)=(1-3)^2(1+1)=4\cdot2=8$.
- p: |-
    $A=\begin{pmatrix}2&1\\0&2\end{pmatrix}$. ¿Cuánto vale la multiplicidad geométrica $d$ de $\lambda=2$?
  opciones:
  - t: |-
      $1$
    ok: true
  - t: |-
      $2$
    ok: false
    why: |-
      Es $\alpha$, no $d$. Has supuesto $d=\alpha$, pero $\operatorname{rang}(A-2I)=1$.
  - t: |-
      $0$
    ok: false
    why: |-
      $d\ge1$ siempre para un valor propio: es la dimensión de un subespacio que contiene vectores no nulos.
  fb: |-
    $A-2I=\begin{pmatrix}0&1\\0&0\end{pmatrix}$ tiene rango $1$, luego $d=2-1=1<\alpha=2$. Esto es lo que impide diagonalizar.
- p: |-
    $A=\begin{pmatrix}4&1\\2&3\end{pmatrix}$ tiene valores propios $5$ y $2$. ¿Cuáles son los de $A^{-1}$?
  opciones:
  - t: |-
      $\tfrac15$ y $\tfrac12$
    ok: true
  - t: |-
      $-5$ y $-2$
    ok: false
    why: |-
      La inversa no cambia el signo, sino que invierte el valor.
  - t: |-
      $5$ y $2$
    ok: false
    why: |-
      Si $Av=5v$ entonces $A^{-1}v=\tfrac15v$: los valores cambian.
  - t: |-
      No se pueden saber
    ok: false
    why: |-
      Sí: $A$ es regular ($|A|=10\neq0$) y $Av=\lambda v\Rightarrow A^{-1}v=\lambda^{-1}v$.
  fb: |-
    $A^{-1}v=\tfrac1\lambda v$ para cada vector propio. Solo se puede hacer porque $0$ no es valor propio ($A$ regular).
- p: |-
    Una matriz $3\times3$ tiene valores propios $2$ (con $\alpha=2$) y $-3$ (con $\alpha=1$). ¿Cuánto vale $|A|$?
  opciones:
  - t: |-
      $-12$
    ok: true
  - t: |-
      $-6$
    ok: false
    why: |-
      Has olvidado que $2$ cuenta dos veces: $|A|=2\cdot2\cdot(-3)$.
  - t: |-
      $1$
    ok: false
    why: |-
      Eso es la traza ($2+2-3$), no el determinante.
  - t: |-
      $12$
    ok: false
    why: |-
      Error de signo: hay un solo factor negativo, así que el producto es negativo.
  fb: |-
    $|A|=\prod\lambda_i=2\cdot2\cdot(-3)=-12$, contando cada valor propio tantas veces como su $\alpha$.
capa: true
que_cae_nota: |-
  Cada ejercicio se ha clasificado por su pregunta principal; muchos mezclan tipos (por ejemplo, calcular valores propios y después sus subespacios).
