  Módulo 4 · Diagonalización de matrices · Tema 4.2
h1: |-
  Valores y vectores propios
resumen: |-
  Cuáles son las direcciones que una aplicación lineal <b>no gira</b> (solo las estira, las encoge o las invierte), cómo se encuentran con el <b>polinomio característico</b> $|A-\lambda I|$, qué se conserva al cambiar de base (Teorema 4.4) y cómo se miden las dos «multiplicidades» de un valor propio: la <b>algebraica</b> $\alpha$ (cuántas veces es raíz) y la <b>geométrica</b> $d$ (cuántos vectores propios independientes tiene). Es la herramienta central de los temas 4.3 (diagonalizar), 4.4 (Jordan), 5.3 y 6.
