h1: |-
  Mínimos cuadrados
resumen: |-
  Cuando un sistema $AX=B$ <b>no tiene solución</b> (lo normal con datos medidos), no te rindes: buscas la <b>mejor solución aproximada</b>, la que deja el vector $AX$ lo más cerca posible de $B$. Verás que eso es una <b>proyección ortogonal</b> (tema 5.1), que se calcula con las <b>ecuaciones normales</b> $A^tAX=A^tB$ o con la factorización $QR$ (tema 5.2), y cómo ajustar una <b>recta</b>, una <b>parábola</b> o un <b>plano</b> a una nube de puntos.
