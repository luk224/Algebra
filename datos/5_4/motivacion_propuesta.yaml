motivacion:
  s1: |-
    Mides tres veces la misma cantidad y obtienes 1, 0 y $-5$ en vez de un único valor: el sistema $x=1,\ x=0,\ y=-5$ de tres ecuaciones no puede cumplirse a la vez. Si no hay solución exacta, ¿qué significa «la menos mala» y cómo se mide lo mala que es?
  s2: |-
    Ya sabes que la mejor aproximación es un punto del plano $\operatorname{Col}A$ que queda «a plomo» bajo $\mathbf b$. ¿Se puede convertir esa condición geométrica en un sistema de ecuaciones cuadrado que resuelvas con Gauss, sin dibujar nada?
  s3: |-
    Dos personas resuelven el mismo problema de mínimos cuadrados y entregan soluciones $\hat x$ distintas, y las dos tienen razón. ¿Cuándo puede pasar eso, y qué propiedad de las columnas de $A$ lo impide?
  s4: |-
    Las ecuaciones normales exigen calcular $A^tA$ y su inversa, y eso es costoso y delicado con números grandes. Si ya tienes ortogonalizadas las columnas de $A$, ¿se puede llegar a $\hat x$ resolviendo un sistema mucho más fácil?
  s5: |-
    Tienes cuatro mediciones $(x_i,y_i)$ que casi, pero no del todo, caen en una recta, y quieres predecir $y$ para un $x$ nuevo. ¿Cómo se traduce «la recta que mejor se ajusta» en un sistema $AX=B$, y se puede ajustar también una parábola o un plano?
consignas:
  - animacion: |-
      Animación 3D: $b$ fuera del plano
    consigna: |-
      Elige distintos presets y mueve los deslizadores del punto de prueba $A\mathbf x$ alrededor de $\hat x$. Fíjate en el segmento rojo $\mathbf b-A\hat x$, que forma ángulo recto con el plano, y en la distancia del punto de prueba a $\mathbf b$.
    pregunta: |-
      ¿Hay algún punto de prueba que quede más cerca de $\mathbf b$ que la proyección $A\hat x$?
  - animacion: |-
      Animación: recta de mínimos cuadrados
    consigna: |-
      Arrastra o edita los puntos (o prueba los presets) y observa los segmentos naranjas de error y el control $\sum e_i=0$, $\sum x_ie_i=0$. Después mueve los deslizadores $\Delta m$, $\Delta n$ de la recta de prueba y mira cómo cambia su error frente al de la recta azul.
    pregunta: |-
      ¿Puedes encontrar una recta cuyo error sea menor que el de la recta de mínimos cuadrados? ¿Y qué avisa la animación si todos los $x_i$ coinciden?
