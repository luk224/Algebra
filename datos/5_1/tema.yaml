kicker: |-
  Módulo 5 · Ortogonalidad · Tema 5.1
h1: |-
  Producto escalar
resumen: |-
  Cómo medir <b>longitudes, distancias y ángulos</b> en cualquier espacio vectorial (no solo en $\mathbb R^2$ y $\mathbb R^3$): el producto escalar y su matriz de Gram, la norma, la ortogonalidad, el método de <b>Gram-Schmidt</b> para fabricar bases ortonormales, el suplementario ortogonal y la <b>proyección ortogonal</b> como «el punto más cercano».
