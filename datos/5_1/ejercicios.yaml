    - |-
      $$GU=\begin{pmatrix}2+0+2\cr3+0+0\cr1+0+4\end{pmatrix}=\begin{pmatrix}4\cr3\cr5\end{pmatrix},$$
            <p>$U^tGU=4+0+10=14$.</p>
    - |-
      $\|(1,0,2)\|=\sqrt{14}$.
  - html: |-
      <p>Esa $G$ <b>no puede ser de Gram</b>: con $w=(1,-1,0)$, $W^tGW=\begin{pmatrix}1&-1&0\end{pmatrix}\begin{pmatrix}-1\cr2\cr1\end{pmatrix}=-3\lt 0$, violando la propiedad 4. Pasa las dos comprobaciones de U p.197 (simétrica, $g_{ii}>0$): <b>no son suficientes</b>. (Sylvester: menores $2,-7,-15$.) El cálculo pedido sale igual.</p>
