      X Feb. 2024 (2.ª) P5
  cuerpo:
  - enun: |-
      En $\mathbb R^3$ se define un producto escalar cuya matriz de Gram en la base canónica es $G=\begin{pmatrix}2&3&1\cr3&1&0\cr1&0&2\end{pmatrix}$. Calcule la norma del vector $(1,0,2)$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Norma con una Gram $3\times3$ (enunciado defectuoso).
      - - |-
          Cómo lo pienso
        - |-
          Antes de calcular, miro si $G$ es definida positiva: puede no serlo.
      - - |-
          Qué uso
        - |-
          <b>Norma, ángulo y distancia:</b> $\|x\|=\sqrt{x\bullet x}=\sqrt{X^tGX}$; $\cos\theta=\dfrac{x\bullet y}{\|x\|\|y\|}$ (Cauchy-Schwarz: $|x\bullet y|\le\|x\|\|y\|$); $d(x,y)=\|x-y\|$; $x\perp y\iff x\bullet y=0$. <b>Producto escalar (Def. 5.1, U p.193):</b> forma bilineal simétrica y definida positiva ($x\bullet x>0$ si $x\neq0$). En una base $B$ se escribe $x\bullet y=X^tGY$, con $G=(e_i\bullet e_j)$ simétrica; $G$ es matriz de Gram $\iff$ simétrica y definida positiva (Sylvester: menores principales $>0$).
      - - |-
          Por dónde empiezo
