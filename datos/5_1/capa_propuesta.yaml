ejercicios:
- id: |-
    ej5-1
  nivel: 1
  pista: |-
    Una matriz de Gram dice todo: la diagonal son $e_i\bullet e_i=\|e_i\|^2$ y los elementos fuera de ella son $e_i\bullet e_j$. Lee cada afirmación (unitarios, ortogonales) directamente en $G$.
  problema:
  - |-
    gram
  - |-
    medir
- id: |-
    ej5-2
  nivel: 2
  pista: |-
    Para ser producto escalar la matriz de la forma debe ser simétrica y definida positiva. Impón primero la simetría (eso fija $\lambda$) y luego comprueba la positividad con los menores.
  problema:
  - |-
    gram
- id: |-
    ej5-4
  nivel: 1
  pista: |-
    Piensa cómo se relacionan $G$ y $G'$ al cambiar de base ($G'=Q^tGQ$) y qué conservan esas operaciones: rango, determinante, signo.
  problema:
  - |-
    gram
- id: |-
    ej5-9
  nivel: 2
  pista: |-
    Cada dato geométrico es un producto $e_i\bullet e_j$ (normas al cuadrado en la diagonal, ortogonalidades dan ceros). Desarrolla $(2e_2-e_3)\bullet e_1$ y $(2e_2-e_3)\bullet e_3$ para sacar los que faltan.
  problema:
  - |-
    gram
- id: |-
    ej5-11
  nivel: 2
  pista: |-
    Con $\|u_i\|$ tienes la diagonal de $G$ (al cuadrado); con el coseno y la definición de ángulo despeja $u_1\bullet u_2$.
  problema:
  - |-
    gram
- id: |-
    ej5-12
  nivel: 1
  pista: |-
    La base nueva solo reordena los vectores canónicos: ¿qué matriz $Q$ tiene por columnas los vectores de $B'$? Aplica $G'=Q^tGQ$ (o reordena a ojo filas y columnas de $G$).
  problema:
  - |-
    gram
- id: |-
    ej5-13
  nivel: 2
  pista: |-
    La Gram del producto usual en una base es $Q^tQ$, con $Q$ los vectores por columnas. Entonces $\det G'=(\det Q)^2$: basta un solo determinante.
  problema:
  - |-
    gram
- id: |-
    ej5-3
  nivel: 1
  pista: |-
    El producto dado es «multiplica casilla a casilla y suma». Calcula la norma de la matriz con él y divide la matriz entre esa norma.
  problema:
  - |-
    medir
- id: |-
    ej5-10
  nivel: 2
  pista: |-
    Escribe las dos condiciones de ortogonalidad como un sistema homogéneo y resuélvelo; después impón norma 1 y mira qué ecuación cumplen todas las soluciones.
  problema:
  - |-
    perp
  - |-
    medir
- id: |-
    ej5-5
  nivel: 3
  pista: |-
    Con un producto no estándar «ortogonal a $u$» significa $u^tGX=0$, no $u\cdot x=0$. Saca un generador de $U$, calcula su fila $u^tG$ y esa será la ecuación de $U^\perp$.
  problema:
  - |-
    perp
  - |-
    gram
- id: |-
    ej5-6
  nivel: 2
  pista: |-
    Es un repaso de varios apartados: los tres primeros son de subespacios (tema 2) y el último, de ortogonalidad: busca los vectores ortogonales a los dos generadores de $L_1$.
  problema:
  - |-
    perp
- id: |-
    ej5-7
  nivel: 1
  pista: |-
    Un subespacio es ortogonal a $U$ si está contenido en $U^\perp$. Calcula $U^\perp$ (¿qué dimensión tiene?) y mira qué afirmaciones lo cumplen.
  problema:
  - |-
    perp
- id: |-
    ej5-8
  nivel: 2
  pista: |-
    Calcula $U^\perp$ (el mayor ortogonal) y elige un subespacio más pequeño dentro de él: sigue siendo ortogonal a $U$ pero ya no lo completa.
  problema:
  - |-
    perp
- id: |-
    ej5-14
  nivel: 2
  pista: |-
    La mínima distancia de $v$ a $U$ es la longitud de $v-\operatorname{Proy}_Uv$. Los generadores no son ortogonales: ortogonaliza primero, o usa la normal del plano.
  problema:
  - |-
    proy
- id: |-
    ej5-15
  nivel: 3
  pista: |-
    Cadena de métodos: Gram-Schmidt para $B_1$; el $U^\perp$ sale de un sistema homogéneo; las coordenadas en base ortogonal salen de cocientes con producto escalar, y la proyección usa $B_1$.
  problema:
  - |-
    gs
  - |-
    perp
  - |-
    proy
- id: |-
    ej-propio-1
  nivel: 1
  pista: |-
    Comprueba simetría y lineal a ojo; lo que decide es $x\bullet x$: ¿es positivo para todo $x\ne0$? Completa cuadrados o busca un vector que lo rompa.
  problema:
  - |-
    gram
- id: |-
    ej-propio-2
  nivel: 1
  pista: |-
    Matriz simétrica $2\times2$: es de Gram si $\Delta_1>0$ y $\Delta_2>0$. Despeja $a$ de $\Delta_2$.
  problema:
  - |-
    gram
- id: |-
    ej-propio-3
  nivel: 2
  pista: |-
    Sylvester $3\times3$: $\Delta_1,\Delta_2,\Delta_3>0$. Calcula cada menor principal y mira cuáles dependen de $k$.
  problema:
  - |-
    gram
- id: |-
    ej-propio-4
  nivel: 3
  pista: |-
    Para la Gram, cada entrada es una integral $\int_{-1}^1x^{i+j}dx$ (¡mira la paridad!). Luego la norma sale con la integral del cuadrado o con $X^tGX$.
  problema:
  - |-
    gram
  - |-
    medir
- id: |-
    ej-propio-5
  nivel: 2
  pista: |-
    La columnas de $Q$ son los vectores de $B'$ escritos en la canónica; aplica $G'=Q^tGQ$ y comprueba que $u\bullet w$ sale igual con $G'$ y con $G$.
  problema:
  - |-
    gram
- id: |-
    ej-propio-6
  nivel: 1
  pista: |-
    Todo sale de $X^tGY$: normas al cuadrado en la diagonal de $G$, el coseno con $e_1\bullet e_2$, y la ortogonalidad con $u^tGX=0$.
  problema:
  - |-
    medir
- id: |-
    ej-propio-7
  nivel: 1
  pista: |-
    Calcula $u\cdot v$, $\|u\|$, $\|v\|$ y $\|u+v\|$ y compáralos. La razón de Cauchy-Schwarz está en el rango del coseno.
  problema:
  - |-
    medir
- id: |-
    ej-propio-8
  nivel: 2
  pista: |-
    Cada generador de $U$ da una ecuación $u^tGX=0$. Escribe la fila $u^tG$ y compárala con la ecuación que saldría con el estándar.
  problema:
  - |-
    perp
- id: |-
    ej-propio-9
  nivel: 2
  pista: |-
    Gram-Schmidt: $e_1=u_1$ y resta a cada $u_k$ sus sombras sobre los $e_i$ anteriores. Reescala a enteros para evitar fracciones y normaliza al final.
  problema:
  - |-
    gs
- id: |-
    ej-propio-10
  nivel: 3
  pista: |-
    Ortogonaliza con la integral como producto (por paridad muchos productos son 0). El polinomio más próximo es la proyección de $x^3$ sobre $\langle1,x\rangle$ con la base ortogonal.
  problema:
  - |-
    gs
  - |-
    proy
- id: |-
    ej-propio-11
  nivel: 2
  pista: |-
    Recta: una sola fórmula $\frac{v\bullet u}{u\bullet u}u$. Plano: ¿son ortogonales los generadores? Si no, usa la normal o ortogonaliza. Pitágoras comprueba el resultado.
  problema:
  - |-
    proy
- id: |-
    ej-propio-12
  nivel: 2
  pista: |-
    Cada generador de $U$ (o los coeficientes de la ecuación de $W$) da una ecuación. Resuelve el sistema y comprueba $\dim U+\dim U^\perp=4$.
  problema:
  - |-
    perp
- id: |-
    ex-feb23b-5
  nivel: 2
  pista: |-
    Escribe la matriz de la expresión (el coeficiente de $x_iy_j$ es $g_{ij}$) y decide si es definida positiva; mira primero si es simétrica y si algún bloque falla por Sylvester.
  problema:
  - |-
    gram
- id: |-
    ex-feb23a-5
  nivel: 1
  pista: |-
    El coeficiente de $x_iy_j$ en la expresión es justamente $g_{ij}$; lee los nueve coeficientes.
  problema:
  - |-
    gram
- id: |-
    ex-feb22a-5
  nivel: 1
  pista: |-
    Producto estándar en una base nueva: $G'=Q^tQ$ con los vectores de la base por columnas (o calcula los 9 productos $v_i\cdot v_j$).
  problema:
  - |-
    gram
- id: |-
    ex-feb19a-pc
  nivel: 2
  pista: |-
    Fuera de la diagonal $g_{ij}=ij$; en la diagonal tienes la norma al cuadrado, $1+i^2$. Escribe las 16 entradas ordenadamente.
  problema:
  - |-
    gram
- id: |-
    ex-feb18a-5
  nivel: 1
  pista: |-
    Coseno $=\frac{u\cdot v}{\|u\|\|v\|}$ con el producto estándar: tres cálculos y un cociente.
  problema:
  - |-
    medir
- id: |-
    ex-sep22-5
  nivel: 1
  pista: |-
    Escribe $u_1-u_2$ por coordenadas $(1,-1)$ en la base $\{u_1,u_2\}$ y usa $\|x\|^2=X^tGX$ con la $G$ dada.
  problema:
  - |-
    medir
- id: |-
    ex-sep25-6
  nivel: 1
  pista: |-
    $\|x\|^2=X^tGX$ con $X=(1,1,2)$: haz primero $GX$ y luego multiplica por $X^t$. No olvides la raíz.
  problema:
  - |-
    medir
- id: |-
    ex-feb24b-5
  nivel: 2
  pista: |-
    Aplica $X^tGX$, pero antes verifica que $G$ es una matriz de Gram válida: ¿es definida positiva (Sylvester)? Si no, ¿qué puede salir de $X^tGX$?
  problema:
  - |-
    medir
  - |-
    gram
- id: |-
    ex-feb26b-5
  nivel: 1
  pista: |-
    Con $\operatorname{traza}(A^tA)$ la norma al cuadrado es la suma de los cuadrados de las entradas de $A$.
  problema:
  - |-
    medir
- id: |-
    ex-feb26a-5
  nivel: 2
  pista: |-
    Ortogonal quiere decir $E_i\bullet E_j=0$ para todos los pares $i\ne j$ y vectores no nulos. Cuenta cuántos pares hay y calcula $\operatorname{traza}(E_i^tE_j)$ en cada uno.
  problema:
  - |-
    medir
- id: |-
    ex-feb25b-5
  nivel: 2
  pista: |-
    Hay tres pares de funciones: calcula las tres integrales en $[-1,1]$ (ayuda la paridad) y comprueba que ninguna $f_i$ es nula.
  problema:
  - |-
    medir
- id: |-
    ex-sep18a-pc
  nivel: 1
  pista: |-
    Define: ortogonal ($u_i\bullet u_j=0$) más norma 1. Para el ejemplo elige la base canónica de $\mathbb R^2$ o $\mathbb R^3$ y comprueba las dos condiciones.
  problema:
  - |-
    medir
- id: |-
    ex-feb19b-5
  nivel: 2
  pista: |-
    La respuesta es sí y la prueba es constructiva: Gram-Schmidt convierte cualquier base en ortogonal y normalizando en ortonormal. Ilústralo con un caso concreto.
  problema:
  - |-
    gs
- id: |-
    ex-sep19a-5
  nivel: 2
  pista: |-
    Gram-Schmidt sobre los tres vectores, comprobando $e_k\bullet e_i=0$ en cada paso, y normaliza al final.
  problema:
  - |-
    gs
- id: |-
    ex-feb17a-5
  nivel: 2
  pista: |-
    Pasa $U$ a generadores (ecuaciones $x-y=0$, $z-t=0$) y recuerda que los coeficientes de cada ecuación son vectores de $U^\perp$; compara con las opciones.
  problema:
  - |-
    perp
- id: |-
    ex-feb18a-pa
  nivel: 2
  pista: |-
    $V$: sistema homogéneo con los dos vectores por filas. $V^\perp$ es el generado por esos dos vectores (¿qué dimensión tienen $V$ y $V^\perp$ entre los dos?).
  problema:
  - |-
    perp
- id: |-
    ex-sep19a-pb
  nivel: 2
  pista: |-
    Tres ecuaciones homogéneas (una por vector). Escalona: la dimensión es $4-\operatorname{rango}$, y ojo, el rango puede ser menor que 3.
  problema:
  - |-
    perp
- id: |-
    ex-feb22a-pa
  nivel: 2
  pista: |-
    Saca generadores de $U$ y busca $V$ ortogonal a ellos. Después compara dimensiones: ¿suman 3 y $U\cap V=\{0\}$?
  problema:
  - |-
    perp
- id: |-
    ex-sep17a-5
  nivel: 2
  pista: |-
    Los dos generadores ya son ortogonales: proyecta sobre cada uno con $\frac{v\bullet u}{u\bullet u}u$ y suma.
  problema:
  - |-
    proy
- id: |-
    ex-sep25-4
  nivel: 1
  pista: |-
    Comprueba si $(1,1,0)$ y $(0,0,1)$ son ortogonales; si lo son, la proyección es la suma de las proyecciones sobre cada uno.
  problema:
  - |-
    proy
- id: |-
    ex-feb20b-5
  nivel: 2
  pista: |-
    Plano $2x+y-z=0$: su normal es $n=(2,1,-1)$. Proyectar sobre el plano es quitar a $v$ su proyección sobre la normal.
  problema:
  - |-
    proy
- id: |-
    ex-sep24-5
  nivel: 3
  pista: |-
    Comprueba primero si los generadores son ortogonales ($u_1\bullet u_2$ con las raíces). Si lo son, aplica la fórmula con ellos; no hace falta Gram-Schmidt.
  problema:
  - |-
    proy
- id: |-
    ex-propio-1
  nivel: 1
  pista: |-
    Cada producto es $X^tGY$. Calcula $GV$ una vez y reutilízalo; $d(u,v)=\|u-v\|$ usa también $G$.
  problema:
  - |-
    medir
- id: |-
    ex-propio-2
  nivel: 2
  pista: |-
    Los generadores no son ortogonales: ortogonaliza con Gram-Schmidt (o usa la normal de $U$) antes de aplicar la fórmula. El control $v-p\perp U$ te avisa.
  problema:
  - |-
    proy
- id: |-
    ex-propio-3
  nivel: 3
  pista: |-
    Escribe la matriz simétrica y aplica Sylvester a los tres menores; con parámetro en la diagonal secundaria salen desigualdades en $a$. Si falla, busca el vector que lo demuestra.
  problema:
  - |-
    gram
esencial:
  intro: |-
    Si solo tienes un rato, esto es lo que tienes que llevarte. El resto de la página lo desarrolla con ejemplos.
  items:
  - |-
    <b>Producto escalar = simétrico, bilineal y definido positivo.</b> En una base, $x\bullet y=X^tGY$ con $G$ simétrica y definida positiva (Sylvester: todos los $\Delta_k>0$). Para refutar, basta un vector con $x\bullet x\le0$, $x\ne0$.
  - |-
    <b>Todo se mide con el producto:</b> $\|v\|=\sqrt{v\bullet v}$, $\cos=\frac{u\bullet v}{\|u\|\|v\|}$, $u\perp v\iff u\bullet v=0$. La diagonal de $G$ son las <b>normas al cuadrado</b>. Cambio de base: $G'=Q^tGQ$ ($Q$ con los vectores de $B'$ por columnas).
  - |-
    <b>Base ortogonal = comodidad:</b> un sistema ortogonal (vectores no nulos) es libre, y sus coordenadas son $c_i=\frac{x\bullet u_i}{u_i\bullet u_i}$ sin resolver sistemas. Gram-Schmidt convierte cualquier base en ortogonal.
  - |-
    <b>$U^\perp$ y proyección:</b> $U^\perp$ se obtiene con una ecuación $u_i^tGX=0$ por generador y $\dim U^\perp=n-\dim U$. $\operatorname{Proy}_Uv=\sum\frac{v\bullet e_i}{e_i\bullet e_i}e_i$ solo con base <b>ortogonal</b>, y $\|v-\operatorname{Proy}_Uv\|$ es la distancia mínima a $U$.
que_cae_nota: |-
  Cada ejercicio se ha clasificado por su pregunta principal; varios mezclan tipos (por ejemplo, E 5.15 encadena Gram-Schmidt, ortogonal y proyección).
tipos:
- id: |-
    gram
  nombre: |-
    ¿Es producto escalar? Matriz de Gram y cambio de base
  receta: |-
    Escribe la matriz $G$ de la expresión (coeficiente de $x_iy_j$ = $g_{ij}$) y exige simétrica y definida positiva; para cambiar de base usa $G'=Q^tGQ$.
  senal: |-
    El enunciado da una fórmula para $x\bullet y$ y pregunta si es producto escalar, pide la matriz de Gram (de una expresión, de datos geométricos o en otra base) o deja un parámetro que hay que determinar.
  pasos:
  - |-
    Escribe la matriz $G$: el coeficiente de $x_iy_j$ es $g_{ij}$ (o $g_{ij}=e_i\bullet e_j$ si te dan productos de la base).
  - |-
    Comprueba que $G$ es simétrica ($g_{ij}=g_{ji}$); si no, no hay producto escalar.
  - |-
    Comprueba que es definida positiva con Sylvester: todos los menores principales $\Delta_k>0$. Si falla uno, busca un vector $x$ con $x\bullet x\le0$ como testigo.
  - |-
    Si cambias de base, forma $Q$ con los vectores de $B'$ por columnas y calcula $G'=Q^tGQ$ (con el estándar, $G'=Q^tQ$); $\det G'=(\det Q)^2\det G$.
  ejemplo: |-
    $G=\begin{pmatrix}1&a\\a&4\end{pmatrix}$: es simétrica, $\Delta_1=1>0$ y $\Delta_2=4-a^2>0\iff|a|<2$. Cambio de base: con $G=\begin{pmatrix}2&1\\1&1\end{pmatrix}$ y $Q=\begin{pmatrix}1&1\\0&-2\end{pmatrix}$ resulta $Q^tGQ=\begin{pmatrix}2&0\\0&2\end{pmatrix}$.
  fallos: |-
    Creer que «simétrica con diagonal positiva» basta (falta Sylvester) · Escribir $Q^{-1}GQ$ en vez de $Q^tGQ$ · Poner los vectores de $B'$ por filas en $Q$ · Pensar que el determinante de $G$ no cambia al cambiar de base
- id: |-
    medir
  nombre: |-
    Norma, ángulo, distancia y ortogonalidad
  receta: |-
    Todo se mide con $u\bullet v=U^tGV$: $\|v\|=\sqrt{v\bullet v}$, $\cos=\frac{u\bullet v}{\|u\|\|v\|}$, $d=\|u-v\|$ y $u\perp v\iff u\bullet v=0$.
  senal: |-
    Piden una norma, un coseno, una distancia, normalizar un vector, o probar que un sistema es ortogonal u ortonormal (con matrices, polinomios o una $G$ dada).
  pasos:
  - |-
    Identifica el producto: estándar, una $G$ dada (usa $X^tGY$) o una integral/traza.
  - |-
    Calcula los productos que necesites: $u\bullet u$, $v\bullet v$ y $u\bullet v$ (el producto, antes de la raíz).
  - |-
    Aplica la definición: norma con raíz, coseno con el cociente, distancia con $\|u-v\|$; para normalizar divide entre la norma.
  - |-
    Para un sistema ortogonal, comprueba todos los pares $u_i\bullet u_j=0$ con $i\ne j$ y que ningún $u_i$ es nulo; ortonormal si además $\|u_i\|=1$.
  ejemplo: |-
    Con $G=\begin{pmatrix}2&1\\1&1\end{pmatrix}$, $u=(1,0)$, $v=(-1,2)$: $u\bullet v=u^tGv=0$, $\|u\|^2=2$, $\|v\|^2=2$ y $\|u-v\|^2=4$, así que $u\perp v$ y $d(u,v)=2$ (Pitágoras: $2+2=4$).
  fallos: |-
    Usar el producto estándar cuando el enunciado trae $G$ · Dar $v\bullet v$ en lugar de $\sqrt{v\bullet v}$ · Decir «ortogonal» sin comprobar todos los pares ni que no sean nulos · Creer que la diagonal de $G$ son las normas (son las normas al cuadrado)
- id: |-
    perp
  nombre: |-
    Vectores ortogonales a un subespacio y $U^\perp$
  receta: |-
    Cada generador $u_i$ de $U$ da una ecuación homogénea $u_i^tGX=0$ (con el estándar, $u_i\cdot x=0$); $U^\perp$ es su conjunto de soluciones y $\dim U^\perp=n-\dim U$.
  senal: |-
    «Hallar los vectores ortogonales a…», «subespacio ortogonal a $U$», «suplementario ortogonal» o «¿es suplementario?».
  pasos:
  - |-
    Reúne un sistema generador de $U$ (si viene por ecuaciones, esas ecuaciones son generadores de $U^\perp$ con el estándar).
  - |-
    Escribe una ecuación por generador, $u_i^tGX=0$, y forma el sistema homogéneo.
  - |-
    Resuélvelo (escalona): las soluciones son $U^\perp$, con dimensión $n-\operatorname{rango}$.
  - |-
    Para distinguir ortogonal de suplementario: un subespacio $V$ es ortogonal a $U$ si $V\subseteq U^\perp$ y es suplementario solo si además $\dim V=n-\dim U$ (entonces $V=U^\perp$).
  ejemplo: |-
    $U=\langle(1,0,0)\rangle$ con $G=\begin{pmatrix}1&1&0\\1&2&1\\0&1&2\end{pmatrix}$: la fila $u^tG=(1,1,0)$ da $x+y=0$, y $U^\perp=\langle(-1,1,0),(0,0,1)\rangle$, de dimensión $2=3-1$. Con el estándar sería $x=0$.
  fallos: |-
    Usar $u\cdot x=0$ cuando el producto no es el estándar · Contar el número de vectores en vez del rango para la dimensión · Creer que ortogonal implica suplementario (solo $U^\perp$ cumple ambas) · Olvidar que un subespacio contenido en $U^\perp$ también es ortogonal a $U$
- id: |-
    gs
  nombre: |-
    Base ortogonal y ortonormal (Gram-Schmidt) y coordenadas
  receta: |-
    Gram-Schmidt: $e_1=u_1$ y $e_k=u_k-\sum_{i<k}\frac{u_k\bullet e_i}{e_i\bullet e_i}e_i$; después normaliza. Con base ortogonal, $c_i=\frac{x\bullet u_i}{u_i\bullet u_i}$.
  senal: |-
    «Calcular una base ortogonal/ortonormal a partir de…», «¿siempre existe una base ortonormal?», o «coordenadas de un vector en una base ortogonal».
  pasos:
  - |-
    Comprueba que los vectores dados son libres (si no, saldrá algún $e_k=0$).
  - |-
    Toma $e_1=u_1$ y, para cada $k$, resta a $u_k$ su sombra sobre los $e_i$ ya construidos (no sobre los $u_i$ originales).
  - |-
    Control en cada paso: $e_k\bullet e_i=0$ para todo $i<k$. Reescala a enteros si salen fracciones.
  - |-
    Normaliza $e_k'=e_k/\|e_k\|$ si piden base ortonormal; las coordenadas en base ortogonal salen de los cocientes, sin sistemas.
  ejemplo: |-
    Con $u_1=(1,1)$ y $u_2=(1,0)$ en el estándar: $e_1=(1,1)$ y $e_2=(1,0)-\tfrac12(1,1)=(\tfrac12,-\tfrac12)$; se comprueba $e_1\cdot e_2=0$.
  fallos: |-
    Proyectar $u_3$ sobre $u_1,u_2$ originales en vez de sobre $e_1,e_2$ · Usar $c_i=x\bullet u_i$ con una base ortogonal sin normalizar · Aplicar la fórmula de coordenadas a una base que no es ortogonal · Olvidar dividir entre la norma al normalizar
- id: |-
    proy
  nombre: |-
    Proyección ortogonal y distancia mínima
  receta: |-
    Con una base ortogonal $e_i$ de $U$: $\operatorname{Proy}_Uv=\sum\frac{v\bullet e_i}{e_i\bullet e_i}e_i$; la distancia mínima es $\|v-\operatorname{Proy}_Uv\|$.
  senal: |-
    «Proyección ortogonal de $v$ sobre…», «vector de $U$ más próximo a $v$», «mínima distancia», «mejor aproximación».
  pasos:
  - |-
    Mira si los generadores de $U$ son ortogonales; si no, aplica Gram-Schmidt (o, en un plano de $\mathbb R^3$, usa la normal $n$: $\operatorname{Proy}_Uv=v-\frac{v\bullet n}{n\bullet n}n$).
  - |-
    Suma las proyecciones sobre cada vector de la base ortogonal: $\sum\frac{v\bullet e_i}{e_i\bullet e_i}e_i$.
  - |-
    Calcula $w=v-\operatorname{Proy}_Uv$ y comprueba que es ortogonal a los generadores de $U$.
  - |-
    La distancia mínima de $v$ a $U$ es $\|w\|$ (Pitágoras: $\|v\|^2=\|p\|^2+\|w\|^2$).
  ejemplo: |-
    $v=(1,2,3)$, $U=\langle(1,1,0),(1,0,1)\rangle$: ortogonalizo, $e_1=(1,1,0)$, $e_2=(\tfrac12,-\tfrac12,1)$, y $p=\tfrac32e_1+\tfrac53e_2=(\tfrac73,\tfrac23,\tfrac53)$; $v-p$ es ortogonal a $e_1$ y $e_2$ y $d(v,U)=\tfrac{4\sqrt3}{3}$.
  fallos: |-
    Sumar las proyecciones sobre generadores que no son ortogonales (el control $v-p\perp U$ falla) · Aplicar la fórmula sin haber ortogonalizado · Olvidar la raíz al dar la distancia · Confundir $\operatorname{Proy}_Uv$ con $v-\operatorname{Proy}_Uv$
quiz:
- p: |-
    ¿Define $G=\begin{pmatrix}1&2\\2&3\end{pmatrix}$ un producto escalar en $\mathbb R^2$?
  opciones:
  - t: |-
      Sí: es simétrica y los elementos de la diagonal son positivos.
    ok: false
    why: |-
      Son condiciones necesarias, no suficientes: falta la definida positiva ($\Delta_2$).
  - t: |-
      No: $\Delta_2=\det G=-1<0$, y por ejemplo $x=(2,-1)$ da $x\bullet x=-1$.
    ok: true
  - t: |-
      Sí, porque su determinante no es cero.
    ok: false
    why: |-
      Que $\det G\ne0$ no basta: tiene que ser positivo (y también $\Delta_1>0$).
  - t: |-
      No, porque no es simétrica.
    ok: false
    why: |-
      Sí es simétrica ($g_{12}=g_{21}=2$); lo que falla es la positividad.
  fb: |-
    $\Delta_1=1>0$ pero $\Delta_2=3-4=-1<0$. Un testigo: $x=(2,-1)$ da $4-8+3=-1<0$.
- p: |-
    Con $G=\begin{pmatrix}4&1\\1&9\end{pmatrix}$ en la base canónica, ¿cuánto vale $\|e_1+e_2\|$?
  opciones:
  - t: |-
      $\sqrt{13}$
    ok: false
    why: |-
      Has sumado $4+9$ y has ignorado $2\,e_1\bullet e_2=2$: solo valdría si $e_1\perp e_2$ (aquí $g_{12}=1\ne0$).
  - t: |-
      $\sqrt{15}$
    ok: true
  - t: |-
      $5$
    ok: false
    why: |-
      Has sumado las normas $2+3$. La norma no es aditiva: solo lo es el cuadrado, y únicamente si los vectores son ortogonales.
  - t: |-
      $\sqrt2$
    ok: false
    why: |-
      Es la norma con el producto estándar; el enunciado trae una $G$ distinta.
  fb: |-
    $\|e_1+e_2\|^2=(1,1)G(1,1)^t=4+1+1+9=15$, luego la norma es $\sqrt{15}$.
- p: |-
    $B=\{(1,1,0),(1,-1,0),(0,0,2)\}$ es base ortogonal de $\mathbb R^3$ (estándar). ¿Cuáles son las coordenadas de $x=(3,1,4)$ en $B$?
  opciones:
  - t: |-
      $(4,2,8)$
    ok: false
    why: |-
      Has usado $c_i=x\bullet u_i$ sin dividir entre $u_i\bullet u_i$; solo vale con base ortonormal.
  - t: |-
      $(2,1,2)$
    ok: true
  - t: |-
      $(3,1,4)$
    ok: false
    why: |-
      Esas son las coordenadas en la base canónica, no en $B$.
  - t: |-
      $(1,2,1)$
    ok: false
    why: |-
      Parece un cálculo cambiando el orden de los vectores; recuerda $c_i=\frac{x\bullet u_i}{u_i\bullet u_i}$ con $u_i$ en el orden dado.
  fb: |-
    $c_1=\frac{3+1}{2}=2$, $c_2=\frac{3-1}{2}=1$, $c_3=\frac{8}{4}=2$, y $2(1,1,0)+(1,-1,0)+2(0,0,2)=(3,1,4)$.
- p: |-
    Sea $v=(1,2,3)$ y $U=\langle(1,1,0),(1,0,1)\rangle$ en $\mathbb R^3$ (estándar). ¿Cuánto vale $\operatorname{Proy}_Uv$?
  opciones:
  - t: |-
      $\left(\tfrac72,\tfrac32,2\right)$
    ok: false
    why: |-
      Has sumado las proyecciones sobre cada generador, pero no son ortogonales ($(1,1,0)\cdot(1,0,1)=1\ne0$). El control falla: $v-p\not\perp U$.
  - t: |-
      $\left(\tfrac73,\tfrac23,\tfrac53\right)$
    ok: true
  - t: |-
      $\left(\tfrac32,\tfrac32,0\right)$
    ok: false
    why: |-
      Es la proyección sobre un solo generador, $(1,1,0)$, no sobre el plano $U$.
  - t: |-
      $(1,2,3)$
    ok: false
    why: |-
      Eso diría que $v\in U$, y no lo es: $v$ no es combinación de los dos generadores.
  fb: |-
    Ortogonalizando: $e_1=(1,1,0)$, $e_2=(\tfrac12,-\tfrac12,1)$, y $p=\tfrac32e_1+\tfrac53e_2=(\tfrac73,\tfrac23,\tfrac53)$; $v-p$ es ortogonal a ambos generadores.
- p: |-
    En $\mathbb R^5$ (estándar), $U=\langle u_1,u_2,u_3\rangle$ con $\operatorname{rango}\{u_1,u_2,u_3\}=2$. ¿Qué dimensión tiene $U^\perp$?
  opciones:
  - t: |-
      $2$
    ok: false
    why: |-
      Has confundido $\dim U$ con $\dim U^\perp$ (o has restado mal). Se cumple $\dim U^\perp=n-\dim U$.
  - t: |-
      $3$
    ok: true
  - t: |-
      $5$
    ok: false
    why: |-
      Es la dimensión de todo el espacio; $U^\perp$ es un subespacio propio porque $U\ne\{0\}$.
  - t: |-
      $0$
    ok: false
    why: |-
      Solo ocurriría si $U=\mathbb R^5$.
  fb: |-
    $\dim U=\operatorname{rango}=2$ (no el número de generadores), así que $\dim U^\perp=5-2=3$.
- p: |-
    Dos matrices $G$ y $G'$ son las de un mismo producto escalar en bases distintas, con $G'=Q^tGQ$, $\det G=2$ y $\det Q=3$. ¿Cuánto vale $\det G'$?
  opciones:
  - t: |-
      $2$
    ok: false
    why: |-
      Eso sería una semejanza ($Q^{-1}GQ$), que conserva el determinante; la congruencia no.
  - t: |-
      $6$
    ok: false
    why: |-
      Has multiplicado $\det G\cdot\det Q$; hay que contar $Q$ y $Q^t$: $(\det Q)^2$.
  - t: |-
      $18$
    ok: true
  - t: |-
      $\tfrac29$
    ok: false
    why: |-
      Has dividido en vez de multiplicar: $\det G'=(\det Q)^2\det G$.
  fb: |-
    $\det(Q^tGQ)=\det Q^t\cdot\det G\cdot\det Q=3\cdot2\cdot3=18$.
