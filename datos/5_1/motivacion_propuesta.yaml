motivacion:
  s1: |-
    En $\mathbb R^2$ sabes que $(1,2)$ y $(2,-1)$ son perpendiculares porque $1\cdot2+2\cdot(-1)=0$. ¿Qué propiedades mínimas tiene que cumplir una «operación de multiplicar vectores» para medir longitudes y ángulos como lo hace esta?
  s2: |-
    En un espacio vectorial abstracto no hay una «fórmula» obvia para multiplicar dos vectores. ¿Cómo guardar en una pequeña tabla de números todo un producto escalar, de modo que bastaran las coordenadas para calcularlo?
  s3: |-
    Con un producto escalar ya puedes decidir si $(1,0)$ y $(-1,2)$ son perpendiculares, pero ¿perpendiculares con qué regla de medir? ¿Cómo se definen longitud, distancia y ángulo usando solo el producto, y qué garantiza que el coseno nunca se pase de $1$?
  s4: |-
    Si en un sistema de vectores todos son perpendiculares entre sí, sacar las coordenadas de un vector en esa base es casi inmediato, sin resolver sistemas. ¿Por qué ocurre y cuándo basta la perpendicularidad para asegurar que son independientes?
  s5: |-
    Te dan una base cualquiera de $\mathbb R^3$, torcida y desigual, y necesitas otra con los mismos vectores «en espíritu» pero perpendiculares y de longitud $1$. ¿Cómo se endereza paso a paso, vector a vector?
  s6: |-
    ¿Cuál es el punto de un plano que está más cerca de un punto exterior $v$? Si dejas caer una plomada desde $v$, ¿dónde cae, y cómo se calcula esa «sombra» y la distancia sin probar puntos uno a uno?
consignas:
  - animacion: |-
      el mismo par de vectores, distintos productos
    consigna: |-
      Con el caso «Propio: (2,1,1) con u ⟂ v» mira el ángulo que da el programa para $(1,0)$ y $(-1,2)$ y compáralo con el dibujo, y luego cambia $a$, $b$, $c$ de $G$. Fíjate en cómo cambian las normas y el ángulo aunque las coordenadas sean las mismas.
    pregunta: |-
      ¿Por qué los mismos vectores pueden ser perpendiculares con un producto y no con otro? ¿Qué te dice el vector testigo en «No definida positiva»?
  - animacion: |-
      Gram-Schmidt paso a paso
    consigna: |-
      Avanza con «Siguiente» desde el Ejemplo 5.21 y observa en cada paso qué se resta a $u_2$ y a $u_3$ y con qué ángulo queda el resto respecto a lo construido. Después prueba «Dependiente (falla)».
    pregunta: |-
      ¿Qué le pasa a Gram-Schmidt cuando los vectores son dependientes, y en qué paso se nota?
  - animacion: |-
      proyección sobre una recta
    consigna: |-
      Cambia $v$ y $d$ y fíjate en el segmento rojo respecto de la recta. Luego mueve el deslizador $\alpha$ y observa cómo varía la distancia del punto morado a $v$.
    pregunta: |-
      ¿En qué valor de $\alpha$ es mínima la distancia, y qué ángulo forma entonces el segmento con la recta?
  - animacion: |-
      proyección sobre un plano y distancia mínima
    consigna: |-
      Mueve los deslizadores $\alpha$ y $\beta$ para recorrer puntos $q$ del plano y fíjate en la distancia de $q$ a $v$ y en el residuo rojo. Compara con la recta gris $U^\perp$.
    pregunta: |-
      ¿Puedes encontrar algún punto del plano más cerca de $v$ que la proyección $p$? ¿Qué dirección tiene el residuo respecto del plano?
