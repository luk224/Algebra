motivacion:
  s1: |-
    Para llegar a cualquier punto del plano basta con dos «direcciones» bien elegidas, pero tres ya son demasiadas y una sola se queda corta. ¿Qué propiedades debe cumplir una lista de vectores para ser ni corta ni sobrada, y por qué no hay una única lista que sirva?
  s2: |-
    En un mapa puedes dar un punto como «2 calles al este y 1 al norte», pero si las calles están inclinadas esos mismos números señalan otro sitio. ¿Cómo cambian los números que describen un mismo vector cuando cambias de «papel milimetrado»?
  s3: |-
    Una base del plano tiene siempre 2 vectores y una de $\mathbb R^3$ siempre 3, pero ¿se podría construir otra base de $\mathbb R^3$ con 2 o con 4 vectores? ¿Qué te asegura que el número de vectores no depende de la base que elijas?
  s4: |-
    Te dan cuatro vectores de $\mathbb R^4$ y te piden decidir si forman una base, cuántos de ellos aportan algo nuevo o cómo completar dos vectores hasta una base. ¿Existe un procedimiento mecánico que resuelva las tres preguntas a la vez?
consignas:
  - animacion: |-
      Interactivo: coordenadas en la base
    consigna: |-
      Mueve $x$ e $y$ y fíjate en cómo cambian $(\alpha,\beta)$, apoyándote en la cuadrícula inclinada de la base $\{u,v\}$. Después prueba a poner $u$ y $v$ paralelos.
    pregunta: |-
      ¿Por qué un mismo punto tiene números distintos en cada base, y qué pasa con las coordenadas cuando $u$ y $v$ son paralelos?
  - animacion: |-
      completar a una base paso a paso
    consigna: |-
      Pulsa «Siguiente» y fíjate en qué columnas del escalonado quedan sin pivote y qué vectores $e_j$ se añaden. Luego cambia los vectores en «✎» y repite.
    pregunta: |-
      ¿Cuántos vectores hay que añadir y cómo lo anticipas mirando solo la dimensión del espacio y el número de vectores dados?
  - animacion: |-
      dimensión y base de
    consigna: |-
      Avanza con «Siguiente» hasta que aparezcan filas nulas y observa cuántas filas no nulas quedan. Cambia después un vector en «✎» por otro independiente de los demás.
    pregunta: |-
      ¿Qué relación hay entre las filas nulas que salen al escalonar y los vectores que sobraban en $S$?
  - animacion: |-
      ¿es $S$ base de $\mathbb R^3$?
    consigna: |-
      Mira primero la comparación entre el número de vectores y la dimensión, y luego el determinante calculado al escalonar. Repite un vector en «✎» y observa el resultado.
    pregunta: |-
      ¿Qué le ocurre al determinante cuando un vector es combinación de los otros, y qué dice eso sobre ser base?
