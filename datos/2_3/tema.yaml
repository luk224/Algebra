  Módulo 2 · Espacios vectoriales · Tema 2.3
h1: |-
  Bases. Dimensión. Coordenadas
resumen: |-
  Una <b>base</b> es el sistema de generadores «sin vectores sobrantes»: con ella cada vector se escribe de <b>una única</b> manera (sus <b>coordenadas</b>) y el número de vectores que tiene es una propiedad del espacio, su <b>dimensión</b>. Aprenderás a decidir si un sistema es base, a calcular coordenadas, a hallar la dimensión de un subespacio con un rango y a completar o reducir un sistema hasta una base.
