    texto: |-
      X Sept. 2017 (A)
  problema:
  - propiedades
  - neutro
  - simetrico
  nivel: 2
  titulo: |-
    Feb. 2019 (tipo A), ejercicio 2 · Sept. 2017 (tipo A), problema a) — la operación $(x_1y_1,\ x_2+y_2)$ en $\mathbb R^+\times\mathbb R$
  enunciado: |-
    <b>Feb. 2019:</b> En el conjunto $V=\{(x_1,x_2)\mid x_1\in\mathbb R^+,\ x_2\in\mathbb R\}$ y considerando la operación interna definida por $(x_1,x_2)\ast(y_1,y_2)=(x_1y_1,\ x_2+y_2)$, razonar si se cumplen o no las propiedades: asociativa, elemento neutro y conmutativa. <b>Sept. 2017</b> (2 puntos): lo mismo, pidiendo además el <b>elemento simétrico</b>.
  pista: |-
    Empieza comprobando que el resultado de operar sigue en $V$. Luego sigue el orden: asociativa, neutro (despejando $e$), simétrico (usando ese $e$) y conmutativa; y no olvides comprobar que $e$ y el simétrico pertenecen a $V$.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Decidir S1, S2, S3 y S4 para $(x_1,x_2)\ast(y_1,y_2)=(x_1y_1,\,x_2+y_2)$ en $V=\mathbb R^+\times\mathbb R$.
      - - |-
          Qué se usa
        - |-
          <b>Propiedades S1–S4</b> (U p.58): asociativa, neutro $e$, simétrico $u'$ con $u\ast u'=e$, conmutativa — <a href="#s2">ver teoría</a>.
      - - |-
          Plan
        - |-
          Cierre; S1 desarrollando los dos miembros; S2 despejando $e$; S3 con ese $e$; S4 comparando los dos órdenes.
  - redaccion:
    - |-
      <b>Operación interna.</b> Si $x_1>0$ e $y_1>0$, entonces $x_1y_1>0$ y $x_2+y_2\in\mathbb R$: el resultado está en $V$.
    - |-
      <b>Asociativa (S1).</b> Con $u=(x_1,x_2)$, $v=(y_1,y_2)$, $w=(z_1,z_2)$:
            $$\begin{aligned}(u\ast v)\ast w&=(x_1y_1,\,x_2+y_2)\ast(z_1,z_2)\\&=\big((x_1y_1)z_1,\ (x_2+y_2)+z_2\big),\end{aligned}$$
            $$\begin{aligned}u\ast(v\ast w)&=(x_1,x_2)\ast(y_1z_1,\,y_2+z_2)\\&=\big(x_1(y_1z_1),\ x_2+(y_2+z_2)\big).\end{aligned}$$
            Coinciden por la asociatividad del producto y de la suma en $\mathbb R$. <b>Se cumple.</b>
    - |-
      <b>Neutro (S2).</b> Se impone $u\ast e=u$ con $e=(e_1,e_2)$:
            $$(x_1e_1,\ x_2+e_2)=(x_1,x_2)\ \Rightarrow\ \begin{cases}x_1e_1=x_1\ \Rightarrow\ e_1=1\\[2pt] x_2+e_2=x_2\ \Rightarrow\ e_2=0.\end{cases}$$
            $e=(1,0)$ no depende de $u$, está en $V$ ($1>0$) y vale por la izquierda: $(1,0)\ast(x_1,x_2)=(x_1,x_2)$. <b>Se cumple, con $e=(1,0)$.</b>
    - |-
      <b>Simétrico (S3; solo Sept. 2017).</b> Se resuelve $u\ast u'=e$:
            $$(x_1x_1',\ x_2+x_2')=(1,0)\ \Rightarrow\ \begin{cases}x_1'=\dfrac1{x_1}\\[4pt] x_2'=-x_2.\end{cases}$$
            Como $x_1>0$, $\frac1{x_1}>0$ y $u'\in V$; además $u'\ast u=(\frac1{x_1}x_1,\,-x_2+x_2)=(1,0)$. <b>Se cumple:</b> el simétrico de $(x_1,x_2)$ es $\big(\frac1{x_1},\,-x_2\big)$.
    - |-
      <b>Conmutativa (S4).</b>
            $$\begin{aligned}(x_1,x_2)\ast(y_1,y_2)&=(x_1y_1,\,x_2+y_2)\\(y_1,y_2)\ast(x_1,x_2)&=(y_1x_1,\,y_2+x_2)\end{aligned}$$
            Coinciden por la conmutatividad en $\mathbb R$. <b>Se cumple.</b>
    - |-
      <b>Conclusión.</b> Se cumplen las cuatro propiedades: $(V,\ast)$ es un <b>grupo conmutativo</b>.
  - comentarios:
    - |-
      En Feb. 2019 solo se pide S1, S2 y S4 (no el simétrico).
    - |-
      Comprobación numérica: $(2,3)\ast(4,5)=(8,8)$; el simétrico de $(2,3)$ es $(\frac12,-3)$ y $(2,3)\ast(\frac12,-3)=(1,0)$.
    - |-
      Por qué sale todo tan limpio: $(x_1,x_2)\mapsto(\ln x_1,\,x_2)$ convierte la operación en la suma ordinaria de $\mathbb R^2$ (neutro = «cero» porque $\ln1=0$; simétrico = «opuesto»). Si $V$ incluyera $x_1\le0$ fallarían el cierre o el simétrico.
    - |-
      Orden recomendado: cierre, S1, S2, S3 (con ese $e$), S4; en S2 y S3 comprobar siempre que $e$ y $u'$ están en $V$.
  - receta: |-
      (1) cierre; (2) asociativa: desarrolla los dos miembros por separado; (3) neutro: despeja $e$ de $u\ast e=u$ y comprueba que no depende de $u$, que está en $V$ y que vale por la izquierda; (4) simétrico: resuelve $u\ast u'=e$ con <b>ese</b> $e$ y comprueba $u'\in V$; (5) conmutativa: compara $u\ast v$ y $v\ast u$.
  - error: |-
      dar $(0,0)$ como neutro «porque el neutro es el cero» ($(0,0)\notin V$ y $(x_1,x_2)\ast(0,0)=(0,x_2)\neq(x_1,x_2)$), o $(-x_1,-x_2)$ como simétrico ($-x_1<0$ no está en $V$ y $(x_1,x_2)\ast(-x_1,-x_2)=(-x_1^2,0)\neq(1,0)$); y olvidar comprobar que $1/x_1>0$.
- id: ex-feb20a
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Ene. 2020 (tipo A), ejercicio 2
    texto: |-
      X Ene. 2020 (A)
  problema:
  - propiedades
  - neutro
  - simetrico
  nivel: 3
  titulo: |-
    Ene. 2020 (tipo A), ejercicio 2 — la operación $a\diamond b=ab-b+a$ en $\mathbb R$
  enunciado: |-
    Estudiar si la operación $\diamond$ definida en el conjunto de los números reales $\mathbb R$, mediante $a\diamond b=a\cdot b-b+a$, verifica las propiedades: asociativa, conmutativa, elemento neutro y elemento simétrico.
  pista: |-
    La operación no es simétrica en $a$ y $b$, así que sospecha de lo que depende del orden. En el neutro, plantea las dos ecuaciones ($a\diamond e=a$ y $e\diamond a=a$) y mira si tienen una solución común.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Decidir si $a\diamond b=ab-b+a$ en $\mathbb R$ es asociativa, conmutativa, con neutro y con simétrico.
      - - |-
          Qué se usa
        - |-
          <b>Propiedades S1–S4</b> (U p.58): el neutro exige $a\ast e=e\ast a=a$ y el simétrico se define con él — <a href="#s2">ver teoría</a>.
      - - |-
          Plan
        - |-
          Contraejemplo numérico para S4 y S1; para S2 las dos ecuaciones ($a\diamond e=a$ y $e\diamond a=a$); S3 depende de S2.
  - redaccion:
    - |-
      <b>Conmutativa (S4).</b>
            $$a\diamond b-b\diamond a=(ab-b+a)-(ba-a+b)=2a-2b.$$
            Contraejemplo ($a=2$, $b=3$):
            $$\begin{aligned}2\diamond3&=2\cdot3-3+2=5\\3\diamond2&=3\cdot2-2+3=7\end{aligned}$$
            Como $5\neq7$, <b>no se cumple.</b>
    - |-
      <b>Asociativa (S1).</b>
            $$\begin{aligned}(a\diamond b)\diamond c&=(ab-b+a)\,c-c+(ab-b+a)\\&=abc-bc+ac-c+ab-b+a,\end{aligned}$$
            $$\begin{aligned}a\diamond(b\diamond c)&=a(bc-c+b)-(bc-c+b)+a\\&=abc-ac+ab-bc+c-b+a.\end{aligned}$$
            Su diferencia es $2ac-2c=2c\,(a-1)\neq0$ en general. Contraejemplo con $a=b=c=2$:
            $$\begin{aligned}2\diamond2&=4-2+2=4\\(2\diamond2)\diamond2&=4\diamond2=8-2+4=10\\2\diamond(2\diamond2)&=2\diamond4=8-4+2=6\end{aligned}$$
            Como $10\neq6$, <b>no se cumple.</b>
    - |-
      <b>Neutro (S2).</b> Debe cumplirse $a\diamond e=a$ y $e\diamond a=a$ para todo $a$.
            <ul>
              <li><i>Por la derecha:</i> $a\diamond e=ae-e+a=a\iff e(a-1)=0$ para todo $a$ $\iff e=0$; y $a\diamond0=a$ ✓.</li>
              <li><i>Por la izquierda:</i> con $e=0$, $0\diamond a=-a\neq a$ si $a\neq0$ (por ejemplo, $0\diamond1=-1\neq1$).</li>
            </ul>
            Las dos igualdades no se cumplen a la vez: <b>no existe elemento neutro</b>.
    - |-
      <b>Simétrico (S3).</b> Se define mediante el neutro ($a\diamond a'=a'\diamond a=e$); al no haber neutro, <b>no existe elemento simétrico</b>.
    - |-
      <b>Conclusión.</b> La operación no verifica ninguna de las cuatro propiedades.
  - comentarios:
    - |-
      Orientación numérica: $2\diamond3=6-3+2=5$. El conjunto es $\mathbb R$, así que el cierre es evidente.
    - |-
      Estrategia: la operación no es simétrica en $a$ y $b$, por lo que lo normal es que fallen las propiedades que dependen del orden.
    - |-
      Por la izquierda, $e\diamond a=a\iff e=\frac{2a}{a+1}$, que depende de $a$: no hay $e$ común. Solo existe neutro por la derecha, $e=0$.
  - receta: |-
      conmutativa → calcula $a\diamond b-b\diamond a$; asociativa → desarrolla los dos miembros, resta y da un contraejemplo numérico; neutro → resuelve <b>las dos</b> ecuaciones ($a\diamond e=a$ y $e\diamond a=a$) y exige una solución común, independiente de $a$; simétrico → solo si hay neutro. Toda negación, con números concretos y la cuenta escrita.
  - error: |-
      comprobar solo $a\diamond e=a$, encontrar $e=0$ y declarar que «$0$ es el neutro». En una operación <b>no conmutativa</b> hay que mirar los dos lados.
