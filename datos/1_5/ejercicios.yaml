- id: ej2-1
  clase: libro
  titulo: |-
    Ejercicio 2.1 — el neutro de $(a,b)\ast(c,d)=(ac,\,b+d)$ en $\{(a,b):a>0\}$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 2.1, p. 46
    texto: |-
      E p.46
  cuerpo:
  - enun: |-
      Si $V=\{(a,b)\in\mathbb R^2\mid a>0\}$ y $(a,b)\ast(c,d)=(ac,\,b+d)$, el elemento neutro de $(V,\ast)$ verifica: A) Es $(0,0)$. B) Existe y pertenece a $V$. C) No existe.
  - html: |-
      <div class="box intu"><span class="h">Qué se pide</span><p>Averiguar <b>cuál</b> es el neutro de <b>esta</b> operación (no el de la suma de siempre) y comprobar si está dentro de $V$.</p></div>
  - pasos:
    - |-
      <b>Planteo.</b> Un neutro $(c,d)$ debe cumplir $(a,b)\ast(c,d)=(a,b)$ para <b>todo</b> $(a,b)\in V$. Por la definición, $(a,b)\ast(c,d)=(ac,\,b+d)$.
    - |-
      <b>Se iguala componente a componente:</b> $ac=a$ y $b+d=b$. Como $a>0$ se puede dividir entre $a$: $c=1$; y $d=0$.
    - |-
      <b>Candidato:</b> $(1,0)$. No depende de $(a,b)$ ✓ y está en $V$ porque $1>0$ ✓.
    - |-
      <b>Por el otro lado:</b> $(1,0)\ast(a,b)=(1\cdot a,\,0+b)=(a,b)$ ✓.
    - |-
      <b>A) Falsa:</b> $(0,0)\notin V$ (su primera coordenada no es $>0$) y además $(a,b)\ast(0,0)=(0,b)\neq(a,b)$. <b>B) Verdadera:</b> el neutro es $(1,0)\in V$. <b>C) Falsa</b> (existe).
  - receta: |-
      para hallar el neutro, escribe $a\ast e=a$ con $e$ desconocido, <b>despeja</b> $e$ componente a componente, y comprueba (i) que no depende de $a$, (ii) que está en el conjunto, (iii) que vale por el otro lado.
- id: ej2-3
  clase: libro
  titulo: |-
    Ejercicio 2.3 — $(x_1y_1,\,x_2+y_2)$ en $\mathbb R^+\times\mathbb R$: asociativa, neutro, simétrico, grupo conmutativo
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 2.3, p. 48
    texto: |-
      E p.48
  cuerpo:
  - enun: |-
      El conjunto $V=\{(x_1,x_2)\mid x_1\in\mathbb R^+,\ x_2\in\mathbb R\}$ con la operación $(x_1,x_2)\ast(y_1,y_2)=(x_1y_1,\,x_2+y_2)$ verifica: A) Es asociativo. B) Existe elemento neutro. C) Todo elemento tiene un simétrico. D) Es grupo conmutativo.
  - html: |-
      <p>Es <b>exactamente la misma operación</b> que en los exámenes de Feb. 2019 y Sept. 2017. Se resuelve completa, con todos los pasos, en <a href="#ex-prodsuma">§6 (Feb. 2019 y Sept. 2017)</a>; el resultado es: <b>A, B, C y D son verdaderas</b>, con neutro $(1,0)$ y simétrico de $(x_1,x_2)$ igual a $(1/x_1,\,-x_2)$.</p>
- id: ej2-4
  clase: libro
  titulo: |-
    Ejercicio 2.4 — $x\ast y=xy+1$ en $\mathbb Z$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 2.4, p. 49
    texto: |-
      E p.49
  cuerpo:
  - enun: |-
      Se pide comprobar si la operación $x\ast y=xy+1$ en el conjunto de los números enteros $\mathbb Z$ verifica alguna de las propiedades: A) Asociativa. B) Existe elemento neutro. C) Conmutativa. D) Se puede definir en MAXIMA… (D, sobre Maxima, queda fuera de examen; se omite).
  - html: |-
      <div class="box intu"><span class="h">Qué se pide</span><p>Para cada propiedad, decir si se cumple <b>siempre</b> (con demostración) o si falla (con contraejemplo). La operación es interna: $xy+1$ es entero si $x,y$ lo son.</p></div>
  - pasos:
    - |-
      <b>A) Asociativa.</b> Se desarrollan los dos miembros por separado: $(x\ast y)\ast z=(xy+1)\ast z=(xy+1)z+1=xyz+z+1$ y $x\ast(y\ast z)=x\ast(yz+1)=x(yz+1)+1=xyz+x+1$. Difieren en $z-x$: no coinciden en general. <b>Contraejemplo:</b> $x=y=0,\ z=1$: $(0\ast0)\ast1=1\ast1=2$ pero $0\ast(0\ast1)=0\ast1=1$. <b>Falsa.</b>
    - |-
      <b>B) Neutro.</b> Se despeja $e$ de $x\ast e=x$: $xe+1=x\iff e=\dfrac{x-1}{x}$. <b>Depende de $x$</b> (para $x=2$ sale $\frac12$, que ni siquiera es entero; para $x=0$ no hay solución, pues $0\cdot e+1=1\neq0$). No existe un $e$ válido para todos. <b>Falsa.</b>
    - |-
      <b>C) Conmutativa.</b> $x\ast y=xy+1=yx+1=y\ast x$ por la conmutatividad del producto en $\mathbb Z$. <b>Verdadera.</b>
  - resultado: |-
      solo es conmutativa. Como no es asociativa ni tiene neutro, tampoco es grupo.
  - receta: |-
      asociativa → desarrolla los dos miembros y resta; si la diferencia no es $0$ en general, busca valores que no la anulen (aquí $z-x\neq0$). Neutro → despeja $e$; si queda en función de $x$, no hay neutro.
- id: ej2-5
  clase: libro
  titulo: |-
    Ejercicio 2.5 — $(U,+)$ con $x_1x_2=0$ no es subgrupo de $(\mathbb R^2,+)$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 2.5, p. 50
    texto: |-
      E p.50
  cuerpo:
  - enun: |-
      Demostrar que $(U,+)$ no es subgrupo de $(\mathbb R^2,+)$ si $U=\{(x_1,x_2)\mid x_1x_2=0\}\subset\mathbb R^2$.
  - html: |-
      <div class="box intu"><span class="h">Qué se pide</span><p>Subgrupo = subconjunto que, con la misma suma, vuelve a ser grupo. Para <b>negar</b> que lo es basta con que <b>falle una</b> condición: aquí fallará el cierre (la suma de dos elementos de $U$ se sale de $U$).</p></div>
  - pasos:
    - |-
      <b>Quién es $U$.</b> Los pares con alguna coordenada nula: los dos ejes coordenados (la «cruz»).
    - |-
      <b>Comprobación del neutro (no basta, pero conviene):</b> $(0,0)\in U$, pues $0\cdot0=0$. Es condición <b>necesaria</b>, no suficiente.
    - |-
      <b>Cierre.</b> Si $(x_1,x_2),(y_1,y_2)\in U$ (es decir $x_1x_2=0$ y $y_1y_2=0$), la suma es $(x_1+y_1,\,x_2+y_2)$ y su producto de coordenadas es
            $$\begin{aligned}(x_1+y_1)(x_2+y_2)&=x_1x_2+x_1y_2\\&\quad+y_1x_2+y_1y_2\\&=x_1y_2+y_1x_2,\end{aligned}$$
            que no tiene por qué ser $0$.
    - |-
      <b>Contraejemplo.</b> $(1,0)\in U$ ($1\cdot0=0$) y $(0,2)\in U$ ($0\cdot2=0$), pero su suma $(1,2)\notin U$ porque $1\cdot2=2\neq0$. Luego la suma no es una operación interna de $U$.
  - html: |-
      <p><b>Conclusión:</b> $(U,+)$ no es subgrupo (ni, por tanto, subespacio) de $(\mathbb R^2,+)$.</p>
  - receta: |-
      para refutar que un subconjunto sea subgrupo, busca <b>un</b> par de elementos del subconjunto cuya suma se salga (cierre), o un elemento sin simétrico dentro, o que no contenga al neutro.
- id: ex-prodsuma
  clase: examen
  titulo: |-
    Feb. 2019 (tipo A), ejercicio 2 · Sept. 2017 (tipo A), problema a) — la operación $(x_1y_1,\ x_2+y_2)$ en $\mathbb R^+\times\mathbb R$
  fuentes:
  - l: X
    ref: |-
      Feb. 2019 (tipo A), ejercicio 2
    texto: |-
      X Feb. 2019 (A)
  - l: X
    ref: |-
      Sept. 2017 (tipo A), problema a)
    texto: |-
      X Sept. 2017 (A)
  cuerpo:
  - enun: |-
      <b>Feb. 2019:</b> En el conjunto $V=\{(x_1,x_2)\mid x_1\in\mathbb R^+,\ x_2\in\mathbb R\}$ y considerando la operación interna definida por $(x_1,x_2)\ast(y_1,y_2)=(x_1y_1,\ x_2+y_2)$, razonar si se cumplen o no las propiedades: asociativa, elemento neutro y conmutativa. <b>Sept. 2017</b> (2 puntos): lo mismo, pidiendo además el <b>elemento simétrico</b>.
  - html: |-
      <div class="box intu"><span class="h">Qué se pide</span>
          <p>Un conjunto de pares $(x_1,x_2)$ en el que la primera coordenada es positiva, y una operación que <b>multiplica</b> las primeras coordenadas y <b>suma</b> las segundas. Hay que decidir S1 (asociativa), S2 (neutro), S3 (simétrico, solo en Sept. 2017) y S4 (conmutativa), <b>razonando cada una</b>. Prueba numérica para orientarte: $(2,3)\ast(4,5)=(8,8)$.</p></div>
  - pasos:
    - |-
      <b>¿La operación es interna?</b> Si $x_1>0$ e $y_1>0$, entonces $x_1y_1>0$; y $x_2+y_2\in\mathbb R$. El resultado está en $V$. <i>Por qué:</i> sin cierre no hay estructura que estudiar.
    - |-
      <b>Asociativa (S1).</b> Con $u=(x_1,x_2)$, $v=(y_1,y_2)$, $w=(z_1,z_2)$:
            $$\begin{aligned}(u\ast v)\ast w&=(x_1y_1,\,x_2+y_2)\\&\quad\ast(z_1,z_2)\\&=\big((x_1y_1)z_1,\\&\quad (x_2+y_2)+z_2\big),\end{aligned}$$
            $$\begin{aligned}u\ast(v\ast w)&=(x_1,x_2)\\&\quad\ast(y_1z_1,\,y_2+z_2)\\&=\big(x_1(y_1z_1),\\&\quad x_2+(y_2+z_2)\big).\end{aligned}$$
            Coinciden componente a componente por la asociatividad del producto y de la suma en $\mathbb R$. <b>Se cumple.</b>
    - |-
      <b>Neutro (S2).</b> Se <b>despeja</b> $e=(e_1,e_2)$ de $u\ast e=u$:
            $$(x_1e_1,\ x_2+e_2)=(x_1,x_2)$$
            <b>Se igualan las coordenadas, una a una</b> (en la primera se divide entre $x_1>0$):
            $$\begin{cases}x_1e_1=x_1\ \Rightarrow\ e_1=1\\[2pt] x_2+e_2=x_2\ \Rightarrow\ e_2=0.\end{cases}$$
            El candidato $e=(1,0)$ <b>no depende de $u$</b>, <b>está en $V$</b> ($1>0$) y <b>vale por la izquierda</b>: $(1,0)\ast(x_1,x_2)=(1\cdot x_1,\,0+x_2)=(x_1,x_2)$. <b>Se cumple, con $e=(1,0)$.</b>
    - |-
      <b>Simétrico (S3; solo Sept. 2017).</b> Con el neutro ya hallado se resuelve $u\ast u'=e$:
            $$(x_1x_1',\ x_2+x_2')=(1,0)$$
            $$\begin{cases}x_1x_1'=1\ \Rightarrow\ x_1'=\dfrac1{x_1}\\[4pt] x_2+x_2'=0\ \Rightarrow\ x_2'=-x_2.\end{cases}$$
            <b>Hay que comprobar que $u'\in V$:</b> $\frac1{x_1}>0$ ✓ (esto es lo que obliga a que $x_1>0$). Por el otro lado, $u'\ast u=(\frac1{x_1}x_1,\,-x_2+x_2)=(1,0)$ ✓. <b>Se cumple:</b> el simétrico de $(x_1,x_2)$ es $\big(\frac1{x_1},\,-x_2\big)$. Comprobación numérica: el simétrico de $(2,3)$ es $(\frac12,-3)$ y $(2,3)\ast(\frac12,-3)=(1,0)$ ✓.
    - |-
      <b>Conmutativa (S4).</b> Se desarrollan los dos órdenes:
            $$\begin{aligned}(x_1,x_2)\ast(y_1,y_2)&=(x_1y_1,\,x_2+y_2)\\(y_1,y_2)\ast(x_1,x_2)&=(y_1x_1,\,y_2+x_2)\end{aligned}$$
            Coinciden por la conmutatividad del producto y de la suma en $\mathbb R$. <b>Se cumple.</b>
  - resultado: |-
      se cumplen las cuatro propiedades: $(V,\ast)$ es un <b>grupo conmutativo</b>. (En Feb. 2019 bastan los pasos 1, 2, 3 y 5.) <i>(Verificado con sympy.)</i>
  - html: |-
      <div class="box intu" style="margin-top:.6em"><span class="h">Por qué sale todo tan limpio</span><p>La función $(x_1,x_2)\mapsto(\ln x_1,\,x_2)$ convierte esta operación en la suma ordinaria de $\mathbb R^2$ (el logaritmo transforma productos en sumas). Por eso el neutro es «el cero de esa suma» ($\ln1=0$) y el simétrico es «el opuesto» ($-\ln x_1=\ln\frac1{x_1}$). Si $V$ incluyera $x_1\le0$ fallarían el cierre o el simétrico.</p></div>
  - html: |-
      <div class="recipe"><b>Receta (orden recomendado):</b> (1) cierre; (2) asociativa: desarrolla los dos miembros por separado; (3) neutro: despeja $e$ de $u\ast e=u$ y comprueba que no depende de $u$, que está en $V$ y que vale por la izquierda; (4) simétrico: resuelve $u\ast u'=e$ con <b>ese</b> $e$ y comprueba $u'\in V$; (5) conmutativa: compara $u\ast v$ y $v\ast u$.</div>
  - error: |-
      dar $(0,0)$ como neutro «porque el neutro es el cero» ($(0,0)\notin V$ y $(x_1,x_2)\ast(0,0)=(0,x_2)\neq(x_1,x_2)$), o $(-x_1,-x_2)$ como simétrico ($-x_1<0$ no está en $V$ y $(x_1,x_2)\ast(-x_1,-x_2)=(-x_1^2,0)\neq(1,0)$); y olvidar comprobar que $1/x_1>0$.
- id: ex-feb20a
  clase: examen
  titulo: |-
    Ene. 2020 (tipo A), ejercicio 2 — la operación $a\diamond b=ab-b+a$ en $\mathbb R$
  fuentes:
  - l: X
    ref: |-
      Ene. 2020 (tipo A), ejercicio 2
    texto: |-
      X Ene. 2020 (A)
  cuerpo:
  - enun: |-
      Estudiar si la operación $\diamond$ definida en el conjunto de los números reales $\mathbb R$, mediante $a\diamond b=a\cdot b-b+a$, verifica las propiedades: asociativa, conmutativa, elemento neutro y elemento simétrico.
  - html: |-
      <div class="box intu"><span class="h">Qué se pide</span>
          <p>El conjunto es $\mathbb R$ (sin restricciones, así que el cierre es evidente: el resultado es un real). La «operación» es: multiplica $a$ por $b$, resta $b$ y suma $a$. Hay que decidir cuatro propiedades <b>razonando</b> cada una: si se cumple, demostración general; si no, contraejemplo con números. Orientación numérica: $2\diamond3=6-3+2=5$.</p></div>
  - html: |-
      <p><b>Estrategia:</b> esta operación <b>no se parece a una operación «buena»</b> (no es simétrica en $a$ y $b$), así que lo normal es que fallen las propiedades que dependen del orden. Se comprueba cada una con cuidado.</p>
  - pasos:
    - |-
      <b>Conmutativa (S4).</b> Se calcula la diferencia entre los dos órdenes:
            $$a\diamond b-b\diamond a=(ab-b+a)-(ba-a+b)=2a-2b.$$
            Solo es $0$ si $a=b$. <b>Contraejemplo</b> (con $a=2$, $b=3$):
            $$\begin{aligned}2\diamond3&=2\cdot3-3+2=5\\3\diamond2&=3\cdot2-2+3=7\end{aligned}$$
            Como $5\neq7$, <b>no se cumple.</b>
    - |-
      <b>Asociativa (S1).</b> Se desarrollan los dos miembros por separado:
            $$\begin{aligned}(a\diamond b)\diamond c&=(ab-b+a)\diamond c\\&=(ab-b+a)\,c-c\\&\quad +(ab-b+a)\\&=abc-bc+ac\\&\quad -c+ab-b+a,\end{aligned}$$
            $$\begin{aligned}a\diamond(b\diamond c)&=a\diamond(bc-c+b)\\&=a(bc-c+b)\\&\quad -(bc-c+b)+a\\&=abc-ac+ab\\&\quad -bc+c-b+a.\end{aligned}$$
            Su diferencia es
            $$(a\diamond b)\diamond c-a\diamond(b\diamond c)=2ac-2c=2c\,(a-1),$$
            distinta de $0$ en general. <b>Contraejemplo</b> con $a=b=c=2$:
            $$\begin{aligned}2\diamond2&=4-2+2=4\\(2\diamond2)\diamond2&=4\diamond2=8-2+4=10\\2\diamond(2\diamond2)&=2\diamond4=8-4+2=6\end{aligned}$$
            Como $10\neq6$, <b>no se cumple.</b>
    - |-
      <b>Elemento neutro (S2).</b> Un neutro $e$ debe cumplir <b>las dos</b> igualdades $a\diamond e=a$ y $e\diamond a=a$ para todo $a$.
            <ul>
              <li><i>Por la derecha:</i> $a\diamond e=ae-e+a=a\iff e(a-1)=0$. Para que valga para <b>todo</b> $a$ hace falta $e=0$. Y en efecto $a\diamond0=0-0+a=a$ ✓. Luego $e=0$ <b>es neutro por la derecha</b>.</li>
              <li><i>Por la izquierda:</i> con ese $e=0$: $0\diamond a=0-a+0=-a$, que es $\neq a$ salvo si $a=0$. Contraejemplo: $0\diamond1=-1\neq1$. (En general, $e\diamond a=a\iff ea-a+e=a\iff e=\frac{2a}{a+1}$, que <b>depende de $a$</b>: no hay un $e$ común.)</li>
            </ul>
            Como no se cumplen las dos igualdades a la vez, <b>no existe elemento neutro</b> (solo hay neutro por la derecha).
    - |-
      <b>Elemento simétrico (S3).</b> Se define como $a\diamond a'=a'\diamond a=e$, siendo $e$ el neutro. <b>Como no existe neutro, no existe elemento simétrico</b> (la propiedad ni siquiera tiene sentido). <b>No se cumple.</b>
  - resultado: |-
      la operación <b>no verifica ninguna</b> de las cuatro propiedades. <i>(Verificado con sympy.)</i>
  - receta: |-
      conmutativa → calcula $a\diamond b-b\diamond a$; asociativa → desarrolla los dos miembros, resta y da un contraejemplo numérico; neutro → resuelve <b>las dos</b> ecuaciones ($a\diamond e=a$ y $e\diamond a=a$) y exige una solución común, independiente de $a$; simétrico → solo si hay neutro. Toda negación, con números concretos y la cuenta escrita.
  - error: |-
      comprobar solo $a\diamond e=a$, encontrar $e=0$ y declarar que «$0$ es el neutro». En una operación <b>no conmutativa</b> hay que mirar los dos lados.
