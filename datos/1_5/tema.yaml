h1: |-
  Estructuras algebraicas: operaciones, grupos y sus propiedades
resumen: |-
  Una <b>operación</b> es una regla que combina dos elementos de un conjunto para dar otro. ¿Es <b>asociativa</b>? ¿<b>Conmutativa</b>? ¿Tiene <b>elemento neutro</b>? ¿Cada elemento tiene <b>simétrico</b>? Saber contestar estas cuatro preguntas con orden y con demostración es una pregunta casi fija del examen, y es la base de la definición de espacio vectorial (tema 2.1).
