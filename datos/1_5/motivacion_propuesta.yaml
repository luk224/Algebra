motivacion:
  s1: |-
    ¿Se pueden restar números naturales y seguir dentro de los naturales? Y si defines $a\ast b=a-b$ en $\mathbb N$, ¿qué pasa con $3\ast 5$? Antes de pedir propiedades a una operación, hay que saber cuándo «sale» del conjunto.
  s2: |-
    La suma, el producto y la resta de números parecen operaciones parecidas, pero la resta no admite reordenar paréntesis ni cambiar el orden. ¿Qué cuatro preguntas hay que hacerle a una operación nueva para saber con qué se parece y con qué no?
  s3: |-
    Los vectores, los números enteros con la suma y los giros del plano se comportan de forma muy parecida al combinarse, aunque no tengan nada que ver. ¿Qué lista mínima de propiedades comparten y por qué compensa darles un nombre común?
  s4: |-
    Si una operación falla solo en un punto, como el $-1$ en $a+b+ab$, ¿se tira entera o se arregla quitando ese punto? Veremos tres operaciones, de la casi perfecta a la que falla de forma más sutil.
consignas:
- animacion: |-
    Laboratorio: busca contraejemplos
  consigna: |-
    Elige una propiedad (asociativa, conmutativa…) y prueba con números distintos hasta que se rompa: un solo caso que falle basta para decir que no se cumple.
  pregunta: |-
    ¿Cuántos casos que sí funcionan hacen falta para demostrar una propiedad? ¿Y cuántos para refutarla?
