# Tabla de notación global (la genera herramientas/estudio.py → notacion.html).
# Campos: s = símbolo en LaTeX, d = qué significa, t = tema donde se introduce (código), g = grupo.
- {g: Matrices, s: 'A=(a_{ij})', d: 'Matriz con $m$ filas y $n$ columnas; $a_{ij}$ es el elemento de la fila $i$, columna $j$ (primero la fila).', t: '1.2'}
- {g: Matrices, s: 'A^t', d: 'Traspuesta: filas y columnas intercambiadas; $(AB)^t=B^tA^t$.', t: '1.2'}
- {g: Matrices, s: 'A^{-1}', d: 'Inversa de una matriz cuadrada regular: $AA^{-1}=A^{-1}A=I$.', t: '1.2'}
- {g: Matrices, s: 'I,\ I_n', d: 'Matriz identidad de orden $n$.', t: '1.2'}
- {g: Matrices, s: '\operatorname{rang}A', d: 'Rango: número de filas (o columnas) linealmente independientes; nº de pivotes al escalonar.', t: '1.2'}
- {g: Matrices, s: '\operatorname{tr}A', d: 'Traza: suma de los elementos de la diagonal principal.', t: '4.2'}
- {g: Matrices, s: '\operatorname{diag}(d_1,\dots,d_n)', d: 'Matriz diagonal con $d_1,\dots,d_n$ en la diagonal.', t: '4.3'}
- {g: Matrices, s: '(A\mid b)', d: 'Matriz ampliada del sistema $AX=b$ (la barra separa $A$ de los términos independientes).', t: '1.4'}
- {g: Determinantes, s: '\det A,\ |A|', d: 'Determinante de una matriz cuadrada. Solo existe si $A$ es cuadrada.', t: '1.3'}
- {g: Determinantes, s: '\operatorname{Adj}A', d: 'Matriz adjunta: la de los adjuntos (cofactores) $A_{ij}$; se usa en $A^{-1}=\frac1{|A|}(\operatorname{Adj}A)^t$.', t: '1.3'}
- {g: Espacios vectoriales, s: 'V,\ W,\ U', d: 'Espacios (o subespacios) vectoriales sobre $\mathbb R$.', t: '2.1'}
- {g: Espacios vectoriales, s: '\langle v_1,\dots,v_k\rangle', d: 'Subespacio generado: todas las combinaciones lineales de $v_1,\dots,v_k$ (el menor subespacio que los contiene).', t: '2.2'}
- {g: Espacios vectoriales, s: '\operatorname{Dim}V', d: 'Dimensión: nº de vectores de cualquier base de $V$.', t: '2.3'}
- {g: Espacios vectoriales, s: 'B=\{e_1,\dots,e_n\}', d: 'Base: sistema de generadores linealmente independiente.', t: '2.3'}
- {g: Espacios vectoriales, s: 'x_B', d: 'Coordenadas del vector $x$ respecto de la base $B$ (en columna).', t: '2.3'}
- {g: Espacios vectoriales, s: 'U\cap W,\ U+W', d: 'Intersección y suma de subespacios. $\operatorname{Dim}(U+W)=\operatorname{Dim}U+\operatorname{Dim}W-\operatorname{Dim}(U\cap W)$.', t: '2.4'}
- {g: Espacios vectoriales, s: 'U\oplus W', d: 'Suma directa: $U+W$ con $U\cap W=\{0\}$ (cada vector se escribe de una sola forma).', t: '2.4'}
- {g: Aplicaciones lineales, s: 'f:V\to W', d: 'Aplicación lineal: $f(\lambda u+\mu v)=\lambda f(u)+\mu f(v)$.', t: '3.1'}
- {g: Aplicaciones lineales, s: '\operatorname{Nuc}f', d: 'Núcleo: vectores que $f$ envía al $0$. Es un subespacio de $V$.', t: '3.2'}
- {g: Aplicaciones lineales, s: '\operatorname{Im}f', d: 'Imagen: conjunto de los $f(v)$. Es un subespacio de $W$.', t: '3.2'}
- {g: Aplicaciones lineales, s: '\operatorname{Col}A', d: 'Espacio columna: generado por las columnas de $A$ (es la imagen de $x\mapsto Ax$).', t: '3.2'}
- {g: Aplicaciones lineales, s: 'M(f;B,B_2)', d: 'Matriz asociada a $f$ respecto de la base $B$ (salida: coordenadas en $B_2$): sus columnas son las imágenes de los vectores de $B$.', t: '3.3'}
- {g: Aplicaciones lineales, s: 'f\circ g', d: 'Composición («primero $g$, luego $f$»); su matriz es el producto $M(f)\,M(g)$ en ese orden.', t: '3.4'}
- {g: Aplicaciones lineales, s: '\mathrm{Id}', d: 'Aplicación identidad.', t: '3.4'}
- {g: Aplicaciones lineales, s: 'Q',  d: 'Matriz de cambio de base (columnas = vectores de la base nueva escritos en la antigua): $x_B=Q\,x_{B^\prime}$.', t: '3.5'}
- {g: Diagonalización, s: 'A\sim A^\prime', d: 'Relación de equivalencia (p. ej. semejanza $A^\prime=P^{-1}AP$ o congruencia $A^\prime=P^tAP$).', t: '4.1'}
- {g: Diagonalización, s: '\lambda', d: 'Valor propio: escalar con $Ax=\lambda x$ para algún $x\ne0$ (raíz de $|A-\lambda I|=0$).', t: '4.2'}
- {g: Diagonalización, s: 'L_\lambda', d: 'Subespacio propio de $\lambda$: $\operatorname{Nuc}(A-\lambda I)$. Su dimensión es la multiplicidad geométrica.', t: '4.2'}
- {g: Diagonalización, s: '|A-\lambda I|', d: 'Polinomio característico, de grado $n$; sus raíces son los valores propios.', t: '4.2'}
- {g: Diagonalización, s: 'P^{-1}AP=D', d: 'Diagonalización: las columnas de $P$ son vectores propios y $D$ tiene los valores propios en el mismo orden.', t: '4.3'}
- {g: Diagonalización, s: 'J_k(\lambda)', d: 'Bloque de Jordan de tamaño $k$: $\lambda$ en la diagonal y unos justo encima.', t: '4.4'}
- {g: Ortogonalidad, s: 'u\bullet v', d: 'Producto escalar. En $\mathbb R^n$ estándar, $u\bullet v=u^tv$.', t: '5.1'}
- {g: Ortogonalidad, s: '\|v\|', d: 'Norma: $\sqrt{v\bullet v}$.', t: '5.1'}
- {g: Ortogonalidad, s: 'u\perp v',  d: 'Ortogonales: $u\bullet v=0$.', t: '5.1'}
- {g: Ortogonalidad, s: 'U^\perp', d: 'Complemento ortogonal: vectores ortogonales a todos los de $U$.', t: '5.1'}
- {g: Ortogonalidad, s: '\operatorname{Proy}_U v', d: 'Proyección ortogonal de $v$ sobre $U$: el vector de $U$ más cercano a $v$.', t: '5.1'}
- {g: Ortogonalidad, s: 'A^tA=I', d: 'Condición de matriz ortogonal (columnas ortonormales); entonces $A^{-1}=A^t$ y $|A|=\pm1$.', t: '5.2'}
- {g: Ortogonalidad, s: 'A^tAX=A^tB', d: 'Ecuaciones normales de mínimos cuadrados.', t: '5.4'}
- {g: Formas bilineales y cuadráticas, s: 'f(x,y)=x^tAy', d: 'Forma bilineal con matriz $A$ en una base; simétrica si $A=A^t$.', t: '6.1'}
- {g: Formas bilineales y cuadráticas, s: 'Q(x)=x^tAx', d: 'Forma cuadrática con matriz simétrica $A$.', t: '6.2'}
- {g: Formas bilineales y cuadráticas, s: '\operatorname{sig}', d: 'Signatura: nº de coeficientes positivos en una forma canónica diagonal (los negativos son $\operatorname{rang}-\operatorname{sig}$).', t: '6.3'}
- {g: Formas bilineales y cuadráticas, s: '\Delta_k', d: 'Menores principales (esquina superior izquierda $k\times k$), usados en el criterio de Sylvester.', t: '6.3'}
- {g: Formas bilineales y cuadráticas, s: 'A_{00}', d: 'Determinante de la parte cuadrática de una cónica o cuádrica (junto con $|A|$ y el rango, decide el tipo).', t: '6.4'}
