h1: |-
  Operaciones con aplicaciones lineales y con matrices
resumen: |-
  Las aplicaciones lineales se pueden <b>sumar</b>, <b>multiplicar por un número</b> y <b>encadenar</b> (componer). Fijadas las bases, cada una de esas operaciones se traduce a una operación con las matrices asociadas: $f+g\leftrightarrow A+B$, $\lambda f\leftrightarrow\lambda A$ y $f\circ g\leftrightarrow AB$. Aquí aprendes a hacerlo sin equivocarte con el <b>orden</b> del producto.
