    ref: |-
      Ejemplo propio, verificado con sympy; anticipa la inversa de U §3.5, p. 131
    texto: propio
  problema:
  - potencias
  - composicion
  nivel: 3
  titulo: |-
    Ejemplo propio 3 (difícil, tipo examen) — potencias de un endomorfismo y la relación $f\circ f-3f+i=0$
  enunciado: |-
    Sea $f:\mathbb R^2\to\mathbb R^2$, $f(x,y)=(2x+y,\ x+y)$, e $i$ la identidad de $\mathbb R^2$. a) Halla la matriz de $f\circ f$ y comprueba que $f\circ f-3f+i=0$ (aplicación nula). b) Deduce, sin multiplicar más matrices, que $f\circ(3i-f)=i$ y $(3i-f)\circ f=i$; da la fórmula de $3i-f$. c) Expresa $f^3=f\circ f\circ f$ y $f^4$ como $\alpha f+\beta i$ y calcula $f^3(1,0)$.
  pista: |-
    Calcula $A^2$ y comprueba la relación con matrices. Para el resto, despeja potencias de $f$ en función de $f$ e $i$ usando esa relación, sin volver a multiplicar matrices grandes.
  cuerpo:
  - html: |-
      <p><b>Qué se pide.</b> Usar las propiedades de la composición (distributiva, identidad) para trabajar con «polinomios» en $f$ sin recalcular matrices.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Usar $f\circ f-3f+i=0$ para calcular potencias de $f$.
      - - |-
          Cómo lo pienso
        - |-
          Es una relación polinómica: puedo despejar $f\circ f$ en función de $f$ e $i$ y reducir potencias sin multiplicar matrices.
      - - |-
          Qué uso
        - |-
          <b>Def. 3.11-3.12</b> (U p.123-126): $f\circ g\to A_fA_g$ (la que actúa primero, a la derecha); $(n\times p)(p\times m)=n\times m$ — <a href="#s3">ver teoría</a>. Propiedades: distributiva, $f\circ i=f$, matriz nula $\Leftrightarrow$ aplicación nula — <a href="#s4">ver teoría</a>.
      - - |-
          Por dónde empiezo
        - |-
          Compruebo la relación con matrices y la uso para $f^3,f^4$.
  - pasos:
    - |-
      <b>Matriz de $f$:</b>
            $$f(1,0)=(2,1),\quad f(0,1)=(1,1)\ \Rightarrow\ A=\begin{pmatrix}2&1\\1&1\end{pmatrix};$$
            <p>la de $i$ es $I$.</p>
    - |-
      <b>a) $f\circ f$:</b> matriz
            $$A\cdot A=A^2=\begin{pmatrix}4+1&2+1\\2+1&1+1\end{pmatrix}=\begin{pmatrix}5&3\\3&2\end{pmatrix}.$$
            <p>La matriz de $f\circ f-3f+i$ es</p>
            $$A^2-3A+I=\begin{pmatrix}5&3\\3&2\end{pmatrix}-\begin{pmatrix}6&3\\3&3\end{pmatrix}+\begin{pmatrix}1&0\\0&1\end{pmatrix}=\begin{pmatrix}0&0\\0&0\end{pmatrix}.$$
            <p>Matriz nula $\Rightarrow$ aplicación nula (la correspondencia es biyectiva, U p.118). Comprobación:</p>
            $$f(f(1,0))=f(2,1)=(5,3),\qquad(5,3)-3(2,1)+(1,0)=(0,0)\ ✓$$
    - |-
      <b>b) Factorizar.</b> De a), $3f-f\circ f=i$. Por la distributiva, $f\circ(\lambda g)=\lambda(f\circ g)$ (para sacar el 3) y las identidades (U p.128):
            $$f\circ(3i-f)=3(f\circ i)-f\circ f=3f-f\circ f=i;$$
            <p>e igual por la otra distributiva, $(3i-f)\circ f=3f-f\circ f=i$. Fórmula:</p>
            $$(3i-f)(x,y)=(3x,3y)-(2x+y,\ x+y)=(x-y,\ -x+2y),\qquad3I-A=\begin{pmatrix}1&-1\\-1&2\end{pmatrix}.$$
            <p>Comprobación:</p>
            $$A(3I-A)=\begin{pmatrix}2-1&-2+2\\1-1&-1+2\end{pmatrix}=I\ ✓$$
            <p><i>(Anticipo de §3.5: $3i-f$ «deshace» $f$; será la aplicación inversa, y $3I-A$ la matriz inversa de $A$.)</i></p>
    - |-
      <b>c) Potencias.</b> Con $f\circ f=3f-i$ y la distributiva:
            $$f^3=f\circ(3f-i)=3\,f\circ f-f=3(3f-i)-f=8f-3i,$$
            $$f^4=f\circ f^3=8\,f\circ f-3f=8(3f-i)-3f=21f-8i.$$
            <p>Matrices:</p>
            $$A^3=8A-3I=\begin{pmatrix}13&8\\8&5\end{pmatrix},\qquad A^4=21A-8I=\begin{pmatrix}34&21\\21&13\end{pmatrix}.$$
            <p>$f^3(1,0)=8(2,1)-3(1,0)=(13,8)$; directo:</p>
            $$f(1,0)=(2,1),\quad f(2,1)=(5,3),\quad f(5,3)=(13,8)\ ✓$$
  - receta: |-
      si un endomorfismo cumple una relación polinómica ($f\circ f=\alpha f+\beta i$), úsala para reducir potencias y, si el término independiente no es cero, para despejar un «inverso» sacando $f$ factor común con la distributiva.
  - error: |-
      confundir $f\circ f$ (matriz $A^2$, producto de matrices) con «elevar al cuadrado cada elemento» de $A$ ($\begin{pmatrix}4&1\cr1&1\end{pmatrix}\neq A^2$).
- id: ex-ene20a-3
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Ene. 2020 (tipo A), ejercicio 3
    texto: |-
      X Ene. 2020 (A) ej. 3
  problema:
  - composicion
  nivel: 1
  titulo: |-
    Ene. 2020 (tipo A), ejercicio 3 — matriz de $f\circ g$, $g:\mathbb R^2\to\mathbb R$, $f:\mathbb R\to\mathbb R^3$
  enunciado: |-
    Considerando las aplicaciones lineales $f:\mathbb R\to\mathbb R^3$ definidas por $f(y)=(y,0,2y)$ y $g:\mathbb R^2\to\mathbb R$ por $g(x_1,x_2)=x_1-x_2$, calcular la matriz asociada a $f\circ g$ en las bases canónicas.
  pista: |-
    Halla la matriz de $g$ (fila $1\times2$) y la de $f$ (columna $3\times1$); la compuesta es el producto con $f$ a la izquierda. Comprueba los tamaños antes de multiplicar.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Matriz de $f\circ g$ con $g:\mathbb R^2\to\mathbb R$ y $f:\mathbb R\to\mathbb R^3$.
      - - |-
          Cómo lo pienso
        - |-
          Tamaños: $(3\times1)(1\times2)=3\times2$. Si no cuadran, la composición no existe.
      - - |-
          Qué uso
        - |-
          <b>Def. 3.11-3.12</b> (U p.123-126): $f\circ g\to A_fA_g$ (la que actúa primero, a la derecha); $(n\times p)(p\times m)=n\times m$ — <a href="#s3">ver teoría</a>.
      - - |-
          Por dónde empiezo
        - |-
          Producto columna por fila.
  - redaccion:
    - |-
      <b>Se puede componer:</b> $\mathbb R^2\xrightarrow{g}\mathbb R\xrightarrow{f}\mathbb R^3$ (Def. 3.11); la matriz de $f\circ g$ es $3\times2$.
    - |-
      <b>Matrices en canónicas.</b> La base canónica de $\mathbb R$ es $\{1\}$:
      $$g(1,0)=1,\ g(0,1)=-1\ \Rightarrow\ B=\begin{pmatrix}1&-1\end{pmatrix}\ (1\times2),\qquad f(1)=(1,0,2)\ \Rightarrow\ A=\begin{pmatrix}1\\0\\2\end{pmatrix}\ (3\times1).$$
    - |-
      <b>Producto</b> (Def. 3.12), $g$ actúa primero y va a la derecha; $(3\times1)(1\times2)=3\times2$:
      $$C=AB=\begin{pmatrix}1\\0\\2\end{pmatrix}\begin{pmatrix}1&-1\end{pmatrix}=\begin{pmatrix}1\cdot1&1\cdot(-1)\\0\cdot1&0\cdot(-1)\\2\cdot1&2\cdot(-1)\end{pmatrix}=\begin{pmatrix}1&-1\\0&0\\2&-2\end{pmatrix}.$$
    - |-
      <b>Respuesta:</b> la matriz asociada a $f\circ g$ es $C=\begin{pmatrix}1&-1\\0&0\\2&-2\end{pmatrix}$.
  - comentarios:
    - |-
      <p><b>Qué se pide.</b> $f\circ g$ es «primero $g$, después $f$». Es exactamente el Ej. 3.23-3.25 de U, con las mismas $f$ y $g$.</p>
    - |-
      <b>Comprobación por sustitución:</b>
      $$(f\circ g)(x_1,x_2)=f(x_1-x_2)=(x_1-x_2,\ 0,\ 2x_1-2x_2),$$
      <p>cuya matriz es la misma ✓.</p>
  - receta: |-
      (1) dibuja la cadena $V\xrightarrow{g}W\xrightarrow{f}U$; (2) matrices $A_f$ ($n\times p$) y $A_g$ ($p\times m$); (3) multiplica $A_fA_g$; (4) comprueba por sustitución.
  - error: |-
      calcular $BA=\begin{pmatrix}1&-1\end{pmatrix}\begin{pmatrix}1\cr0\cr2\end{pmatrix}$: con estos tamaños ni se puede ($1\times2$ por $3\times1$), y $g\circ f$ no existe.
- id: ex-feb23-1p3
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Feb. 2023 (1.ª sem.), pregunta 3
    texto: |-
      X Feb. 2023 (1.ª) P3
  problema:
  - composicion
  nivel: 1
  titulo: |-
    Feb. 2023 (1.ª sem.), pregunta 3 — representación matricial de $f\circ g$
  enunciado: |-
    Sean $f:\mathbb R\to\mathbb R^3$ y $g:\mathbb R^2\to\mathbb R$ las aplicaciones lineales definidas por $f(x)=(0,5x,x)$ y $g(x,y)=2x+y$. Halle la representación matricial de la aplicación compuesta $f\circ g$.
  pista: |-
    Una matriz por aplicación (de $g$ es $1\times2$, de $f$ es $3\times1$) y multiplica en el orden $A_fA_g$. El resultado debe ser $3\times2$.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Representación matricial de $f\circ g$.
      - - |-
          Cómo lo pienso
        - |-
          Igual que el anterior: producto de las matrices canónicas con $g$ a la derecha.
      - - |-
          Qué uso
        - |-
          <b>Def. 3.11-3.12</b> (U p.123-126): $f\circ g\to A_fA_g$ (la que actúa primero, a la derecha); $(n\times p)(p\times m)=n\times m$ — <a href="#s3">ver teoría</a>. Representación (Def. 3.13): $Y=CX$.
      - - |-
          Por dónde empiezo
        - |-
          Producto y expresión $Y=CX$.
  - redaccion:
    - |-
      <b>Cadena:</b> $\mathbb R^2\xrightarrow{g}\mathbb R\xrightarrow{f}\mathbb R^3$; se puede componer.
    - |-
      <b>Matrices en canónicas:</b>
      $$g(1,0)=2,\ g(0,1)=1\ \Rightarrow\ A_g=\begin{pmatrix}2&1\end{pmatrix}\ (1\times2),\qquad f(1)=(0,5,1)\ \Rightarrow\ A_f=\begin{pmatrix}0\\5\\1\end{pmatrix}\ (3\times1).$$
    - |-
      <b>Producto</b> ($g$ actúa primero, va a la derecha):
      $$C=A_fA_g=\begin{pmatrix}0\\5\\1\end{pmatrix}\begin{pmatrix}2&1\end{pmatrix}=\begin{pmatrix}0&0\\10&5\\2&1\end{pmatrix}.$$
    - |-
      <b>Representación matricial</b> (Def. 3.13):
      $$(f\circ g)(x,y)=\begin{pmatrix}0&0\\10&5\\2&1\end{pmatrix}\binom xy=\begin{pmatrix}0\\10x+5y\\2x+y\end{pmatrix}.$$
    - |-
      <b>Respuesta:</b> $Y=CX$ con $C=\begin{pmatrix}0&0\\10&5\\2&1\end{pmatrix}$.
  - comentarios:
    - |-
      <p><b>Qué se pide.</b> La expresión $Y=CX$ (Def. 3.13, U p.126) de $f\circ g:\mathbb R^2\to\mathbb R^3$ en canónicas, con $C$ de tamaño $3\times2$.</p>
    - |-
      <b>Comprobación:</b> $f(g(x,y))=f(2x+y)=(0,\ 5(2x+y),\ 2x+y)$ ✓.
    - |-
      Si una aplicación va a $\mathbb R$ o sale de $\mathbb R$, su matriz es una fila o una columna; el producto columna$\times$fila es una matriz de rango 1 (columnas proporcionales).
  - receta: |-
      igual que el anterior. Si una aplicación va a $\mathbb R$ o sale de $\mathbb R$, su matriz es una fila o una columna, y el producto columna$\times$fila da una matriz de rango 1 (columnas proporcionales).
  - error: |-
      escribir $A_f$ como fila $(0\ 5\ 1)$: tiene <b>3 filas</b> (dimensión de llegada) y 1 columna.
- id: ex-sep24-p3
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Sept. 2024, pregunta 3
    texto: |-
      X Sept. 2024 P3
  problema:
  - composicion
  nivel: 2
  titulo: |-
    Sept. 2024, pregunta 3 — matriz de $g\circ f$ y valor $(g\circ f)(3,2)$
  enunciado: |-
    Sean $f:\mathbb R^2\to\mathbb R^3$ y $g:\mathbb R^3\to\mathbb R$ las aplicaciones lineales definidas por $f(x,y)=(x+y,\ 5y,\ -2x)$ y $g(x,y,z)=3x-y+z$. Halle la representación matricial de la aplicación compuesta $g\circ f$ y calcule $(g\circ f)(3,2)$.
  pista: |-
    La matriz de $g\circ f$ es $A_gA_f$ (fila por matriz $3\times2$). Para el valor en $(3,2)$ puedes multiplicar la matriz por la columna o aplicar $f$ y luego $g$.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Representación de $g\circ f$ y valor en $(3,2)$.
      - - |-
          Cómo lo pienso
        - |-
          Ahora el orden es el contrario: actúa primero $f$. Matriz $1\times2$.
      - - |-
          Qué uso
        - |-
          <b>Def. 3.11-3.12</b> (U p.123-126): $f\circ g\to A_fA_g$ (la que actúa primero, a la derecha); $(n\times p)(p\times m)=n\times m$ — <a href="#s3">ver teoría</a>.
      - - |-
          Por dónde empiezo
        - |-
          Producto $A_gA_f$ y evaluación.
  - redaccion:
    - |-
      <b>Cadena:</b> $\mathbb R^2\xrightarrow{f}\mathbb R^3\xrightarrow{g}\mathbb R$; $g\circ f$ existe y su matriz es $1\times2$.
    - |-
      <b>Matrices en canónicas:</b>
      $$f(1,0)=(1,0,-2),\ f(0,1)=(1,5,0)\ \Rightarrow\ A_f=\begin{pmatrix}1&1\\0&5\\-2&0\end{pmatrix}\ (3\times2),\qquad A_g=\begin{pmatrix}3&-1&1\end{pmatrix}\ (1\times3).$$
    - |-
      <b>Producto</b> ($f$ actúa primero, $A_f$ a la derecha); $(1\times3)(3\times2)=1\times2$:
      $$A_gA_f=\begin{pmatrix}3&-1&1\end{pmatrix}\begin{pmatrix}1&1\\0&5\\-2&0\end{pmatrix}=\begin{pmatrix}3-0-2&\ 3-5+0\end{pmatrix}=\begin{pmatrix}1&-2\end{pmatrix}.$$
    - |-
      <b>Representación y valor:</b>
      $$(g\circ f)(x,y)=\begin{pmatrix}1&-2\end{pmatrix}\binom xy=x-2y,\qquad(g\circ f)(3,2)=3-4=-1.$$
    - |-
      <b>Respuesta:</b> $A_{g\circ f}=\begin{pmatrix}1&-2\end{pmatrix}$ y $(g\circ f)(3,2)=-1$.
  - comentarios:
    - |-
      <p><b>Qué se pide.</b> Ahora el orden es el contrario: $g\circ f$ = «primero $f$, después $g$». Matriz $1\times2$ y su valor en $(3,2)$.</p>
    - |-
      Al revés, $f\circ g$ <b>no</b> existe: $g$ llega a $\mathbb R$ y $f$ sale de $\mathbb R^2$.
    - |-
      <b>Comprobación sin matrices:</b> $f(3,2)=(5,10,-6)$ y $g(5,10,-6)=15-10-6=-1$ ✓.
  - receta: |-
      lee la composición de derecha a izquierda para saber qué actúa primero; esa matriz va a la derecha. Para un valor concreto, comprueba aplicando $f$ y luego $g$.
  - error: |-
      calcular $A_fA_g$ ($3\times2$ por $1\times3$: no se puede) o confundir $g\circ f$ con $f\circ g$.
- id: ex-sep18a-3
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Sept. 2018 (tipo A), ejercicio 3
    texto: |-
      X Sept. 2018 (A) ej. 3
  problema:
  - composicion
  nivel: 1
  titulo: |-
    Sept. 2018 (tipo A), ejercicio 3 — la aplicación $h=f\circ g$ por sustitución
  enunciado: |-
    Hallar la aplicación lineal $h$ definida por $f\circ g$ ($f$ compuesta con $g$) siendo $f(x_1,x_2)=(x_1,\ x_2-x_1,\ 3x_1)$ y $g(y_1,y_2)=(2y_1-y_2,\ 0)$.
  pista: |-
    Aquí piden la fórmula de $f\circ g$: sustituye las componentes de $g(y_1,y_2)$ en $f$ (primero actúa $g$). Si prefieres matrices, calcula $A_fA_g$.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Fórmula de $h=f\circ g$ dadas $f$ y $g$ por fórmulas.
      - - |-
          Cómo lo pienso
        - |-
          Se resuelve por sustitución: la salida de $g$ entra como argumento de $f$.
      - - |-
          Qué uso
        - |-
          <b>Sustitución (Def. 3.11)</b> (U p.123): $h(y)=f(g(y))$; matriz $A_fA_g$ (la que actúa primero, a la derecha) — <a href="#s3">ver teoría</a>.
      - - |-
          Por dónde empiezo
        - |-
          Sustituyo directamente y contrasto con el producto de matrices.
  - redaccion:
    - |-
      <b>Se puede componer:</b> $g:\mathbb R^2\to\mathbb R^2$ y $f:\mathbb R^2\to\mathbb R^3$, luego $h=f\circ g:\mathbb R^2\to\mathbb R^3$.
    - |-
      <b>Sustitución</b> (Def. 3.11): $(x_1,x_2)=g(y_1,y_2)=(2y_1-y_2,\ 0)$ se lleva a $f$ (componentes $x_1$, $x_2-x_1$, $3x_1$):
      $$h(y_1,y_2)=f(2y_1-y_2,\ 0)=\big(2y_1-y_2,\ -(2y_1-y_2),\ 3(2y_1-y_2)\big)$$
    - |-
      <b>Respuesta:</b>
      $$h(y_1,y_2)=(2y_1-y_2,\ -2y_1+y_2,\ 6y_1-3y_2).$$
  - comentarios:
    - |-
      <p><b>Qué se pide.</b> La fórmula de $h$, deduciendo antes los espacios.</p>
    - |-
      <b>Comprobación con matrices:</b>
      $$A_f=\begin{pmatrix}1&0\\-1&1\\3&0\end{pmatrix},\quad A_g=\begin{pmatrix}2&-1\\0&0\end{pmatrix},\quad A_fA_g=\begin{pmatrix}2&-1\\-2&1\\6&-3\end{pmatrix},$$
      <p>cuyas filas son los coeficientes de las tres componentes de $h$ ✓.</p>
    - |-
      <b>Observación.</b> $g\circ f$ no se puede formar ($f$ llega a $\mathbb R^3$ y $g$ sale de $\mathbb R^2$). Y $h$ tiene rango 1 (columnas proporcionales) porque la imagen de $g$ ya es $\langle(1,0)\rangle$.
  - receta: |-
      por sustitución, pon la fórmula de la de dentro ($g$) <b>en el lugar de cada variable</b> de la de fuera ($f$), respetando qué componente es $x_1$ y cuál $x_2$ (las letras son solo nombres: importa la posición).
  - error: |-
      sustituir mal la posición, olvidando que la 2.ª componente de $f$ es $x_2-x_1$ con $x_2=0$; o hacer $g(f(\cdot))$.
- id: ex-feb25-1p7c
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Feb. 2025 (1.ª sem.), problema 7 (3.er apartado)
    texto: |-
      X Feb. 2025 (1.ª) P7c
  problema:
  - composicion
  nivel: 2
  titulo: |-
    Feb. 2025 (1.ª sem.), problema 7, 3.er apartado — matriz de $h\circ g$ ($4\times3$)
  enunciado: |-
    Consideremos $f:\mathbb R\to\mathbb R^5$, $g:\mathbb R^3\to\mathbb R^2$ y $h:\mathbb R^2\to\mathbb R^4$ definidas por $f(x)=(x,\ 2+x,\ 3x,\ 4x,\ 5x)$, $g(x,y,z)=(x+y+z,\ -5x-5y-5z)$ y $h(x,y)=(4x-5y,\ y,\ x,\ -3x+7y)$. <i>[1.er apartado: ¿$f$ lineal? → <a href="tema_3_1_conceptos_propiedades.html#ex-feb25a-p7">tema 3.1</a>; 2.º: núcleo e imagen de $g$ → <a href="tema_3_2_nucleo_imagen.html#ex-feb25-1p7">tema 3.2</a>.]</i> Calcule la matriz asociada a la aplicación lineal $h\circ g$.
  pista: |-
    Solo intervienen $g$ y $h$; $f$ no se usa. Comprueba que $h:\mathbb R^2\to\mathbb R^4$ puede ir después de $g:\mathbb R^3\to\mathbb R^2$ y multiplica $A_hA_g$ ($4\times2$ por $2\times3$).
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Matriz de $h\circ g$ de tamaño $4\times3$.
      - - |-
          Cómo lo pienso
        - |-
          La función $f$ del enunciado es un distractor. $g$ tiene tres columnas iguales: el producto tendrá tres columnas iguales.
      - - |-
          Qué uso
        - |-
          <b>Def. 3.11-3.12</b> (U p.123-126): $f\circ g\to A_fA_g$ (la que actúa primero, a la derecha); $(n\times p)(p\times m)=n\times m$ — <a href="#s3">ver teoría</a>. Columna $j$ de $A_hA_g$ = $A_h\cdot$(columna $j$ de $A_g$).
      - - |-
          Por dónde empiezo
        - |-
          Matrices y producto.
  - redaccion:
    - |-
      <b>Se puede componer:</b> $\mathbb R^3\xrightarrow{g}\mathbb R^2\xrightarrow{h}\mathbb R^4$; la matriz de $h\circ g$ es $4\times3$ ($f$ no interviene).
    - |-
      <b>Matrices</b> (fila $i$ = coeficientes de la componente $i$):
      $$A_g=\begin{pmatrix}1&1&1\cr-5&-5&-5\end{pmatrix}\ (2\times3),\qquad A_h=\begin{pmatrix}4&-5\cr0&1\cr1&0\cr-3&7\end{pmatrix}\ (4\times2).$$
    - |-
      <b>Producto</b> $A_hA_g$, de tamaño $(4\times2)(2\times3)=4\times3$. Las tres columnas de $A_g$ son iguales a $\binom{1}{-5}$ y la columna $j$ del producto es $A_h$ por la columna $j$ de $A_g$:
      $$A_h\begin{pmatrix}1\cr-5\end{pmatrix}=\begin{pmatrix}4+25\cr-5\cr1\cr-3-35\end{pmatrix}=\begin{pmatrix}29\cr-5\cr1\cr-38\end{pmatrix}\ \Rightarrow\ A_hA_g=\begin{pmatrix}29&29&29\cr-5&-5&-5\cr1&1&1\cr-38&-38&-38\end{pmatrix}.$$
    - |-
      <b>Respuesta:</b> la matriz de $h\circ g$ es la $4\times3$ anterior.
  - comentarios:
    - |-
      <p><b>Qué se pide.</b> La matriz en canónicas de $h\circ g$, de tamaño $4\times3$. La función $f$ del enunciado es un distractor.</p>
    - |-
      <b>Comprobación por sustitución.</b> Con $u=x+y+z$, $v=-5u$: $h(u,v)=(4u-5v,\ v,\ u,\ -3u+7v)=(29u,\ -5u,\ u,\ -38u)$ ✓.
    - |-
      <b>Interpretación (tema 3.2).</b> $\operatorname{rang}A_h=2$ (sus columnas $(4,0,1,-3)$ y $(-5,1,0,7)$ son independientes), luego $h$ es inyectiva y $\operatorname{Nuc}(h\circ g)=\operatorname{Nuc}g=\{x+y+z=0\}$, de dimensión $3-1=2$; por eso el rango de $h\circ g$ es $3-2=1$. Su imagen es $h(\operatorname{Im}g)=\langle(29,-5,1,-38)\rangle$.
  - receta: |-
      con matrices grandes aprovecha que la columna $j$ de $A_hA_g$ es $A_h\cdot(\text{columna }j\text{ de }A_g)$; si $A_g$ tiene columnas repetidas, el producto también.
  - error: |-
      calcular $A_gA_h$ ($2\times3$ por $4\times2$: imposible) o meter $f$ en la composición; o tomar $A_g$ como $3\times2$ (imágenes en filas).
- id: ex-sep23-p3
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Sept. 2023, pregunta 3
    texto: |-
      X Sept. 2023 P3
  problema:
  - combinacion
  nivel: 2
  titulo: |-
    Sept. 2023, pregunta 3 — representación matricial de $f=3g-5h$
  enunciado: |-
    Sea $f=3g-5h:\mathbb R^2\to\mathbb R^3$, en donde $g,h:\mathbb R^2\to\mathbb R^3$ son las aplicaciones $g(x,y)=(-y,\ 4y+7x,\ 3x)$ y $h(x,y)=\begin{pmatrix}1&-5\cr-3&0\cr2&-6\end{pmatrix}\begin{pmatrix}x\cr y\end{pmatrix}$. Halle la representación matricial de $f$.
  pista: |-
    Pasa $g$ a matriz (cada componente es una fila) y usa la matriz dada de $h$. Después calcula $3A_g-5A_h$ entrada a entrada.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Matriz de $f=3g-5h$ cuando $g$ viene por fórmula y $h$ por su matriz.
      - - |-
          Cómo lo pienso
        - |-
          Hay que poner ambas en el mismo formato; cuidado con el orden de las variables en la fórmula.
      - - |-
          Qué uso
        - |-
          <b>Def. 3.5-3.10</b> (U p.118-121): $f+g\to A+B$, $\lambda f\to\lambda A$ (mismas bases; solo si $f,g$ tienen los mismos espacios inicial y final) — <a href="#s2">ver teoría</a>.
      - - |-
          Por dónde empiezo
        - |-
          Matriz de $g$ por columnas y combinación con $h$.
  - redaccion:
    - |-
      <b>Se puede combinar:</b> $g,h:\mathbb R^2\to\mathbb R^3$; la matriz de $f$ es $3\times2$.
    - |-
      <b>Matriz de $g$</b> (columnas $g(1,0)=(0,7,3)$ y $g(0,1)=(-1,4,0)$; la 2.ª componente es $7x+4y$):
      $$A_g=\begin{pmatrix}0&-1\cr7&4\cr3&0\end{pmatrix},\qquad A_h=\begin{pmatrix}1&-5\cr-3&0\cr2&-6\end{pmatrix}\ (\text{la dada}).$$
    - |-
      <b>Combinación</b> (Def. 3.7 y 3.10, ambas en canónicas):
      $$A_f=3A_g-5A_h=\begin{pmatrix}0&-3\cr21&12\cr9&0\end{pmatrix}-\begin{pmatrix}5&-25\cr-15&0\cr10&-30\end{pmatrix}=\begin{pmatrix}-5&22\cr36&12\cr-1&30\end{pmatrix}.$$
    - |-
      <b>Respuesta:</b> $Y=A_fX$, es decir, $f(x,y)=(-5x+22y,\ 36x+12y,\ -x+30y)$.
  - comentarios:
    - |-
      <p><b>Qué se pide.</b> La matriz $3\times2$ de $f$ en canónicas y la expresión $Y=AX$. $h$ viene en forma matricial y $g$ en forma de fórmula: hay que poner las dos en el mismo formato.</p>
    - |-
      <b>Cuidado con el orden de las variables:</b> $4y+7x=7x+4y$ da la fila $(7,4)$, no $(4,7)$.
    - |-
      <b>Comprobación con $(1,2)$</b> (Def. 3.5 y 3.8): $g(1,2)=(-2,15,3)$, $h(1,2)=(-9,-3,-10)$ y $3g-5h=(-6+45,\ 45+15,\ 9+50)=(39,60,59)$; y $A_f\binom12=(-5+44,\ 36+24,\ -1+60)=(39,60,59)$ ✓.
  - receta: |-
      pon todas las aplicaciones como matrices <b>en las mismas bases</b>, comprueba que tienen el mismo tamaño y opera elemento a elemento ($\lambda A_g+\mu A_h$). Comprueba con un vector.
  - error: |-
      leer mal $A_g$ por el orden de las variables ($4y+7x$ → poner $(4,7)$ en vez de $(7,4)$); multiplicar matrices en vez de sumarlas (una «$-$» entre aplicaciones no es composición); errores de signo al restar $5A_h$.
- id: ex-propio-p1
  clase: propio
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  problema:
  - combinacion
  nivel: 1
  titulo: |-
    Propio A — $2f-3g$ en $\mathbb R^2$ (método B)
  enunciado: |-
    Sean $f,g:\mathbb R^2\to\mathbb R^2$, $f(x,y)=(x+2y,\ 3x)$, $g(x,y)=(y,\ x-y)$. Halle la matriz de $2f-3g$ y compruébela en $(1,1)$.
  pista: |-
    Obtén las dos matrices $2\times2$ y haz $2A_f-3A_g$ directamente. Comprueba aplicando la fórmula de $2f-3g$ al vector $(1,1)$.
  cuerpo:
  - html: |-
      <p><b>Qué se pide.</b> Matriz $2\times2$ de la combinación y comprobación con un vector.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Matriz de $2f-3g$.
      - - |-
          Cómo lo pienso
        - |-
          Mismo espacio de salida y llegada: combinación entrada a entrada.
      - - |-
          Qué uso
        - |-
          <b>Def. 3.5-3.10</b> (U p.118-121): $f+g\to A+B$, $\lambda f\to\lambda A$ (mismas bases; solo si $f,g$ tienen los mismos espacios inicial y final) — <a href="#s2">ver teoría</a>.
      - - |-
          Por dónde empiezo
        - |-
          Matrices y combinación.
  - pasos:
    - |-
      Mismos espacios: se pueden combinar.
            $$A_f=\begin{pmatrix}1&2\\3&0\end{pmatrix},\qquad A_g=\begin{pmatrix}0&1\\1&-1\end{pmatrix}.$$
    - |-
      Combino las matrices:
            $$2A_f-3A_g=\begin{pmatrix}2&4\\6&0\end{pmatrix}-\begin{pmatrix}0&3\\3&-3\end{pmatrix}=\begin{pmatrix}2&1\\3&3\end{pmatrix}.$$
    - |-
      Comprobación en $(1,1)$:
            $$f(1,1)=(3,3),\quad g(1,1)=(1,0),\quad2(3,3)-3(1,0)=(3,6);\qquad\begin{pmatrix}2&1\\3&3\end{pmatrix}\binom11=\binom36\ ✓$$
  - receta: |-
      matriz de cada aplicación, combina las matrices y comprueba en un vector.
- id: ex-propio-p2
  clase: propio
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  problema:
  - composicion
  - propiedades
  nivel: 2
  titulo: |-
    Propio B — $g\circ f$ y $f\circ g$ (método A)
  enunciado: |-
    Sean $f:\mathbb R^2\to\mathbb R^3$, $f(x,y)=(x,\ x+y,\ 2y)$ y $g:\mathbb R^3\to\mathbb R^2$, $g(x,y,z)=(x-z,\ y)$. Calcule las matrices de $g\circ f$ y de $f\circ g$. ¿Son iguales?
  pista: |-
    Mira los tamaños: $g\circ f$ va de $\mathbb R^2$ a $\mathbb R^2$ y $f\circ g$ de $\mathbb R^3$ a $\mathbb R^3$. Multiplica en cada caso con el que actúa primero a la derecha.
  cuerpo:
  - html: |-
      <p><b>Qué se pide.</b> Las dos matrices, con sus tamaños, y compararlas.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Matrices de $g\circ f$ y $f\circ g$; ¿son iguales?
      - - |-
          Cómo lo pienso
        - |-
          Tamaños distintos ya sugieren que no.
      - - |-
          Qué uso
        - |-
          <b>Def. 3.11-3.12</b> (U p.123-126): $f\circ g\to A_fA_g$ (la que actúa primero, a la derecha); $(n\times p)(p\times m)=n\times m$ — <a href="#s3">ver teoría</a>.
      - - |-
          Por dónde empiezo
        - |-
          Matrices y productos en ambos órdenes.
  - pasos:
    - |-
      <b>Cadenas:</b> $g\circ f:\mathbb R^2\to\mathbb R^2$ (matriz $2\times2$); $f\circ g:\mathbb R^3\to\mathbb R^3$ (matriz $3\times3$). Ambas existen (como en U Ej. 3.27).
    - |-
      Matrices:
            $$A_f=\begin{pmatrix}1&0\\1&1\\0&2\end{pmatrix},\qquad A_g=\begin{pmatrix}1&0&-1\\0&1&0\end{pmatrix}.$$
    - |-
      $g\circ f$:
            $$A_{g\circ f}=A_gA_f=\begin{pmatrix}1&-2\\1&1\end{pmatrix}.$$
            <p>Sustitución: $g(x,\ x+y,\ 2y)=(x-2y,\ x+y)$ ✓.</p>
    - |-
      $f\circ g$:
            $$A_{f\circ g}=A_fA_g=\begin{pmatrix}1&0&-1\\1&1&-1\\0&2&0\end{pmatrix}.$$
            <p>Sustitución: $f(x-z,\ y)=(x-z,\ x-z+y,\ 2y)$ ✓.</p>
    - |-
      <b>No son iguales</b>: ni siquiera tienen el mismo tamaño. Además $\det A_{g\circ f}=3\neq0$ mientras que $\det A_{f\circ g}=0$ ($f\circ g$ pasa por $\mathbb R^2$, así que su imagen tiene dimensión $\le2$).
  - receta: |-
      cadena de espacios, matrices en el orden «la última a la izquierda», y comprueba sustituyendo.
  - html: |-
      <p class="note">El ejemplo propio 3 de la sección 5 ($f\circ f-3f+i=0$) es el ejercicio de examen típico sobre propiedades de la composición, con anticipo de la inversa de §3.5.</p>
