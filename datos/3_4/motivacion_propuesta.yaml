motivacion:
  s1: |-
    Si $f$ y $g$ son dos transformaciones del plano, ¿se pueden sumar, escalar y encadenar como si fueran números? ¿Y habrá una operación equivalente con sus matrices que dé exactamente el mismo resultado sin tener que mirar los vectores uno a uno?
  s2: |-
    Dos giros o dos estiramientos del plano se pueden «sumar» aplicando ambos a cada vector y sumando los resultados. ¿Cómo obtener de una vez la matriz de esa nueva aplicación a partir de las matrices de las dos originales?
  s3: |-
    Primero una aplicación $g:\mathbb R^2\to\mathbb R^3$ y luego una $f:\mathbb R^3\to\mathbb R^2$: ¿qué matriz describe el viaje completo, y por qué sale de multiplicar las matrices de una forma tan rara (filas por columnas) en lugar de elemento a elemento?
  s4: |-
    Con números, $2\cdot3$ y $3\cdot2$ dan lo mismo; ¿pasa igual al encadenar «primero girar y luego estirar» frente a «primero estirar y luego girar»? ¿Qué reglas del álgebra de siempre sobreviven con matrices y cuáles no?
consignas:
  - animacion: |-
      producto fila×columna de una matriz
    consigna: |-
      Recorre el cálculo y fíjate en qué fila de $A$ y qué columna de $B$ se emparejan para cada elemento de $AB$, y en el tamaño del resultado. Luego cambia algún número con «✎» y repite.
    pregunta: |-
      Si calculas $BA$ con las mismas matrices, ¿qué tamaño tiene y por qué no puede coincidir con $AB$?
