motivacion:
  s1: |-
    Al girar una fotografía en la pantalla, ni las longitudes ni los ángulos cambian. ¿Qué propiedad deben cumplir las columnas de la matriz que hace ese giro para que sea posible?
  s2: |-
    Invertir una matriz $3\times3$ suele costar un buen rato de Gauss. ¿Existe una clase de matrices cuya inversa se escribe sin hacer ningún cálculo, con solo darles la vuelta?
  s3: |-
    Si multiplicas dos vectores por una misma matriz, ¿puedes asegurar que seguirán midiendo lo mismo y formando el mismo ángulo entre sí? ¿Y qué ocurre con una matriz cualquiera?
  s4: |-
    En el plano, ¿cuántas maneras distintas hay de mover una figura sin deformarla y dejando el origen fijo? ¿Basta con girarla, o hay movimientos que no son giros?
  s5: |-
    Un satélite gira alrededor de un eje inclinado en el espacio. Dada su matriz $3\times3$, ¿cómo averiguar sin dibujar nada cuál es el eje y cuántos grados ha girado?
  s6: |-
    Para escribir un mismo vector en dos bases ortonormales, normalmente habría que resolver un sistema. ¿Qué ventaja tiene que ambas sean ortonormales y cómo se ve eso en la matriz de cambio?
  s7: |-
    Dada una matriz $A$ con columnas independientes, ¿se puede reemplazar sus columnas por otras perpendiculares entre sí sin perder la información de $A$, y guardar lo que se ha cambiado en otra matriz sencilla?
consignas:
  - animacion: |-
      Animación: giros, simetrías y matrices que deforman
    consigna: |-
      Mueve el deslizador del ángulo $\theta$ con «Giro» y luego con «Simetría», y después prueba los presets que no son ortogonales. Fíjate en el cuadrado unidad, en las normas y el ángulo entre $x$ e $y$ antes y después, y en $A^tA$.
    pregunta: |-
      ¿Qué cambia en el cuadrado unidad y en $\det A$ al pasar de un giro a una simetría, y qué condición falla cuando la matriz no es ortogonal?
  - animacion: |-
      Animación 3D: cubo y esfera antes y después
    consigna: |-
      Cambia el ángulo y el eje del giro, pasa luego a los modos de simetría y a la matriz editable, y compara el cubo y la esfera con sus imágenes. Fíjate en cuándo la imagen de la esfera sigue siendo una esfera.
    pregunta: |-
      ¿Qué le ocurre a la esfera cuando la matriz deja de ser ortogonal, y cómo se lee el eje del giro en el resultado?
