resumen: |-
  Las matrices que <b>mueven el plano y el espacio sin deformarlos</b>: giros y simetrías. Cómo reconocerlas ($A^tA=I$), qué conservan (longitudes, ángulos, productos escalares), qué tipos hay en $\mathbb R^2$ y en $\mathbb R^3$, y la <b>factorización $QR$</b>, que es Gram-Schmidt escrito con matrices y sirve para resolver sistemas.
