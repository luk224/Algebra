h1: |-
  Matriz inversa y cambios de base
resumen: |-
  Un mismo vector se «escribe» con números distintos según la base que uses. Aquí aprendes a <b>traducir</b> coordenadas de una base a otra con una matriz $Q$, a traducir en sentido contrario con su inversa $Q^{-1}$ y a calcular la matriz de una aplicación lineal cuando cambias las bases: $A'=P^{-1}AQ$.
