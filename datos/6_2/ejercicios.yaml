  nivel: 1
  titulo: |-
    Feb. 2025 (1.ª semana), pregunta 6 — $Q(2,4,6)=-5\Rightarrow Q(6,12,18)$
  enunciado: |-
    Sea $Q:\mathbb R^3\to\mathbb R$ una forma cuadrática tal que $Q(2,4,6)=-5$. Calcule $Q(6,12,18)$.
  pista: |-
    ¿Por qué número hay que multiplicar $(2,4,6)$ para llegar a $(6,12,18)$? Aplica la propiedad de homogeneidad de $Q$ y justifícala con la bilinealidad.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Calcular $Q(3x)$ conocido $Q(x)$.
      - - |-
          Qué se usa
        - |-
          <b>Propiedades:</b> $Q(\lambda x)=\lambda^2Q(x)$; $Q(x+y)=Q(x)+Q(y)+2f(x,y)$. <b>Rango</b> de $Q$ = rango de $A$.
      - - Plan
        - |-
          $Q(3x)=9Q(x)$.
  - pasos:
    - |-
      $(6,12,18)=3\,(2,4,6)$.
    - |-
      $Q(3v)=3^2Q(v)=9\cdot(-5)=\mathbf{-45}$ (mismo razonamiento).
    - |-
