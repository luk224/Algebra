    Feb. 2023 (1.ª semana), pregunta 6 — $Q(-2,5,3,1)=10\Rightarrow Q(-10,25,15,5)$
  enunciado: |-
    Si $Q$ es una forma cuadrática de $\mathbb R^4$ tal que $Q(-2,5,3,1)=10$, calcule el valor de $Q(-10,25,15,5)$.
  pista: |-
    Compara el segundo vector con el primero: ¿es un múltiplo? Entonces usa cómo escala $Q$ cuando multiplicas el vector por $\lambda$.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Calcular $Q(5x)$ conocido $Q(x)$.
      - - |-
          Qué se usa
        - |-
          <b>Propiedades:</b> $Q(\lambda x)=\lambda^2Q(x)$; $Q(x+y)=Q(x)+Q(y)+2f(x,y)$. <b>Rango</b> de $Q$ = rango de $A$.
      - - Plan
        - |-
          $Q(5x)=25Q(x)$.
  - pasos:
    - |-
      $(-10,25,15,5)=5\,(-2,5,3,1)$ (compruébalo coordenada a coordenada).
    - |-
      $Q(5v)=f(5v,5v)=5^2f(v,v)=25\,Q(v)$ por bilinealidad.
    - |-
      $Q(-10,25,15,5)=25\cdot10=\mathbf{250}$. Error frecuente: multiplicar simplemente por 5.
