      <div class="recipe"><b>Receta del bloque:</b> $\lambda v\Rightarrow\lambda^2Q(v)$, con la frase «por bilinealidad $f(\lambda v,\lambda v)=\lambda^2f(v,v)$».</div>
- id: ex-sep23-6
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Sept. 2023, pregunta 6
    texto: |-
      X Sept. 2023 P6
  problema:
  - poli
  nivel: 1
  titulo: |-
    Sept. 2023, pregunta 6 — matriz de $Q=x^2+y^2-z^2+5xy-3xz$
  enunciado: |-
    Halle la matriz asociada a la forma cuadrática $Q:\mathbb R^3\to\mathbb R$ donde $Q(x,y,z)=x^2+y^2-z^2+5xy-3xz$.
  pista: |-
    Cuadrados a la diagonal y cada término cruzado dividido entre 2 en las dos posiciones simétricas. Los que no aparecen valen 0.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Matriz de una forma cuadrática en $\mathbb R^3$.
      - - |-
          Qué se usa
        - |-
          <b>Matriz de $Q$:</b> la diagonal son los coeficientes de $x_i^2$ y fuera de ella va <b>la mitad</b> del coeficiente de $x_ix_j$. Si $M$ no es simétrica, la matriz de $Q(x)=x^tMx$ es $\tfrac12(M+M^t)$. Recuperar $A$: $a_{ii}=Q(e_i)$, $a_{ij}=\tfrac12[Q(e_i+e_j)-Q(e_i)-Q(e_j)]$.
      - - Plan
        - |-
          Mitades en los términos cruzados.
  - pasos:
    - |-
      Diagonal: $a_{11}=1$, $a_{22}=1$, $a_{33}=-1$.
    - |-
      $5xy=\tfrac52xy+\tfrac52yx\Rightarrow a_{12}=a_{21}=\tfrac52$.
    - |-
      $-3xz\Rightarrow a_{13}=a_{31}=-\tfrac32$.
    - |-
      No hay $yz\Rightarrow a_{23}=a_{32}=0$.
          $$A=\begin{pmatrix}1&\tfrac52&-\tfrac32\\[2pt]\tfrac52&1&0\\[2pt]-\tfrac32&0&-1\end{pmatrix}.$$
    - |-
      <b>Comprobación:</b> $X^tAX=x^2+y^2-z^2+2\cdot\tfrac52xy+2\cdot(-\tfrac32)xz=Q$ ✓.
  - receta: |-
      cuadrados a la diagonal; cruzados, mitad en cada posición.
- id: ex-sep25-8
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Sept. 2025, problema 8, 1.er apartado (0,5 puntos)
    texto: |-
      X Sept. 2025 P8 (a)
  problema:
  - poli
  nivel: 1
  titulo: |-
    Sept. 2025, problema 8, 1.er apartado — matriz de $Q=6x_1^2+4x_1x_2+4x_1x_3+8x_2x_3$
  enunciado: |-
    Sea $Q(x_1,x_2,x_3)=6x_1^2+4x_1x_2+4x_1x_3+8x_2x_3$ una forma cuadrática. Halle la matriz $A$ asociada a $Q$. <i>(El 2.º apartado, autovalor del autovector $(2,1,1)$, está en el <a href="tema_4_2_valores_vectores_propios.html#examenes">tema 4.2</a>, y el 3.º, signatura, en el <a href="tema_6_3_clasificacion_formas_cuadraticas.html#ex-sep25-8">6.3</a>.)</i>
  pista: |-
    Pasa los coeficientes de $x_i^2$ a la diagonal y reparte a medias cada coeficiente cruzado. Comprueba con $X^tAX$.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Matriz asociada a una forma cuadrática en $\mathbb R^3$.
      - - |-
          Qué se usa
        - |-
          <b>Matriz de $Q$:</b> la diagonal son los coeficientes de $x_i^2$ y fuera de ella va <b>la mitad</b> del coeficiente de $x_ix_j$. Si $M$ no es simétrica, la matriz de $Q(x)=x^tMx$ es $\tfrac12(M+M^t)$. Recuperar $A$: $a_{ii}=Q(e_i)$, $a_{ij}=\tfrac12[Q(e_i+e_j)-Q(e_i)-Q(e_j)]$.
      - - Plan
        - |-
          Mitades en los términos cruzados.
  - pasos:
    - |-
      Cuadrados: $a_{11}=6$; no hay $x_2^2$ ni $x_3^2$, luego $a_{22}=a_{33}=0$.
    - |-
      $4x_1x_2\Rightarrow a_{12}=a_{21}=2$; $4x_1x_3\Rightarrow a_{13}=a_{31}=2$; $8x_2x_3\Rightarrow a_{23}=a_{32}=4$.
          $$A=\begin{pmatrix}6&2&2\\2&0&4\\2&4&0\end{pmatrix}.$$
    - |-
      Comprobación: $X^tAX=Q$ ✓. (Dato para los otros apartados: $A(2,1,1)^t=(16,8,8)^t=8\,(2,1,1)^t$ y $|A-\lambda I|=-(\lambda-8)(\lambda+4)(\lambda-2)$.)
  - receta: |-
      la de siempre; una diagonal con ceros es normal.
