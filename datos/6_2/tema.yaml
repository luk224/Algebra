h1: |-
  Formas cuadráticas
resumen: |-
  Una <b>forma cuadrática</b> es lo que sale de una forma bilineal <b>simétrica</b> al poner el <b>mismo</b> vector en sus dos entradas: $Q(x)=f(x,x)=X^tAX$. En coordenadas es un <b>polinomio homogéneo de grado 2</b>. Aprenderás a pasar del polinomio a su matriz simétrica y al revés, a calcular su rango, a usar $Q(\lambda x)=\lambda^2Q(x)$ y a cambiar de base con $A'=P^tAP$. Es la materia prima de la clasificación (<a href="tema_6_3_clasificacion_formas_cuadraticas.html">6.3</a>), las cónicas (6.4) y las cuádricas (6.5).
