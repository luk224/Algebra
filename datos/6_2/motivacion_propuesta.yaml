motivacion:
  s1: |-
    Si $f(x,y)=x_1y_2$ en $\mathbb R^2$, ¿vale lo mismo $f(x,y)$ que $f(y,x)$? ¿Y existe alguna forma bilineal para la que cambiar el orden solo cambie el signo?
  s2: |-
    El polinomio $x_1^2+4x_1x_2+3x_2^2$ mezcla cuadrados y productos cruzados. ¿Se puede escribir como «un vector, una matriz y el mismo vector otra vez», y qué ganamos con ello?
  s3: |-
    Te dan $2x_1^2-6x_1x_2+5x_2^2$ y piden «la matriz de la forma cuadrática». ¿Qué número va fuera de la diagonal, y cómo reconstruyes el polinomio a partir de una matriz?
  s4: |-
    Si multiplicas un vector por 2, ¿por cuánto se multiplica $Q(x)$? ¿Y si cambias $x$ por $-x$? ¿Se puede recuperar la forma bilineal sabiendo solo los valores de $Q$?
  s5: |-
    Si describes el mismo plano con otra base, el polinomio de $Q$ cambia de aspecto. ¿Qué cosas siguen siendo iguales sea cual sea la base, y cuál es la nueva matriz?
consignas:
  - animacion: |-
      Animación: forma cuadrática, parte simétrica y cambio de base (2D)
    consigna: |-
      Avanza por los pasos con una matriz $M$ no simétrica y mira cómo la matriz de $Q$ es su parte simétrica; después cambia la matriz de paso $P$ y fíjate en cómo cambia $S'$ y en que $Q(x)$ no cambia.
    pregunta: |-
      ¿Qué le pasa a $Q$ si $M$ es antisimétrica, y por qué la parte antisimétrica no aporta nada?
