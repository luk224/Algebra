kicker: |-
  Módulo 6 · Formas bilineales y cuadráticas · Tema 6.1
h1: |-
  Formas bilineales
resumen: |-
  Una <b>forma bilineal</b> es una «máquina» que recibe <b>dos</b> vectores y devuelve <b>un número</b>, y es lineal en cada entrada por separado: el producto escalar es el ejemplo que ya conoces. Aprenderás a reconocerlas, a guardarlas en una <b>matriz</b> $A$ ($f(x,y)=x^tAy$), a ver cómo cambia esa matriz al cambiar de base ($A'=P^tAP$, <b>congruencia</b>) y en qué se distingue de la semejanza del tema 4. Es la base de las formas cuadráticas, las cónicas y las cuádricas de los temas siguientes.
