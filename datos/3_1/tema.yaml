h1: |-
  Aplicaciones lineales: conceptos y propiedades
resumen: |-
  Una <b>aplicación lineal</b> es una función entre espacios vectoriales que «respeta» las dos operaciones que definen un espacio vectorial: la suma y el producto por escalares. En este tema aprenderás a <b>reconocerlas</b> (¿es lineal o no?), a usar sus <b>propiedades</b> básicas ($f(0)=0$, imágenes de combinaciones lineales, qué pasa con libres y ligados) y a <b>calcular la imagen de cualquier vector</b> conociendo solo las imágenes de unos pocos.
