esencial:
  intro: |-
    Una aplicación lineal es una función entre espacios vectoriales que respeta la suma y el producto por escalares; eso la deja determinada por lo que hace a una base.
  items:
  - |-
    $f:V\to W$ es lineal si $f(v+\lambda u)=f(v)+\lambda f(u)$ para todo $v,u$ y todo escalar $\lambda$ (equivale a conservar la suma y el producto por escalares). Si $V=W$ se llama endomorfismo.
  - |-
    Atajo para refutar: si $f(0)\neq0$, no es lineal. Pero $f(0)=0$ no basta para probar que lo sea; hay que desarrollar la definición con vectores genéricos.
  - |-
    En la práctica, $f$ es lineal cuando cada componente de $f(x)$ es una combinación $a_1x_1+\dots+a_nx_n$ sin término independiente, productos, potencias ni valores absolutos.
  - |-
    Propiedades: $f(0)=0$, $f(-v)=-f(v)$ y $f(a_1v_1+\dots+a_nv_n)=a_1f(v_1)+\dots+a_nf(v_n)$. Imágenes de ligados son ligados; imágenes de libres pueden ser ligadas.
  - |-
    Para hallar $f(w)$ con pocos datos: escribe $w$ como combinación de los vectores cuya imagen conoces (coordenadas respecto de esa base, no las componentes) y aplica la misma combinación a las imágenes.
tipos:
- id: lineal
  nombre: |-
    ¿Es lineal esta aplicación?
  receta: |-
    Prueba $f(0)=0$ para refutar; si pasa, desarrolla $f(v+\lambda u)$ y $f(v)+\lambda f(u)$ con vectores genéricos y compáralos.
  senal: |-
    «Compruebe si $f$ es lineal», «justifique si es un endomorfismo», o una fórmula $f(x_1,\dots)=(\dots)$ para analizar.
  pasos:
  - |-
    Calcula $f(0)$. Si no es el neutro del espacio de llegada, concluye que no es lineal y termina.
  - |-
    Si $f(0)=0$, mira la fórmula: términos constantes, productos, potencias o valores absolutos sugieren buscar un contraejemplo numérico con $f(v+\lambda u)\neq f(v)+\lambda f(u)$.
  - |-
    Para probar que es lineal: toma $v$, $u$ genéricos y $\lambda$ escalar, calcula $v+\lambda u$ y desarrolla por separado los dos miembros de la definición.
  - |-
    Si son iguales para todos, $f$ es lineal. Para endomorfismo, comprueba además que el espacio de partida y el de llegada coinciden.
  ejemplo: |-
    $h(x,y)=(x+y,\ xy)$ cumple $h(0,0)=(0,0)$, pero con $v=(1,1)$: $h(2v)=h(2,2)=(4,4)$ mientras que $2h(v)=(4,2)$. No es lineal.
  fallos: |-
    dar por bueno que es lineal solo porque $f(0)=0$ · escribir «$f(v+\lambda u)=f(v)+\lambda f(u)$» como primer paso (es lo que se quiere probar) · llamar endomorfismo a una lineal entre espacios distintos.
  series:
  - tipo: lineal
    titulo: |-
      ¿Es lineal esta aplicación?
    n: 5
- id: imagen
  nombre: |-
    Calcular $f(w)$ conociendo imágenes de otros vectores
  receta: |-
    Escribe $w$ como combinación lineal de los vectores con imagen conocida y aplica los mismos coeficientes a las imágenes.
  senal: |-
    «Sea $f$ lineal tal que $f(v_1)=\dots$ y $f(v_2)=\dots$; halle $f(w)$» (a veces con matrices o en $\mathbb R^4$).
  pasos:
  - |-
    Comprueba que los vectores $v_i$ con imagen conocida son una base del espacio de partida (tantos como la dimensión y $\det\neq0$).
  - |-
    Plantea $w=a_1v_1+\dots+a_kv_k$ como sistema (vectores en columnas) y resuélvelo.
  - |-
    Comprueba la combinación sustituyendo.
  - |-
    Aplica la linealidad: $f(w)=a_1f(v_1)+\dots+a_kf(v_k)$ con los mismos coeficientes.
  ejemplo: |-
    $f(1,1)=(3,0)$, $f(1,-1)=(1,2)$. Para $w=(5,1)$: $a+b=5$, $a-b=1$ da $a=3$, $b=2$. Entonces $f(5,1)=3(3,0)+2(1,2)=(11,4)$.
  fallos: |-
    usar las componentes de $w$ como coeficientes (solo valen con la base canónica) · no comprobar la combinación · usar vectores ligados como si fueran una base.
- id: prop
  nombre: |-
    Propiedades de las lineales (verdadero o falso)
  receta: |-
    Aplica $f(0)=0$, $f(-v)=-f(v)$ y la linealidad sobre combinaciones; para negar, busca un contraejemplo.
  senal: |-
    «Verdadero o falso», «justifique si es cierto que…», implicaciones sobre sistemas libres o ligados, o igualdades del tipo $5f(3,2)=f(15,10)$.
  pasos:
  - |-
    Traduce la afirmación a una propiedad: ¿es $f(0)=0$, $f(\lambda v)=\lambda f(v)$, $f(x-y)=f(x)-f(y)$ o un caso de libres y ligados?
  - |-
    Si es una propiedad general de lineales, demuéstrala a partir de la definición (por ejemplo $0=0+0$ para $f(0)=0$).
  - |-
    Si parece falsa, busca un contraejemplo concreto (una proyección que aplaste vectores libres sirve a menudo).
  - |-
    Recuerda: ligados van a ligados; libres pueden ir a ligados; imágenes libres implican originales libres.
  ejemplo: |-
    $f(x,y,z)=(x,y)$ y $x=(1,0,0)$, $y=(1,0,1)$ son libres, pero $f(x)=f(y)=(1,0)$ son ligados: «libres $\Rightarrow$ libres» es falso.
  fallos: |-
    creer que una lineal siempre conserva la independencia · decir que la recíproca de «ligados van a ligados» es cierta · usar $f(0)=0$ para demostrar que algo es lineal.
- id: datos
  nombre: |-
    ¿Se puede definir una lineal con estos datos?
  receta: |-
    Las imágenes solo se dan libremente sobre un sistema libre; sobre vectores ligados deben respetar la misma relación.
  senal: |-
    «¿Existe una aplicación lineal con $f(a)=\dots$ y $f(b)=\dots$?», «¿se conoce la imagen de todo vector?», «¿es $\operatorname{Im}f$ todo $\mathbb R^3$?».
  pasos:
  - |-
    Mira si los vectores con imagen dada son libres. Si son una base, la aplicación existe, es única y queda determinada en todo vector.
  - |-
    Si son ligados, escribe la relación entre ellos y comprueba que las imágenes cumplen la misma (con la linealidad).
  - |-
    Para la imagen: Im$f$ está generada por las imágenes de una base. Dos vectores de $\mathbb R^3$ no generan $\mathbb R^3$.
  ejemplo: |-
    $f(1,2)=(1,0)$ y $f(2,4)=(3,1)$: como $(2,4)=2(1,2)$, tendría que ser $f(2,4)=(2,0)\neq(3,1)$. No existe tal $f$.
  fallos: |-
    asignar imágenes arbitrarias a vectores ligados · pensar que $\operatorname{Im}f=W$ porque $f$ es lineal · olvidar que el número de generadores de la imagen es la dimensión del espacio de partida como máximo.
quiz:
- p: |-
    ¿Cuál de estas aplicaciones $\mathbb R^2\to\mathbb R^2$ es lineal?
  opciones:
  - t: |-
      $f(x,y)=(2x-y,\ x+3y)$
    ok: true
  - t: |-
      $f(x,y)=(x+1,\ y)$
    ok: false
    why: |-
      Lleva $(0,0)$ a $(1,0)$: una lineal siempre deja el origen en el origen.
  - t: |-
      $f(x,y)=(x,\ y^2)$
    ok: false
    why: |-
      Aparece una potencia: $f(2(0,1))=(0,4)$ y $2f(0,1)=(0,2)$.
  - t: |-
      $f(x,y)=(|x|,\ y)$
    ok: false
    why: |-
      El valor absoluto no conserva la suma: $f(1,0)+f(-1,0)=(2,0)\neq f(0,0)$.
  fb: |-
    Solo la primera tiene cada componente como combinación lineal de $x,y$ sin término independiente.
- p: |-
    $g(x,y)=(x+y,\ xy)$ cumple $g(0,0)=(0,0)$. ¿Qué se puede concluir?
  opciones:
  - t: |-
      Que es lineal, porque lleva el origen al origen.
    ok: false
    why: |-
      $g(0)=0$ es necesaria, no suficiente.
  - t: |-
      Que no es lineal, porque $g(2(1,1))=(4,4)$ y $2g(1,1)=(4,2)$.
    ok: true
  - t: |-
      Que no es lineal, porque el origen va al origen.
    ok: false
    why: |-
      Ir al origen no refuta nada; es lo que debe cumplir una lineal.
  - t: |-
      Nada, porque con un caso numérico no se puede refutar.
    ok: false
    why: |-
      Un solo contraejemplo basta para refutar la linealidad.
  fb: |-
    Un contraejemplo concreto basta para negar la linealidad; $g(0)=0$ no basta para probarla.
- p: |-
    $f:\mathbb R^2\to\mathbb R^2$ lineal con $f(1,1)=(3,0)$ y $f(1,-1)=(1,2)$. ¿Cuánto vale $f(5,1)$?
  opciones:
  - t: |-
      $(11,4)$
    ok: true
  - t: |-
      $(16,2)$
    ok: false
    why: |-
      Has usado las componentes $5$ y $1$ como coeficientes; son las coordenadas respecto de la base dada las que valen: $3$ y $2$.
  - t: |-
      $(4,2)$
    ok: false
    why: |-
      Has sumado $f(1,1)+f(1,-1)$, sin hallar los coeficientes de $(5,1)$.
  - t: |-
      $(9,0)$
    ok: false
    why: |-
      Solo has usado $3f(1,1)$; falta el término $2f(1,-1)$.
  fb: |-
    $(5,1)=3(1,1)+2(1,-1)$, luego $f(5,1)=3(3,0)+2(1,2)=(11,4)$.
- p: |-
    Sea $f:\mathbb R^2\to\mathbb R^2$ lineal con $f(1,0)=(2,1)$ y $f(0,1)=(-1,3)$. ¿Cuánto vale $f(4,-3)$?
  opciones:
  - t: |-
      $(11,-5)$
    ok: true
  - t: |-
      $(-10,9)$
    ok: false
    why: |-
      Has calculado $4f(0,1)-3f(1,0)$ al intercambiar los vectores.
  - t: |-
      $(8,4)$
    ok: false
    why: |-
      Solo has calculado $4f(1,0)$ y olvidas $-3f(0,1)$.
  - t: |-
      $(1,4)$
    ok: false
    why: |-
      Has sumado $f(1,0)+f(0,1)$ en lugar de usar los coeficientes $4$ y $-3$.
  fb: |-
    Con la base canónica las componentes son los coeficientes: $f(4,-3)=4(2,1)-3(-1,3)=(11,-5)$.
- p: |-
    Sea $f(x,y,z)=(x,y)$, lineal. ¿Cuál de las afirmaciones es cierta?
  opciones:
  - t: |-
      Si $\{u,v\}$ es libre, $\{f(u),f(v)\}$ es libre.
    ok: false
    why: |-
      Con $u=(1,0,0)$ y $v=(1,0,1)$ son libres pero $f(u)=f(v)=(1,0)$ son ligados.
  - t: |-
      Si $\{f(u),f(v)\}$ es libre, $\{u,v\}$ es libre.
    ok: true
  - t: |-
      Si $\{f(u),f(v)\}$ es ligado, $\{u,v\}$ es ligado.
    ok: false
    why: |-
      Con los mismos $u$, $v$ de arriba las imágenes son ligadas y ellos libres.
  - t: |-
      Toda lineal conserva los sistemas libres.
    ok: false
    why: |-
      Esta misma $f$ lo desmiente: aplasta el eje $z$.
  fb: |-
    Es la contrarrecíproca de «ligados van a ligados»: si $\lambda u+\mu v=0$, entonces $\lambda f(u)+\mu f(v)=0$ y la libertad de las imágenes da $\lambda=\mu=0$.
- p: |-
    ¿Existe una aplicación lineal $f:\mathbb R^2\to\mathbb R^2$ con $f(1,2)=(1,1)$ y $f(-2,-4)=(-2,-2)$?
  opciones:
  - t: |-
      Sí, porque $(-2,-4)=-2(1,2)$ y $-2(1,1)=(-2,-2)$.
    ok: true
  - t: |-
      No, porque los vectores $(1,2)$ y $(-2,-4)$ no forman base de $\mathbb R^2$.
    ok: false
    why: |-
      No hace falta una base: basta que las imágenes respeten la relación de dependencia entre los vectores.
  - t: |-
      No, porque hay dos datos y la dimensión es 2.
    ok: false
    why: |-
      Lo importante es si los datos son compatibles, no cuántos hay.
  - t: |-
      No, porque $f(1,2)$ y $f(-2,-4)$ son distintos.
    ok: false
    why: |-
      Son distintos, pero proporcionales con el mismo factor que los originales, que es lo exigible.
  fb: |-
    Los datos son compatibles con la linealidad ($f(-2v)=-2f(v)$). La aplicación existe, pero no es única: falta definir $f$ en un vector independiente.
capa: true
que_cae_nota: |-
  En los exámenes casi siempre se pide calcular la imagen de un vector a partir de las imágenes de otros dos (o cuatro) vectores, y a veces decidir si una aplicación dada es lineal. Domina bien esos dos tipos.
motivacion:
  s1: |-
    Un cajero cambia euros a dólares y a libras: si cambias 10 € y luego otros 20 €, ¿da lo mismo que cambiar 30 € de golpe? ¿Qué tienen que cumplir las reglas «que mueven vectores de un espacio a otro» para comportarse así de bien con las sumas y los múltiplos?
  s2: |-
    Tienes la regla $(x,y)\mapsto(x+1,y)$, que desplaza todo una unidad, y la regla $(x,y)\mapsto(2x,\,x+y)$. Las dos parecen inofensivas, pero ¿cómo decidir, sin fiarte del aspecto, cuál respeta las combinaciones de vectores y cuál no?
  s3: |-
    Si una regla respeta sumas y múltiplos, ¿qué le pasa al vector cero? ¿Y al opuesto de un vector? ¿Hay consecuencias automáticas que permitan descartar rápidamente una candidata a ser lineal?
  s4: |-
    Sabes que $f$ es lineal y solo conoces lo que hace con dos vectores concretos. ¿Puedes averiguar la imagen de otro vector cualquiera, o te faltan datos? ¿Cuántos datos hacen falta para conocer $f$ entera?
consignas:
- animacion: |-
    «transformar la combinación» frente a «combinar las transformadas»
  consigna: |-
    Elige primero una aplicación lineal y mueve $\alpha$ y $\beta$ fijándote en que las flechas verde y morada siempre coinciden. Después elige la traslación y busca los valores de $\alpha$ y $\beta$ para los que sí coinciden.
  pregunta: |-
    ¿Qué relación cumplen $\alpha$ y $\beta$ cuando la traslación engaña, y por qué eso no basta para decir que es lineal?
