motivacion:
  s1: |-
    Un cajero cambia euros a dólares y a libras: si cambias 10 € y luego otros 20 €, ¿da lo mismo que cambiar 30 € de golpe? ¿Qué tienen que cumplir las reglas «que mueven vectores de un espacio a otro» para comportarse así de bien con las sumas y los múltiplos?
  s2: |-
    Tienes la regla $(x,y)\mapsto(x+1,y)$, que desplaza todo una unidad, y la regla $(x,y)\mapsto(2x,\,x+y)$. Las dos parecen inofensivas, pero ¿cómo decidir, sin fiarte del aspecto, cuál respeta las combinaciones de vectores y cuál no?
  s3: |-
    Si una regla respeta sumas y múltiplos, ¿qué le pasa al vector cero? ¿Y al opuesto de un vector? ¿Hay consecuencias automáticas que permitan descartar rápidamente una candidata a ser lineal?
  s4: |-
    Sabes que $f$ es lineal y solo conoces lo que hace con dos vectores concretos. ¿Puedes averiguar la imagen de otro vector cualquiera, o te faltan datos? ¿Cuántos datos hacen falta para conocer $f$ entera?
consignas:
  - animacion: |-
      «transformar la combinación» frente a «combinar las transformadas»
    consigna: |-
      Elige primero una aplicación lineal y mueve $\alpha$ y $\beta$ fijándote en que las flechas verde y morada siempre coinciden. Después elige la traslación y busca los valores de $\alpha$ y $\beta$ para los que sí coinciden.
    pregunta: |-
      ¿Qué relación cumplen $\alpha$ y $\beta$ cuando la traslación engaña, y por qué eso no basta para decir que es lineal?
