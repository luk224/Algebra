h1: |-
  Clasificación de las formas cuadráticas
resumen: |-
  Dada una forma cuadrática $Q(x)=X^tAX$, ¿qué signo toma $Q(x)$ cuando recorres todos los vectores $x\neq0$? Si siempre es positiva, $Q$ es <b>definida positiva</b>; si a veces es positiva y a veces negativa, <b>indefinida</b>; y así hasta cinco clases. Aprenderás a decidirlo de tres maneras que deben coincidir: con los <b>valores propios</b> de $A$ (gracias a la diagonalización ortogonal del tema 5.3), con el <b>criterio de Sylvester</b> (menores principales, ideal para parámetros) y con los <b>invariantes</b> (rango y signatura). Además verás cómo se ve la clasificación: la superficie $z=Q(x_1,x_2)$ y las superficies de nivel $Q=c$ en $\mathbb R^3$.
