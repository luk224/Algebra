ejercicios:
- id: ej6-18
  nivel: 2
  pista: |-
    Forma la matriz simétrica de $Q$ y busca una base ortonormal de vectores propios: en ella $Q$ solo tendrá cuadrados. Ojo con que los vectores propios estén normalizados y con el orden de los valores propios.
  problema: [canonica]
- id: ej6-19
  nivel: 2
  pista: |-
    $Q$ es la forma cuadrática de $f$: la matriz de $f$ ya es simétrica y es la de $Q$. Diagonalízala con una base ortonormal para la forma canónica y mira los signos de los valores propios para clasificar.
  problema: [canonica, clasif]
- id: ej6-17
  nivel: 3
  pista: |-
    Escribe la matriz simétrica (los cruzados se parten a la mitad) y halla sus valores propios. Con un valor propio doble, el subespacio propio tiene dimensión 2: tendrás que ortogonalizar dentro de él.
  problema: [canonica]
- id: ej6-20
  nivel: 1
  pista: |-
    Sustituye $a=-1$ y mira si el polinomio es un cuadrado perfecto más otro término: ¿puede ser positivo? ¿se anula en algún vector no nulo?
  problema: [clasif]
- id: ej6-21
  nivel: 2
  pista: |-
    En cada apartado forma la matriz simétrica y decide por valores propios o por Sylvester; si Sylvester no encaja en ninguna rama, calcula los valores propios o busca dos vectores de signo opuesto.
  problema: [clasif]
- id: ej6-22
  nivel: 3
  pista: |-
    Primero la matriz de $f$ (simétrica, así que es la de $Q$). Después calcula rango y signatura mediante los valores propios o una forma canónica, y contrasta con cada afirmación.
  problema: [invar, clasif]
- id: ej6-23
  nivel: 3
  pista: |-
    Escribe la matriz con $\alpha$ (el cruzado $\alpha x_1x_3$ aporta $\alpha/2$) y calcula los menores $\Delta_1,\Delta_2,|A|$ como polinomios en $\alpha$. Plantea cuándo serían todos positivos y cuándo alternarían signo.
  problema: [param, clasif]
- id: ej6-24
  nivel: 3
  pista: |-
    Semidefinida positiva exige primero $|A|=0$: resuélvelo para $a$ y después comprueba para cada valor obtenido si de verdad es SP (Sylvester solo da «⇒»).
  problema: [param, clasif]
- id: ej-propio-1
  nivel: 1
  pista: |-
    Con matrices $2\times2$ no hace falta resolver la ecuación característica: el signo de $|A|$ y el de la diagonal bastan.
  problema: [clasif]
- id: ej-propio-2
  nivel: 2
  pista: |-
    Con todos los términos iguales fuera de la diagonal, la matriz es $I+$(algo sencillo): sus valores propios salen casi sin cuentas. Con el doble, ortogonaliza dentro de su subespacio propio.
  problema: [canonica, clasif]
- id: ej-propio-3
  nivel: 3
  pista: |-
    Calcula $\Delta_1,\Delta_2,|A|$ y obtén los valores de $a$ donde cada rama de Sylvester se cumple; los valores frontera y los casos que no encajan hay que mirarlos aparte con los valores propios.
  problema: [param, clasif]
- id: ex-feb22a2-6
  nivel: 1
  pista: |-
    Matriz simétrica de $Q$, valores propios y coeficientes de la forma canónica. Indica también la base y el orden de los valores propios.
  problema: [canonica]
- id: ex-feb24a-6
  nivel: 2
  pista: |-
    Matriz $\begin{pmatrix}1&2\\2&-2\end{pmatrix}$: halla sus valores propios y vectores propios unitarios; la base pedida son esos vectores, y $Q$ es la suma con los valores propios como coeficientes.
  problema: [canonica]
- id: ex-feb18a-b
  nivel: 2
  pista: |-
    La matriz de $Q$ tiene la forma diagonal por bloques $1\oplus$(bloque $2\times2$). Halla valores propios, un vector propio de cada uno y normalízalos; todos son ortogonales entre sí.
  problema: [canonica]
- id: ex-ene22a1-6
  nivel: 2
  pista: |-
    Traduce rango y signatura a «cuántos coeficientes de la forma canónica son no nulos y cuántos son positivos»; compara con $n=3$.
  problema: [invar]
- id: ex-sep25-8
  nivel: 2
  pista: |-
    El vector propio dado te regala un valor propio con $Av=\lambda v$. Los otros dos salen de la traza y del determinante: te bastan sus signos para la signatura.
  problema: [invar, clasif]
- id: ex-feb26b-6
  nivel: 1
  pista: |-
    Es $2\times2$: la definida positiva pide $\Delta_1>0$ y $|A|>0$. Recuerda que el término cruzado $a\,x_1x_2$ entra en la matriz como $a/2$.
  problema: [param, clasif]
- id: ex-feb25b-8b
  nivel: 2
  pista: |-
    Sylvester para definida positiva es una equivalencia: calcula $\Delta_1,\Delta_2,\Delta_3=|A|$ en función de $a$ y exige que los tres sean positivos.
  problema: [param, clasif]
que_cae_nota: |-
  Casi todos los ejercicios se reducen a diagonalizar una matriz simétrica o a mirar signos de menores y valores propios; los de examen se reparten entre la forma canónica con su base, la clasificación con parámetro y los invariantes.
esencial:
  intro: |-
    Clasificar una forma cuadrática es decir qué signo toma $Q(x)$ sobre los vectores $x\neq0$; se decide mirando solo la matriz simétrica $A$ de $Q$.
  items:
  - |-
    <b>Cinco clases.</b> Definida positiva ($Q>0$ si $x\neq0$), definida negativa ($Q<0$), semidefinida positiva ($Q\ge0$ y se anula en algún $x\neq0$), semidefinida negativa, e indefinida (toma valores de ambos signos). Un solo vector de signo contrario basta para refutar; para afirmar «definida» hacen falta los criterios.
  - |-
    <b>Valores propios.</b> Con $A$ simétrica, los signos de sus valores propios lo deciden todo: todos $>0$ es DP, todos $<0$ es DN, todos $\ge0$ con algún $0$ es SP (análogo SN), y de ambos signos es indefinida. Si $Q=X^tMX$ con $M$ no simétrica, usa $\tfrac12(M+M^t)$.
  - |-
    <b>Forma canónica.</b> Con $P$ ortogonal de vectores propios unitarios, $Q=\lambda_1y_1^2+\dots+\lambda_ny_n^2$ (mismo orden que en $P$). No es única, pero el número de coeficientes positivos (signatura) y no nulos (rango) sí lo es: ley de inercia.
  - |-
    <b>Sylvester (sin valores propios).</b> DP $\iff$ $\Delta_1,\dots,\Delta_n>0$; DN $\iff$ signos alternos empezando por $\Delta_1<0$. Para semidefinidas solo es «$\Rightarrow$» ($|A|=0$ y los demás de la rama): si no encaja, no concluyas nada. Ideal con parámetros.
  - |-
    <b>Invariantes.</b> DP: rango $=$ sig $=n$; DN: rango $=n$, sig $=0$; SP: rango $=$ sig $<n$; SN: rango $<n$, sig $=0$; indefinida: rango $\neq$ sig y sig $\neq0$.
tipos:
- id: canonica
  nombre: Hallar una forma canónica y la base
  receta: |-
    Diagonaliza la matriz simétrica con una base ortonormal de vectores propios.
  senal: |-
    El enunciado pide «una base en la que $Q$ sea suma de cuadrados», «una forma canónica» o «una matriz de paso ortogonal».
  pasos:
  - |-
    Escribe la matriz simétrica $A$ de $Q$ (cada término cruzado $c\,x_ix_j$ da $c/2$ en las posiciones $ij$ y $ji$).
  - |-
    Resuelve $|A-\lambda I|=0$ para obtener los valores propios (todos reales por ser $A$ simétrica).
  - |-
    Halla un vector propio por valor propio; si hay uno doble, una base de su subespacio propio ortogonalizada con Gram-Schmidt.
  - |-
    Normaliza cada vector: $B'=\{u_1,\dots,u_n\}$ y $P=(u_1\ \dots\ u_n)$.
  - |-
    Escribe $Q=\lambda_1y_1^2+\dots+\lambda_ny_n^2$ respetando el orden de las columnas de $P$.
  ejemplo: |-
    $Q=x_1^2+4x_1x_2+x_2^2$: $A=\begin{pmatrix}1&2\\2&1\end{pmatrix}$, $\lambda=3$ con $\tfrac1{\sqrt2}(1,1)$ y $\lambda=-1$ con $\tfrac1{\sqrt2}(1,-1)$. En esa base $Q=3y_1^2-y_2^2$.
  fallos: |-
    No normalizar los vectores (los coeficientes dejan de ser los valores propios) · No ortogonalizar dentro de un subespacio propio doble · Cambiar el orden de los $\lambda_i$ respecto de las columnas de $P$ · Escribir $a$ en vez de $a/2$ fuera de la diagonal
- id: clasif
  nombre: Clasificar una forma cuadrática
  receta: |-
    Mira los signos de los valores propios o de los menores de Sylvester de la matriz simétrica.
  senal: |-
    «Clasifique la forma cuadrática», «¿es definida positiva?», «¿es semidefinida?».
  pasos:
  - |-
    Forma la matriz simétrica $A$ de $Q$ (si te dan $M$ no simétrica, $A=\tfrac12(M+M^t)$).
  - |-
    Prueba lo rápido: $\Delta_1,\dots,\Delta_{n-1},|A|$ de Sylvester; en $2\times2$, el signo de $|A|$ y de $a_{11}$ lo deciden casi todo.
  - |-
    Si Sylvester no encaja en ninguna rama, calcula los valores propios (o busca dos vectores con $Q$ de signo opuesto).
  - |-
    Aplica la tabla: todos $>0$ DP, todos $<0$ DN, $\ge0$ con algún $0$ SP, $\le0$ con algún $0$ SN, ambos signos indefinida.
  ejemplo: |-
    $Q=2x_1^2+2x_1x_2+x_2^2$: $A=\begin{pmatrix}2&1\\1&1\end{pmatrix}$, $\Delta_1=2>0$, $|A|=1>0$: definida positiva.
  fallos: |-
    Clasificar por los signos de los coeficientes del polinomio · Decir «semidefinida» solo porque $|A|=0$ (puede ser indefinida) · Usar Sylvester para negar una semidefinida · Olvidar la matriz simétrica cuando $M$ no lo es
- id: param
  nombre: Clasificar según un parámetro
  receta: |-
    Escribe los menores de Sylvester como polinomios en el parámetro y resuelve las desigualdades de cada rama.
  senal: |-
    «¿Para qué valores de $a$ es $Q$ definida positiva / semidefinida?» o «según los valores de $\alpha$».
  pasos:
  - |-
    Forma la matriz simétrica con el parámetro (ojo: $a\,x_ix_j$ da $a/2$).
  - |-
    Calcula $\Delta_1,\dots,\Delta_{n-1},|A|$ como polinomios en el parámetro.
  - |-
    Definida positiva: exige todos $>0$ e intersecta las soluciones (rama «$\iff$», da el conjunto exacto).
  - |-
    Semidefinida: impón $|A|=0$, despeja el parámetro y comprueba en cada valor la clase real (por valores propios, pues Sylvester solo da «$\Rightarrow$»).
  ejemplo: |-
    $Q=2x_1^2+2x_1x_2+a\,x_2^2$: $A=\begin{pmatrix}2&1\\1&a\end{pmatrix}$, $\Delta_1=2>0$, $|A|=2a-1>0\iff a>\tfrac12$: es DP exactamente para $a>\tfrac12$.
  fallos: |-
    Olvidar comprobar los valores frontera (donde un menor se anula) · Pensar que «$|A|=0$» ya garantiza semidefinida · Resolver mal las desigualdades de grado 2 o 3 · Poner $a$ en vez de $a/2$ en el término cruzado
- id: invar
  nombre: Rango y signatura
  receta: |-
    Cuenta coeficientes no nulos (rango) y positivos (signatura) de una forma canónica, y compáralos con $n$.
  senal: |-
    El enunciado da o pide «rango», «signatura», o dice «rango $=$ signatura $=2$».
  pasos:
  - |-
    Obtén los valores propios de $A$ (o una forma canónica); no hace falta la base.
  - |-
    Rango = número de valores propios $\neq0$; signatura = número de positivos; negativos = rango $-$ signatura.
  - |-
    Si no puedes resolver la ecuación característica, usa $\operatorname{tr}A=\sum\lambda_i$, $|A|=\prod\lambda_i$ o un vector propio dado ($Av=\lambda v$).
  - |-
    Compara con $n$ y aplica la tabla de invariantes.
  ejemplo: |-
    $A=\begin{pmatrix}2&1&0\\1&2&0\\0&0&0\end{pmatrix}$ tiene valores propios $3,1,0$: rango $=2$, signatura $=2<3$: semidefinida positiva.
  fallos: |-
    Confundir signatura con (positivos $-$ negativos) o con el rango · Contar el $0$ como positivo · Concluir «definida» sin comparar el rango con $n$
quiz:
- p: |-
    ¿Cómo es $Q=x_1^2+4x_1x_2+x_2^2$?
  opciones:
  - t: |-
      Definida positiva, porque los coeficientes $1,4,1$ son positivos.
    ok: false
    why: |-
      Los signos de los coeficientes no deciden: hay que mirar la matriz y sus valores propios.
  - t: |-
      Semidefinida positiva.
    ok: false
    why: |-
      Eso exigiría $|A|=0$; aquí $|A|=1-4=-3\neq0$.
  - t: |-
      Indefinida.
    ok: true
  - t: |-
      Definida negativa.
    ok: false
    why: |-
      $Q(1,0)=1>0$, así que no puede ser negativa en todo $x\neq0$.
  fb: |-
    $A=\begin{pmatrix}1&2\\2&1\end{pmatrix}$, $|A|=-3<0$: valores propios $3$ y $-1$ de signos opuestos. Por ejemplo $Q(1,1)=6>0$ y $Q(1,-1)=-2<0$.
- p: |-
    $Q=x_1^2+2x_1x_2+x_2^2-x_3^2$ tiene $|A|=0$. ¿Cómo es?
  opciones:
  - t: |-
      Semidefinida negativa.
    ok: false
    why: |-
      Eso exigiría todos los valores propios $\le0$, pero $Q(1,0,0)=1>0$.
  - t: |-
      Semidefinida positiva, porque $|A|=0$.
    ok: false
    why: |-
      $|A|=0$ solo dice que hay un valor propio nulo; hay que mirar el resto.
  - t: |-
      Indefinida.
    ok: true
  - t: |-
      Definida positiva.
    ok: false
    why: |-
      Una definida positiva tiene $|A|>0$; aquí $|A|=0$.
  fb: |-
    Los valores propios son $2,\,0,\,-1$: hay uno positivo y uno negativo, luego es indefinida, aunque haya un $0$ (comprobación: $Q(1,0,0)=1>0$ y $Q(0,0,1)=-1<0$).
- p: |-
    Una forma cuadrática de $\mathbb R^3$ tiene rango $2$ y signatura $0$. ¿Cómo es?
  opciones:
  - t: |-
      Definida negativa.
    ok: false
    why: |-
      Para ser definida negativa el rango tendría que ser $3$.
  - t: |-
      Semidefinida negativa.
    ok: true
  - t: |-
      Indefinida.
    ok: false
    why: |-
      Indefinida necesita al menos un coeficiente positivo; con signatura $0$ no hay ninguno.
  - t: |-
      Semidefinida positiva.
    ok: false
    why: |-
      Eso pediría signatura igual al rango; aquí no hay coeficientes positivos.
  fb: |-
    Hay $2$ coeficientes no nulos y ninguno positivo, así que ambos son negativos; el tercero es $0$. Rango $<n$ y signatura $0$: semidefinida negativa.
- p: |-
    ¿Para qué valores de $a$ es $Q=x_1^2+2a\,x_1x_2+4x_2^2$ definida positiva?
  opciones:
  - t: |-
      $a<2$
    ok: false
    why: |-
      Falta $a>-2$: con $a=-5$, por ejemplo, $|A|=4-25<0$.
  - t: |-
      $-2<a<2$
    ok: true
  - t: |-
      $-2\le a\le2$
    ok: false
    why: |-
      En $a=\pm2$ se tiene $|A|=0$: es semidefinida, no definida.
  - t: |-
      $a>-2$
    ok: false
    why: |-
      Falta $a<2$: con $a=3$, $|A|=4-9<0$ y es indefinida.
  fb: |-
    $A=\begin{pmatrix}1&a\\a&4\end{pmatrix}$, $\Delta_1=1>0$ y $\Delta_2=4-a^2>0\iff|a|<2$.
- p: |-
    $Q=x_1^2+4x_1x_2+x_2^2$ se escribe $3y_1^2-y_2^2$ en una base. ¿Cuál NO puede ser una forma canónica de $Q$ en otra base?
  opciones:
  - t: |-
      $6y_1^2-2y_2^2$
    ok: false
    why: |-
      Sí puede (base ortogonal sin normalizar $(1,1),(1,-1)$): cambian los números, no los signos.
  - t: |-
      $y_1^2-y_2^2$
    ok: false
    why: |-
      Sí puede: reescalando los vectores se cambian los coeficientes sin cambiar los signos.
  - t: |-
      $3y_1^2+y_2^2$
    ok: true
  - t: |-
      $-y_1^2+3y_2^2$
    ok: false
    why: |-
      Sí puede: es la misma con los vectores propios en el otro orden.
  fb: |-
    La ley de inercia exige un coeficiente positivo y otro negativo (signatura $1$, rango $2$). $3y_1^2+y_2^2$ tendría signatura $2$.
- p: |-
    $Q=x_2^2$ en $\mathbb R^2$ tiene $\Delta_1=0$ y $|A|=0$. ¿Qué dice Sylvester y cuál es la clase?
  opciones:
  - t: |-
      No es semidefinida porque $\Delta_1$ no es positivo.
    ok: false
    why: |-
      La rama de semidefinidas es solo «$\Rightarrow$»: que no se cumpla no prueba que no sea semidefinida.
  - t: |-
      No decide; por valores propios ($0$ y $1$) es semidefinida positiva.
    ok: true
  - t: |-
      Es indefinida, porque $\Delta_1=0$.
    ok: false
    why: |-
      $Q=x_2^2\ge0$ en todos los vectores, no toma valores negativos.
  - t: |-
      Es definida positiva.
    ok: false
    why: |-
      $Q(1,0)=0$ con $(1,0)\neq0$.
  fb: |-
    Ninguna rama de Sylvester se cumple, así que el criterio no concluye. Los valores propios de $\operatorname{diag}(0,1)$ son $0$ y $1$: $Q\ge0$ y se anula en $(1,0)$.

