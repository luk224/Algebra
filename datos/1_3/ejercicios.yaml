  nivel: 1
  titulo: |-
    Sept. 2017 (tipo A), ejercicio 1 — factorización $LU$ y $\det A=\det U$ (test)
  enunciado: |-
    La factorización $LU$ de una matriz $A$ cuadrada de orden $n$: A) Siempre es única; B) NO se puede utilizar en la resolución de $AX=B$; C) Permite calcular el determinante de $A$ ya que coincide con el determinante de $U$; D) Ninguna de las anteriores es cierta.
  pista: |-
    Recuerda qué forma tienen $L$ (con unos en la diagonal) y $U$ (triangular) y qué dice el determinante de un producto. Descarta las opciones por separado.
  cuerpo:
  - html: |-
      <p><b>Respuesta: C.</b> Con $A=LU$, $L$ triangular inferior de diagonal unitaria (U p.45): $\det A=\det L\cdot\det U=1\cdot\det U$ (U p.26 y p.51). El ejercicio completo (con las razones por las que A y B son falsas) está resuelto en el <a href="tema_1_4_sistemas_ecuaciones.html#ex-sep17e1">tema 1.4</a>.</p>
- id: ex-feb18b1
  clase: examen
  fuentes:
  - l: X
    ref: |-
      Feb. 2018 (tipo B), ejercicio 1
    texto: |-
      X Feb. 2018 (B)
  problema:
  - calc
  - rango
  nivel: 2
  titulo: |-
    Feb. 2018 (tipo B), ejercicio 1 — $\det$ de orden 4 para probar que $S_1$ es base de $\mathbb R^4$
  enunciado: |-
    Sean el sistema $S_1$ de vectores definido por las filas de $\begin{pmatrix}4&1&-3&-4\\2&4&-4&3\\2&3&1&3\\4&0&-1&2\end{pmatrix}$ y el sistema $S_2$ definido por las filas de $\begin{pmatrix}1&1&-4\\1&5&6\\4&2&3\\-2&0&-2\end{pmatrix}$. Se pide comprobar que $S_1$ es una base de $\mathbb R^4$ y que $S_2$ es un sistema ligado de $\mathbb R^3$.
  pista: |-
    Un conjunto de $n$ vectores de $\mathbb R^n$ es base si el determinante de la matriz que forman es distinto de cero. En $S_2$ cuenta los vectores frente a la dimensión.
  cuerpo:
  - pasos:
    - |-
      <b>Por qué basta un determinante.</b> $S_1$ tiene 4 vectores en $\mathbb R^4$ (dimensión 4): son base $\iff$ son linealmente independientes $\iff$ la matriz $S$ con ellos por filas tiene rango 4 $\iff\det S\neq0$ (U p.27).
    - |-
      <b>Hacer ceros en la columna 2</b> con el 1 de la posición $(1,2)$ como pivote (reemplazos: no cambian el determinante). $F_2\to F_2-4F_1$: $(2-16,\,0,\,-4+12,\,3+16)=(-14,0,8,19)$. $F_3\to F_3-3F_1$: $(2-12,\,0,\,1+9,\,3+12)=(-10,0,10,15)$. $F_4$ ya tiene 0. $$\det S=\det\begin{pmatrix}4&1&-3&-4\\-14&0&8&19\\-10&0&10&15\\4&0&-1&2\end{pmatrix}.$$
    - |-
      <b>Desarrollar por la columna 2</b> (U p.24): solo queda $a_{12}=1$, con signo $(-1)^{1+2}=-1$: $$\det S=-\det\begin{pmatrix}-14&8&19\\-10&10&15\\4&-1&2\end{pmatrix}.$$
    - |-
      <b>Sacar factor 5 de la fila 2.</b> $F_2\to\tfrac15F_2$ divide el determinante por 5, así que fuera se multiplica por 5: $$\det\begin{pmatrix}-14&8&19\\-10&10&15\\4&-1&2\end{pmatrix}=5\det\begin{pmatrix}-14&8&19\\-2&2&3\\4&-1&2\end{pmatrix}.$$
    - |-
      <b>Sarrus</b> (U p.26). Positivos: $(-14)(2)(2)+8\cdot3\cdot4+19\cdot(-2)(-1)=-56+96+38=78$. Negativos: $19\cdot2\cdot4+(-14)\cdot3\cdot(-1)+8\cdot(-2)\cdot2=152+42-32=162$. Determinante $=78-162=-84$.
    - |-
      <b>Juntar:</b> $\det S=-1\cdot5\cdot(-84)=420\neq0$: rango 4, $S_1$ libre y, con 4 vectores en dimensión 4, <b>base</b> de $\mathbb R^4$.
    - |-
      <b>$S_2$.</b> Son 4 vectores de $\mathbb R^3$: el rango de una matriz $4\times3$ es a lo sumo 3 $<4$, luego son linealmente dependientes (ligados). No hace falta ningún cálculo. (Sympy: rango 3.)
  - resultado: |-
      $\det S=420$ (sympy) $\Rightarrow$ $S_1$ base; $S_2$ ligado por tener más vectores que la dimensión.
  - receta: |-
      $n$ vectores de $\mathbb R^n$ son base $\iff$ el determinante de la matriz que forman es $\neq0$. Para un $4\times4$: elige una fila/columna con un 1 (o ceros), haz ceros con reemplazos, desarrolla por adjuntos y acaba con Sarrus.
  - error: |-
      intentar calcular un determinante para $S_2$: no es cuadrada y el determinante no está definido (U p.23).
