ejercicios:
- id: ej1-21
  nivel: 2
  pista: |-
    Elige la columna que te dicen y escribe primero el tablero de signos $(-1)^{i+j}$; el parámetro $m$ se arrastra como un número más. ¿Qué menores $3\times3$ te quedan y cuál conviene calcular primero?
  problema: [calc]
- id: ej1-22
  nivel: 2
  pista: |-
    Cada término de la fórmula de Leibniz es un producto con un elemento por fila y por columna: los segundos subíndices forman una permutación de $\{1,\dots,5\}$. Prueba cada opción, completa la permutación y cuenta los intercambios que necesita para volver a la identidad.
  problema: [signo]
- id: ej1-23
  nivel: 1
  pista: |-
    Antes de calcular, comprueba de qué orden es cada matriz: si no es cuadrada, el determinante no existe. En las que sí lo son, mira si son triangulares, tienen una fila de ceros o son una permutación de la identidad.
  problema: [calc, ops]
- id: ej1-24
  nivel: 2
  pista: |-
    No hace falta invertir toda la matriz: la columna $k$ de $A^{-1}$ sale de los adjuntos de la fila $k$ de $A$ divididos por $\det A$. ¿Qué fila usarás y qué adjuntos necesitas?
  problema: [inversa]
- id: ej1-25
  nivel: 3
  pista: |-
    Relaciona la matriz adjunta con la inversa: para $A$ regular, $(\operatorname{Adj}A)^t$ es $A^{-1}$ multiplicada por un número. Pregúntate si ese número es cero y qué rango tiene entonces $B$.
  problema: [inversa, rango]
- id: ej1-26
  nivel: 2
  pista: |-
    Anota el factor por el que cada operación multiplica el determinante (escalar una fila, reemplazo, traspuesta) y multiplícalos. Recuerda que el reemplazo no cambia nada.
  problema: [ops]
- id: ej1-27
  nivel: 2
  pista: |-
    Compara las dos matrices columna a columna: ¿cuál es la nueva respecto de la dada? Fíjate en las columnas que se han multiplicado por un número y en si han cambiado de sitio.
  problema: [ops]
- id: ej1-28
  nivel: 3
  pista: |-
    Hay una fila con dos ceros y la matriz es casi diagonal: desarrolla por una de esas filas, y el determinante $3\times3$ que queda vuelve a tener ceros. Repite el desarrollo sin forzar Sarrus.
  problema: [calc]
- id: ej1-29
  nivel: 3
  pista: |-
    Calcula primero $\det$ en función de $a$ y factorízalo: donde no se anula, el rango es máximo. Para el valor que lo anula, sustituye y busca un menor de orden 2 no nulo.
  problema: [rango]
- id: sol-1_3-10
  nivel: 1
  pista: |-
    Escribe los seis productos de Sarrus con su signo y, por separado, los tres adjuntos de la columna 1 con el tablero de signos. Si no coinciden, hay un error de signo.
  problema: [calc]
- id: sol-1_3-11
  nivel: 2
  pista: |-
    Compara las filas entre sí: ¿alguna es múltiplo de otra? Si lo es, el determinante es cero sin calcular nada; luego busca un menor $2\times2$ no nulo para fijar el rango.
  problema: [rango, ops]
- id: sol-1_3-12
  nivel: 2
  pista: |-
    Traduce cada operación a su factor (permutar $-1$, escalar $\alpha$, reemplazo $1$) y multiplícalos por $\det A$. Para $\det(2A)$ piensa en el orden de la matriz.
  problema: [ops]
- id: sol-1_3-13
  nivel: 3
  pista: |-
    Calcula $\det P$ factorizado para ver qué valores de $a$ lo anulan. En esos valores baja de orden con un menor no nulo; para $a=2$, usa $\frac1{\det P}(\operatorname{Adj}P)^t$ con cuidado en la trasposición.
  problema: [rango, inversa]
- id: ex-sep25
  nivel: 2
  pista: |-
    Convierte cada operación sobre columnas en un factor para el determinante. Al final, la traspuesta tiene el mismo determinante que la matriz.
  problema: [ops]
- id: ex-feb23a
  nivel: 3
  pista: |-
    Compara fila a fila la matriz nueva con $A$: ¿qué filas aparecen, en qué orden, con qué factor y cuáles son una suma de filas? Separa la fila suma en dos determinantes con la linealidad en esa fila y descarta el que tenga filas repetidas.
  problema: [ops]
- id: ex-feb25b
  nivel: 3
  pista: |-
    Compara fila a fila la nueva matriz con $A$: identifica las filas intercambiadas, las multiplicadas por un número y las que resultan de sumar otra. Lo que sume una fila a otra no cambia el determinante; lo demás cuenta como factor.
  problema: [ops]
- id: ex-feb24b
  nivel: 2
  pista: |-
    Mira si las filas de $B$ son las de $A$ reordenadas o multiplicadas. Luego aplica $\det(ABA^t)=\det A\cdot\det B\cdot\det A^t$.
  problema: [ops]
- id: ex-feb19b4
  nivel: 1
  pista: |-
    Semejante a una diagonal significa $A=PDP^{-1}$. ¿Qué pasa con el determinante de un producto y con el de $P^{-1}$?
  problema: [ops]
- id: ex-sep24p4
  nivel: 1
  pista: |-
    Una matriz semejante a $D$ tiene el mismo determinante que $D$. En una diagonal el determinante es el producto de los valores propios repetidos según su multiplicidad.
  problema: [ops]
- id: ex-feb26b
  nivel: 1
  pista: |-
    Una matriz semejante a $D$ tiene el mismo determinante que $D$. Multiplica los valores propios de la diagonal tantas veces como indica su multiplicidad.
  problema: [ops]
- id: ex-feb19b1
  nivel: 2
  pista: |-
    Completa la permutación con los subíndices de columna que te dan, prueba las dos posibilidades para $(i,j)$ y cuenta los intercambios que necesita cada una.
  problema: [signo]
- id: ex-sep17a
  nivel: 1
  pista: |-
    Recuerda qué forma tienen $L$ (con unos en la diagonal) y $U$ (triangular) y qué dice el determinante de un producto. Descarta las opciones por separado.
  problema: [ops, calc]
- id: ex-feb18b1
  nivel: 2
  pista: |-
    Un conjunto de $n$ vectores de $\mathbb R^n$ es base si el determinante de la matriz que forman es distinto de cero. En $S_2$ cuenta los vectores frente a la dimensión.
  problema: [calc, rango]
esencial:
  intro: |-
    Lo que tienes que llevarte de los determinantes.
  items:
  - |-
    <b>Calcular:</b> $2\times2$ es $ad-bc$; $3\times3$ por Sarrus (solo orden 3); en cualquier orden, desarrollo por adjuntos con $A_{ij}=(-1)^{i+j}M_{ij}$ eligiendo la línea con más ceros.
  - |-
    <b>Efecto de las operaciones:</b> permutar $\times(-1)$, escalar una línea $\times\alpha$, reemplazo sin cambio. Además $\det A^t=\det A$, $\det(AB)=\det A\det B$, $\det(\alpha A)=\alpha^n\det A$ y las triangulares valen el producto de la diagonal.
  - |-
    <b>Atajo de examen:</b> con $A$ cuadrada de orden $n$, $\det A\neq0\iff A$ regular $\iff\operatorname{rang}A=n$. Con parámetro: factoriza $\det A$ y estudia aparte los valores que lo anulan.
  - |-
    <b>Inversa por adjuntos:</b> $A^{-1}=\frac1{\det A}(\operatorname{Adj}A)^t$ con $\det A\neq0$; la columna $k$ de $A^{-1}$ usa los adjuntos de la fila $k$ de $A$.
  - |-
    <b>Rango por menores:</b> es el mayor orden de un menor no nulo; $\det A=0$ solo dice que el rango es menor que $n$.

tipos:
- id: calc
  nombre: |-
    Calcular un determinante
  receta: |-
    Sarrus si es $3\times3$; si no, adjuntos por la línea con más ceros o escalonar llevando la cuenta de los factores.
  senal: |-
    El enunciado da una matriz concreta (a veces con parámetro) y pide «calcúlese $|A|$», quizá indicando fila o columna.
  pasos:
  - |-
    Comprueba que la matriz es cuadrada y mira si es triangular o tiene una línea de ceros (resultado inmediato).
  - |-
    Si es $3\times3$ y no hay atajo, aplica Sarrus; si es de orden mayor, elige la fila o columna con más ceros.
  - |-
    Escribe el tablero de signos $(-1)^{i+j}$ de esa línea y calcula solo los menores cuyo elemento no es cero.
  - |-
    Suma $\sum a_{ij}A_{ij}$; si un menor es $3\times3$ y vuelve a tener ceros, repite el desarrollo.
  ejemplo: |-
    $A=\begin{pmatrix}1&2&0\\3&1&4\\2&0&1\end{pmatrix}$, desarrollo por la fila 1: $|A|=1\cdot\begin{vmatrix}1&4\\0&1\end{vmatrix}-2\begin{vmatrix}3&4\\2&1\end{vmatrix}+0=1-2(-5)=11$.
  fallos: |-
    olvidar el signo $(-1)^{i+j}$ · aplicar Sarrus a una matriz que no es $3\times3$ · calcular también los menores de los elementos que valen cero
- id: ops
  nombre: |-
    Sé $\det A$: ¿cuánto vale el de la matriz nueva?
  receta: |-
    Traduce cada operación o propiedad a un factor y multiplica: permutar $-1$, escalar una línea $\alpha$, reemplazo $1$, producto $\det A\det B$.
  senal: |-
    «Sabiendo que $\det A=\dots$», «se hacen estas operaciones en las filas», «matriz semejante a una diagonal», $\det(ABA^t)$ o $\det(\alpha A)$.
  pasos:
  - |-
    Compara la matriz nueva con la dada, línea a línea, y anota qué operaciones elementales la producen (o qué producto de matrices es).
  - |-
    Asigna a cada operación su factor: intercambio $-1$, multiplicar una línea por $\alpha$ el factor $\alpha$, sumar un múltiplo de otra línea $1$.
  - |-
    Si hay una línea que es suma de dos, separa el determinante en dos por linealidad en esa línea y descarta el que tenga líneas proporcionales.
  - |-
    Multiplica los factores por el determinante conocido y recuerda $\det A^t=\det A$, $\det(\alpha A)=\alpha^n\det A$ y que semejantes tienen el mismo determinante.
  ejemplo: |-
    $A$ de orden 3 con $\det A=2$. Se intercambian dos filas, se multiplica otra por 5 y se suma una fila a otra: $\det B=2\cdot(-1)\cdot5\cdot1=-10$.
  fallos: |-
    decir que el reemplazo multiplica por $\alpha$ · confundir escalar una fila ($\alpha$) con escalar toda la matriz ($\alpha^n$) · olvidar el signo del intercambio
- id: signo
  nombre: |-
    Signo de un término del desarrollo
  receta: |-
    Los segundos subíndices forman una permutación; cuenta cuántos intercambios la devuelven a la identidad: par es $+$, impar es $-$.
  senal: |-
    «Término $a_{1p_1}a_{2p_2}\cdots$ del desarrollo de un determinante de orden $n$ con signo negativo/positivo»; hay subíndices desconocidos.
  pasos:
  - |-
    Escribe los segundos subíndices en orden de fila: es la permutación $p=(p_1,\dots,p_n)$, que debe usar cada columna una sola vez.
  - |-
    Con esa condición determina o prueba los valores desconocidos de los subíndices.
  - |-
    Cuenta los intercambios de dos posiciones que llevan $p$ a $(1,2,\dots,n)$.
  - |-
    Par: $\operatorname{sig}=+1$; impar: $\operatorname{sig}=-1$. Compara con lo que pide el enunciado.
  ejemplo: |-
    En orden 4, el término $a_{14}a_{22}a_{31}a_{43}$ tiene $p=(4,2,1,3)$: $(4,2,1,3)\to(1,2,4,3)\to(1,2,3,4)$, dos intercambios, luego signo $+$.
  fallos: |-
    contar los intercambios sobre los primeros subíndices en vez de los segundos · repetir una columna · pensar que el número de intercambios es único (solo lo es su paridad)
- id: rango
  nombre: |-
    Regularidad y rango con parámetro
  receta: |-
    Calcula $\det A$ factorizado: donde no se anula, rango máximo; donde se anula, busca un menor de orden inferior no nulo.
  senal: |-
    «Discute el rango según $a$», «¿para qué valores es invertible?», «comprobar que es base», o una matriz con una fila proporcional a otra.
  pasos:
  - |-
    Calcula $\det A$ en función del parámetro y factorízalo.
  - |-
    Para los valores con $\det\neq0$, la matriz es regular y el rango es el máximo $n$.
  - |-
    Para cada valor que anula $\det$, sustituye en la matriz y busca un menor de orden $n-1$ no nulo (basta uno); si todos son nulos, baja otro orden.
  - |-
    Enuncia el rango para cada caso, sin olvidar los valores especiales.
  ejemplo: |-
    $P=\begin{pmatrix}1&1&0\\1&a&1\\0&1&1\end{pmatrix}$ tiene $\det P=a-2$: rango 3 si $a\neq2$; para $a=2$ el menor $\begin{vmatrix}1&1\\1&2\end{vmatrix}=1\neq0$ da rango 2.
  fallos: |-
    creer que $\det A=0$ implica rango 1 o 0 · no estudiar los valores que anulan el determinante · dar por buena una condición sin comprobar el caso límite
- id: inversa
  nombre: |-
    Inversa o columna de la inversa por adjuntos
  receta: |-
    $A^{-1}=\frac1{\det A}(\operatorname{Adj}A)^t$; la columna $k$ de $A^{-1}$ usa los adjuntos de la fila $k$ de $A$.
  senal: |-
    «Hállese la columna (o el elemento) $k$ de $A^{-1}$», «calcula la inversa por adjuntos», o aparece la matriz adjunta.
  pasos:
  - |-
    Calcula $\det A$ y comprueba que es distinto de cero; si no, no hay inversa.
  - |-
    Calcula los adjuntos $A_{ij}=(-1)^{i+j}M_{ij}$ que necesites: todos para la inversa completa, solo los de una fila para una columna.
  - |-
    Coloca los adjuntos de la fila $k$ en la columna $k$ (esto es la trasposición) y divide por $\det A$.
  - |-
    Comprueba multiplicando $A$ por la columna obtenida: debe dar la columna $k$ de $I$.
  ejemplo: |-
    $A=\begin{pmatrix}1&2&0\\0&1&1\\1&0&1\end{pmatrix}$, $\det A=3$. Adjuntos de la fila 3: $2,-1,1$. La tercera columna de $A^{-1}$ es $\frac13(2,-1,1)^t$.
  fallos: |-
    no trasponer (poner los adjuntos de la fila $k$ en la fila $k$) · olvidar dividir por $\det A$ · errores de signo en el tablero
quiz:
- p: |-
    Si $A$ es de orden 4 y $\det A=3$, ¿cuánto vale $\det(2A)$?
  opciones:
  - t: |-
      $6$
    ok: false
    why: |-
      Has multiplicado por $2$ una sola vez; $2A$ multiplica las cuatro filas por $2$.
  - t: |-
      $12$
    ok: false
    why: |-
      Has usado $2\cdot2\cdot3$ (dos filas); son cuatro filas, luego $2^4$.
  - t: |-
      $48$
    ok: true
  - t: |-
      $24$
    ok: false
    why: |-
      Te has quedado en $2^3$; el orden es 4, así que el factor es $2^4$.
  fb: |-
    $\det(\alpha A)=\alpha^n\det A$ con $n=4$: $2^4\cdot3=48$.
- p: |-
    $\det A=2$ con $A$ de orden 3. Se intercambian dos filas, se multiplica una fila por 5 y a otra fila se le suma 7 veces una tercera. ¿Cuánto vale el determinante de la nueva matriz?
  opciones:
  - t: |-
      $-10$
    ok: true
  - t: |-
      $10$
    ok: false
    why: |-
      Falta el signo del intercambio: permutar dos filas multiplica por $-1$.
  - t: |-
      $-70$
    ok: false
    why: |-
      El reemplazo no multiplica por $7$: sumar un múltiplo de otra fila no cambia el determinante.
  - t: |-
      $-80$
    ok: false
    why: |-
      Has contado el reemplazo como $1+7$; el reemplazo siempre tiene factor $1$.
  fb: |-
    Factores: intercambio $-1$, escalar $5$, reemplazo $1$. Total $2\cdot(-1)\cdot5\cdot1=-10$.
- p: |-
    $A$ es una matriz de orden 2 semejante a $\begin{pmatrix}2&0\\0&-1\end{pmatrix}$. ¿Cuánto vale $\det A$?
  opciones:
  - t: |-
      $1$
    ok: false
    why: |-
      Has sumado los valores propios ($2+(-1)$): eso es la traza, no el determinante.
  - t: |-
      $-2$
    ok: true
  - t: |-
      $2$
    ok: false
    why: |-
      Falta el signo: $2\cdot(-1)=-2$.
  - t: |-
      No se puede saber sin conocer $P$
    ok: false
    why: |-
      Semejantes tienen el mismo determinante: $\det(PDP^{-1})=\det D$, sin importar $P$.
  fb: |-
    $A=PDP^{-1}$, luego $\det A=\det P\cdot\det D\cdot\frac1{\det P}=\det D=2\cdot(-1)=-2$.
- p: |-
    Sea $A=\begin{pmatrix}1&2&3\\2&4&6\\1&0&1\end{pmatrix}$. ¿Cuál es su rango?
  opciones:
  - t: |-
      $3$
    ok: false
    why: |-
      La fila 2 es el doble de la fila 1, así que $\det A=0$ y el rango no puede ser $3$.
  - t: |-
      $1$
    ok: false
    why: |-
      $\det A=0$ solo dice que el rango es menor que 3; el menor $\begin{vmatrix}1&2\\1&0\end{vmatrix}=-2\neq0$ prueba que es al menos 2.
  - t: |-
      $2$
    ok: true
  - t: |-
      $0$
    ok: false
    why: |-
      La matriz no es la nula; hay menores no nulos.
  fb: |-
    $\det A=0$ (filas proporcionales) y el menor $\begin{vmatrix}1&2\\1&0\end{vmatrix}=-2\neq0$ (filas 1 y 3, columnas 1 y 2), luego rango $2$.
- p: |-
    Si $\det A=4$ con $A$ de orden 3, ¿qué es cierto?
  opciones:
  - t: |-
      $\det(A^{-1})=\frac14$ y $\det(-A)=-4$
    ok: true
  - t: |-
      $\det(A^{-1})=-4$ y $\det(-A)=-4$
    ok: false
    why: |-
      La inversa tiene determinante $\frac1{\det A}$, no el opuesto.
  - t: |-
      $\det(A^{-1})=\frac14$ y $\det(-A)=4$
    ok: false
    why: |-
      $\det(-A)=(-1)^3\det A=-4$: con orden impar el signo sí cambia.
  - t: |-
      $\det(A^{-1})=\frac14$ y $\det(-A)=-12$
    ok: false
    why: |-
      Has hecho $-3\cdot4$; el factor correcto es $(-1)^n$ con $n=3$.
  fb: |-
    $\det(A^{-1})=1/\det A=\frac14$ y $\det(-A)=(-1)^3\cdot4=-4$.
- p: |-
    En un determinante de orden 3, ¿qué signo tiene el término $a_{13}a_{21}a_{32}$?
  opciones:
  - t: |-
      $+$
    ok: true
  - t: |-
      $-$
    ok: false
    why: |-
      La permutación es $(3,1,2)$ y se obtiene con dos intercambios, no con uno.
  - t: |-
      Depende de los valores de $a_{ij}$
    ok: false
    why: |-
      El signo solo depende de la permutación de subíndices.
  - t: |-
      No es un término del desarrollo
    ok: false
    why: |-
      Sí lo es: un elemento por fila y por columna.
  fb: |-
    Segundos subíndices $(3,1,2)\to(1,3,2)\to(1,2,3)$: dos intercambios, signo $+$. Es uno de los términos positivos de Sarrus.
