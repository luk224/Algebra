h1: Determinantes
resumen: |-
  Un número que se calcula a partir de una matriz cuadrada y que responde de golpe a varias preguntas: ¿es invertible la matriz?, ¿cuál es su rango?, ¿cómo se calcula la inversa sin resolver sistemas? Es también la pieza que, más adelante, sirve para hallar valores propios (Tema 4) y clasificar formas cuadráticas (Tema 6).
