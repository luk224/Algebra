kicker: |-
  Módulo 4 · Diagonalización de matrices · Tema 4.3
h1: |-
  Diagonalización de matrices
resumen: |-
  Cuándo y cómo se puede elegir una <b>base formada por vectores propios</b> para que la matriz de una aplicación lineal se convierta en una <b>matriz diagonal</b> $\Lambda=P^{-1}AP$: la definición 4.12, el teorema 4.6 (base de vectores propios), los criterios de diagonalizabilidad (valores propios distintos; $d_i=\alpha_i$, Teorema 4.7), la receta de cinco pasos para hallar $P$ y $\Lambda$ y su aplicación más útil, las potencias $A^k=P\Lambda^kP^{-1}$. Es el punto de llegada de los temas 4.1 y 4.2 y la puerta de los temas 4.4 (Jordan), 5.3 y 6.
