motivacion:
  s1: |-
    Una aplicación lineal $f:\mathbb R^2\to\mathbb R^2$ manda $(1,0)$ a $(2,1)$ y $(0,1)$ a $(0,3)$. ¿Podrías calcular a dónde va $(5,4)$ sin saber nada más de $f$? ¿Qué información mínima hace falta guardar?
  s2: |-
    Si te dicen que $f$ es lineal y que $f(1,1)=(2,3)$ y $f(1,2)=(1,1)$, ¿queda $f$ completamente fijada, o hay varias aplicaciones posibles? ¿Qué tienen de especial esos dos vectores de partida?
  s3: |-
    Una aplicación lineal puede describirse con una fórmula, con una lista de imágenes o con una sola tabla de números. ¿Cómo se ordenan esos números para que multiplicar la tabla por un vector dé directamente su imagen?
  s4: |-
    Quieres programar $f:\mathbb R^3\to\mathbb R^2$ para calcular imágenes rápido. ¿Cómo se escriben las coordenadas de $f(x)$ en función de las de $x$ de una vez, sin repetir la cuenta para cada vector?
  s5: |-
    En un examen te pueden dar los datos de $f$ de tres formas distintas: la fórmula, las imágenes de una base cualquiera o las bases de salida y llegada no canónicas. ¿Hay un método para cada caso que no se te quede a medias?
  s6: |-
    Ya tienes la matriz de $f$. ¿Puedes saber, solo mirándola, si $f$ es inyectiva, qué dimensión tiene su imagen y cuántos vectores se aplastan en el cero?

consignas:
  - animacion: la matriz se construye con las imágenes de la base
    consigna: |-
      Cambia los vectores $f(e_1)$ y $f(e_2)$ y el vector $x$, y fíjate en cómo las columnas de $A$ son siempre esas imágenes y en que $f(x)$ sale de combinarlas con las coordenadas de $x$.
    pregunta: |-
      Con los datos iniciales, $f(2,1)=2(1,2)+1(3,-1)=(5,3)$: ¿qué pasa con $f(x)$ si pones $x=(1,0)$ o $x=(0,1)$?
  - animacion: resolver el sistema de la primera fila de $A$
    consigna: |-
      Pulsa «siguiente» y observa qué operación por filas se hace en cada paso hasta que quedan despejadas $a$ y $b$; después cambia la matriz y prueba otros datos.
    pregunta: |-
      ¿Por qué el resultado $a=3$, $b=-1$ es la primera fila de $A$ y no la primera columna?
