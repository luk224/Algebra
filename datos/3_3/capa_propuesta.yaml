ejercicios:
- id: ej3-15
  nivel: 1
  pista: |-
    Cada columna de la matriz es la imagen de un vector de la base canónica. Escríbelas en columna y luego lee las filas.
  problema: [canon]
- id: ej3-17
  nivel: 1
  pista: |-
    La base de llegada es la canónica de $\mathcal M_{2\times2}$: pasa cada matriz imagen a sus 4 coordenadas (entradas por filas) y ponlas en columna.
  problema: [canon]
- id: ej3-18
  nivel: 1
  enunciado: |-
    El endomorfismo de $P_3$ que asigna a cada polinomio de grado $\le3$ su derivada, ¿qué matriz tiene en la base canónica? (Hay que elegir entre cuatro matrices $4\times4$.)
  pista: |-
    Deriva cada vector de la base $\{1,x,x^2,x^3\}$ y escribe el resultado en coordenadas de esa misma base; cada resultado es una columna.
  problema: [canon]
- id: ej3-19
  nivel: 2
  pista: |-
    Mira si los tres polinomios $1,x,x^2$ de los que te dan la imagen forman una base de $P_2$. Si es así, tienes todo: matriz, ecuaciones e imagen de cualquier polinomio, descomponiéndolo en esa base.
  problema: [canon, usar]
- id: ej-propio-1
  nivel: 1
  pista: |-
    Fíjate en el tamaño de $A$ (filas y columnas) para saber de qué espacio a qué espacio va. Después, la fila $i$ da la fórmula de la componente $i$ y las columnas son $f(e_j)$.
  problema: [usar, canon]
- id: ej-propio-2
  nivel: 2
  pista: |-
    Comprueba con un determinante que $\{(1,1),(1,2)\}$ es base. La matriz respecto de $B$ y $C_3$ tiene por columnas los datos tal cual; para la canónica, escribe $e_1$ y $e_2$ como combinación de la base y usa la linealidad.
  problema: [noncanon, canon]
- id: ej-propio-3
  nivel: 2
  pista: |-
    Calcula $f$ de cada vector de $B$ y escribe cada imagen como combinación de los vectores de $S$ (un sistema por cada una, o uno solo con un vector genérico). Esos coeficientes son las columnas.
  problema: [bases, usar]
- id: ex-feb26-2p7a
  nivel: 1
  pista: |-
    Es una fórmula con 4 variables y 3 componentes: la matriz tiene 3 filas y 4 columnas, y cada fila son los coeficientes de $x,y,z,t$ en esa componente.
  problema: [canon]
- id: ex-feb23-1p7b
  nivel: 2
  pista: |-
    Deriva tres veces cada polinomio de la base $\{1,x,x^2,x^3,x^4\}$ de $\wp_4$ y exprésalo en la base $\{1,x\}$ de $\wp_1$. Comprueba la matriz con el ejemplo del enunciado.
  problema: [canon]
- id: ex-feb18b-3
  nivel: 2
  pista: |-
    Los datos están en $(1,2)$ y $(2,0)$, no en $e_1,e_2$. Escribe $e_1$ y $e_2$ combinando esos dos vectores y aplica la linealidad (o resuelve $AP=F$).
  problema: [noncanon]
- id: ex-ene22a-3
  nivel: 2
  pista: |-
    Con $P$ (columnas los vectores de $B$) y $F$ (columnas sus imágenes) se cumple $AP=F$. Despeja $A$ con la inversa de $P$, o escribe $e_1,e_2,e_3$ en la base $B$.
  problema: [noncanon]
- id: ex-feb19a-3
  nivel: 2
  pista: |-
    Calcula $f$ de cada vector de la base de salida y pasa cada resultado a coordenadas en la base de llegada, ojo con el orden $\{(0,1),(1,0)\}$.
  problema: [bases]
- id: ex-feb26-2p8
  nivel: 3
  pista: |-
    Es un endomorfismo con la misma base $B$ en salida y llegada. Calcula $f(b_1)$ y $f(b_2)$ y exprésalos como combinación de $b_1,b_2$: esos coeficientes son las columnas.
  problema: [bases]
- id: ex-feb26-1p2
  nivel: 2
  pista: |-
    Las imágenes ya vienen en coordenadas de $B'$. Escribe las columnas y calcula el rango de la matriz $4\times3$ que resulta.
  problema: [usar, canon]
- id: ex-sep17a-3
  nivel: 1
  pista: |-
    Piensa qué datos se necesitan para escribir la matriz (bases de salida y llegada) y qué ocurre si cambias de base; descarta las opciones con un contraejemplo.
  problema: [usar]
- id: ej-propio-4
  nivel: 1
  pista: |-
    Es un endomorfismo con fórmula: fila $i$ = coeficientes de $x,y,z$ en la componente $i$. Para $f(1,1,1)$ multiplica la matriz por la columna $(1,1,1)^T$.
  problema: [canon, usar]
- id: ej-propio-5
  nivel: 2
  pista: |-
    Los vectores dados forman una base triangular. Escribe $e_3$, $e_2$ y $e_1$ en esa base empezando por el que sale más fácil, y despeja $f(e_3), f(e_2), f(e_1)$ por linealidad.
  problema: [noncanon]
- id: ej-propio-6
  nivel: 2
  pista: |-
    Calcula $f(1)$, $f(x)$, $f(x^2)$ (sustituye $x$ por $x+1$) y desarróllalos en la base $\{1,x,x^2\}$. Para $f(2-x+3x^2)$ usa las coordenadas $(2,-1,3)$.
  problema: [canon, usar]
- id: ej-propio-7
  nivel: 2
  pista: |-
    Imagen de cada vector de $B$, y luego sus coordenadas respecto de $S$. Para comprobar, halla las coordenadas de $v$ en $B$, multiplica por $A$ y compara con las de $f(v)$ en $S$.
  problema: [bases, usar]
tipos:
- id: canon
  nombre: Matriz asociada en bases canónicas
  receta: |-
    Columna $j$ = $f(e_j)$ en coordenadas de la base canónica de llegada.
  senal: |-
    Te dan la fórmula de $f$, o las imágenes de $e_1,\dots,e_m$, o piden «la matriz» sin hablar de bases (polinomios o matrices incluidos).
  pasos:
  - |-
    Calcula el tamaño: filas = dimensión del espacio de llegada, columnas = dimensión del de partida.
  - |-
    Para cada vector $e_j$ de la base canónica de partida, calcula $f(e_j)$ (sustituyendo $x_j=1$ y las demás $0$).
  - |-
    Pasa cada imagen a coordenadas de la base canónica de llegada (en polinomios, los coeficientes de $1,x,x^2,\dots$; en matrices, las entradas por filas).
  - |-
    Escribe esas coordenadas en columna, en el orden de la base, y comprueba con un vector.
  ejemplo: |-
    $f(x,y)=(x+2y,\,3x-y)$. $f(1,0)=(1,3)$ y $f(0,1)=(2,-1)$, luego $A=\begin{pmatrix}1&2\\3&-1\end{pmatrix}$. Comprobación: $A\binom{1}{1}=\binom{3}{2}=f(1,1)$.
  fallos: |-
    Poner las imágenes en filas (matriz traspuesta) · Tamaño al revés ($m\times n$ en vez de $n\times m$) · Escribir al revés las coordenadas de un polinomio ($2x^3+5x^2-1$ es $(-1,0,5,2)$) · Cambiar el orden de la base a mitad de la matriz
- id: noncanon
  nombre: Matriz canónica a partir de imágenes de una base no canónica
  receta: |-
    Si $f(b_i)$ se conoce para una base $\{b_i\}$, despeja $f(e_j)$ por linealidad, o resuelve $AP=F$.
  senal: |-
    Los datos son $f(1,1)=\dots$, $f(1,2)=\dots$ (vectores que no son $e_j$) y piden la matriz «en las bases canónicas» o $f(x,y)$.
  pasos:
  - |-
    Comprueba que los vectores dados son una base del espacio de partida (determinante o rango); si no, los datos no bastan o se contradicen.
  - |-
    Escribe cada $e_j$ como combinación de los $b_i$ (resolviendo un sistema).
  - |-
    Aplica la linealidad: $f(e_j)=\sum c_i f(b_i)$. Esas imágenes son las columnas de $A$.
  - |-
    Comprueba multiplicando $A$ por cada $b_i$: debe salir $f(b_i)$.
  ejemplo: |-
    $f(1,1)=(2,3)$, $f(1,2)=(1,1)$. Como $e_2=(1,2)-(1,1)$ y $e_1=2(1,1)-(1,2)$: $f(e_2)=(-1,-2)$, $f(e_1)=(3,5)$. Así $A=\begin{pmatrix}3&-1\\5&-2\end{pmatrix}$ y $A\binom{1}{2}=\binom{1}{1}$.
  fallos: |-
    Usar las imágenes dadas como columnas de la matriz canónica · No comprobar que los vectores son base · Despejar mal los $e_j$ (hazlo siempre con comprobación) · Dejar la fila en vez de la columna al resolver $AP=F$
- id: bases
  nombre: Matriz respecto de bases B y S no canónicas
  receta: |-
    Columna $j$ = coordenadas en $S$ de $f(b_j)$, donde $b_j$ es el $j$-ésimo vector de $B$.
  senal: |-
    El enunciado dice «respecto de las bases $B$ y $S$» o «en la base $B$» con vectores que no son los canónicos.
  pasos:
  - |-
    Calcula $f(b_j)$ para cada vector $b_j$ de la base de partida $B$, usando la fórmula de $f$.
  - |-
    Escribe cada $f(b_j)$ como combinación de los vectores de $S$: $f(b_j)=a_{1j}u_1+\dots+a_{nj}u_n$. Resuelve el sistema (un vector genérico $(p,q)$ evita repetirlo).
  - |-
    Coloca los coeficientes $a_{ij}$ en la columna $j$, respetando el orden de $B$ y de $S$.
  - |-
    Si es un endomorfismo con «la base $B$», usa $B$ en salida y en llegada. Comprueba con un vector.
  ejemplo: |-
    $f(x,y)=(x+y,\,x-y)$, $B=\{(1,0),(1,1)\}$, $S=\{(1,1),(1,-1)\}$. $f(1,0)=(1,1)=1\,u_1+0\,u_2$ y $f(1,1)=(2,0)=1\,u_1+1\,u_2$. Luego $A=\begin{pmatrix}1&1\\0&1\end{pmatrix}$.
  fallos: |-
    Dejar $f(b_j)$ en componentes canónicas (es otra matriz) · Calcular las coordenadas de $b_j$ en lugar de las de $f(b_j)$ · Cambiar el orden de los vectores de $S$ · Aplicar $A$ a un vector dado en componentes canónicas cuando $X$ debe estar en coordenadas de $B$
- id: usar
  nombre: "Usar la matriz: ecuaciones, imagen y rango"
  receta: |-
    $Y=AX$ con $X$ en coordenadas de $B$ e $Y$ en coordenadas de $S$; el rango de $A$ es $\operatorname{Dim}\operatorname{Im}f$.
  senal: |-
    Te dan $A$ y piden ecuaciones, la imagen de un vector, el espacio de llegada, el rango, o un verdadero/falso sobre la dependencia de las bases.
  pasos:
  - |-
    Lee el tamaño $n\times m$: $m$ = dimensión de partida (columnas), $n$ = dimensión de llegada (filas).
  - |-
    Escribe las ecuaciones $y_i=a_{i1}x_1+\dots+a_{im}x_m$ (una por fila).
  - |-
    Para un vector concreto, pasa a coordenadas de $B$, multiplica $AX$ y, si $S$ no es canónica, reconstruye el vector con $y_1u_1+\dots$.
  - |-
    Para el rango, escalona $A$: $\operatorname{Dim}\operatorname{Im}f=\operatorname{rang}A$ y $\operatorname{Dim}\operatorname{Nuc}f=m-\operatorname{rang}A$.
  ejemplo: |-
    $A=\begin{pmatrix}1&2\\2&4\end{pmatrix}$ (bases canónicas): $y_1=x_1+2x_2$, $y_2=2x_1+4x_2$. $A\binom11=\binom36$. La 2.ª fila es el doble de la 1.ª: $\operatorname{rang}A=1$, luego $\operatorname{Dim}\operatorname{Nuc}f=2-1=1$.
  fallos: |-
    Multiplicar $A$ por un vector en componentes cuando $X$ debe estar en coordenadas de $B$ · Confundir filas con columnas al contar el rango de $\operatorname{Im}$ · Creer que la matriz no depende de las bases (el rango sí es invariante, la matriz no)
esencial:
  intro: |-
    Una aplicación lineal queda fijada por lo que hace con una base, y esa información se guarda en la matriz asociada.
  items:
  - |-
    <b>Teorema 3.2:</b> si $\{e_1,\dots,e_m\}$ es base de $V$, $f$ queda determinada por $f(e_1),\dots,f(e_m)$, con $f(v)=v_1f(e_1)+\dots+v_mf(e_m)$. Hacen falta las imágenes de una base <b>entera</b>; con vectores dependientes hay que comprobar que los datos no se contradicen.
  - |-
    <b>Matriz asociada (Def. 3.4):</b> la columna $j$ son las coordenadas en $S$ de $f(e_j)$. Tamaño $(\operatorname{Dim}W)\times(\operatorname{Dim}V)$: filas = llegada, columnas = partida.
  - |-
    <b>Ecuaciones:</b> $Y=AX$, con $X$ las coordenadas del vector en $B$ e $Y$ las de su imagen en $S$. Solo en bases canónicas coinciden con las componentes.
  - |-
    <b>La matriz depende de las bases, el rango no:</b> $\operatorname{rang}A=\operatorname{Dim}\operatorname{Im}f$ y $\operatorname{Dim}\operatorname{Nuc}f=m-\operatorname{rang}A$.
que_cae_nota: |-
  Los ejercicios se han clasificado por la pregunta principal; varios mezclan tipos (por ejemplo, pedir la matriz y después usarla para una imagen o un rango).
quiz:
- p: |-
    Sea $f:\mathbb R^3\to\mathbb R^2$ lineal. Respecto de las bases canónicas, su matriz asociada es de orden…
  opciones:
  - t: |-
      $3\times2$
    ok: false
    why: |-
      Has puesto el espacio de partida en las filas. Las columnas son tantas como la dimensión de partida.
  - t: |-
      $2\times3$
    ok: true
  - t: |-
      $3\times3$
    ok: false
    why: |-
      Solo sería cuadrada si los dos espacios tuvieran la misma dimensión.
  - t: |-
      $2\times2$
    ok: false
    why: |-
      Con partida de dimensión 3 hay 3 vectores en la base, luego 3 columnas.
  fb: |-
    Filas = dimensión de llegada (2), columnas = dimensión de partida (3).
- p: |-
    $f:\mathbb R^2\to\mathbb R^2$ lineal con $f(1,0)=(2,1)$ y $f(0,1)=(0,3)$. ¿Cuánto vale $f(2,-1)$?
  opciones:
  - t: |-
      $(4,-1)$
    ok: true
  - t: |-
      $(4,5)$
    ok: false
    why: |-
      Has sumado $2f(e_1)+f(e_2)$ en lugar de restar: la segunda coordenada de $(2,-1)$ es $-1$.
  - t: |-
      $(2,-1)$
    ok: false
    why: |-
      Eso sería $f$ = identidad; aquí hay que aplicar la linealidad con las imágenes dadas.
  - t: |-
      $(2,1)$
    ok: false
    why: |-
      Solo has usado $f(e_1)$ y has olvidado el sumando de $e_2$.
  fb: |-
    $f(2,-1)=2f(1,0)-f(0,1)=2(2,1)-(0,3)=(4,-1)$. Equivale a $A\binom{2}{-1}$ con $A=\begin{pmatrix}2&0\\1&3\end{pmatrix}$.
- p: |-
    $f:\mathbb R^2\to\mathbb R^2$ lineal con $f(1,1)=(1,2)$ y $f(1,2)=(0,1)$. Su matriz en las bases canónicas es…
  opciones:
  - t: |-
      $\begin{pmatrix}1&0\\2&1\end{pmatrix}$
    ok: false
    why: |-
      Has puesto como columnas las imágenes de $(1,1)$ y $(1,2)$, que no son los vectores de la base canónica.
  - t: |-
      $\begin{pmatrix}2&-1\\3&-1\end{pmatrix}$
    ok: true
  - t: |-
      $\begin{pmatrix}1&2\\0&1\end{pmatrix}$
    ok: false
    why: |-
      Ese error pone las imágenes en filas y además no despeja $f(e_1)$ y $f(e_2)$.
  - t: |-
      $\begin{pmatrix}2&3\\-1&-1\end{pmatrix}$
    ok: false
    why: |-
      Es la traspuesta de la correcta: las imágenes $f(e_j)$ van en columnas.
  fb: |-
    $e_2=(1,2)-(1,1)$ y $e_1=2(1,1)-(1,2)$, luego $f(e_2)=(-1,-1)$ y $f(e_1)=(2,3)$. Comprobación: $A\binom11=\binom12$ y $A\binom12=\binom01$.
- p: |-
    $f(x,y)=(x+y,\,x-y)$ y $S=\{(1,1),(1,-1)\}$. Si $f(b)=(3,1)$, sus coordenadas en $S$ son…
  opciones:
  - t: |-
      $(3,1)$
    ok: false
    why: |-
      Esas son las componentes en la base canónica, no en $S$.
  - t: |-
      $(1,2)$
    ok: false
    why: |-
      Has cambiado el orden: la primera coordenada acompaña a $(1,1)$.
  - t: |-
      $(2,1)$
    ok: true
  - t: |-
      $(2,-1)$
    ok: false
    why: |-
      $2(1,1)-(1,-1)=(1,3)$, no $(3,1)$.
  fb: |-
    $a(1,1)+b(1,-1)=(3,1)\Rightarrow a+b=3,\ a-b=1\Rightarrow a=2,\ b=1$. En la matriz asociada se escriben estas coordenadas, no las componentes.
- p: |-
    $D:\wp_2\to\wp_2$ es la derivada, con la base $\{1,x,x^2\}$ en ambos lados. Las coordenadas de $D(2+5x+x^2)$ son…
  opciones:
  - t: |-
      $(5,2,0)$
    ok: true
  - t: |-
      $(0,5,2)$
    ok: false
    why: |-
      Has ordenado por potencias decrecientes; en la base $\{1,x,x^2\}$ el término independiente va primero.
  - t: |-
      $(5,2,1)$
    ok: false
    why: |-
      Al derivar $x^2$ sale $2x$ y no queda término en $x^2$: la última coordenada es 0.
  - t: |-
      $(2,5,0)$
    ok: false
    why: |-
      Esas serían (con un cero) las coordenadas de $p$ sin derivar; hay que aplicar $D$.
  fb: |-
    $D(2+5x+x^2)=5+2x$, con coordenadas $(5,2,0)$. Usando la matriz: $\begin{pmatrix}0&1&0\\0&0&2\\0&0&0\end{pmatrix}\begin{pmatrix}2\\5\\1\end{pmatrix}=\begin{pmatrix}5\\2\\0\end{pmatrix}$.
- p: |-
    ¿Existe una aplicación lineal $f:\mathbb R^2\to\mathbb R^2$ con $f(1,2)=(1,0)$ y $f(2,4)=(0,1)$?
  opciones:
  - t: |-
      Sí, y es única, porque hay dos vectores y dos imágenes
    ok: false
    why: |-
      $(1,2)$ y $(2,4)$ son proporcionales, no forman base. No basta con contar vectores.
  - t: |-
      Sí, pero hay infinitas
    ok: false
    why: |-
      Los datos se contradicen, así que no hay ninguna.
  - t: |-
      No: la linealidad fuerza $f(2,4)=2f(1,2)=(2,0)\neq(0,1)$
    ok: true
  - t: |-
      No se puede saber sin más datos
    ok: false
    why: |-
      Sí se sabe: los datos son incompatibles entre sí.
  fb: |-
    Como $(2,4)=2(1,2)$, la linealidad obliga a $f(2,4)=2f(1,2)=(2,0)$, que no coincide con $(0,1)$. Con vectores dependientes hay que comprobar siempre la coherencia.
