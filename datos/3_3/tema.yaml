h1: |-
  Ecuaciones y matriz asociada
resumen: |-
  Una aplicación lineal queda <b>totalmente determinada</b> por lo que hace con los vectores de una base. Esa información se guarda en una tabla de números, la <b>matriz asociada</b>: cada columna son las coordenadas de la imagen de un vector de la base. Con ella, calcular $f(x)$ se reduce a multiplicar una matriz por una columna: $Y=AX$.
