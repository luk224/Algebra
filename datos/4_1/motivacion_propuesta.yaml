motivacion:
  s1: |-
    En una clase, ¿qué significa que dos alumnos «estén relacionados» si tienen la misma edad, o si uno es más alto que el otro? ¿Qué diferencia hay entre estas dos formas de comparar, y cuál de ellas permite agrupar a los alumnos sin dejar a nadie fuera?
  s2: |-
    Si agrupas a todos los enteros según su resto al dividir entre 3, cada número cae en un único grupo y no queda ninguno suelto. ¿Qué propiedades tiene que cumplir una regla de comparación para repartir un conjunto así en grupos limpios?
  s3: |-
    Las matrices $\begin{pmatrix}1&2\\2&4\end{pmatrix}$ y $\begin{pmatrix}1&0\\0&0\end{pmatrix}$ son muy distintas a simple vista, pero describen «lo mismo» salvo un cambio de bases. ¿Cómo saber, sin probar cambios al azar, si dos matrices del mismo tamaño son equivalentes?
  s4: |-
    Una misma matriz puede representar una aplicación lineal o una forma bilineal, y al cambiar de base se transforma de dos maneras distintas ($Q^{-1}AQ$ frente a $Q^tAQ$). ¿Por qué hacen falta dos nombres, y qué se conserva en cada caso?
  s5: |-
    Para demostrar que dos matrices son semejantes hay que encontrar una $P$; pero ¿cómo demostrar que no existe ninguna? ¿Qué números podrías calcular de cada matriz para descartarlo de un vistazo?
consignas:
  - animacion: |-
      Animación: el rango es el invariante
    consigna: |-
      Avanza paso a paso el escalonado de $C$ y cuenta cuántas filas no nulas quedan. Después edita la matriz con otros números y fíjate en cuándo cambia ese conteo.
    pregunta: |-
      ¿Por qué da igual qué operaciones por filas hagas: qué número es el mismo al final?
  - animacion: |-
      Animación: semejante frente a congruente
    consigna: |-
      Con la misma $A$ y la misma $Q$, compara $Q^{-1}AQ$ y $Q^tAQ$ y fíjate en el determinante y la traza de cada una. Prueba también el preset «Q singular».
    pregunta: |-
      ¿Cuál de las dos operaciones conserva el determinante y la traza, y por qué la matriz de paso debe ser regular?
