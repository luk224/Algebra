  Módulo 4 · Diagonalización de matrices · Tema 4.1
h1: |-
  Relaciones de equivalencia
resumen: |-
  Cómo «clasificar» objetos que comparten una cualidad (relaciones de equivalencia y clases) y, en concreto, cómo clasificar matrices: <b>equivalentes</b> ($B=MAN$, las que tienen el mismo rango), <b>congruentes</b> ($B=P^tAP$) y <b>semejantes</b> ($A'=P^{-1}AP$, las que representan el mismo endomorfismo en bases distintas). Es la base de todo el módulo 4: diagonalizar es buscar, en la clase de semejanza de una matriz, una diagonal.
