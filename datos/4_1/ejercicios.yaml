      Ene. 2022 (tipo A), ejercicio 5
    texto: |-
      X Ene. 2022 (A) ej. 5
  problema:
  - clasif
  nivel: 2
  titulo: |-
    Ene. 2022 (tipo A), ejercicio 5 — matrices de Gram del mismo producto escalar en dos bases
  enunciado: |-
    Si $G$ y $G'$ son dos matrices de Gram del mismo producto escalar en bases diferentes, razonar si son o no ciertas las siguientes afirmaciones: los dos determinantes son iguales y ambas matrices son congruentes y equivalentes.
  pista: |-
    Las dos matrices de Gram representan la misma forma en bases distintas: relaciónalas con $P^tGP$ y calcula qué le pasa al determinante.
  cuerpo:
  - html: |-
      <p><b>Qué se pide.</b> Tres afirmaciones. El concepto de matriz de Gram es del tema 5.1; el núcleo de la pregunta (congruencia y equivalencia) es de este tema. Solo necesitas saber que, al cambiar de base, $G'=Q^tGQ$ (U Teor. 5.1, p.198).</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Comparar dos matrices de Gram del mismo producto escalar.
      - - |-
          Cómo lo pienso
        - |-
          El cambio de base da $G'=Q^tGQ$: congruentes y equivalentes. Los determinantes difieren en el factor $|Q|^2$.
      - - |-
          Qué uso
        - |-
          <b>Tres relaciones entre matrices (Def. 4.3-4.5):</b> equivalentes $B=MAN$ ($M,N$ regulares cualesquiera) $\iff$ mismo rango; congruentes $B=P^tAP$; semejantes $B=P^{-1}AP$. Semejantes y congruentes son casos particulares de equivalentes. <b>Semejantes</b> comparten determinante, traza y polinomio característico. <b>Gram:</b> $G=(e_i\bullet e_j)$; con $Q$ el cambio de base, $G'=Q^tGQ$.
      - - |-
          Por dónde empiezo
        - |-
          Deduzco $G'=Q^tGQ$ y refuto con un ejemplo.
  - pasos:
    - |-
      <b>Matriz de Gram</b> en una base $B$: $G=(e_i\bullet e_j)$, con $x\bullet y=X^tGY$. Si $Q$ es el cambio de $B'$ a $B$, $X=QX'$ e $Y=QY'$, luego
            $$x\bullet y=X'^t(Q^tGQ)Y',$$
            <p>y por unicidad $G'=Q^tGQ$.</p>
    - |-
      <b>Congruentes: VERDADERA.</b> $Q$ es regular (cambio de base) y $G'=Q^tGQ$ es exactamente la Def. 4.4.
    - |-
      <b>Equivalentes: VERDADERA.</b> $M=Q^t$ y $N=Q$ son regulares: Def. 4.3. En particular tienen el mismo rango (aquí $n$, porque las matrices de Gram son regulares).
    - |-
      <b>Mismos determinantes: FALSA en general.</b> $|G'|=|Q|^2|G|$. Contraejemplo: producto escalar estándar de $\mathbb R^2$, $B$ canónica, $G=I_2$; $B'=\{(1,1),(1,-1)\}$, $Q=\begin{pmatrix}1&1\\1&-1\end{pmatrix}$ ($|Q|=-2$):
            $$G'=Q^tGQ=\begin{pmatrix}2&0\\0&2\end{pmatrix},\qquad|G'|=4\neq1=|G|.$$
            <p>Comprobación directa: $(1,1)\cdot(1,1)=2$, $(1,1)\cdot(1,-1)=0$, $(1,-1)\cdot(1,-1)=2$.</p>
    - |-
      <b>Lo que sí se conserva:</b> el signo ($|Q|^2>0$) y el rango. Los determinantes coinciden si $|Q|=\pm1$, p. ej. entre bases ortonormales ($Q$ ortogonal).
  - receta: |-
      cambio de base en Gram o en formas bilineales $\Rightarrow P^tAP$ $\Rightarrow$ congruentes $\Rightarrow$ equivalentes (mismo rango); el determinante queda multiplicado por $|P|^2$.
  - error: |-
      aplicar la fórmula de los endomorfismos ($Q^{-1}GQ$) a la matriz de Gram y concluir que el determinante no cambia.
