ejercicios:
- id: ej2-15
  nivel: 1
  pista: |-
    Plantea $(2,3,0)=\alpha v_1+\beta v_2$ y mira si hay $\alpha,\beta$ que cuadren en las tres coordenadas a la vez.
  problema: [comb]
- id: ej2-16
  nivel: 1
  pista: |-
    Para cada opción escribe $(2,3,2)$ como combinación con coeficientes desconocidos y resuelve el sistema; fíjate en qué opciones lo dejan compatible.
  problema: [comb]
- id: ej2-17
  nivel: 1
  pista: |-
    Primero comprueba que los vectores están en el plano; después compara cuántos hay con la dimensión del plano (2) y si son libres.
  problema: [genera]
- id: ej2-18
  nivel: 2
  pista: |-
    Para cada conjunto calcula el rango y comprueba que sus vectores están en $U$: si el rango es 2 y todos están en $U$, generan $U$.
  problema: [genera, rango]
- id: ej2-19
  nivel: 2
  pista: |-
    Pertenecer a $\langle S\rangle$ es que el sistema con columnas los vectores de $S$ y términos independientes $(1,-1,m,n)$ sea compatible: escalona y exige que no aparezcan filas contradictorias.
  problema: [comb]
- id: ej2-20
  nivel: 2
  pista: |-
    Escribe cada matriz como vector de $\mathbb R^4$ y busca cuándo el rango de las tres filas es menor que 3.
  problema: [ligado]
- id: ej2-21
  nivel: 2
  pista: |-
    Dos vectores son ligados cuando uno es múltiplo del otro: mira qué obliga eso a $a$ y $b$ y qué pasa con el rango en cada caso.
  problema: [ligado]
- id: ej2-22
  nivel: 1
  pista: |-
    Plantea $(1,-2,c)=\alpha(3,0,-2)+\beta(2,-1,-5)$: las dos primeras ecuaciones fijan $\alpha,\beta$ y la tercera te da $c$.
  problema: [comb]
- id: sol-2_2-9
  nivel: 1
  pista: |-
    Resuelve $w=\alpha u_1+\beta u_2$ con las dos primeras coordenadas y comprueba si la tercera también se cumple.
  problema: [comb]
- id: sol-2_2-10
  nivel: 2
  pista: |-
    Tres vectores de $\mathbb R^3$ son ligados cuando el determinante de la matriz que forman es 0: calcúlalo en función de $k$.
  problema: [ligado]
- id: sol-2_2-11
  nivel: 3
  pista: |-
    Escalona la matriz con los cuatro vectores por filas: el rango son las filas no nulas, y estas dan un sistema libre. Para (b) añade el vector y mira si el rango crece.
  problema: [rango, comb]
- id: ex-feb18
  nivel: 2
  pista: |-
    Cuenta: ¿cuántos vectores necesita un generador de $\mathbb R^3$, y qué rango tiene la pareja $\{\bar u,\bar v\}$?
  problema: [genera, ligado]
- id: ex-feb22
  nivel: 1
  pista: |-
    Resuelve el sistema de ecuaciones del subespacio y escribe la solución general con parámetros: los vectores que multiplican a cada parámetro son los generadores.
  problema: [ecuaciones]
- id: ex-feb25
  nivel: 2
  pista: |-
    Que $w$ sea combinación de $v_1,v_2,v_3$ es que el sistema $\alpha v_1+\beta v_2+\gamma v_3=w$ sea compatible: despeja $\alpha,\beta,\gamma$ con las coordenadas que no tienen $t$ y sustituye en la que sí lo tiene.
  problema: [comb]
- id: ex-sep23
  nivel: 2
  pista: |-
    Escribe la matriz $4\times4$ con los tres vectores y el vector dado como columnas; para que haya combinación, el rango debe quedarse en 3 y no subir a 4.
  problema: [comb]
- id: ex-feb24
  nivel: 3
  pista: |-
    Pasa las tres matrices a vectores de $\mathbb R^4$ y exige rango menor que 3; ojo, la condición da varias ecuaciones que fijan $x$ e $y$ a la vez.
  problema: [ligado]
- id: ex-feb17
  nivel: 3
  pista: |-
    Tres vectores de $\mathbb R^4$ son ligados cuando la matriz tiene rango menor que 3: anula todos los menores de orden 3 y mira qué obligan a $a$ y $b$.
  problema: [ligado]
- id: ex-sep22
  nivel: 1
  pista: |-
    Un subespacio de dimensión 1 en $\mathbb R^2$ es una recta por el origen: elige un vector no nulo y escribe sus paramétricas y la ecuación que cumple.
  problema: [ecuaciones]
- id: ex-feb22b
  nivel: 1
  pista: |-
    Elige tú un par de generadores en $\mathbb R^3$, escribe las paramétricas y elimina los parámetros para quedarte con la ecuación cartesiana.
  problema: [ecuaciones]
- id: ex-feb23
  nivel: 2
  pista: |-
    Con los vectores de $E$ por filas, escalona para (i); las paramétricas salen de una base de $U$, y las implícitas de exigir que $(x_1,x_2,x_3)$ no suba el rango (determinante nulo).
  problema: [rango, ecuaciones, ligado]
esencial:
  intro: |-
    Todo el tema gira en torno a una idea: ¿qué se puede fabricar mezclando unos vectores dados? Esto es lo que debes llevarte.
  items:
  - |-
    <b>Combinación lineal:</b> $w=\alpha_1v_1+\dots+\alpha_kv_k$. Saber si $w$ lo es equivale a que el sistema con columnas $v_i$ y término independiente $w$ sea <b>compatible</b>.
  - |-
    <b>Generadores y envoltura:</b> $\langle S\rangle$ es el conjunto de todas las combinaciones de $S$; es el subespacio más pequeño que contiene a $S$. $S$ es generador de $V$ si $\langle S\rangle=V$.
  - |-
    <b>Libre o ligado:</b> $S$ es libre si $\sum\alpha_iv_i=0$ solo con todos los $\alpha_i=0$; ligado si algún vector es combinación de los demás. En $\mathbb R^n$, más de $n$ vectores son siempre ligados.
  - |-
    <b>Rango = vectores independientes.</b> Es el rango de la matriz con los vectores por filas (o columnas) y se calcula escalonando; da $\operatorname{Dim}\langle S\rangle$. Si el rango es menor que el número de vectores, el sistema es ligado.
  - |-
    <b>Atajo de examen:</b> con tantos vectores como la dimensión de $\mathbb R^n$ ($n$ vectores), son libres $\iff\det\ne0$. Con parámetros, anula el determinante o los menores y resuelve.
que_cae_nota: |-
  En examen domina el tipo «parámetro para que un vector sea combinación lineal o un sistema sea ligado»; las ecuaciones paramétricas e implícitas aparecen mezcladas con él.
tipos:
- id: comb
  nombre: |-
    ¿Es combinación lineal? (con o sin parámetro)
  receta: |-
    Plantea $w=\sum\alpha_iv_i$ como sistema, escalona y comprueba que no hay contradicción; el parámetro se fija para que no la haya.
  senal: |-
    «¿es $w$ combinación lineal de…?», «pertenece a $\langle S\rangle$», «halle $t$ para que $w$ sea combinación lineal».
  pasos:
  - |-
    Escribe $w=\alpha_1v_1+\dots+\alpha_kv_k$ con $\alpha_i$ incógnitas e iguala coordenada a coordenada.
  - |-
    Forma la matriz ampliada $(v_1\ \cdots\ v_k\mid w)$ con los vectores como columnas y escalona.
  - |-
    Si aparece una fila $(0\ \cdots\ 0\mid c)$ con $c\ne0$, no es combinación; si no, es compatible y las $\alpha_i$ son los coeficientes.
  - |-
    Con parámetro: impón que la fila contradictoria sea $0=0$ (o que el rango no suba) y despeja el parámetro.
  ejemplo: |-
    ¿Es $(3,1,4)$ combinación de $(1,0,1)$ y $(1,1,2)$? Las dos primeras coordenadas dan $\alpha+\beta=3$, $\beta=1$, luego $\alpha=2,\beta=1$; la tercera comprueba $2\cdot1+1\cdot2=4$. Sí: $(3,1,4)=2(1,0,1)+(1,1,2)$.
  fallos: |-
    Poner los vectores como filas y no como columnas al plantear el sistema · Comprobar solo las primeras coordenadas y olvidar la última · Dar por válido un parámetro sin comprobar que sale compatible.
- id: ligado
  nombre: |-
    ¿Libre o ligado? (dependencia lineal)
  receta: |-
    Resuelve $\sum\alpha_iv_i=0$: si hay solución no trivial es ligado; con parámetros, impón rango menor que el número de vectores.
  senal: |-
    «linealmente dependientes», «sistema ligado», «es libre», «halle $a$, $b$ para que…».
  pasos:
  - |-
    Pasa los objetos a vectores de coordenadas (si son matrices o polinomios, usa la base canónica).
  - |-
    Forma la matriz con los vectores por filas (o columnas) y calcula su rango escalonando.
  - |-
    Rango igual al número de vectores: libre. Rango menor: ligado.
  - |-
    Si hay tantos vectores como la dimensión, sirve $\det=0$ (ligado) o $\det\ne0$ (libre). Con parámetros, resuelve esa condición.
  ejemplo: |-
    $\{(1,2),(3,k)\}$ en $\mathbb R^2$: $\det\begin{pmatrix}1&2\\3&k\end{pmatrix}=k-6$. Es ligado solo para $k=6$ (entonces $(3,6)=3(1,2)$).
  fallos: |-
    Usar el determinante cuando el número de vectores no es igual a la dimensión · Olvidar que con varios parámetros hay que anular todos los menores del tamaño adecuado · Pensar que dos vectores distintos nunca son ligados.
- id: genera
  nombre: |-
    ¿Es sistema generador?
  receta: |-
    Comprueba que los vectores están en el subespacio y que su rango (= dimensión de $\langle S\rangle$) coincide con la dimensión de ese subespacio.
  senal: |-
    «¿genera…?», «forman un sistema generador de…», «son equivalentes los sistemas…».
  pasos:
  - |-
    Averigua la dimensión del subespacio que quieres generar (en $\mathbb R^n$ es $n$).
  - |-
    Si es un subespacio dado por ecuaciones, verifica que cada vector de $S$ las cumple.
  - |-
    Calcula el rango de $S$ escalonando.
  - |-
    Si rango $=$ dimensión (y los vectores están dentro), generan; si el rango es menor, no. Dos sistemas son equivalentes si generan el mismo subespacio.
  ejemplo: |-
    ¿Generan $\{(1,0,-1),(0,1,-1)\}$ el plano $x_1+x_2+x_3=0$? Ambos cumplen la ecuación, su rango es 2 y el plano tiene dimensión 2: sí lo generan.
  fallos: |-
    Olvidar comprobar que los vectores pertenecen al subespacio · Creer que cualquier conjunto con suficientes vectores genera · Confundir generar con ser libre.
- id: rango
  nombre: |-
    Rango y sistema libre equivalente
  receta: |-
    Escalona la matriz de vectores: el rango son las filas no nulas, que forman un sistema libre con el mismo $\langle S\rangle$.
  senal: |-
    «halle el rango de…», «un sistema libre que genere lo mismo», «dimensión de $\langle S\rangle$».
  pasos:
  - |-
    Escribe los vectores como filas de una matriz.
  - |-
    Escalona con operaciones elementales por filas, sin intercambiar el sentido de las operaciones de combinación.
  - |-
    Cuenta las filas no nulas: es el rango $=\operatorname{Dim}\langle S\rangle$.
  - |-
    Esas filas no nulas forman un sistema libre generador de $\langle S\rangle$; para saber si un vector pertenece, añádelo y mira si el rango crece.
  ejemplo: |-
    $S=\{(1,2,3),(2,4,6),(0,1,1)\}$: la segunda fila es el doble de la primera, queda rango 2 y $\{(1,2,3),(0,1,1)\}$ es un sistema libre con el mismo $\langle S\rangle$.
  fallos: |-
    Contar filas de la matriz original en lugar de las no nulas tras escalonar · Pensar que el rango depende de que sea por filas o columnas (es el mismo) · Usar las filas escalonadas como vectores del conjunto original: son otros vectores del mismo subespacio.
- id: ecuaciones
  nombre: |-
    Ecuaciones paramétricas e implícitas de un subespacio
  receta: |-
    De implícitas a paramétricas: resuelve el sistema y despeja con parámetros. De paramétricas a implícitas: elimina los parámetros (o exige que el rango no suba).
  senal: |-
    «ecuaciones paramétricas», «ecuaciones cartesianas o implícitas», «halle un sistema generador del subespacio definido por…».
  pasos:
  - |-
    Si tienes generadores $u_1,\dots,u_k$, las paramétricas son $x=\lambda_1u_1+\dots+\lambda_ku_k$.
  - |-
    Para pasar a implícitas, impón que $x$ sea combinación de los generadores: la matriz $(u_1\cdots u_k\mid x)$ debe tener el mismo rango que $(u_1\cdots u_k)$.
  - |-
    Cada condición de rango (menor nulo) es una ecuación implícita; el número de ecuaciones es $n-\operatorname{Dim}U$.
  - |-
    Si parte de implícitas, resuelve el sistema homogéneo: los vectores que acompañan a cada parámetro libre son un sistema generador.
  ejemplo: |-
    $U=\langle(1,1,0),(0,1,1)\rangle$: paramétricas $x=\lambda,\ y=\lambda+\mu,\ z=\mu$; eliminando, $x-y+z=0$ (ambos generadores la cumplen).
  fallos: |-
    Dejar parámetros sin eliminar en las implícitas · Dar demasiadas o muy pocas ecuaciones (deben ser $n-\operatorname{Dim}U$) · No comprobar la ecuación obtenida con los generadores.
quiz:
- p: |-
    ¿Es $(1,2,4)$ combinación lineal de $(1,0,1)$ y $(0,1,1)$?
  opciones:
  - t: |-
      Sí, $(1,2,4)=1\cdot(1,0,1)+2\cdot(0,1,1)$
    ok: false
    why: |-
      Esa combinación da $(1,2,3)$, no $(1,2,4)$: las dos primeras coordenadas cuadran, pero la tercera no.
  - t: |-
      No: las dos primeras coordenadas fuerzan $\alpha=1,\beta=2$ y la tercera daría 3, no 4.
    ok: true
  - t: |-
      Sí, porque hay dos vectores y están en $\mathbb R^3$.
    ok: false
    why: |-
      El número de vectores no basta: dos vectores solo generan un plano de $\mathbb R^3$, y no todo vector está en él.
  fb: |-
    Hay que comprobar las tres coordenadas a la vez: $\alpha=1$, $\beta=2$ y $\alpha+\beta=3\ne4$. El sistema es incompatible.
- p: |-
    ¿Para qué $k$ es ligado $\{(1,0,1),(0,1,1),(1,1,k)\}$?
  opciones:
  - t: |-
      Para $k=0$
    ok: false
    why: |-
      Con $k=0$ el determinante vale $-2\ne0$: sigue siendo libre.
  - t: |-
      Para $k=2$
    ok: true
  - t: |-
      Para ningún $k$
    ok: false
    why: |-
      Con $k=2$ se tiene $(1,1,2)=(1,0,1)+(0,1,1)$: es ligado.
  fb: |-
    El determinante vale $k-2$, y tres vectores de $\mathbb R^3$ son ligados justo cuando es 0.
- p: |-
    Un sistema de 4 vectores de $\mathbb R^3$...
  opciones:
  - t: |-
      puede ser libre si los vectores son «suficientemente distintos».
    ok: false
    why: |-
      En $\mathbb R^3$ como mucho hay 3 vectores independientes: con 4 siempre sobra al menos uno.
  - t: |-
      es siempre ligado.
    ok: true
  - t: |-
      es siempre generador de $\mathbb R^3$.
    ok: false
    why: |-
      Pueden ser cuatro vectores en un mismo plano, que no generan $\mathbb R^3$.
  fb: |-
    El rango no puede superar 3 (número de coordenadas), luego con 4 vectores es menor que el número de vectores: ligado. Que genere depende de cada caso.
- p: |-
    ¿Cuál es el rango de $\{(1,2,3),(2,4,6),(0,1,1)\}$?
  opciones:
  - t: |-
      3
    ok: false
    why: |-
      Cuentas tres vectores, pero el segundo es el doble del primero: solo hay 2 independientes.
  - t: |-
      2
    ok: true
  - t: |-
      1
    ok: false
    why: |-
      El tercero no es múltiplo de los otros (tiene primera coordenada 0 y segunda 1): hay al menos 2 independientes.
  fb: |-
    Al escalonar, la segunda fila queda nula y las otras dos son independientes: rango 2.
- p: |-
    ¿Cuál de estos sistemas genera el mismo subespacio que $\{(1,0),(0,1)\}$?
  opciones:
  - t: |-
      $\{(1,1),(2,2)\}$
    ok: false
    why: |-
      Son proporcionales: solo generan la recta $y=x$.
  - t: |-
      $\{(1,1),(1,-1)\}$
    ok: true
  - t: |-
      $\{(1,0),(2,0)\}$
    ok: false
    why: |-
      Todos tienen segunda coordenada 0: solo generan el eje $x$.
  fb: |-
    $\det\begin{pmatrix}1&1\\1&-1\end{pmatrix}=-2\ne0$: son dos vectores independientes en $\mathbb R^2$, luego generan todo $\mathbb R^2$.
- p: |-
    ¿Qué ecuación implícita tiene $\langle(1,1,0),(0,1,1)\rangle$?
  opciones:
  - t: |-
      $x+y-z=0$
    ok: false
    why: |-
      Con $(1,1,0)$ da $2\ne0$: el vector no la cumple.
  - t: |-
      $x-y+z=0$
    ok: true
  - t: |-
      $x+y+z=0$
    ok: false
    why: |-
      Con $(1,1,0)$ da $2\ne0$: el vector no la cumple.
  fb: |-
    Es un plano ($n-\operatorname{Dim}=3-2=1$ ecuación) y debe cumplirla cada generador: $1-1+0=0$ y $0-1+1=0$.
