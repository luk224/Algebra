kicker: |-
  Módulo 2 · Espacios vectoriales · Tema 2.2
h1: |-
  Sistemas de generadores
resumen: |-
  ¿Con qué «ingredientes» se puede fabricar todo un subespacio? Aquí aprenderás a construir vectores como <b>combinaciones lineales</b> de otros, a describir un subespacio con unos pocos <b>generadores</b>, a detectar los vectores que sobran (sistemas <b>ligados</b> frente a <b>libres</b>) y a medirlo todo con el <b>rango</b>. Es la herramienta que más se usa en el resto del módulo.
