motivacion:
  s1: |-
    Tienes dos ingredientes, $u=(1,0,1)$ y $u'=(2,0,1)$, y quieres preparar el vector $(5,0,3)$ mezclándolos. ¿Cuánto hay que poner de cada uno, y cómo sabrías si una receta cualquiera es posible?
  s2: |-
    Con dos vectores sobre una misma recta solo llegas a esa recta, pero con dos no alineados llegas a todo el plano. ¿Cómo describir de una vez el conjunto de todas las mezclas posibles de unos vectores dados?
  s3: |-
    Si ya tienes $(1,0,1)$ y $(2,0,1)$, ¿para qué guardar también $(3,0,2)$? ¿Cómo detectar, sin adivinarlo, que un vector de la lista sobra porque se prepara con los demás?
  s4: |-
    Te dan cuatro vectores de $\mathbb R^3$ y quieres saber de un vistazo cuántos de ellos aportan algo realmente nuevo. ¿Existe un único número que lo resuma y se calcule de forma mecánica?
  s5: |-
    Un sistema tiene vectores de sobra: ¿cuáles puedes quitar sin que deje de generar lo mismo? Y si cambias uno por otro, ¿bajo qué condición sigues generando exactamente el mismo conjunto?
consignas:
  - animacion: |-
      Interactivo: combinaciones lineales de dos vectores
    consigna: |-
      Mueve los deslizadores $\alpha$ y $\beta$ hasta que $w$ caiga sobre un punto de la cuadrícula, y luego cambia $u$ y $v$ en las cajas. Fíjate en cómo se forma $w$ sumando $\alpha u$ y $\beta v$.
    pregunta: |-
      ¿Qué valores de $\alpha$ y $\beta$ necesitas para llegar a un punto cualquiera, y cambia eso si $u$ y $v$ son distintos?
  - animacion: |-
      Interactivo: vectores dependientes no generan el plano
    consigna: |-
      Con $u=(1,2)$ y $v=(2,4)$ mueve $\alpha$ y $\beta$ y observa por dónde se desplaza $w$. Después cambia $v$ a $(2,5)$ y repite.
    pregunta: |-
      ¿Qué cambia en el conjunto de puntos que puedes alcanzar al pasar de $(2,4)$ a $(2,5)$, y por qué?
  - animacion: |-
      Interactivo 3D: qué generan tres vectores de
    consigna: |-
      Prueba cada uno de los casos preparados y mira qué figura forman las combinaciones (punto, recta, plano o todo el espacio). Fíjate en cuándo los tres vectores quedan en un mismo plano.
    pregunta: |-
      ¿Qué relación hay entre el número de direcciones realmente distintas que aportan los vectores y la dimensión de la figura que generan?
