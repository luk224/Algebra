motivacion:
  s1: |-
    La matriz $\begin{pmatrix}2&1\\0&2\end{pmatrix}$ solo tiene una dirección que se queda quieta al multiplicar. ¿Cómo describir algo parecido a una diagonal cuando faltan ejes propios para formar una base de $\mathbb R^2$?
  s2: |-
    Si no puedes llegar a una matriz diagonal, ¿cuál es la forma más sencilla que sí se alcanza siempre? ¿Qué aspecto tiene y por qué aparecen unos «1» pegados encima de la diagonal?
  s3: |-
    Una matriz $4\times4$ tiene un único valor propio $\lambda$ con multiplicidad 4. ¿De cuántas maneras distintas se puede repartir esa multiplicidad en bloques, y qué dato de la matriz decide cuál ocurre?
  s4: |-
    No siempre tienes tiempo de buscar vectores para saber cómo es $J$. ¿Se puede leer el número y el tamaño de los bloques solo con unos pocos rangos de matrices?
  s5: |-
    Ya sabes qué matriz $J$ te sale, pero necesitas la $P$ que la hace realidad. ¿Cómo elegir vectores que, al ir multiplicando por $A-\lambda I$, vayan «bajando» hasta un vector propio?
  s6: |-
    Calcular las raíces de un polinomio característico de grado 5 o 6 es inviable a mano. Si solo repites una y otra vez el producto de una matriz por un vector, ¿qué puede ir apareciendo en esa sucesión?
  mapa: |-
    Te dan una matriz cuadrada cualquiera y te piden «hazla lo más sencilla posible». ¿Por dónde empiezas y qué preguntas te haces, en qué orden, hasta saber si basta una diagonal, una ortogonal o hace falta Jordan?
consignas:
  - animacion: |-
      Animación 3D: lo que falta
    consigna: |-
      Elige primero «Doble con $d=2$» y luego «Doble con $d=1$», y compara cuántas rectas y planos propios aparecen. Después mueve el deslizador $t$ para ver cómo la esfera se deforma.
    pregunta: |-
      ¿En qué caso los subespacios propios bastan para formar una base de $\mathbb R^3$ y en cuál faltan ejes?
  - animacion: |-
      Animación: forma de Jordan y matriz de paso
    consigna: |-
      Carga «E 4.39» y luego el caso «4×4: bloques 2 y 2», y fíjate en los rangos de $(A-\lambda I)^k$, en los tamaños de los bloques y en las cadenas de vectores. Comprueba al final la igualdad $AP=PJ$.
    pregunta: |-
      Si dos matrices tienen el mismo polinomio característico y el mismo número de vectores propios independientes, ¿tienen necesariamente la misma $J$?
