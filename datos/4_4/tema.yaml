esencial:
  intro: |-
    Cuando a una matriz le faltan vectores propios no se diagonaliza, pero sí se deja casi diagonal: esa es la forma de Jordan. Esto es lo que debes llevarte.
  items:
  - |-
    <b>$J$ es la «casi diagonal» de $A$.</b> Teorema 4.8: si todas las raíces de $|A-\lambda I|$ son reales, $A$ es semejante a $J=\operatorname{diag}(J_1,\dots,J_s)$, con $\lambda$ en la diagonal de cada bloque y unos justo encima. Si $A$ es diagonalizable, $J=\Lambda$ (sin unos).
  - |-
    <b>Nº de bloques y unos.</b> Cada valor propio $\lambda_i$ tiene $d_i=n-\operatorname{rang}(A-\lambda_iI)$ bloques, de tamaños que suman $\alpha_i$. El nº de unos de $J$ es $n-\sum d_i$. No confundas «nº de bloques» con «nº de valores propios distintos».
  - |-
    <b>Si $\alpha\le3$, $d$ decide; si $\alpha\ge4$, no siempre.</b> Entonces usa los rangos de $N^k=(A-\lambda I)^k$: nº de bloques de tamaño $\ge k$ $=r_{k-1}-r_k$, hasta que $n-r_k=\alpha$.
  - |-
    <b>Matriz de paso por cadenas.</b> Para un bloque de tamaño $k$ toma $v\in\operatorname{Nuc}N^k\setminus\operatorname{Nuc}N^{k-1}$ y escribe las columnas $(N^{k-1}v\mid\cdots\mid Nv\mid v)$: primero el vector propio. Comprueba $\det P\neq0$ y $AP=PJ$ (sin invertir). $J$ es única salvo el orden de bloques; $P$ no.
  - |-
    <b>Método de potencias</b> (poco examinable): $x_{k+1}=Ax_k/\mu_k$ con $\mu_k$ la coordenada de mayor valor absoluto (con su signo); $\mu_k\to\lambda_1$ si el valor propio dominante es estricto.
tipos:
- id: bloques
  nombre: |-
    Hallar la matriz de Jordan $J$
  receta: |-
    Valores propios, $d_i=n-\operatorname{rang}(A-\lambda_iI)$ para cada uno, y reparte $\alpha_i$ en $d_i$ bloques.
  senal: |-
    «halla / calcula la matriz de Jordan de $A$», «una posible matriz de Jordan», «¿es diagonalizable? ¿cuál es su $J$?».
  pasos:
  - |-
    Calcula $|A-\lambda I|$ y los valores propios con su multiplicidad $\alpha_i$. Si alguna raíz no es real, no hay $J$ real.
  - |-
    Para cada $\lambda_i$ calcula $d_i=n-\operatorname{rang}(A-\lambda_iI)$: es el número de bloques de ese valor propio.
  - |-
    Reparte $\alpha_i$ en $d_i$ bloques (tamaños de mayor a menor). Con $\alpha_i\le3$ queda fijado; con $\alpha_i\ge4$ y varias opciones, usa los rangos (tipo siguiente).
  - |-
    Escribe $J$: cada bloque con $\lambda_i$ en la diagonal y unos encima. Justifica: «$d=\alpha$, luego diagonal» o «$d<\alpha$, luego hay unos».
  ejemplo: |-
    $A=\begin{pmatrix}4&1\\-1&2\end{pmatrix}$: $|A-\lambda I|=(\lambda-3)^2$, $\alpha=2$. $\operatorname{rang}(A-3I)=1$, $d=1$: un bloque $2\times2$, $J=\begin{pmatrix}3&1\\0&3\end{pmatrix}$.
  fallos: |-
    decir «no diagonalizable, no hay $J$» · contar bloques por valores propios distintos · olvidar que si $d=\alpha$ en todos, $J$ es diagonal · sumar mal: los tamaños de un valor propio deben sumar $\alpha_i$.
- id: rangos
  nombre: |-
    Tamaño de los bloques con los rangos de $(A-\lambda I)^k$
  receta: |-
    Calcula $r_k=\operatorname{rang}N^k$ y usa que los bloques de tamaño $\ge k$ son $r_{k-1}-r_k$.
  senal: |-
    «todas las $J$ posibles», «con estos rangos, halla $J$», $\alpha\ge4$ con $d\ge2$, «¿son semejantes?» con mismo polinomio y misma $d$.
  pasos:
  - |-
    Pon $N=A-\lambda I$ y $r_0=n$, $r_1=\operatorname{rang}N$, $r_2=\operatorname{rang}N^2$…, hasta que $n-r_k=\alpha$.
  - |-
    Nº de bloques de tamaño $\ge k$: $r_{k-1}-r_k$ (para $k=1$ es $d$).
  - |-
    Bloques de tamaño exactamente $k$: (los $\ge k$) menos (los $\ge k+1$).
  - |-
    Escribe $J$ colocando los bloques de mayor a menor. Para «posibles $J$» lista todas las particiones de $\alpha$ en $d$ partes.
  ejemplo: |-
    $\alpha=4$ con $r_1=2$, $r_2=1$, $r_3=0$ ($n=4$): bloques $\ge1$: $4-2=2$; $\ge2$: $2-1=1$; $\ge3$: $1-0=1$; $\ge4$: $0$. Luego tamaños $3$ y $1$: $J=J_3(\lambda)\oplus J_1(\lambda)$. Con $r_2=0$ saldría $(2,2)$.
  fallos: |-
    parar en $d$ cuando $\alpha=4$ y $d=2$ (hay dos candidatas, $(3,1)$ y $(2,2)$) · restar mal los rangos · seguir potenciando una vez que $n-r_k=\alpha$.
- id: paso
  nombre: |-
    Matriz de paso $P$ (y $A^n$)
  receta: |-
    Para cada bloque de tamaño $k$, cabeza $v\in\operatorname{Nuc}N^k\setminus\operatorname{Nuc}N^{k-1}$ y columnas $(N^{k-1}v\mid\cdots\mid v)$.
  senal: |-
    «halla una matriz de paso», «halla $P$ tal que $P^{-1}AP=J$», «¿es $P$ una matriz de paso?», «calcula $A^n$».
  pasos:
  - |-
    Halla $J$ (tipo anterior) y, para cada $\lambda$, $N=A-\lambda I$ y los núcleos $\operatorname{Nuc}N\subset\operatorname{Nuc}N^2\subset\cdots$ hasta dimensión $\alpha$.
  - |-
    Por cada bloque de tamaño $k$ (empezando por el mayor): elige una cabeza $v\in\operatorname{Nuc}N^k$ independiente de lo ya elegido y calcula $Nv,\dots,N^{k-1}v$. Los bloques $1\times1$ llevan vectores propios independientes.
  - |-
    Coloca las columnas bloque a bloque en el mismo orden que en $J$, cada bloque como $(N^{k-1}v\mid\cdots\mid Nv\mid v)$: el vector propio primero.
  - |-
    Comprueba $\det P\neq0$ y $AP=PJ$ (sin invertir). Para $A^n$: $A^n=PJ^nP^{-1}$, con $J_2(\lambda)^n=\begin{pmatrix}\lambda^n&n\lambda^{n-1}\\0&\lambda^n\end{pmatrix}$.
  ejemplo: |-
    $A=\begin{pmatrix}1&1\\-1&3\end{pmatrix}$, $\lambda=2$ doble, $N=\begin{pmatrix}-1&1\\-1&1\end{pmatrix}$. Cabeza $v=(1,0)$, $Nv=(-1,-1)$. $P=\begin{pmatrix}-1&1\\-1&0\end{pmatrix}$ ($\det=1$) y $P^{-1}AP=\begin{pmatrix}2&1\\0&2\end{pmatrix}$.
  fallos: |-
    poner la cabeza antes que el vector propio (sale $J$ traspuesta) · tomar $v$ dentro de $\operatorname{Nuc}N^{k-1}$ · con bloques $(2,2)$, cabezas dependientes (da $P$ singular) · olvidar comprobar $AP=PJ$.
- id: vf
  nombre: |-
    Verdadero o falso sobre $J$
  receta: |-
    Traduce cada afirmación a $d_i$, $\alpha_i$, nº de bloques, nº de unos y semejanza; contrasta con un ejemplo.
  senal: |-
    «justificar si…» con afirmaciones sobre bloques, unos, ser diagonal, semejante a otra matriz o única $P$.
  pasos:
  - |-
    Traduce la afirmación: nº de bloques $=\sum d_i$ (vectores propios independientes), nº de unos $=n-\sum d_i$, $J$ diagonal $\iff d_i=\alpha_i$ siempre.
  - |-
    Si hay una matriz concreta, calcula valores propios y $d_i$ y contrasta la afirmación con ellos.
  - |-
    Si es general, razona con un ejemplo pequeño o un contraejemplo ($J_2(\lambda)$, $J_3(\lambda)$) y cita el teorema.
  - |-
    Recuerda: $J$ única salvo orden de bloques (y cambiar el orden da una matriz semejante); $P$ no es única; cada bloque es $\lambda I+N$ con $N$ nilpotente.
  ejemplo: |-
    «El nº de unos de $J$ es igual al nº de bloques»: falso. $J=J_3(2)$ tiene 1 bloque y 2 unos; el nº de unos es $n-\sum d_i=3-1$.
  fallos: |-
    creer que los unos pueden ser otro valor · pensar que reordenar bloques da una matriz no semejante · confundir nº de bloques con valores propios distintos.
- id: potencias
  nombre: |-
    Método de potencias
  receta: |-
    Itera $x_{k+1}=Ax_k/\mu_k$ con $\mu_k$ la coordenada de mayor valor absoluto; $\mu_k\to\lambda_1$.
  senal: |-
    «aproxime el valor propio / vector propio dominante», «método de potencias», «valor propio de menor módulo».
  pasos:
  - |-
    Elige $x_0\neq0$ sencillo, por ejemplo $(1,0)$ o $(1,1)$.
  - |-
    Calcula $Ax_k$ y toma $\mu_k$ como su coordenada de mayor valor absoluto, con su signo.
  - |-
    Normaliza: $x_{k+1}=Ax_k/\mu_k$ (tiene una coordenada igual a $1$). Repite hasta que $\mu_k$ se estabilice.
  - |-
    Para el menor en módulo, aplica el método a $A^{-1}$ y toma el inverso del resultado.
  ejemplo: |-
    $A=\begin{pmatrix}2&1\\1&2\end{pmatrix}$, $x_0=(1,0)$: $Ax_0=(2,1)$, $\mu_0=2$, $x_1=(1,\tfrac12)$; $Ax_1=(\tfrac52,2)$, $\mu_1=\tfrac52$. Tiende a $\lambda_1=3$ con vector $(1,1)$.
  fallos: |-
    olvidar el signo de $\mu_k$ · pensar que sirve sin valor dominante estricto · empezar con un $x_0$ sin componente en $v_1$.
quiz:
- p: |-
    $A=\begin{pmatrix}3&1&1\\0&3&0\\0&0&3\end{pmatrix}$ tiene $\lambda=3$ triple. ¿Cuál es su forma de Jordan?
  opciones:
  - t: |-
      $3I$ (diagonal)
    ok: false
    why: |-
      $A-3I\neq0$, tiene rango $1$: $d=2<3$, luego hay algún $1$ y no es diagonal.
  - t: |-
      Un bloque $2\times2$ y otro $1\times1$
    ok: true
  - t: |-
      Un único bloque $3\times3$
    ok: false
    why: |-
      Un solo bloque exigiría $d=1$ (rango $2$), pero $\operatorname{rang}(A-3I)=1$ da $d=2$ bloques.
  - t: |-
      Tres bloques $1\times1$ con un $1$ encima
    ok: false
    why: |-
      Tres bloques son tres vectores propios independientes ($d=3$) y entonces no habría unos.
  fb: |-
    $\operatorname{rang}(A-3I)=1$, luego $d=3-1=2$ bloques de tamaños que suman $3$: $(2,1)$.
- p: |-
    $J$ es de orden $4$ con un único valor propio y un único bloque. ¿Cuántos unos tiene encima de la diagonal?
  opciones:
  - t: '1'
    ok: false
    why: |-
      Un uno sería un bloque $2\times2$ más otros bloques. Con un solo bloque de tamaño $4$ hay $3$.
  - t: '3'
    ok: true
  - t: '4'
    ok: false
    why: |-
      Un bloque $4\times4$ tiene $4-1=3$ unos (una línea de $3$ posiciones), no $4$.
  - t: '0'
    ok: false
    why: |-
      Sin unos sería diagonal, es decir cuatro bloques $1\times1$.
  fb: |-
    Nº de unos $=n-\sum d_i=4-1=3$.
- p: |-
    Una matriz $4\times4$ tiene $\lambda=2$ con $\alpha=4$, $\operatorname{rang}(A-2I)=2$ y $\operatorname{rang}(A-2I)^2=0$. ¿Qué bloques tiene?
  opciones:
  - t: |-
      $(2,2)$
    ok: true
  - t: |-
      $(3,1)$
    ok: false
    why: |-
      Un bloque de tamaño $3$ exigiría $(A-2I)^2\neq0$; aquí es nula.
  - t: |-
      $(2,1,1)$
    ok: false
    why: |-
      Serían $d=3$ bloques, pero $d=4-2=2$.
  - t: |-
      $(4)$
    ok: false
    why: |-
      Un bloque de tamaño $4$ da $d=1$, no $d=2$.
  fb: |-
    $d=4-2=2$ bloques; los de tamaño $\ge2$ son $r_1-r_2=2-0=2$, así que ambos tienen tamaño $2$: $J_2\oplus J_2$.
- p: |-
    Sea $A=\begin{pmatrix}1&1\\-1&3\end{pmatrix}$, $J=\begin{pmatrix}2&1\\0&2\end{pmatrix}$. ¿Cuál es una matriz de paso $P$ con $P^{-1}AP=J$?
  opciones:
  - t: |-
      $\begin{pmatrix}-1&1\\-1&0\end{pmatrix}$
    ok: true
  - t: |-
      $\begin{pmatrix}1&-1\\0&-1\end{pmatrix}$
    ok: false
    why: |-
      Tiene la cabeza $(1,0)$ en la primera columna y el vector propio en la segunda: sale la traspuesta $\begin{pmatrix}2&0\\1&2\end{pmatrix}$.
  - t: |-
      $\begin{pmatrix}1&1\\1&0\end{pmatrix}$
    ok: false
    why: |-
      Las columnas no cumplen $Ap_2=p_1+2p_2$: da $\begin{pmatrix}2&-1\\0&2\end{pmatrix}$, no $J$.
  - t: |-
      $\begin{pmatrix}1&1\\-1&0\end{pmatrix}$
    ok: false
    why: |-
      Su primera columna $(1,-1)$ no es vector propio de $A$ (el propio es $(1,1)$): da otra matriz.
  fb: |-
    El vector propio de $\lambda=2$ es $(-1,-1)$ (1.ª columna) y la cabeza $v=(1,0)$ con $(A-2I)v=(-1,-1)$ (2.ª columna). Se comprueba $AP=PJ$.
- p: |-
    $A=\begin{pmatrix}1&-2\\1&-1\end{pmatrix}$. ¿Qué ocurre con su forma de Jordan real?
  opciones:
  - t: |-
      No existe, porque $|A-\lambda I|=\lambda^2+1$ no tiene raíces reales.
    ok: true
  - t: |-
      Es $\begin{pmatrix}1&1\\0&-1\end{pmatrix}$.
    ok: false
    why: |-
      Los valores propios no son $1$ y $-1$: la traza es $0$ y el determinante $1$, que dan $\lambda^2+1$.
  - t: |-
      Es $\begin{pmatrix}0&1\\0&0\end{pmatrix}$.
    ok: false
    why: |-
      Esa matriz tiene polinomio $\lambda^2$; semejantes tienen el mismo polinomio característico.
  - t: |-
      Es diagonal porque tiene dos valores propios distintos.
    ok: false
    why: |-
      Los valores propios $\pm i$ son distintos pero complejos: no hay $J$ real.
  fb: |-
    El Teorema 4.8 exige raíces reales. Aquí $\lambda=\pm i$; solo sobre $\mathbb C$ se diagonaliza.
- p: |-
    Con $A=\begin{pmatrix}2&1\\1&2\end{pmatrix}$ y $x_0=(1,0)$, ¿cuánto vale $\mu_1$ en el método de potencias?
  opciones:
  - t: |-
      $\tfrac52$
    ok: true
  - t: |-
      $2$
    ok: false
    why: |-
      Es $\mu_0$ (coordenada mayor de $Ax_0=(2,1)$); $\mu_1$ sale de $Ax_1$ con $x_1=(1,\tfrac12)$.
  - t: |-
      $3$
    ok: false
    why: |-
      Es el valor propio al que tiende $\mu_k$, no el segundo término de la sucesión.
  - t: |-
      $2$ con vector $(1,1)$
    ok: false
    why: |-
      Mezcla cosas: tras dos pasos aún no se ha llegado a $(1,1)$.
  fb: |-
    $x_1=(1,\tfrac12)$ y $Ax_1=(\tfrac52,2)$, cuya coordenada mayor es $\tfrac52$. La sucesión $2,\tfrac52,\dots$ tiende a $3$.
capa: true
que_cae_nota: |-
  En 4 de las 24 convocatorias revisadas se pide «hallar (una posible) matriz de Jordan» de una $2\times2$ o $3\times3$, sin pedir la matriz de paso; el método de potencias no ha salido en ninguna.
