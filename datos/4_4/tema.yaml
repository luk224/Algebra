h1: |-
  Matrices de Jordan
resumen: |-
  Qué hacer cuando una matriz <b>no tiene bastantes vectores propios</b> para diagonalizarse: se busca la matriz «casi diagonal» más sencilla que le es semejante, la <b>forma de Jordan</b> $J=P^{-1}AP$ (valores propios en la diagonal y unos justo encima). Aprenderás a leer cuántos bloques hay y de qué tamaño (con $\alpha$, $d$ y los rangos de $(A-\lambda I)^k$), a escribir $J$ y a construir la matriz de paso $P$ con <b>cadenas de vectores</b>. Al final, el método de las potencias (§4.4.3) para estimar el valor propio dominante, y un mapa que resume todo el tema 4.
