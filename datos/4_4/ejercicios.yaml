- id: ej4-33
  clase: libro
  titulo: |-
    Ejercicio 4.33 — verdadero o falso sobre bloques y semejanza
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 4.33, p. 151
    texto: |-
      E p.151
  cuerpo:
  - enun: |-
      Si $J$ es la matriz de Jordan de una matriz $A$ cualquiera, responder verdadero o falso: A) El número de bloques de $J$ es superior al de vectores propios linealmente independientes. B) Al cambiar de orden los bloques de $J$ se obtiene una matriz que no es semejante a $A$. C) Cada bloque de $J$ es la suma de un múltiplo de la matriz unidad y una matriz nihilpotente.
  - html: |-
      <p><b>Qué se pide.</b> Traducir cada frase a «$d_i$ = nº de bloques de $\lambda_i$» y a $J_i=\lambda I+N$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Verdadero o falso sobre bloques y semejanza de la matriz de Jordan.
      - - |-
          Cómo lo pienso
        - |-
          Cada bloque corresponde a un vector propio independiente: número de bloques $=$ número de vectores propios independientes. Reordenar los bloques no cambia la clase de semejanza (es una matriz de paso con una permutación).
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$.
      - - |-
          Por dónde empiezo
        - |-
          Contrasto cada frase con la definición: bloques, orden, estructura $\lambda I+N$.
  - pasos:
    - |-
      <p><b>A) Falsa.</b> Por la construcción (U p.169) el nº de bloques de $\lambda_i$ es $d_i$ y el total $\sum d_i$ es el nº <b>máximo</b> de vectores propios independientes: es <b>igual</b>, no superior. Ejemplo:</p>
            $$A=\begin{pmatrix}2&1\cr0&2\end{pmatrix}$$
            <p>tiene $d=2-\operatorname{rang}(A-2I)=2-1=1$: un bloque y un vector propio independiente.</p>
    - |-
      <b>B) Falsa.</b> U p.169: al permutar bloques la matriz sigue siendo de la misma clase de semejanza que $A$. Reordenar los bloques equivale a reordenar por grupos las columnas de $P$: si $J=P^{-1}AP$ y $\tilde P$ es $P$ con los grupos permutados, $\tilde J=\tilde P^{-1}A\tilde P$ es $J$ con los bloques permutados, semejante a $A$ por definición. Ejemplo: $\operatorname{diag}(J_2(3),5)$ y $\operatorname{diag}(5,J_2(3))$ son semejantes.
    - |-
      <p><b>C) Verdadera.</b> $J_i=\lambda_iI+N$ con $N$ con unos encima de la diagonal y ceros en el resto, nilpotente porque cada potencia desplaza los unos y, para un bloque de tamaño $s$, $N^s=0$. Ejemplo:</p>
            $$\begin{pmatrix}4&1\cr0&4\end{pmatrix}=4I+\begin{pmatrix}0&1\cr0&0\end{pmatrix}$$
            $$\begin{pmatrix}0&1\cr0&0\end{pmatrix}^2=0.$$
  - html: |-
      <p><b>Respuesta:</b> A falsa, B falsa, C verdadera.</p>
  - receta: |-
      en los V/F de Jordan, tradúcelo todo a «$d_i$ = nº de bloques de $\lambda_i$» y «nº de unos $=n-\sum d_i$».
  - error: |-
      pensar que el orden de los bloques cambia la clase de semejanza: solo cambia el orden de las columnas de $P$. <b>Teoría:</b> U Teor. 4.8 p.168; propiedades p.169; construcción pp.169-170.
- id: ej4-34
  clase: libro
  titulo: |-
    Ejercicio 4.34 — ¿a qué es igual el número de unos de $J$?
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 4.34, p. 151
    texto: |-
      E p.151
  cuerpo:
  - enun: |-
      Si $J$ es la matriz de Jordan de una matriz $A$ cualquiera, responder verdadero o falso a si el número de unos que hay por encima de la diagonal principal de $J$ es: A) Igual al número de vectores propios linealmente independientes. B) Igual al número de bloques. C) Igual al número de vectores no propios que se necesitan para formar una base de vectores que determinan la matriz de paso. D) Igual al rango de $A$.
  - html: |-
      <p><b>Qué se pide.</b> Contar unos, bloques y vectores.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          A qué es igual el número de unos de $J$.
      - - |-
          Cómo lo pienso
        - |-
          Un bloque de tamaño $s$ tiene $s-1$ unos. Sumando los tamaños da el orden $n$: unos $=n-$ nº de bloques.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. Un bloque de tamaño $s$ aporta $s-1$ unos.
      - - |-
          Por dónde empiezo
        - |-
          Cuento unos por bloques y relaciono con cadenas de vectores.
  - pasos:
    - |-
      <b>Cuenta clave.</b> Un bloque de tamaño $s$ tiene $s-1$ unos. Con $b$ bloques de tamaños $s_1,\dots,s_b$ y $\sum s_i=n$, el número de unos es $\sum(s_i-1)=n-b$. Y $b=\sum d_i$ (U p.169).
    - |-
      <b>A) Falsa</b> en general: unos $=n-b$ y vectores propios independientes $=b$; solo coinciden si $n=2b$. Contraejemplo: $A=I_2$, $0$ unos y $2$ vectores propios.
    - |-
      <b>B) Falsa:</b> el nº de bloques es $b$, mismo contraejemplo ($b=2$, $0$ unos).
    - |-
      <b>C) Verdadera.</b> En la base de Jordan cada bloque aporta un vector propio (el primero de su cadena) y $s_i-1$ vectores no propios; total de no propios $\sum(s_i-1)=n-b$, igual al nº de unos. Es decir, tantos 1 como vectores no propios se necesitan hasta completar una base con los vectores propios.
    - |-
      <b>D) Falsa.</b> $A=I_n$ tiene rango $n$ y $J=I_n$ no tiene unos. (Para una matriz nilpotente sí coinciden, porque $\operatorname{rang}A=n-d=n-b$; el enunciado dice «cualquiera».)
  - html: |-
      <p><b>Respuesta:</b> A falsa, B falsa, C verdadera, D falsa.</p>
  - receta: |-
      nº de unos de $J$ $=n-$ nº de bloques $=n-\sum d_i$ = nº de vectores no propios de la base de Jordan.
  - error: |-
      confundir «nº de unos» con «nº de bloques»: son complementarios hasta $n$. <b>Teoría:</b> U pp.169-170.
- id: ej4-35
  clase: libro
  titulo: |-
    Ejercicio 4.35 — ¿cuándo es diagonal $J$?
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 4.35, p. 152
    texto: |-
      E p.152
  cuerpo:
  - enun: |-
      Si $J$ es la matriz de Jordan de una matriz $A$ cualquiera, justificar si: A) Los elementos de $J$ que están encima de la diagonal principal son siempre 1. B) $J$ es diagonal cuando el número de valores propios distintos es igual al rango de $A$. C) Los elementos que están encima de la diagonal principal pueden ser valores distintos a 0 y distintos a 1 para alguna matriz $A$. D) Ninguna de las anteriores es correcta.
  - html: |-
      <p><b>Qué se pide.</b> Refutar con contraejemplos las tres primeras.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Cuándo es diagonal $J$ y qué se puede decir de los elementos fuera de la diagonal.
      - - |-
          Cómo lo pienso
        - |-
          $J$ es diagonal si todos los bloques son de tamaño 1, es decir, si $A$ es diagonalizable. Los elementos de encima de la diagonal son 0 o 1, no valores propios.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$.
      - - |-
          Por dónde empiezo
        - |-
          Contrasto cada opción con esa idea.
  - pasos:
    - |-
      <b>A) Falsa.</b> Si $J$ es diagonal hay ceros encima de la diagonal: por ejemplo $A=\operatorname{diag}(1,2)$, valores propios distintos, $J=\Lambda$. Además entre dos bloques distintos siempre hay un $0$.
    - |-
      <p><b>B) Falsa</b>. Contraejemplo</p>
            $$A=\begin{pmatrix}0&1\cr0&0\end{pmatrix}:$$
            <p>$|A-\lambda I|=\lambda^2$, un único valor propio $0$, y $\operatorname{rang}A=1$: «nº de valores propios distintos = rango» se cumple ($1=1$). Pero $d=2-\operatorname{rang}A=1\lt2=\alpha$, no es diagonalizable y $J=A$ <b>no</b> es diagonal. Tampoco es necesario: $\operatorname{diag}(1,2,2)$ es diagonal, con $2$ valores distintos y rango $3$. Lo cierto (U p.169) es que $n$ valores propios distintos en una matriz de <b>orden</b> $n$ da diagonalizable.</p>
    - |-
      <b>C) Falsa.</b> Por la construcción (U pp.168-170) los elementos encima de la diagonal solo pueden ser $0$ o $1$.
    - |-
      <b>D) Verdadera</b>, porque A, B y C son falsas.
  - html: |-
      <p><b>Respuesta: D.</b></p>
  - receta: |-
      para refutar un «$J$ es diagonal cuando…» prueba con $\begin{pmatrix}0&1\cr0&0\end{pmatrix}$ (y con $I$ o una diagonal para la implicación contraria). Lo único que garantiza $J$ diagonal es $d_i=\alpha_i$ para todo $i$ (Teorema 4.7).
  - error: |-
      mezclar «rango» y «orden». <b>Teoría:</b> U Teor. 4.7 p.164; pp.168-170.
- id: ej4-36
  clase: libro
  titulo: |-
    Ejercicio 4.36 — $2\times2$ con un valor propio doble
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 4.36, p. 153
    texto: |-
      E p.153
  cuerpo:
  - enun: |-
      Si $A$ es la matriz de filas $(3,1)$, $(-1,1)$, justificar si: A) Es semejante a una matriz diagonal. B) Existe una base de $\mathbb R^2$ formada por vectores propios de $A$. C) Se puede calcular su matriz $J$ de Jordan. D) Para obtener $J$ con MAXIMA hay que evaluar <code>load(diag); jordan(); dispJordan();</code>.
  - html: |-
      <p><b>Qué se pide.</b> $A=\begin{pmatrix}3&1\cr-1&1\end{pmatrix}$: decidir con $\alpha$ y $d$, y hallar $J$ y $P$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Para una $2\times2$ con valor doble: semejanza a diagonal, base de vectores propios y existencia de $J$.
      - - |-
          Cómo lo pienso
        - |-
          Calculo si el valor doble tiene dos vectores propios independientes; si no, hay un único bloque $2\times2$ y la matriz no es diagonalizable.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$.
      - - |-
          Por dónde empiezo
        - |-
          Polinomio y rango de $A-\lambda I$.
  - pasos:
    - |-
      <p><b>Polinomio:</b></p>
            $$|A-\lambda I|=(3-\lambda)(1-\lambda)+1=\lambda^2-4\lambda+4=(\lambda-2)^2:$$
            <p>$\lambda=2$, $\alpha=2$.</p>
    - |-
      <p><b>$d$:</b></p>
            $$A-2I=\begin{pmatrix}1&1\cr-1&-1\end{pmatrix}$$
            <p>de rango $1$, $d=1$. $L=\langle(1,-1)\rangle$, asociado a $\lambda=2$.</p>
    - |-
      <b>A) Falsa:</b> $d=1\neq\alpha=2$ (Teor. 4.7). <b>B) Falsa:</b> por el Teor. 4.6 diagonalizable equivale a base de vectores propios; todos los vectores propios son múltiplos de $(1,-1)$.
    - |-
      <p><b>C) Verdadera.</b> Las raíces son reales, luego existe $J$ (Teor. 4.8). $d=1$: un solo bloque de tamaño $2$:</p>
            $$J=\begin{pmatrix}2&1\cr0&2\end{pmatrix}.$$
            <p><b>Matriz de paso</b> (guion de U p.173): $(A-2I)^2=0$, así que se elige $v=(1,0)\notin\operatorname{Nuc}(A-2I)$ y $Nv=(1,-1)$:</p>
            $$P=\begin{pmatrix}1&1\cr-1&0\end{pmatrix},$$
            <p>$\det P=1$,</p>
            $$AP=\begin{pmatrix}2&3\cr-2&-1\end{pmatrix}=PJ$$
            <p>(columna a columna: $A(1,-1)=2(1,-1)$ y $A(1,0)=(3,-1)=(1,-1)+2(1,0)$).</p>
    - |-
      <b>D)</b> Maxima, fuera de examen. E la da por correcta; U (p.169) escribe <code>jordan(A); dispJordan(%);</code>: los paréntesis vacíos del enunciado no son sintaxis literal.
  - html: |-
      <p><b>Respuesta:</b> A falsa, B falsa, C verdadera, D verdadera (como E).</p>
  - receta: |-
      $2\times2$ con $\lambda$ doble: si $A\neq\lambda I$, entonces $d=1$ y $J=\begin{pmatrix}\lambda&1\cr0&\lambda\end{pmatrix}$. Para $P$: $v$ con $(A-\lambda I)v\neq0$ y $P=\big((A-\lambda I)v\mid v\big)$.
  - error: |-
      concluir «no tiene forma de Jordan» porque no es diagonalizable: el teorema de Jordan existe para ese caso. <b>Teoría:</b> U Teor. 4.4 p.153, 4.6 p.162, 4.7 p.164, 4.8 p.168, guion p.173. (Verificado con sympy.)
- id: ej4-37
  clase: libro
  titulo: |-
    Ejercicio 4.37 — $3\times3$ diagonalizable: «dos bloques» es falso
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 4.37, p. 154
    texto: |-
      E p.154
  cuerpo:
  - enun: |-
      Si $A$ es la matriz de filas $(2,2,-5)$, $(3,7,-15)$, $(1,2,-4)$, justificar si: A) La matriz de Jordan de $A$ posee solo dos bloques. B) $S=\{x=\alpha,y=\beta,z=0\mid\alpha,\beta\in\mathbb R\}$ es un subespacio de vectores propios de $A$. C) $A$ es semejante a la matriz $B$ de filas $(3,0,0)$, $(0,1,0)$ y $(0,0,3)$. D) Ninguna de las anteriores.
  - html: |-
      <p><b>Qué se pide.</b> Hallar los valores propios y comprobar $d_i=\alpha_i$ antes de buscar bloques.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Para una $3\times3$, cuántos bloques tiene $J$ y si es semejante a una diagonal dada.
      - - |-
          Cómo lo pienso
        - |-
          El número de bloques por valor propio es $d(\lambda)$. Calculo valores propios y rangos de $A-\lambda I$.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Tamaños de los bloques:</b> el nº de bloques de tamaño $\ge k$ es $\operatorname{rang}(A-\lambda I)^{k-1}-\operatorname{rang}(A-\lambda I)^{k}$.
      - - |-
          Por dónde empiezo
        - |-
          Polinomio y $d$ de cada valor.
  - pasos:
    - |-
      <b>Polinomio</b> (Sarrus): $p(\lambda)=-\lambda^3+5\lambda^2-7\lambda+3$. Comprobación rápida: coeficiente de $\lambda^2$ = traza $2+7-4=5$ y $p(0)=|A|=3$. Como $p(1)=0$, Ruffini: $p(\lambda)=-(\lambda-1)^2(\lambda-3)$. $\lambda_1=3$ ($\alpha=1$), $\lambda_2=1$ ($\alpha=2$).
    - |-
      <p><b>$d$:</b></p>
            $$A-I=\begin{pmatrix}1&2&-5\cr3&6&-15\cr1&2&-5\end{pmatrix}$$
            <p>con las tres filas proporcionales: rango $1$, $d(1)=3-1=2=\alpha$. $L_1:\ x+2y-5z=0$. Y $\lambda=3$: $d=1=\alpha$ ($1\le d\le\alpha=1$).</p>
    - |-
      <b>A) Falsa.</b> $d_i=\alpha_i$ para los dos valores propios $\Rightarrow$ diagonalizable (Teor. 4.7) $\Rightarrow J=\Lambda=\operatorname{diag}(3,1,1)$, con <b>tres</b> bloques $1\times1$ (nº de bloques $=d(3)+d(1)=1+2=3$).
    - |-
      <b>B) Falsa.</b> «Subespacio de vectores propios» significa que todos sus vectores no nulos son propios de un mismo valor propio, es decir $S\subset L_1$ o $S\subset L_3$. Pero $(1,0,0)\in S$ y $A(1,0,0)=(2,3,1)$ no es múltiplo de $(1,0,0)$.
    - |-
      <b>C) Falsa.</b> Semejantes tienen el mismo determinante y la misma traza: $|A|=3\neq|B|=3\cdot1\cdot3=9$ (y $5\neq7$). $A$ es semejante a $\operatorname{diag}(3,1,1)$, no a $\operatorname{diag}(3,1,3)$.
    - |-
      <b>D) Verdadera.</b>
  - html: |-
      <p><b>Respuesta: D.</b></p>
  - receta: |-
      antes de buscar bloques comprueba si $d_i=\alpha_i$: entonces $J=\Lambda$ con $n$ bloques $1\times1$. Para descartar una semejanza basta un invariante distinto (traza, determinante, polinomio característico, rango de $A-\lambda I$).
  - error: |-
      responder «dos bloques» porque hay dos valores propios distintos: los bloques se cuentan por vectores propios independientes. <b>Teoría:</b> U p.153; Teor. 4.5 p.158; Teor. 4.7 p.164; p.169. (Verificado con sympy: <code>jordan_form</code> da $\operatorname{diag}(1,1,3)$.)
- id: ej4-38
  clase: libro
  titulo: |-
    Ejercicio 4.38 — ¿es $P$ una matriz de paso?
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 4.38, p. 155
    texto: |-
      E p.155
  cuerpo:
  - enun: |-
      Si $A$ es la matriz de filas $(0,3,1)$, $(2,-1,-1)$, $(-2,-1,-1)$ y $J$ la matriz de Jordan asociada, de filas $(2,0,0)$, $(0,-2,1)$, $(0,0,-2)$, justificar si la matriz de paso $P$ verifica: A) Tiene por filas $(1,1,0)$, $(1,-1,0)$, $(-1,1,1)$. B) Tiene por filas $(1,-1,1)$, $(1,1,-1)$, $(-1,-1,0)$. C) No es única. D) En MAXIMA hay instrucciones específicas para calcularla.
  - html: |-
      <p><b>Qué se pide.</b> Comprobar candidatas sin calcular $P$ de cero: $P$ vale si y solo si es regular y $AP=PJ$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Comprobar si dos matrices candidatas son matriz de paso $P$.
      - - |-
          Cómo lo pienso
        - |-
          La matriz de paso cumple $AP=PJ$ columna a columna: cada columna es un vector propio o el siguiente de una cadena. Compruebo columna a columna.
      - - |-
          Qué uso
        - |-
          <b>Matriz de paso:</b> por cada bloque, una <i>cadena</i> $v_1,\dots,v_s$ con $(A-\lambda I)v_1=0$ y $(A-\lambda I)v_{k}=v_{k-1}$; las cadenas por columnas forman $P$ y $AP=PJ$.
      - - |-
          Por dónde empiezo
        - |-
          Calculo $AP$ y $PJ$ y comparo.
  - pasos:
    - |-
      <b>Criterio.</b> $J=P^{-1}AP\iff AP=PJ$ (multiplicando por $P$) <b>con $P$ regular</b>. Comprobar $AP=PJ$ evita invertir; hace falta $\det P\neq0$ porque con $P=0$ también se cumple.
    - |-
      <p><b>A) Correcta.</b></p>
            $$P_A=\begin{pmatrix}1&1&0\cr1&-1&0\cr-1&1&1\end{pmatrix},$$
            <p>$\det P_A=-2\neq0$:</p>$$AP_A=\begin{pmatrix}2&-2&1\cr2&2&-1\cr-2&-2&-1\end{pmatrix}=P_AJ.$$ Lectura por columnas: $u=(1,1,-1)$: $Au=2u$ (propio de $\lambda=2$); $w=(1,-1,1)$: $(A+2I)w=0$ (propio de $\lambda=-2$, primera columna del bloque); $v=(0,0,1)$: $(A+2I)v=(1,-1,1)=w$, es decir $Av=w-2v$ (tercera columna de $J$: $(0,1,-2)$).
    - |-
      <p><b>B) Correcta.</b></p>
            $$P_B=\begin{pmatrix}1&-1&1\cr1&1&-1\cr-1&-1&0\end{pmatrix},$$
            <p>$\det P_B=-2\neq0$ y</p>
            $$AP_B=\begin{pmatrix}2&2&-3\cr2&-2&3\cr-2&2&-1\end{pmatrix}=P_BJ.$$
    - |-
      <p><b>C) Correcta — y por qué hay tantas.</b> Con $P=(p_1\,p_2\,p_3)$, $AP=PJ$ dice: $(A-2I)p_1=0$ ($p_1=a\,u$, $a\neq0$); $(A+2I)p_2=0$ y $(A+2I)p_3=p_2$. Como</p>
            $$(A+2I)^2=\begin{pmatrix}8&8&0\cr8&8&0\cr-8&-8&0\end{pmatrix}:$$
            <p>$\operatorname{Nuc}(A+2I)^2=\{x+y=0\}=\langle w,v\rangle$ y $\operatorname{Nuc}(A+2I)=\langle w\rangle$. Luego $p_3=b\,v+c\,w$ ($b\neq0$), $p_2=(A+2I)p_3=b\,w$ y</p>$$P=\big(a\,u\mid b\,w\mid b\,v+c\,w\big),\qquad a,b\neq0,\ c\in\mathbb R:$$ tres parámetros libres. $P_A$ es $a=b=1,c=0$; $P_B$ es $a=1,b=-1,c=1$. <b>Ojo:</b> $b$ es el mismo en $p_2$ y $p_3$.
    - |-
      <b>D)</b> Maxima (<code>ModeMatrix(A,l)</code>), fuera de examen; E la da por correcta.
  - html: |-
      <p><b>Respuesta:</b> A, B, C y D correctas (como E).</p>
  - receta: |-
      «¿es $P$ matriz de paso?» $\Rightarrow$ (1) $\det P\neq0$; (2) $AP=PJ$ (columna $j$ de $AP$ = $Ap_j$ frente a columna $j$ de $PJ$). Para ver que no es única basta multiplicar un vector propio aislado por un escalar $\neq0$.
  - error: |-
      escalar solo la última columna de una cadena: dentro de un bloque $p_2=(A-\lambda I)p_3$ obliga a escalarlas juntas. <b>Teoría:</b> U Teor. 4.8 p.168; guion p.173; Ej. 4.18 pp.173-175. (Verificado con sympy; <code>jordan_form</code> da la misma $J$ con los bloques en otro orden, válido por U p.169.)
- id: ej4-39
  clase: libro
  titulo: |-
    Ejercicio 4.39 — forma de Jordan de una $4\times4$ con $\alpha=4$, $d=2$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 4.39, p. 156-157
    texto: |-
      E p.156-157
  cuerpo:
  - enun: |-
      Si $(2,0,3,0)$, $(1,2,0,3)$, $(0,0,2,0)$, $(0,0,1,2)$ son las filas de $A$, se pide obtener la matriz de Jordan $J$ asociada.
  - html: |-
      <p><b>Qué se pide.</b> $A=\begin{pmatrix}2&0&3&0\cr1&2&0&3\cr0&0&2&0\cr0&0&1&2\end{pmatrix}$. Con $\alpha=4$ y $d=2$ hay dos candidatas, $(3,1)$ y $(2,2)$: hay que mirar los rangos de las potencias.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Matriz de Jordan de una $4\times4$ con $\alpha=4$.
      - - |-
          Cómo lo pienso
        - |-
          Un único valor propio. El número de bloques es $4-\operatorname{rang}(A-2I)$ y para saber sus tamaños miro también el rango de $(A-2I)^2$.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Tamaños de los bloques:</b> el nº de bloques de tamaño $\ge k$ es $\operatorname{rang}(A-\lambda I)^{k-1}-\operatorname{rang}(A-\lambda I)^{k}$.
      - - |-
          Por dónde empiezo
        - |-
          Rangos de $A-2I$ y $(A-2I)^2$.
  - pasos:
    - |-
      <p><b>Polinomio</b> (por la 3.ª fila, que solo tiene $2-\lambda$ en la columna 3; luego por la 1.ª fila):</p>
            $$|A-\lambda I|=(2-\lambda)\begin{vmatrix}2-\lambda&0&0\cr1&2-\lambda&3\cr0&0&2-\lambda\end{vmatrix}=(2-\lambda)^2\begin{vmatrix}2-\lambda&3\cr0&2-\lambda\end{vmatrix}=(2-\lambda)^4.$$
            <p>Único valor propio $\lambda=2$, $\alpha=4$.</p>
    - |-
      <p><b>$d$:</b></p>
            $$N=A-2I=\begin{pmatrix}0&0&3&0\cr1&0&0&3\cr0&0&0&0\cr0&0&1&0\end{pmatrix}.$$
            <p>La fila 1 es el triple de la fila 4 y la fila 2 es independiente: $\operatorname{rang}N=2$, $d=4-2=2\lt4$: no es diagonalizable, hay <b>$2$ bloques</b>. $\operatorname{Nuc}N$: $x_3=0,\ x_1+3x_4=0$.</p>
    - |-
      <b>Candidatas:</b> tamaños no crecientes que suman $4$ con $d=2$ bloques: $(3,1)$ o $(2,2)$ (U Ej. 4.16).
    - |-
      <p><b>Cadena de núcleos:</b></p>
            $$N^2=\begin{pmatrix}0&0&0&0\cr0&0&6&0\cr0&0&0&0\cr0&0&0&0\end{pmatrix},$$
            <p>$\operatorname{rang}N^2=1$; $N^3=0$. Dimensiones: $\dim\operatorname{Nuc}N=2$, $\dim\operatorname{Nuc}N^2=3$, $\dim\operatorname{Nuc}N^3=4=\alpha$ (se para).</p>
    - |-
      <b>Decisión.</b> Si fuera $(2,2)$, las dimensiones serían $2,4$; pero $\dim\operatorname{Nuc}N^2=3$ $\Rightarrow$ descartado. Con $(3,1)$: $1+1=2,\ 2+1=3,\ 3+1=4$ ✓. Equivalente: nº de bloques de tamaño $\ge k$ $=\dim\operatorname{Nuc}N^k-\dim\operatorname{Nuc}N^{k-1}$: $\ge1$: $2$; $\ge2$: $1$; $\ge3$: $1$ $\Rightarrow$ tamaños $3$ y $1$.
    - |-
      <p><b>Resultado:</b></p>
            $$J=\begin{pmatrix}2&1&0&0\cr0&2&1&0\cr0&0&2&0\cr0&0&0&2\end{pmatrix}$$
            <p>(sympy: la misma; rangos de $N^k$: $2,1,0$).</p>
  - receta: |-
      si hay varias particiones posibles (con $\alpha\ge4$), calcula $r_k=\operatorname{rang}(A-\lambda I)^k$ hasta que $n-r_k=\alpha$. Nº de bloques de tamaño $\ge k$ $=r_{k-1}-r_k$ (con $r_0=n$).
  - error: |-
      decidir los bloques solo con $d$ cuando $\alpha=4$ y $d=2$ (ejemplo propio 10). <b>Teoría:</b> U Teor. 4.1 p.146, Teor. 4.7 p.164, pp.169-170 (Ej. 4.16), guion p.173, p.176.
- id: ej4-40
  clase: libro
  titulo: |-
    Ejercicio 4.40 — matriz de paso para el ejercicio 4.39
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 4.40, p. 158-159
    texto: |-
      E p.158-159
  cuerpo:
  - enun: |-
      Si $A$ y $J$ son las matrices del Ejercicio 4.39, se pide obtener una matriz de paso.
  - html: |-
      <p><b>Qué se pide.</b> Aplicar el guion de U p.173: $P=(e_1\,e_2\,e_3\,e_4)$ con $N=A-2I$ y $J=\operatorname{diag}(J_3(2),J_1(2))$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Matriz de paso para el $J$ del 4.39.
      - - |-
          Cómo lo pienso
        - |-
          Para cada bloque necesito una cadena: un vector propio y los vectores que lo van generando con $(A-\lambda I)v=\text{anterior}$.
      - - |-
          Qué uso
        - |-
          <b>Matriz de paso:</b> por cada bloque, una <i>cadena</i> $v_1,\dots,v_s$ con $(A-\lambda I)v_1=0$ y $(A-\lambda I)v_{k}=v_{k-1}$; las cadenas por columnas forman $P$ y $AP=PJ$.
      - - |-
          Por dónde empiezo
        - |-
          Resuelvo por cadenas y compruebo $AP=PJ$.
  - pasos:
    - |-
      <b>Qué base buscamos.</b> $AP=PJ$ columna a columna: $Ae_1=2e_1$, $Ae_2=e_1+2e_2$, $Ae_3=e_2+2e_3$, $Ae_4=2e_4$; es decir $Ne_1=0$, $Ne_2=e_1$, $Ne_3=e_2$, $Ne_4=0$. Así $(e_1,e_2,e_3)=(N^2v,\,Nv,\,v)$ con $v=e_3$: una <b>cadena</b> que empieza en $v$ y termina en un vector propio. Se calcula <b>de derecha a izquierda</b>.
    - |-
      <b>Cadena de núcleos</b> (de 4.39): $\operatorname{Nuc}N:\{x_3=0,x_1+3x_4=0\}$ (dim $2$) $\subset\operatorname{Nuc}N^2:\{x_3=0\}$ (dim $3$) $\subset\operatorname{Nuc}N^3=\mathbb R^4$ (dim $4=\alpha$, $k=3$).
    - |-
      <b>Elegir $v\in\operatorname{Nuc}N^3$ que no esté en $\operatorname{Nuc}N^2$</b>, es decir con $x_3\neq0$: lo más sencillo, $v=(0,0,1,0)$. ¿Por qué fuera de $\operatorname{Nuc}N^2$? Para que $N^2v\neq0$: así la cadena tiene longitud $3$.
    - |-
      <b>Bajar:</b> $e_2=Nv=$ tercera columna de $N=(3,0,0,1)$ (está en $\operatorname{Nuc}N^2$, no en $\operatorname{Nuc}N$: $3+3\neq0$). $e_1=N(3,0,0,1)=(0,6,0,0)$ (en $\operatorname{Nuc}N$ ✓: es propio). Hay $3$ vectores; faltan $\alpha-3=1$.
    - |-
      <b>Vector del bloque $1\times1$:</b> propio ($Ne_4=0$) e independiente de $e_1$: $\operatorname{Nuc}N=\langle(0,1,0,0),(-3,0,0,1)\rangle$; vale $a(0,1,0,0)+b(-3,0,0,1)$ con $b\neq0$. También vale $(1,0,0,-\tfrac13)$; $(-3,0,0,1)$ evita fracciones.
    - |-
      <b>Matriz de paso</b> (columnas $e_1,e_2,e_3,e_4$):
            $$P=\begin{pmatrix}0&3&0&1\cr6&0&0&0\cr0&0&1&0\cr0&1&0&-\tfrac13\end{pmatrix},\qquad\det P=12\neq0,\qquad AP=PJ.$$ Con $e_4=(-3,0,0,1)$: $\det P=-36$ y también $AP=PJ$.
    - |-
      <b>Si se ordenan mal las columnas</b> $(v,Nv,N^2v)$: $P^{-1}AP$ tiene en ese bloque los unos <b>debajo</b> de la diagonal (la traspuesta), no la $J$ de U.
  - receta: |-
      para cada bloque de tamaño $s$: (1) elige $v$ con $N^{s-1}v\neq0$ y $N^sv=0$, independiente de las cabezas ya elegidas y de sus cadenas; (2) calcula $Nv,\dots,N^{s-1}v$; (3) columnas $(N^{s-1}v,\dots,Nv,v)$; (4) completa con vectores propios independientes; (5) comprueba $\det P\neq0$ y $AP=PJ$.
  - error: |-
      (a) tomar $v\in\operatorname{Nuc}N^2$ (p. ej. $(1,0,0,0)$): la cadena se corta antes; (b) $e_4$ proporcional a $e_1$: $P$ singular; (c) invertir el orden de la cadena. <b>Teoría:</b> U Def. 4.13 y guion p.173; Ej. 4.18-4.19 pp.173-177. (Verificado con sympy.)
- id: ej4-41
  clase: libro
  titulo: |-
    Ejercicio 4.41 — aproximar el vector propio estrictamente dominante
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 4.41, p. 159-160
    texto: |-
      E p.159-160
  cuerpo:
  - enun: |-
      Se pide aproximar un vector propio estrictamente dominante de la matriz $\begin{pmatrix}-4&1\cr-6&1\end{pmatrix}$ mediante el método de potencias.
  - html: |-
      <p><b>Qué se pide.</b> Aplicar el algoritmo de U p.185 con $x_0=(1,1)$ y leer el resultado.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Aproximar un vector propio dominante con el método de las potencias.
      - - |-
          Cómo lo pienso
        - |-
          Multiplicar una y otra vez por $A$ hace que domine la dirección del valor propio de mayor módulo.
      - - |-
          Qué uso
        - |-
          <b>Método de potencias:</b> la iteración $x_{k+1}=Ax_k$ normalizada converge hacia el vector propio del valor propio de mayor módulo.
      - - |-
          Por dónde empiezo
        - |-
          Itero con un vector inicial y normalizo.
  - pasos:
    - |-
      <b>Algoritmo:</b> $\mu_k$ = coordenada de $Ax_k$ de mayor valor absoluto, <b>con su signo</b>; $x_{k+1}=\tfrac1{\mu_k}Ax_k$.
    - |-
      <b>Iteraciones a mano (fracciones exactas):</b> $k=0$: $Ax_0=(-4+1,\,-6+1)=(-3,-5)$, $\mu_0=-5$, $x_1=(\tfrac35,1)$. $k=1$: $Ax_1=(-\tfrac75,-\tfrac{13}5)$, $\mu_1=-\tfrac{13}5$, $x_2=(\tfrac7{13},1)$. $k=2$: $Ax_2=(-\tfrac{15}{13},-\tfrac{29}{13})$, $\mu_2=-\tfrac{29}{13}$, $x_3=(\tfrac{15}{29},1)$. $k=3$: $\mu_3=-\tfrac{61}{29}$, $x_4=(\tfrac{31}{61},1)$. $k=4$: $\mu_4=-\tfrac{125}{61}$, $x_5=(\tfrac{63}{125},1)$. <i>Atajo:</i> con $x_k=(a,1)$ y $a\gt0$, $Ax_k=(1-4a,\,1-6a)$ y la 2.ª coordenada siempre gana en valor absoluto.
    - |-
      <b>Tabla:</b>
            <table>
              <tr><th>$k$</th><th>$\mu_k$</th><th>$\mu_k$ (dec.)</th><th>$x_{k+1}$</th><th>1.ª coord.</th></tr>
              <tr><td>$0$</td><td>$-5$</td><td>$-5$</td><td>$(\tfrac35,1)$</td><td>$0.6$</td></tr>
              <tr><td>$1$</td><td>$-\tfrac{13}5$</td><td>$-2.6$</td><td>$(\tfrac7{13},1)$</td><td>$0.5385$</td></tr>
              <tr><td>$2$</td><td>$-\tfrac{29}{13}$</td><td>$-2.2308$</td><td>$(\tfrac{15}{29},1)$</td><td>$0.5172$</td></tr>
              <tr><td>$3$</td><td>$-\tfrac{61}{29}$</td><td>$-2.1034$</td><td>$(\tfrac{31}{61},1)$</td><td>$0.5082$</td></tr>
              <tr><td>$4$</td><td>$-\tfrac{125}{61}$</td><td>$-2.0492$</td><td>$(\tfrac{63}{125},1)$</td><td>$0.504$</td></tr>
              <tr><td>$5$</td><td>$-\tfrac{253}{125}$</td><td>$-2.024$</td><td>$(\tfrac{127}{253},1)$</td><td>$0.5020$</td></tr>
              <tr><td>$6$</td><td>$-\tfrac{509}{253}$</td><td>$-2.0119$</td><td>$(\tfrac{255}{509},1)$</td><td>$0.5010$</td></tr>
              <tr><td>$7$</td><td>$-\tfrac{1021}{509}$</td><td>$-2.0059$</td><td>$(\tfrac{511}{1021},1)$</td><td>$0.5005$</td></tr>
            </table>
            (Coincide con la tabla de Maxima de E p.160, $k=7$: $\mu\approx-2.00589$, $x\approx(0.50049,1)$.)
    - |-
      <b>Lectura:</b> $\mu_k\to-2$ y $x_k\to(\tfrac12,1)\propto(1,2)$. Estimación: valor propio estrictamente dominante $\lambda_1\approx-2$, vector propio $\approx(1,2)$.
    - |-
      <p><b>Comprobación exacta:</b></p>
            $$|A-\lambda I|=(-4-\lambda)(1-\lambda)+6=\lambda^2+3\lambda+2=(\lambda+1)(\lambda+2):$$
            <p>valores propios $-2$ y $-1$; $|-2|\gt|-1|$, luego $-2$ es estrictamente dominante (U Def. 4.14).</p>
            $$A+2I=\begin{pmatrix}-2&1\cr-6&3\end{pmatrix}\Rightarrow(1,2);$$
            $$A+I=\begin{pmatrix}-3&1\cr-6&2\end{pmatrix}\Rightarrow(1,3).$$
    - |-
      <b>Por qué converge y a qué ritmo.</b> $x_0=(1,1)=2(1,2)-(1,3)$, luego $A^kx_0=2(-2)^k(1,2)-(-1)^k(1,3)$ y $x_k=\Big(\dfrac{2^{k+1}-1}{2^{k+2}-3},1\Big)\to(\tfrac12,1)$, $\mu_k=-\dfrac{2^{k+3}-3}{2^{k+2}-3}\to-2$. El término «molesto» pesa como $(|\lambda_2|/|\lambda_1|)^k=(1/2)^k$: el error se divide por $2$ en cada paso (se ve en la tabla: $0.1,\ 0.038,\ 0.017,\ 0.008$…).
    - |-
      <b>Signo:</b> aunque $\lambda_1\lt0$, $x_k$ no cambia de signo porque se divide por $\mu_k$ <b>con su signo</b>; por eso $\mu_k$ estima $-2$ y no $2$.
  - receta: |-
      tabla de tres columnas $Ax_k\mid\mu_k\mid x_{k+1}=Ax_k/\mu_k$. Para justificar: (1) valores propios y comprobar que hay uno estrictamente dominante; (2) tres o cuatro iteraciones; (3) comparar con el vector propio exacto.
  - error: |-
      tomar $\mu_k$ en valor absoluto ($+5$ en vez de $-5$): entonces $x_k$ alterna de signo y $\mu_k\to2$, valor equivocado. <b>Teoría:</b> U §4.4.3, Def. 4.14 p.181, Ej. 4.24 p.182, algoritmo p.185. (Verificado con sympy en fracciones.)
- id: ej-propio-1
  clase: propio
  titulo: |-
    Ejemplo propio 1 (fácil) — $J$ de una $2\times2$ no diagonalizable
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      Halla $J$ y una matriz de paso de $A=\begin{pmatrix}1&1\cr-1&3\end{pmatrix}$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Jordan y matriz de paso de una $2\times2$.
      - - |-
          Cómo lo pienso
        - |-
          Valor doble con un único vector propio: un bloque $2\times2$. La cadena es $v_1\in L_\lambda$, $v_2$ con $(A-\lambda I)v_2=v_1$.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Matriz de paso:</b> por cada bloque, una <i>cadena</i> $v_1,\dots,v_s$ con $(A-\lambda I)v_1=0$ y $(A-\lambda I)v_{k}=v_{k-1}$; las cadenas por columnas forman $P$ y $AP=PJ$.
      - - |-
          Por dónde empiezo
        - |-
          Polinomio, $v_1$ y $v_2$.
  - pasos:
    - |-
      $$|A-\lambda I|=(1-\lambda)(3-\lambda)+1=\lambda^2-4\lambda+4=(\lambda-2)^2:$$
            <p>$\lambda=2$, $\alpha=2$.</p>
    - |-
      $$A-2I=\begin{pmatrix}-1&1\cr-1&1\end{pmatrix},$$
            <p>rango $1$, $d=1\lt2$: no diagonalizable; un bloque:</p>
            $$J=\begin{pmatrix}2&1\cr0&2\end{pmatrix}.$$
    - |-
      $(A-2I)^2=0$: sirve cualquier $v$ con $(A-2I)v\neq0$: $v=(1,0)$, $(A-2I)v=(-1,-1)$ (vector propio).
    - |-
      $$P=\begin{pmatrix}-1&1\cr-1&0\end{pmatrix}$$
            <p>(vector propio primero), $\det P=1$. Comprobación: $A(-1,-1)=(-2,-2)$ ✓; $A(1,0)=(1,-1)=(-1,-1)+2(1,0)$ ✓. Es decir $AP=PJ$.</p>
- id: ej-propio-2
  clase: propio
  titulo: |-
    Ejemplo propio 2 (fácil-medio) — $3\times3$, $\lambda$ triple con $\operatorname{rang}(A-\lambda I)=1$
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      Halla $J$ y $P$ de $A=\begin{pmatrix}3&-1&1\cr1&1&1\cr0&0&2\end{pmatrix}$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          $J$ y $P$ de una $3\times3$ con valor triple y $\operatorname{rang}(A-\lambda I)=1$.
      - - |-
          Cómo lo pienso
        - |-
          Rango 1 en dimensión 3: $d=2$, dos bloques que suman 3. Solo cabe un bloque de 2 y otro de 1.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Tamaños de los bloques:</b> el nº de bloques de tamaño $\ge k$ es $\operatorname{rang}(A-\lambda I)^{k-1}-\operatorname{rang}(A-\lambda I)^{k}$.
      - - |-
          Por dónde empiezo
        - |-
          Cadena de longitud 2 y un vector propio independiente.
  - pasos:
    - |-
      <p>Por la 3.ª fila:</p>
            $$|A-\lambda I|=(2-\lambda)\big[(3-\lambda)(1-\lambda)+1\big]=(2-\lambda)(\lambda-2)^2=-(\lambda-2)^3.$$
    - |-
      $$N=A-2I=\begin{pmatrix}1&-1&1\cr1&-1&1\cr0&0&0\end{pmatrix},$$
            <p>rango $1$, $d=2$: bloques $(2,1)$,</p>
            $$J'=\begin{pmatrix}2&1&0\cr0&2&0\cr0&0&2\end{pmatrix}.$$
    - |-
      $N^2=0$. $\operatorname{Nuc}N:\ x-y+z=0$, es $\langle(1,1,0),(0,1,1)\rangle$.
    - |-
      Cabeza $v=(1,0,0)\notin\operatorname{Nuc}N$; $Nv=(1,1,0)$. Tercer vector: propio e independiente de $(1,1,0)$: $(0,1,1)$.
    - |-
      $$P=\begin{pmatrix}1&1&0\cr1&0&1\cr0&0&1\end{pmatrix}$$
            <p>(columnas $Nv,v,(0,1,1)$), $\det P=-1$, $AP=PJ'$. <i>Trampa:</i> como 3.ª columna $(1,1,0)$ ($P$ singular) o $(0,0,1)$ (no es propio).</p>
- id: ej-propio-3
  clase: propio
  titulo: |-
    Ejemplo propio 3 (medio) — $\lambda$ triple con $\operatorname{rang}(A-\lambda I)=2$: un bloque $3\times3$
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      Halla $J$ y $P$ de $A=\begin{pmatrix}0&1&0\cr0&0&1\cr1&-3&3\end{pmatrix}$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          $J$ y $P$ con valor triple y rango 2.
      - - |-
          Cómo lo pienso
        - |-
          Rango 2 ⇒ $d=1$ ⇒ un único bloque $3\times3$. Hace falta una cadena de tres vectores.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Matriz de paso:</b> por cada bloque, una <i>cadena</i> $v_1,\dots,v_s$ con $(A-\lambda I)v_1=0$ y $(A-\lambda I)v_{k}=v_{k-1}$; las cadenas por columnas forman $P$ y $AP=PJ$.
      - - |-
          Por dónde empiezo
        - |-
          Resuelvo $(A-\lambda I)v_3=v_2$, $(A-\lambda I)v_2=v_1$.
  - pasos:
    - |-
      $$|A-\lambda I|=-\lambda\big[-\lambda(3-\lambda)+3\big]-1\cdot(0-1)=-\lambda^3+3\lambda^2-3\lambda+1=-(\lambda-1)^3.$$
    - |-
      $$N=A-I=\begin{pmatrix}-1&1&0\cr0&-1&1\cr1&-3&2\end{pmatrix}:$$
            <p>fila 3 $=-$fila 1 $+2\cdot$fila 2, rango $2$, $d=1$: un bloque,</p>
            $$J''=\begin{pmatrix}1&1&0\cr0&1&1\cr0&0&1\end{pmatrix}.$$
    - |-
      $$N^2=\begin{pmatrix}1&-2&1\cr1&-2&1\cr1&-2&1\end{pmatrix}$$
            <p>(rango $1$), $N^3=0$: dimensiones $1,2,3$.</p>
    - |-
      $v\notin\operatorname{Nuc}N^2=\{x-2y+z=0\}$: $v=(1,0,0)$; $Nv=(-1,0,1)$; $N^2v=(1,1,1)$ (propio: $N(1,1,1)=0$ ✓).
    - |-
      $$P=(N^2v\mid Nv\mid v)=\begin{pmatrix}1&-1&1\cr1&0&0\cr1&1&0\end{pmatrix},$$
            <p>$\det P=1$, $AP=PJ''$.</p>
- id: ej-propio-4
  clase: propio
  titulo: |-
    Ejemplo propio 4 (medio) — $4\times4$ con dos valores propios dobles
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      Halla $J$ y $P$ de $A=\begin{pmatrix}1&1&1&0\cr0&1&0&1\cr0&0&2&0\cr0&0&0&2\end{pmatrix}$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          $J$ y $P$ de una $4\times4$ con dos valores propios dobles.
      - - |-
          Cómo lo pienso
        - |-
          Cada valor propio se trata por separado.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Matriz de paso:</b> por cada bloque, una <i>cadena</i> $v_1,\dots,v_s$ con $(A-\lambda I)v_1=0$ y $(A-\lambda I)v_{k}=v_{k-1}$; las cadenas por columnas forman $P$ y $AP=PJ$.
      - - |-
          Por dónde empiezo
        - |-
          Rangos de $A-\lambda I$ y cadenas.
  - pasos:
    - |-
      Triangular: valores propios $1,1,2,2$; $|A-\lambda I|=(\lambda-1)^2(\lambda-2)^2$.
    - |-
      <p>$\lambda=1$:</p>
            $$A-I=\begin{pmatrix}0&1&1&0\cr0&0&0&1\cr0&0&1&0\cr0&0&0&1\end{pmatrix},$$
            <p>rango $3$, $d=1\lt2$: un bloque $2\times2$.</p>
    - |-
      <p>$\lambda=2$:</p>
            $$A-2I=\begin{pmatrix}-1&1&1&0\cr0&-1&0&1\cr0&0&0&0\cr0&0&0&0\end{pmatrix},$$
            <p>rango $2$, $d=2=\alpha$: dos bloques $1\times1$.</p>
    - |-
      $$J=\begin{pmatrix}1&1&0&0\cr0&1&0&0\cr0&0&2&0\cr0&0&0&2\end{pmatrix}$$
            <p>(nº de bloques $3=1+2$; unos: $4-3=1$).</p>
    - |-
      <p>Cadena de $\lambda=1$:</p>
            $$(A-I)^2=\begin{pmatrix}0&0&1&1\cr0&0&0&1\cr0&0&1&0\cr0&0&0&1\end{pmatrix},$$
            <p>$\operatorname{Nuc}=\langle e_1,e_2\rangle$ (dim $2=\alpha$) y $\operatorname{Nuc}(A-I)=\langle e_1\rangle$: $v=e_2$, $(A-I)e_2=e_1$.</p>
    - |-
      Propios de $\lambda=2$: $-x+y+z=0,\ -y+w=0$: $(1,0,1,0)$, $(1,1,0,1)$.
    - |-
      $$P=\begin{pmatrix}1&0&1&1\cr0&1&0&1\cr0&0&1&0\cr0&0&0&1\end{pmatrix},$$
            <p>$\det P=1$, $AP=PJ$. Cada valor propio se trabaja <b>por separado</b> con su $A-\lambda I$.</p>
- id: ej-propio-5
  clase: propio
  titulo: |-
    Ejemplo propio 5 (medio) — todas las $J$ posibles para un polinomio dado (como U Ej. 4.16 y 4.22)
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio a partir de U Ej. 4.16 p. 170 y 4.22 p. 179
    texto: propio
  cuerpo:
  - enun: |-
      $A$ es de orden $5$ con $|A-\lambda I|=-(\lambda-2)^3(\lambda+1)^2$. ¿Qué formas de Jordan son posibles? ($J_s(\lambda)$ = bloque de tamaño $s$.)
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Enumerar las formas de Jordan posibles dado el polinomio característico.
      - - |-
          Cómo lo pienso
        - |-
          Para cada valor propio, los tamaños de sus bloques forman una partición de su multiplicidad.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$.
      - - |-
          Por dónde empiezo
        - |-
          Listo particiones de 3 y de 2 y las combino.
  - pasos:
    - |-
      $\lambda=2$ ($\alpha=3$): $d=1$: $J_3(2)$; $d=2$: $J_2(2)\oplus J_1(2)$; $d=3$: $2I_3$.
    - |-
      $\lambda=-1$ ($\alpha=2$): $d=1$: $J_2(-1)$; $d=2$: $-I_2$.
    - |-
      <p>Combinaciones: $3\cdot2=6$ formas de Jordan (salvo orden). Nº de bloques $d(2)+d(-1)$, entre $2$ y $5$. Por ejemplo, con $d(2)=2$ y $d(-1)=1$:</p>
            $$J=\operatorname{diag}\big(J_2(2),\,J_1(2),\,J_2(-1)\big)=\begin{pmatrix}2&1&0&0&0\cr0&2&0&0&0\cr0&0&2&0&0\cr0&0&0&-1&1\cr0&0&0&0&-1\end{pmatrix}.$$
    - |-
      Solo una es diagonal ($d=\alpha$ en ambos). Con $\alpha\le3$, <b>$d$ determina los bloques</b>; con $\alpha=4$ y $d=2$ ya no (ejemplo propio 10).
- id: ej-propio-6
  clase: propio
  titulo: |-
    Ejemplo propio 6 (medio) — deducir $J$ a partir de los rangos de $(A-\lambda I)^k$
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      $A$ de orden $5$ con único valor propio $\lambda=3$, y $\operatorname{rang}(A-3I)=3$, $\operatorname{rang}(A-3I)^2=1$, $\operatorname{rang}(A-3I)^3=0$. Halla $J$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Deducir $J$ a partir de los rangos de $(A-3I)^k$.
      - - |-
          Cómo lo pienso
        - |-
          Las diferencias entre rangos consecutivos cuentan cuántos bloques hay de cada tamaño.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Tamaños de los bloques:</b> el nº de bloques de tamaño $\ge k$ es $\operatorname{rang}(A-\lambda I)^{k-1}-\operatorname{rang}(A-\lambda I)^{k}$.
      - - |-
          Por dónde empiezo
        - |-
          Resto rangos consecutivos.
  - pasos:
    - |-
      Dimensiones de los núcleos: $5-3=2$, $5-1=4$, $5-0=5=\alpha$ (se para).
    - |-
      Nº de bloques de tamaño $\ge k$ $=\dim\operatorname{Nuc}_k-\dim\operatorname{Nuc}_{k-1}$: $\ge1$: $2$; $\ge2$: $4-2=2$; $\ge3$: $5-4=1$.
    - |-
      Dos bloques, ambos de tamaño $\ge2$ y uno de ellos $\ge3$, con suma $5$: tamaños $(3,2)$. $J=\operatorname{diag}(J_3(3),J_2(3))$.
    - |-
      <p>Justificación: $(J_s-\lambda I)^k$ tiene rango $\max(s-k,0)$ y</p>
            $$\operatorname{rang}(A-\lambda I)^k=\operatorname{rang}(J-\lambda I)^k$$
            <p>por semejanza (U Teor. 4.1, p.146). sympy: rangos $3,1,0$ para esa $J$ ✓.</p>
    - |-
      Variante rápida: con $\alpha=4$, $\operatorname{rang}(A-\lambda I)=2$ y $(A-\lambda I)^2=0$ $\Rightarrow$ dimensiones $2,4$ $\Rightarrow(2,2)$; si $\operatorname{rang}(A-\lambda I)^2=1$ $\Rightarrow(3,1)$.
- id: ej-propio-7
  clase: propio
  titulo: |-
    Ejemplo propio 7 (medio) — matriz nilpotente
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy; U p. 169 (nilpotente)
    texto: propio
  cuerpo:
  - enun: |-
      Halla $J$ y $P$ de $A=\begin{pmatrix}1&1&0\cr-1&-1&1\cr0&0&0\end{pmatrix}$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          $J$ y $P$ de una matriz nilpotente.
      - - |-
          Cómo lo pienso
        - |-
          Único valor propio $0$; el tamaño máximo de bloque es el menor $k$ con $A^k=0$.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Matriz de paso:</b> por cada bloque, una <i>cadena</i> $v_1,\dots,v_s$ con $(A-\lambda I)v_1=0$ y $(A-\lambda I)v_{k}=v_{k-1}$; las cadenas por columnas forman $P$ y $AP=PJ$.
      - - |-
          Por dónde empiezo
        - |-
          Potencias de $A$ y cadena en el núcleo.
  - pasos:
    - |-
      $$A^2=\begin{pmatrix}0&0&1\cr0&0&-1\cr0&0&0\end{pmatrix}$$
            <p>y $A^3=0$: <b>nilpotente</b> (U p.169).</p>
    - |-
      <b>Único valor propio $0$:</b> si $Av=\lambda v$ con $v\neq0$, entonces $0=A^3v=\lambda^3v$, luego $\lambda=0$. En efecto $|A-\lambda I|=-\lambda^3$.
    - |-
      <p>$\operatorname{rang}A=2$, $d=1$: un bloque $3\times3$ con $\lambda=0$:</p>
            $$J=\begin{pmatrix}0&1&0\cr0&0&1\cr0&0&0\end{pmatrix}.$$
    - |-
      $v\notin\operatorname{Nuc}A^2$ ($A^2v=(z,-z,0)$, basta $z\neq0$): $v=e_3$; $Av=(0,1,0)$; $A^2v=(1,-1,0)$.
    - |-
      $$P=(A^2v\mid Av\mid v)=\begin{pmatrix}1&0&0\cr-1&1&0\cr0&0&1\end{pmatrix},$$
            <p>$\det P=1$ y $AP=PJ$.</p>
    - |-
      <b>Consecuencia:</b> una nilpotente <b>no nula</b> nunca es diagonalizable (si lo fuera, $\Lambda=0$ y $A=P\,0\,P^{-1}=0$).
- id: ej-propio-8
  clase: propio
  titulo: |-
    Ejemplo propio 8 (medio-difícil) — potencias de un bloque y $A^n=PJ^nP^{-1}$
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      Con $A=\begin{pmatrix}1&1\cr-1&3\end{pmatrix}$ (ejemplo propio 1), halla $A^n$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Calcular $A^n$ con un bloque de Jordan.
      - - |-
          Cómo lo pienso
        - |-
          Un bloque $\lambda I+N$ con $N^2=0$ se eleva con el binomio, que solo tiene dos términos.
      - - |-
          Qué uso
        - |-
          <b>Potencia de un bloque:</b> $(\lambda I+N)^n=\lambda^nI+n\lambda^{n-1}N$ si $N^2=0$.
      - - |-
          Por dónde empiezo
        - |-
          $J^n$ y $PJ^nP^{-1}$.
  - pasos:
    - |-
      <p>$J=2I+N$ con</p>
            $$N=\begin{pmatrix}0&1\cr0&0\end{pmatrix},$$
            <p>$N^2=0$. Como $2I$ conmuta con $N$:</p>
            $$J^n=2^nI+n2^{n-1}N=\begin{pmatrix}2^n&n2^{n-1}\cr0&2^n\end{pmatrix}.$$
            <p>(Calcular $J^n$ elevando cada entrada a $n$ solo vale para diagonales.)</p>
    - |-
      <p>De $A=PJP^{-1}$ con</p>
            $$P=\begin{pmatrix}-1&1\cr-1&0\end{pmatrix},$$
            $$P^{-1}=\begin{pmatrix}0&-1\cr1&-1\end{pmatrix}:$$
            <p>$A^n=PJ^nP^{-1}$ (los $P^{-1}P$ intermedios se cancelan).</p>
            $$PJ^n=\begin{pmatrix}-2^n&2^n-n2^{n-1}\cr-2^n&-n2^{n-1}\end{pmatrix}$$$$A^n=PJ^nP^{-1}=2^{n-1}\begin{pmatrix}2-n&n\cr-n&n+2\end{pmatrix}.$$
    - |-
      <p>Comprobaciones: $n=1$ da $A$; $n=2$ da</p>
            $$\begin{pmatrix}0&4\cr-4&8\end{pmatrix}=A^2$$
            <p>(sympy: correcto para $n=1,2,3,5$).</p>
- id: ej-propio-9
  clase: propio
  titulo: |-
    Ejemplo propio 9 (medio-difícil) — raíces complejas: no hay $J$ real
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy; U p. 167 sobre raíces reales
    texto: propio
  cuerpo:
  - enun: |-
      Estudia si $A=\begin{pmatrix}1&-2\cr1&-1\end{pmatrix}$ tiene forma de Jordan real.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Decidir si una matriz tiene forma de Jordan real.
      - - |-
          Cómo lo pienso
        - |-
          Si el polinomio tiene raíces complejas, no hay $J$ real.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$.
      - - |-
          Por dónde empiezo
        - |-
          Raíces del polinomio.
  - pasos:
    - |-
      $|A-\lambda I|=(1-\lambda)(-1-\lambda)+2=\lambda^2+1$: sin raíces reales.
    - |-
      Si existiera $J$ real triangular con $J=P^{-1}AP$, tendría el mismo polinomio característico (U Teor. 4.4), que sería $(\lambda-j_{11})(\lambda-j_{22})$ con $j_{ii}$ reales: contradicción. <b>No hay forma de Jordan real</b>; el Teor. 4.8 requiere tácitamente raíces reales.
    - |-
      Sobre $\mathbb C$: $\lambda=\pm i$ distintos, diagonalizable, $J=\operatorname{diag}(i,-i)$, con vectores $(1+i,1)$ y $(1-i,1)$ (sympy).
- id: ej-propio-10
  clase: propio
  titulo: |-
    Ejemplo propio 10 (difícil) — mismo polinomio y misma $d$, pero no semejantes
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      $A=\begin{pmatrix}2&0&3&0\cr1&2&0&3\cr0&0&2&0\cr0&0&1&2\end{pmatrix}$ (la de E 4.39) y $B=\begin{pmatrix}2&0&1&0\cr0&2&0&1\cr0&0&2&0\cr0&0&0&2\end{pmatrix}$. ¿Son semejantes?
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Decidir si dos matrices con igual polinomio y $d$ son semejantes.
      - - |-
          Cómo lo pienso
        - |-
          Si los rangos de $(A-\lambda I)^2$ difieren, los tamaños de bloques difieren.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Tamaños de los bloques:</b> el nº de bloques de tamaño $\ge k$ es $\operatorname{rang}(A-\lambda I)^{k-1}-\operatorname{rang}(A-\lambda I)^{k}$.
      - - |-
          Por dónde empiezo
        - |-
          Comparo rangos de potencias.
  - pasos:
    - |-
      Ambas tienen el único valor propio $2$ y $|A-\lambda I|=(\lambda-2)^4$ ($B$ es triangular; $A$ en 4.39).
    - |-
      <p>$\operatorname{rang}(A-2I)=2$ y</p>
            $$B-2I=\begin{pmatrix}0&0&1&0\cr0&0&0&1\cr0&0&0&0\cr0&0&0&0\end{pmatrix}$$
            <p>también tiene rango $2$: $d=2$ en las dos.</p>
    - |-
      <b>Distinguirlas:</b> $(A-2I)^2$ tiene rango $1$ (4.39), pero $(B-2I)^2=0$ (rango $0$).
    - |-
      Si fueran semejantes, $B=Q^{-1}AQ$ y $(B-2I)^2=Q^{-1}(A-2I)^2Q$ tendría el mismo rango (U Teor. 4.1, p.146): $1\neq0$. <b>No son semejantes.</b>
    - |-
      Sus formas de Jordan: $A\sim\operatorname{diag}(J_3(2),J_1(2))$ y $B\sim\operatorname{diag}(J_2(2),J_2(2))$ (sympy). Moraleja: polinomio característico, traza, determinante y $d$ son invariantes, pero no bastan cuando $\alpha\ge4$.
- id: ej-propio-11
  clase: propio
  titulo: |-
    Ejemplo propio 11 (medio) — método de potencias con $A^{-1}$: el valor propio de menor módulo
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio a partir de U Ej. 4.30, p. 189
    texto: propio
  cuerpo:
  - enun: |-
      $A=\begin{pmatrix}2&1\cr1&2\end{pmatrix}$ ($|A-\lambda I|=(\lambda-1)(\lambda-3)$; vectores $(1,1)$ para $3$ y $(1,-1)$ para $1$). Estima el valor propio menor con $x_0=(1,0)$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Estimar el valor propio de menor módulo con el método de potencias en $A^{-1}$.
      - - |-
          Cómo lo pienso
        - |-
          Los valores propios de $A^{-1}$ son los inversos; el dominante de $A^{-1}$ da el menor de $A$.
      - - |-
          Qué uso
        - |-
          Los valores propios de $A^{-1}$ son los inversos; el dominante de $A^{-1}$ da el de menor módulo de $A$.
      - - |-
          Por dónde empiezo
        - |-
          Itero con $A^{-1}$.
  - pasos:
    - |-
      <b>Idea</b> (U Ej. 4.30): si $Av=\lambda v$ con $\lambda\neq0$, $A^{-1}v=\lambda^{-1}v$. Los valores de $A^{-1}$ son $\tfrac13$ y $1$; el dominante es $1$ (del $\lambda=1$ de $A$).
    - |-
      $$A^{-1}=\tfrac13\begin{pmatrix}2&-1\cr-1&2\end{pmatrix}$$
            <p>($|A|=3$).</p>
    - |-
      <b>Iteraciones:</b>
            <table>
              <tr><th>$k$</th><th>$A^{-1}x_k$</th><th>$\mu_k$</th><th>$x_{k+1}$</th></tr>
              <tr><td>$0$</td><td>$(\tfrac23,-\tfrac13)$</td><td>$0.6667$</td><td>$(1,-\tfrac12)$</td></tr>
              <tr><td>$1$</td><td>$(\tfrac56,-\tfrac23)$</td><td>$0.8333$</td><td>$(1,-\tfrac45)$</td></tr>
              <tr><td>$2$</td><td>$(\tfrac{14}{15},-\tfrac{13}{15})$</td><td>$0.9333$</td><td>$(1,-\tfrac{13}{14})$</td></tr>
              <tr><td>$3$</td><td>$(\tfrac{41}{42},-\tfrac{20}{21})$</td><td>$0.9762$</td><td>$(1,-\tfrac{40}{41})$</td></tr>
              <tr><td>$4$</td><td>$(\tfrac{122}{123},-\tfrac{121}{123})$</td><td>$0.9919$</td><td>$(1,-\tfrac{121}{122})$</td></tr>
            </table><p>Ejemplo de cálculo ($k=1$):</p>
            $$A^{-1}(1,-\tfrac12)=\tfrac13(2+\tfrac12,\,-1-1)=(\tfrac56,-\tfrac23).$$
    - |-
      $\mu_k\to1\Rightarrow$ valor propio de $A$: $1/1=1$; $x_k\to(1,-1)$ ✓. Ritmo $\tfrac{1/3}{1}=\tfrac13$ por paso.
    - |-
      <p>Truco sin fracciones: iterar con</p>
            $$3A^{-1}=\begin{pmatrix}2&-1\cr-1&2\end{pmatrix}$$
            <p>(los mismos vectores; $\mu_k\to3$ y el valor propio de $A$ es $3/3=1$).</p>
- id: ex-ene22a-4
  clase: examen
  titulo: |-
    Ene. 2022 (tipo A), ejercicio 4 — «una posible matriz de Jordan» de una matriz diagonalizable
  fuentes:
  - l: X
    ref: |-
      Ene. 2022 (tipo A), ejercicio 4
    texto: |-
      X Ene. 2022 (A) ej. 4
  cuerpo:
  - enun: |-
      Si $A$ es la matriz de filas $(2,2,-5)$, $(3,7,-15)$, $(1,2,-4)$, obtener una posible matriz de Jordan suya.
  - html: |-
      <p><b>Qué se pide.</b> Es la matriz de E 4.37. Aquí lo que enseña es que <b>si $A$ es diagonalizable, su $J$ es la diagonal</b> (U p.169; Ej. 4.17, p.171-172). El trabajo de fondo ($d=\alpha$) es el de 4.3.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Dar una forma de Jordan de una matriz diagonalizable.
      - - |-
          Cómo lo pienso
        - |-
          Si es diagonalizable, $J$ es diagonal.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$.
      - - |-
          Por dónde empiezo
        - |-
          Valores propios y diagonal.
  - pasos:
    - |-
      <p><b>Escribir la matriz:</b> cada terna es una fila,</p>
            $$A=\begin{pmatrix}2&2&-5\cr3&7&-15\cr1&2&-4\end{pmatrix}.$$
    - |-
      <p><b>Polinomio</b> (Sarrus): términos $+$:</p>
            $$(2-\lambda)(7-\lambda)(-4-\lambda)+2\cdot(-15)\cdot1+(-5)\cdot3\cdot2=-\lambda^3+5\lambda^2+22\lambda-116;$$
            <p>términos $-$:</p>
            $$(-5)(7-\lambda)\cdot1+(2-\lambda)(-15)\cdot2+2\cdot3\cdot(-4-\lambda)=-119+29\lambda.$$
            <p>Restando: $p(\lambda)=-\lambda^3+5\lambda^2-7\lambda+3$.</p>
    - |-
      <b>Raíces:</b> $p(1)=0$; Ruffini con $1$ sobre $(-1,5,-7,3)$ da $(-1,4,-3\mid0)$: $p(\lambda)=-(\lambda-1)^2(\lambda-3)$. $\lambda_1=1$ ($\alpha_1=2$), $\lambda_2=3$ ($\alpha_2=1$).
    - |-
      <p><b>$d$ del doble:</b></p>
            $$A-I=\begin{pmatrix}1&2&-5\cr3&6&-15\cr1&2&-5\end{pmatrix}:$$
            <p>la 2.ª fila es el triple de la 1.ª y la 3.ª es igual a la 1.ª, rango $1$, $d_1=3-1=2=\alpha_1$. El simple: $d_2=1=\alpha_2$ (Teor. 4.5).</p>
    - |-
      <p><b>Conclusión:</b> $d_i=\alpha_i$ y las raíces son reales $\Rightarrow$ diagonalizable (Teor. 4.7). Su forma de Jordan es la diagonal, con tres bloques $1\times1$:</p>
            $$J=\begin{pmatrix}3&0&0\cr0&1&0\cr0&0&1\end{pmatrix}$$
            <p>(o $\operatorname{diag}(1,1,3)$: única salvo el orden de los bloques).</p>
    - |-
      <p><b>Matriz de paso</b> (no se pide, sirve de comprobación): $L_1:\ x+2y-5z=0$, $L_1=\langle(-2,1,0),(5,0,1)\rangle$; $L_3=\langle(1,3,1)\rangle$. Con</p>
            $$P=\begin{pmatrix}1&-2&5\cr3&1&0\cr1&0&1\end{pmatrix}$$
            <p>($\det P=2$): $P^{-1}AP=\operatorname{diag}(3,1,1)$.</p>
  - receta: |-
      «matriz de Jordan de $A$» $\Rightarrow$ primero, ¿es diagonalizable (raíces reales y $d_i=\alpha_i$)? Si lo es, $J$ es la diagonal de los valores propios, cada uno repetido $\alpha_i$ veces. Solo si no lo es aparecen los unos.
  - error: |-
      «tiene un valor propio doble $\Rightarrow$ no diagonalizable $\Rightarrow$ $J$ con un uno». Lo que decide es el rango de $A-\lambda I$: aquí es $1$ y no hay ningún uno.
- id: ex-ene20a-4
  clase: examen
  titulo: |-
    Ene. 2020 (tipo A), ejercicio 4 — tres valores propios reales distintos (irracionales)
  fuentes:
  - l: X
    ref: |-
      Ene. 2020 (tipo A), ejercicio 4
    texto: |-
      X Ene. 2020 (A) ej. 4
  cuerpo:
  - enun: |-
      Hallar una matriz de Jordan de la matriz $\begin{pmatrix}1&-1&3\cr3&1&2\cr4&0&1\end{pmatrix}$.
  - html: |-
      <p><b>Qué se pide.</b> Solo $J$. Con tres raíces reales distintas no hace falta ni un vector propio.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Forma de Jordan con tres valores reales distintos.
      - - |-
          Cómo lo pienso
        - |-
          Tres raíces reales distintas: $J$ diagonal.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$.
      - - |-
          Por dónde empiezo
        - |-
          Polinomio y raíces.
  - pasos:
    - |-
      <p><b>Polinomio</b> (adjuntos por la 2.ª columna, que tiene un cero; $(-1)^{1+2}=-1$):</p>
            $$|A-\lambda I|=\begin{vmatrix}1-\lambda&-1&3\cr3&1-\lambda&2\cr4&0&1-\lambda\end{vmatrix}=\big(3(1-\lambda)-8\big)+(1-\lambda)\big((1-\lambda)^2-12\big)=(1-\lambda)^3+9\lambda-17=-\lambda^3+3\lambda^2+6\lambda-16.$$
    - |-
      <b>Raíces:</b> con $\lambda=2$: $-8+12+12-16=0$. Ruffini sobre $(-1,3,6,-16)$ da $(-1,1,8\mid0)$: $p(\lambda)=-(\lambda-2)(\lambda^2-\lambda-8)$, y $\lambda^2-\lambda-8=0\iff\lambda=\frac{1\pm\sqrt{33}}2$ (discriminante $1+32=33\gt0$: reales y distintas; ninguna vale $2$ porque $4-2-8=-6\neq0$).
    - |-
      <b>Tres valores propios reales distintos</b> $\Rightarrow$ diagonalizable (corolario de U p.163), y por U p.169 («si todos los autovalores son diferentes, $\Lambda$ coincide con $J$») y el Ej. 4.17:
            $$J=\begin{pmatrix}2&0&0\cr0&\frac{1+\sqrt{33}}2&0\cr0&0&\frac{1-\sqrt{33}}2\end{pmatrix}.$$ Si se quisiera $P$: para $\lambda=2$ sale $(1,11,4)$ y $A(1,11,4)=(2,22,8)$.
  - receta: |-
      $p(\lambda)$ con $n$ raíces reales distintas $\Rightarrow J=\operatorname{diag}(\lambda_1,\dots,\lambda_n)$ sin más cálculo. Las raíces irracionales no cambian nada.
  - error: |-
      desanimarse por $\sqrt{33}$ y pensar «no es diagonalizable porque los valores propios no son enteros»: basta con que sean <b>reales y distintos</b>.
- id: ex-feb25a-4
  clase: examen
  titulo: |-
    Feb. 2025 (1.ª sem.), pregunta 4 — matriz de Jordan de $\begin{pmatrix}0&1\cr-1&2\end{pmatrix}$
  fuentes:
  - l: X
    ref: |-
      Feb. 2025 (1.ª sem.), pregunta 4
    texto: |-
      X Feb. 2025 (1.ª) P4
  cuerpo:
  - enun: |-
      Calcule la matriz de Jordan correspondiente a $\begin{pmatrix}0&1\cr-1&2\end{pmatrix}$.
  - html: |-
      <p><b>Qué se pide.</b> $2\times2$ con un valor propio doble: hay que decidir entre $A=\lambda I$ y un bloque $2\times2$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Forma de Jordan de una $2\times2$.
      - - |-
          Cómo lo pienso
        - |-
          Hay que ver si el valor doble tiene uno o dos vectores propios.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Tamaños de los bloques:</b> el nº de bloques de tamaño $\ge k$ es $\operatorname{rang}(A-\lambda I)^{k-1}-\operatorname{rang}(A-\lambda I)^{k}$.
      - - |-
          Por dónde empiezo
        - |-
          Polinomio y rango.
  - pasos:
    - |-
      <p><b>Polinomio:</b></p>
            $$|A-\lambda I|=-\lambda(2-\lambda)+1=\lambda^2-2\lambda+1=(\lambda-1)^2:$$
            <p>$\lambda=1$, $\alpha=2$. Comprobación: $\operatorname{tr}A=2=1+1$ y $|A|=1=1\cdot1$.</p>
    - |-
      <p><b>$d$:</b></p>
            $$A-I=\begin{pmatrix}-1&1\cr-1&1\end{pmatrix}$$
            <p>tiene rango $1$ (filas iguales, no nulas), $d=2-1=1\lt2$: <b>no es diagonalizable</b> (Teor. 4.7). (Otra forma: si lo fuera, $\Lambda=I$ y $A=PIP^{-1}=I$, falso.)</p>
    - |-
      <p><b>Forma de Jordan:</b> el nº de bloques de $\lambda=1$ es $d=1$: un único bloque, de tamaño $\alpha=2$:</p>
            $$J=\begin{pmatrix}1&1\cr0&1\end{pmatrix}.$$
            <p>Un solo «1» porque falta un vector no propio.</p>
    - |-
      <p><b>Matriz de paso</b> (no se pide): $(A-I)^2=0$; $v=(1,0)\notin\operatorname{Nuc}(A-I)=\langle(1,1)\rangle$, $(A-I)v=(-1,-1)$.</p>
            $$P=\begin{pmatrix}-1&1\cr-1&0\end{pmatrix}$$
            $$AP=\begin{pmatrix}-1&0\cr-1&-1\end{pmatrix}=PJ.$$
  - receta: |-
      $2\times2$ con valor propio doble $\lambda$: si $A=\lambda I$, $J=A$; si $A\neq\lambda I$, $J=\begin{pmatrix}\lambda&1\cr0&\lambda\end{pmatrix}$ porque $\operatorname{rang}(A-\lambda I)=1$.
  - error: |-
      saltarse la comprobación de $d$ o poner el $1$ debajo de la diagonal. <i>Práctica relacionada:</i> es el mismo razonamiento que <a href="tema_4_3_diagonalizacion.html#ex-feb23b-4">4.3, Feb. 2023 (2.ª), pregunta 4</a> ($\begin{pmatrix}9&9\cr0&9\end{pmatrix}$, cuya $J$ es $\begin{pmatrix}9&1\cr0&9\end{pmatrix}$).
- id: ex-sep24-p8b
  clase: examen
  titulo: |-
    Sept. 2024, problema 8 (2.º apartado) — $J$ y matriz de paso de $\begin{pmatrix}3&0&0\cr0&4&-1\cr0&1&2\end{pmatrix}$
  fuentes:
  - l: X
    ref: |-
      Sept. 2024, problema 8 (2.º apartado)
    texto: |-
      X Sept. 2024 P8 (2.º)
  cuerpo:
  - enun: |-
      Considere $A=\begin{pmatrix}3&0&0\cr0&4&-1\cr0&1&2\end{pmatrix}$. Demuestre que $A$ no es diagonalizable (1 punto). <b>Calcule la matriz de Jordan asociada a $A$ (1 punto).</b>
  - html: |-
      <p><b>Qué se pide.</b> El 1.er apartado está desarrollado en 4.3 (<a href="tema_4_3_diagonalizacion.html#ex-sep24-p8a">Sept. 2024, P8, 1.º</a>). Aquí, el 2.º: hallar $J$; además se construye $P$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          $J$ y matriz de paso de una $3\times3$.
      - - |-
          Cómo lo pienso
        - |-
          Un valor propio triple; un bloque $1\times1$ y uno $2\times2$.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Matriz de paso:</b> por cada bloque, una <i>cadena</i> $v_1,\dots,v_s$ con $(A-\lambda I)v_1=0$ y $(A-\lambda I)v_{k}=v_{k-1}$; las cadenas por columnas forman $P$ y $AP=PJ$.
      - - |-
          Por dónde empiezo
        - |-
          Cadena de dos vectores y un propio.
  - pasos:
    - |-
      <p><b>Lo ya sabido:</b></p>
            $$p(\lambda)=(3-\lambda)\big[(4-\lambda)(2-\lambda)+1\big]=(3-\lambda)(\lambda^2-6\lambda+9)=(3-\lambda)^3:$$
            <p>$\lambda=3$, $\alpha=3$.</p>
            $$N:=A-3I=\begin{pmatrix}0&0&0\cr0&1&-1\cr0&1&-1\end{pmatrix}$$
            <p>tiene rango $1$: $d=3-1=2\lt3$.</p>
    - |-
      <b>Forma de los bloques</b> (U p.169-170 y p.175-176): $d=2$ bloques de $\lambda=3$ con tamaños no crecientes que suman $3$: un bloque $2\times2$ y uno $1\times1$. Equivalentemente $\operatorname{rang}(A-3I)=1\Rightarrow J'$:
            $$J=\begin{pmatrix}3&1&0\cr0&3&0\cr0&0&3\end{pmatrix}.$$ Con esto ya está lo que se pide; la matriz de paso sirve de comprobación.
    - |-
      <b>Cadena de núcleos</b> (guion p.173): $\operatorname{Nuc}N=\{y-z=0\}=\langle(1,0,0),(0,1,1)\rangle$ (dim $2$). Se calcula $N^2$:
            $$N^2=\begin{pmatrix}0&0&0\cr0&1\cdot1+(-1)\cdot1&1\cdot(-1)+(-1)(-1)\cr0&0&0\end{pmatrix}=0,$$ luego $\operatorname{Nuc}N^2=\mathbb R^3$ (dim $3=\alpha$). Se para.
    - |-
      <b>Cabeza:</b> $v\in\operatorname{Nuc}N^2$ (cualquiera) y $\notin\operatorname{Nuc}N$ ($y\neq z$): $v=(0,0,1)$. Baja: $v_1:=Nv=(0,-1,-1)$, vector propio ($Nv_1=N^2v=0$).
    - |-
      <b>Completar:</b> un propio independiente de $v_1$ para el bloque $1\times1$: $v_3=(1,0,0)$ (también vale $(1,2,2)$, que cumple $y=z$).
    - |-
      <b>Orden de columnas:</b> para que el $1$ quede <b>encima</b>, primero $v_1=(A-3I)v$ y después $v$ (U Ej. 4.18-4.19: «los vectores de cada bloque se calculan de derecha a izquierda»): la 2.ª columna de $J$, $(1,3,0)^t$, significa $Av=1\cdot v_1+3v$, es decir $Nv=v_1$.
            $$P=(v_1\mid v\mid v_3)=\begin{pmatrix}0&0&1\cr-1&0&0\cr-1&1&0\end{pmatrix},\qquad\det P=-1\neq0.$$
    - |-
      <p><b>Comprobación sin invertir:</b></p>
            $$AP=\begin{pmatrix}0&0&3\cr-3&-1&0\cr-3&2&0\end{pmatrix}=PJ;$$
            $$P^{-1}=\begin{pmatrix}0&-1&0\cr0&-1&1\cr1&0&0\end{pmatrix},$$
            <p>$P^{-1}AP=J$.</p>
  - html: |-
      <div class="recipe"><b>Receta (cadena de un bloque $2\times2$):</b> (1) $N=A-\lambda I$; (2) $v$ con $N^2v=0$ y $Nv\neq0$; (3) columnas del bloque $(Nv\mid v)$, en ese orden; (4) completar con propios independientes para los bloques $1\times1$; (5) comprobar $AP=PJ$ sin invertir.</div>
  - error: |-
      poner $v$ antes que $Nv$ (el uno queda debajo); elegir $v\in\operatorname{Nuc}N$ (entonces $Nv=0$, no sirve); tomar el tercer vector proporcional a $Nv$ ($P$ singular).
- id: ej-propio-12
  clase: propio
  titulo: |-
    Ejemplo propio 12 (examen) — $2\times2$: $J$, $P$ y $A^n$
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      Halla la forma de Jordan $J$, una matriz de paso $P$ y $A^n$ para $A=\begin{pmatrix}3&1\cr-1&1\end{pmatrix}$ (la de E 4.36).
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          $J$, $P$ y $A^n$ de una $2\times2$.
      - - |-
          Cómo lo pienso
        - |-
          Cadena de longitud 2 y binomio del bloque.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Matriz de paso:</b> por cada bloque, una <i>cadena</i> $v_1,\dots,v_s$ con $(A-\lambda I)v_1=0$ y $(A-\lambda I)v_{k}=v_{k-1}$; las cadenas por columnas forman $P$ y $AP=PJ$.
      - - |-
          Por dónde empiezo
        - |-
          $P$, $J$, $J^n$.
  - pasos:
    - |-
      <p>$\operatorname{tr}A=4$ y $|A|=3+1=4$: $p(\lambda)=\lambda^2-4\lambda+4=(\lambda-2)^2$. $A-2I$ tiene rango $1$: $d=1$,</p>
            $$J=\begin{pmatrix}2&1\cr0&2\end{pmatrix}.$$
    - |-
      <p>$(A-2I)^2=0$. $v=(1,0)\notin\operatorname{Nuc}(A-2I)=\langle(1,-1)\rangle$ y $Nv=(1,-1)$.</p>
            $$P=\begin{pmatrix}1&1\cr-1&0\end{pmatrix},$$
            <p>$\det P=1$,</p>
            $$P^{-1}=\begin{pmatrix}0&-1\cr1&1\end{pmatrix},$$
            $$AP=\begin{pmatrix}2&3\cr-2&-1\end{pmatrix}=PJ.$$
    - |-
      <p><b>Potencias:</b></p>
            $$J^n=\begin{pmatrix}2^n&n2^{n-1}\cr0&2^n\end{pmatrix}$$
            $$A^n=PJ^nP^{-1}=2^{n-1}\begin{pmatrix}n+2&n\cr-n&2-n\end{pmatrix}.$$
            <p>Comprobaciones: $n=1$ da $A$; $n=2$ da</p>
            $$\begin{pmatrix}8&4\cr-4&0\end{pmatrix}=A^2.$$
  - receta: |-
      $2\times2$ con $\lambda$ doble y $A\neq\lambda I$: $J=\begin{pmatrix}\lambda&1\cr0&\lambda\end{pmatrix}$, $P=(Nv\mid v)$, $J^n=\begin{pmatrix}\lambda^n&n\lambda^{n-1}\cr0&\lambda^n\end{pmatrix}$. <b>Error típico:</b> elevar cada entrada de $J$ a $n$.
- id: ej-propio-13
  clase: propio
  titulo: |-
    Ejemplo propio 13 (examen) — valor simple y valor doble con $d=1$ (como U Ej. 4.18)
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      Halla $J$ y $P$ para $A=\begin{pmatrix}2&1&1\cr0&2&0\cr0&1&1\end{pmatrix}$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          $J$ y $P$ de una matriz con valor simple y valor doble con $d=1$.
      - - |-
          Cómo lo pienso
        - |-
          Un bloque $1\times1$ y uno $2\times2$.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Matriz de paso:</b> por cada bloque, una <i>cadena</i> $v_1,\dots,v_s$ con $(A-\lambda I)v_1=0$ y $(A-\lambda I)v_{k}=v_{k-1}$; las cadenas por columnas forman $P$ y $AP=PJ$.
      - - |-
          Por dónde empiezo
        - |-
          Cadena de longitud 2 y vector propio del simple.
  - pasos:
    - |-
      <p>Por la 1.ª columna:</p>
            $$|A-\lambda I|=(2-\lambda)\begin{vmatrix}2-\lambda&0\cr1&1-\lambda\end{vmatrix}=(2-\lambda)^2(1-\lambda).$$
            <p>$\lambda=1$ simple y $\lambda=2$ con $\alpha=2$.</p>
    - |-
      $$N=A-2I=\begin{pmatrix}0&1&1\cr0&0&0\cr0&1&-1\end{pmatrix}$$
            <p>tiene rango $2$, $d_2=1\lt2$:</p>
            $$J=\begin{pmatrix}1&0&0\cr0&2&1\cr0&0&2\end{pmatrix}.$$
    - |-
      <p><b>Cadena para $\lambda=2$:</b> $\operatorname{Nuc}N$: $y+z=0,\ y-z=0\Rightarrow y=z=0$, $\langle(1,0,0)\rangle$.</p>
            $$N^2=\begin{pmatrix}0&1&-1\cr0&0&0\cr0&-1&1\end{pmatrix}:$$
            <p>$\operatorname{Nuc}N^2=\{y=z\}=\langle(1,0,0),(0,1,1)\rangle$ (dim $2=\alpha$).</p>
    - |-
      <p>Cabeza</p>
            $$v=(0,1,1)\in\operatorname{Nuc}N^2\setminus\operatorname{Nuc}N;$$
            <p>$Nv=(2,0,0)$.</p>
    - |-
      <p>$\lambda=1$:</p>
            $$A-I=\begin{pmatrix}1&1&1\cr0&1&0\cr0&1&0\end{pmatrix},$$
            <p>$y=0,\ x=-z$: $u=(-1,0,1)$.</p>
    - |-
      $$P=(u\mid Nv\mid v)=\begin{pmatrix}-1&2&0\cr0&0&1\cr1&0&1\end{pmatrix},$$
            <p>$\det P=2$; el orden sigue el de $J$ (primero el bloque de $1$, luego el de $2$, con $Nv$ antes que $v$).</p>
            $$AP=\begin{pmatrix}-1&4&2\cr0&0&2\cr1&0&2\end{pmatrix}=PJ.$$
  - html: |-
      <p><b>Error típico (comprobado con sympy).</b> Tomar $v=(0,1,0)$ «porque no es propio»: es cierto que $v\notin\operatorname{Nuc}N$, pero <b>tampoco está en $\operatorname{Nuc}N^2$</b> ($N^2v=(1,0,-1)\neq0$). Entonces $Nv=(1,0,1)$ no es propio y con $P=(u\mid Nv\mid v)$ sale $P^{-1}AP=\begin{pmatrix}1&-1&0\cr0&2&1\cr0&0&2\end{pmatrix}$, que no es de Jordan (el $-1$ no es $0$ ni $1$).</p>
  - receta: |-
      $v\in\operatorname{Nuc}N^k$ <b>y</b> $v\notin\operatorname{Nuc}N^{k-1}$: las dos condiciones a la vez.
- id: ej-propio-14
  clase: propio
  titulo: |-
    Ejemplo propio 14 (examen) — valor triple con un solo bloque $3\times3$ y $J^n$
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio, verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      a) Sin calcular $P$, ¿qué formas de Jordan son posibles para una $3\times3$ con $|A-\lambda I|=-(\lambda-1)^3$? b) Para $A=\begin{pmatrix}0&1&0\cr0&0&1\cr1&-3&3\end{pmatrix}$ halla $J$ y $P$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Posibles $J$ con polinomio $-(\lambda-1)^3$ y cálculo para una matriz concreta.
      - - |-
          Cómo lo pienso
        - |-
          Particiones de 3: tres formas posibles.
      - - |-
          Qué uso
        - |-
          <b>Forma de Jordan (Def. 4.13-4.14, U p.167):</b> si todos los valores propios son reales, $A$ es semejante a $J$, diagonal por bloques $J_s(\lambda)$ (valor propio en la diagonal y unos justo encima). Para cada $\lambda$: el nº de bloques es $d(\lambda)=n-\operatorname{rang}(A-\lambda I)$ y la suma de sus tamaños es $\alpha(\lambda)$. <b>Matriz de paso:</b> por cada bloque, una <i>cadena</i> $v_1,\dots,v_s$ con $(A-\lambda I)v_1=0$ y $(A-\lambda I)v_{k}=v_{k-1}$; las cadenas por columnas forman $P$ y $AP=PJ$.
      - - |-
          Por dónde empiezo
        - |-
          Rango de $A-I$ decide.
  - pasos:
    - |-
      <p><b>a)</b> $J=I$ (U p.175-176),</p>
            $$J'=\begin{pmatrix}1&1&0\cr0&1&0\cr0&0&1\end{pmatrix}$$
            $$J''=\begin{pmatrix}1&1&0\cr0&1&1\cr0&0&1\end{pmatrix},$$
            <p>según $\operatorname{rang}(A-I)=0,1,2$.</p>
    - |-
      <p><b>b)</b> Por Sarrus</p>
            $$|A-\lambda I|=\lambda^2(3-\lambda)+1-3\lambda=-(\lambda-1)^3.$$
            $$B=A-I=\begin{pmatrix}-1&1&0\cr0&-1&1\cr1&-3&2\end{pmatrix}:$$
            <p>fila 3 $=-$fila 1 $+2\,$fila 2, rango $2$, $d=1$: $J=J''$.</p>
    - |-
      <p><b>Cadena:</b> $\operatorname{Nuc}B=\langle(1,1,1)\rangle$;</p>
            $$B^2=\begin{pmatrix}1&-2&1\cr1&-2&1\cr1&-2&1\end{pmatrix}$$
            <p>(rango $1$, $\operatorname{Nuc}B^2=\{x-2y+z=0\}$, dim $2$); $B^3=0$ (dim $3=\alpha$).</p>
    - |-
      <b>Cabeza</b> $v\notin\operatorname{Nuc}B^2$: $v=(0,0,1)$ ($0-0+1\neq0$). $Bv=(0,1,2)$ y $B^2v=(1,1,1)$ (propio).
    - |-
      $$P=(B^2v\mid Bv\mid v)=\begin{pmatrix}1&0&0\cr1&1&0\cr1&2&1\end{pmatrix},$$
            <p>$\det P=1$,</p>
            $$P^{-1}=\begin{pmatrix}1&0&0\cr-1&1&0\cr1&-2&1\end{pmatrix},$$
            $$AP=\begin{pmatrix}1&1&0\cr1&2&1\cr1&3&3\end{pmatrix}=PJ.$$
    - |-
      <p><i>(Ampliación.)</i></p>
            $$J^n=\begin{pmatrix}1&n&\binom n2\cr0&1&n\cr0&0&1\end{pmatrix}$$
            <p>(porque $J=I+N$ con $N^3=0$); p. ej.</p>
            $$J^5=\begin{pmatrix}1&5&10\cr0&1&5\cr0&0&1\end{pmatrix},$$
            <p>y $A^n=PJ^nP^{-1}$ (verificado con sympy para $n=0,\dots,6$).</p>
  - receta: |-
      valor triple con $\operatorname{rang}(A-\lambda I)=2$ $\Rightarrow$ un bloque $3\times3$. Cabeza $v\notin\operatorname{Nuc}(A-\lambda I)^2$ y $P=\big((A-\lambda I)^2v\mid(A-\lambda I)v\mid v\big)$. <b>Error típico:</b> elegir $v\in\operatorname{Nuc}B^2$: $B^2v=0$ y la cadena se corta en dos vectores.
