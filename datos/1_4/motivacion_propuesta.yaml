motivacion:
  s1: |-
    Tres ecuaciones con tres incógnitas ocupan media página y se vuelven ilegibles si hay que manipularlas. ¿Se pueden guardar todas en una sola igualdad corta, con matrices, para trabajar con ella como si fuera una ecuación de una incógnita?
  s2: |-
    Un sistema puede tener una solución, infinitas o ninguna. ¿Hay una forma de saberlo antes de resolver nada, solo mirando dos números asociados a las matrices? Piensa en dos rectas del plano: ¿cuándo se cortan en un punto, cuándo coinciden y cuándo son paralelas?
  s3: |-
    Si sumas dos ecuaciones de un sistema o multiplicas una por 5, el sistema parece otro. ¿Qué operaciones puedes hacer sobre las ecuaciones sin cambiar las soluciones? Y, ¿para qué sirve transformar un sistema en otro más sencillo?
  s4: |-
    Una recta en $\mathbb R^3$ se puede dar como intersección de dos planos o como «punto + t·dirección». ¿Cómo se pasa de una forma a otra, y cuál conviene para comprobar si un punto está en la recta?
  s5: |-
    Un ordenador no guarda $\tfrac13$ exacto, solo $0{,}3333\ldots$ cortado. Si resuelve un sistema con miles de operaciones, ¿cuánto pueden crecer esos pequeños fallos y cómo se mide el error de un resultado?
  s6: |-
    Resolver un sistema por sustitución a mano se complica en cuanto hay más de tres incógnitas. ¿Existe un procedimiento mecánico, siempre igual, que vaya anulando incógnitas y deje el sistema listo para despejar de abajo arriba?
  s7: |-
    Tras escalonar, aún hay que despejar hacia arriba, con muchas sustituciones. ¿Se puede seguir operando hasta que la solución aparezca directamente leída en la matriz, sin sustituir nada?
  s8: |-
    Imagina que tienes que resolver el mismo sistema con 100 vectores de términos independientes distintos. ¿Hay que repetir todo el escalonamiento cada vez, o se puede hacer una vez y reutilizarlo?
  s9: |-
    La factorización anterior funciona si nunca hace falta intercambiar filas. ¿Qué pasa si aparece un 0 justo donde necesitamos el pivote, y cómo se arregla sin perder la ventaja de reutilizar el trabajo?
  s10: |-
    Ya conoces Gauss, Gauss-Jordan y $LU$. Ante un sistema concreto, ¿cuál escoges? ¿Cambia la respuesta si tienes un solo sistema o muchos con la misma matriz, o si pides la inversa?
consignas:
  - animacion: un sistema $2\times2$ son dos rectas
    consigna: |-
      Cambia los coeficientes de las dos ecuaciones y observa las dos rectas del plano. Prueba a que sean paralelas y luego a que coincidan, fijándote en cómo cambian los rangos de $A$ y de $(A\mid B)$.
    pregunta: |-
      ¿Qué relación entre los dos rangos y el número de incógnitas aparece cuando las rectas se cortan en un único punto?
  - animacion: tres ecuaciones son tres planos
    consigna: |-
      Gira la escena y fíjate en cómo se colocan los tres planos entre sí. Cambia los coeficientes para obtener planos que se cortan en una recta, en un punto o sin punto común, y mira la clasificación por rangos.
    pregunta: |-
      ¿Pueden dos planos ser paralelos y aun así el sistema tener solución?
  - animacion: método de Gauss sobre un sistema
    consigna: |-
      Avanza paso a paso con el control del método y fíjate en qué pivote se usa en cada columna y qué filas se anulan debajo de él. Cuando llegues a la forma escalonada, comprueba que se puede resolver de abajo arriba.
    pregunta: |-
      ¿Por qué cada paso no cambia las soluciones del sistema?
  - animacion: Gauss-Jordan (sistema compatible indeterminado)
    consigna: |-
      Avanza hasta el final y observa cómo, además de anular por debajo, se anula por encima de cada pivote. Fíjate en la columna que queda sin pivote y en cómo aparece como parámetro en la solución.
    pregunta: |-
      ¿Cuántos parámetros libres hay y cómo lo ves en el número de pivotes?
  - animacion: $A=LU$ paso a paso y resolución de $AX=B$
    consigna: |-
      Avanza por los pasos y fíjate en cómo los multiplicadores usados al escalonar se guardan en $L$ y en que $U$ es la matriz escalonada. Después mira cómo se resuelve $AX=B$ en dos pasos, $LY=B$ y $UX=Y$.
    pregunta: |-
      Si cambias solo $B$, ¿qué parte del trabajo no hay que repetir?
  - animacion: cuándo falla la $LU$ sin permutar
    consigna: |-
      Avanza hasta el paso en que el pivote vale 0 y comprueba que no se puede seguir sin intercambiar filas. Observa cómo el intercambio, recogido en la matriz de permutación, permite terminar la factorización.
    pregunta: |-
      ¿En qué momento exacto deja de servir el método sin permutaciones?
