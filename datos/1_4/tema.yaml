h1: |-
  Sistemas de ecuaciones lineales
resumen: |-
  Un sistema lineal se escribe siempre como $AX=B$: una matriz que combina las incógnitas. Aquí se cierra el Módulo 1 juntando todo lo anterior —rango (1.2) y determinante (1.3)— para clasificar sistemas sin resolverlos, y se aprenden los tres algoritmos con los que se resuelven en la práctica: Gauss, Gauss-Jordan y la factorización $LU$.
