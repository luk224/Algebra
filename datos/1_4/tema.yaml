esencial:
  intro: |-
    Un sistema es una pregunta sobre las columnas de $A$; casi todo se decide con rangos y se calcula con operaciones por filas.
  items:
  - |-
    <b>Clasificar sin resolver (Rouché-Frobenius).</b> Con $n$ incógnitas: $\operatorname{rang}A\neq\operatorname{rang}(A\mid B)\Rightarrow$ incompatible; $\operatorname{rang}A=\operatorname{rang}(A\mid B)=n\Rightarrow$ determinado; $=k<n\Rightarrow$ indeterminado con $n-k$ parámetros. Nunca hay «exactamente dos» soluciones: o 0, o 1, o infinitas.
  - |-
    <b>Atajos con las dimensiones.</b> Si $\operatorname{rang}A$ es igual al número de ecuaciones, la ampliada no puede tener más rango: el sistema es compatible. Un homogéneo $AX=0$ siempre es compatible (tiene $X=0$) y es determinado solo si $\operatorname{rang}A=n$. Si $A$ es regular, el sistema es determinado.
  - |-
    <b>Con parámetros.</b> Si $A$ es cuadrada, $\det A\neq0$ da el caso determinado; los valores que anulan $\det A$ se sustituyen y se estudian aparte comparando rangos.
  - |-
    <b>Equivalentes y paramétricas.</b> Las operaciones elementales sobre ecuaciones (equivalentemente, sobre filas de la ampliada) no cambian las soluciones. Para pasar a paramétricas, las incógnitas libres son los parámetros; el número de ecuaciones cartesianas es $n$ menos el de parámetros independientes.
  - |-
    <b>Métodos.</b> Gauss escalona y retrosustituye; Gauss-Jordan deja la forma reducida. $A=LU$ (sin normalizar pivotes, $L$ con los multiplicadores) resuelve $LY=B$ y luego $UX=Y$; si hubo intercambios, $PA=LU$ y se resuelve con $PB$. $\det L=1$, luego sin intercambios $\det A=\det U$ (con $PA=LU$, $\det A=\pm\det U$, signo según el número de intercambios).
tipos:
- id: clasif
  nombre: |-
    Clasificar un sistema (con o sin parámetros)
  receta: |-
    Comparar $\operatorname{rang}A$, $\operatorname{rang}(A\mid B)$ y el número de incógnitas $n$.
  senal: |-
    «Clasifique», «discuta», «¿es compatible?», «para qué valores de $a$…», o datos como dimensiones y rangos sin números concretos.
  pasos:
  - |-
    Identifica $m$ (ecuaciones), $n$ (incógnitas, columnas de $A$) y escribe la ampliada $(A\mid B)$.
  - |-
    Calcula $\operatorname{rang}A$ y $\operatorname{rang}(A\mid B)$ (escalonando o con menores). Con parámetros: si $A$ es cuadrada, $\det A=0$ marca los valores críticos.
  - |-
    Si los rangos difieren, es incompatible; si son iguales a $n$, determinado; si son iguales a $k<n$, indeterminado con $n-k$ parámetros.
  - |-
    Con parámetros, sustituye cada valor crítico y repite la comparación de rangos; el resto de valores dan el caso general.
  ejemplo: |-
    $x+2y=3,\ 2x+4y=7$: $\operatorname{rang}A=1$ (filas proporcionales) pero $\operatorname{rang}(A\mid B)=2$ (el menor de las columnas 1 y 3 vale $1\cdot7-3\cdot2=1\neq0$), luego es incompatible.
  fallos: |-
    Concluir «incompatible» solo porque $\det A=0$ (puede ser indeterminado) · Contar las columnas de la ampliada como incógnitas ($n+1$ columnas) · Olvidar que un homogéneo nunca es incompatible
  series:
  - tipo: clasifica
    titulo: |-
      Clasificar con Rouché–Frobenius
    n: 5
- id: resolver
  nombre: |-
    Resolver por Gauss o Gauss-Jordan
  receta: |-
    Escalonar la ampliada por filas y despejar desde la última ecuación.
  senal: |-
    «Resuelva», «calcule las soluciones», «halle $X$»; también sistemas con incógnitas matriciales, que se resuelven combinando ecuaciones igual que con números.
  pasos:
  - |-
    Escribe la ampliada $(A\mid B)$ con la barra vertical.
  - |-
    Elige el pivote de la primera columna (intercambia filas si es $0$) y anula por reemplazo todo lo que hay debajo; repite con la siguiente columna.
  - |-
    Si aparece una fila $(0\ \cdots\ 0\mid c)$ con $c\neq0$, es incompatible; una fila de ceros se descarta.
  - |-
    Despeja desde la última fila hacia arriba (Gauss) o anula también por encima y normaliza (Gauss-Jordan, forma reducida). Las incógnitas sin pivote son parámetros libres.
  ejemplo: |-
    $x+y+z=6,\ 2y+z=7,\ x+z=4$: con $F_3\to F_3-F_1$ queda $-y=-2$, luego $y=2$; de la segunda $z=7-4=3$; de la primera $x=6-2-3=1$. Solución $(1,2,3)$.
  fallos: |-
    Errores de signo al restar filas · Operar con una columna que no es la del pivote actual · Olvidar aplicar a la columna de términos independientes la misma operación · Dar la solución sin comprobarla en el sistema original
  series:
  - tipo: sist2
    titulo: |-
      Resolver un sistema 2×2
    n: 5
- id: cartparam
  nombre: |-
    Pasar de paramétricas a cartesianas (y al revés)
  receta: |-
    Eliminar los parámetros, o resolver y dejar libres las incógnitas sin pivote.
  senal: |-
    «Calcule unas ecuaciones cartesianas / paramétricas», solución dada con parámetros $\alpha,\beta$.
  pasos:
  - |-
    Cuenta incógnitas $n$ y parámetros independientes $r$: harán falta $n-r$ ecuaciones cartesianas.
  - |-
    De paramétricas a cartesianas: despeja los parámetros en las ecuaciones que los contienen solos y sustitúyelos en las demás.
  - |-
    De cartesianas a paramétricas: resuelve por Gauss; las incógnitas sin pivote son los parámetros y las demás se expresan en función de ellos.
  - |-
    Comprueba con un punto: sustituye valores de los parámetros en las cartesianas.
  ejemplo: |-
    $x=\alpha,\ y=\beta,\ z=\alpha+\beta$: dos parámetros y tres incógnitas dan $3-2=1$ ecuación. Como $\alpha=x$ y $\beta=y$, queda $z=x+y$, es decir, $x+y-z=0$.
  fallos: |-
    Dar menos ecuaciones de las necesarias (la solución queda demasiado grande) · Tomar como parámetros incógnitas que no son libres · No comprobar con un punto concreto
- id: equiv
  nombre: |-
    Sistemas equivalentes
  receta: |-
    Dos sistemas son equivalentes si tienen las mismas soluciones; las operaciones elementales lo garantizan.
  senal: |-
    «¿Son equivalentes?», «escriba dos sistemas equivalentes», «obtenga un sistema equivalente».
  pasos:
  - |-
    Para fabricar uno equivalente: aplica a la ampliada una operación elemental (intercambiar, multiplicar por $c\neq0$, sumar a una fila un múltiplo de otra).
  - |-
    Para comparar dos sistemas dados: resuelve ambos (o escalona sus ampliadas hasta la forma reducida) y compara los conjuntos de soluciones.
  - |-
    Justifica con el teorema: las operaciones elementales sobre las filas no cambian el conjunto de soluciones.
  ejemplo: |-
    $x+y=2,\ 2x+2y=4$ es equivalente a $x+y=2$: la operación $F_2\to F_2-2F_1$ da la fila $(0\ 0\mid0)$, que se puede suprimir. Ambos tienen como soluciones $\{(t,2-t)\}$.
  fallos: |-
    Pensar que dos sistemas con el mismo número de ecuaciones son equivalentes · Multiplicar una fila por $0$ (no es operación elemental) · Comparar solo los rangos sin comparar las soluciones
- id: lu
  nombre: |-
    Factorización LU
  receta: |-
    Escalonar $A$ por reemplazos sin normalizar y guardar los multiplicadores en $L$.
  senal: |-
    «Calcule la factorización $LU$», «resuelva usando $LU$», preguntas teóricas sobre existencia, unicidad o usos de $LU$.
  pasos:
  - |-
    Escalona $A$ solo con reemplazos $F_i\to F_i+\lambda F_j$ ($i>j$), sin normalizar ni intercambiar filas: el resultado es $U$.
  - |-
    En la posición $(i,j)$ de $L$ coloca el multiplicador usado con el signo cambiado, $-\lambda$, con $1$ en la diagonal y $0$ encima.
  - |-
    Comprueba que $LU=A$.
  - |-
    Para resolver $AX=B$: resuelve $LY=B$ (hacia delante) y después $UX=Y$ (hacia atrás). Si hubo intercambios, $PA=LU$ y se resuelve $LY=PB$.
  ejemplo: |-
    $A=\begin{pmatrix}2&1\\4&5\end{pmatrix}$: con $F_2\to F_2-2F_1$ resulta $U=\begin{pmatrix}2&1\\0&3\end{pmatrix}$ y $L=\begin{pmatrix}1&0\\2&1\end{pmatrix}$. Para $B=(3,9)^t$: $LY=B$ da $Y=(3,3)^t$ y $UX=Y$ da $X=(1,1)^t$.
  fallos: |-
    Poner en $L$ el multiplicador $\lambda$ de $F_i\to F_i+\lambda F_j$ sin cambiarle el signo · Resolver primero $UX=Y$ y luego $LY=B$ (el orden es primero $L$) · Olvidar permutar también $B$ cuando hay $PA=LU$ · Decir que $\det A=\det L$ en vez de $\det U$
quiz:
- p: |-
    Un sistema tiene 4 ecuaciones, 6 incógnitas y $\operatorname{rang}A=4$. ¿Cómo es?
  opciones:
  - t: |-
      Compatible indeterminado con 2 parámetros
    ok: true
  - t: |-
      Compatible determinado
    ok: false
    why: |-
      Determinado exigiría $\operatorname{rang}A=n=6$, y aquí el rango es 4.
  - t: Incompatible
    ok: false
    why: |-
      La ampliada tiene 4 filas, luego su rango no puede pasar de 4: coincide con el de $A$ y el sistema es compatible.
  - t: |-
      Compatible indeterminado con 4 parámetros
    ok: false
    why: |-
      Los parámetros son $n-\operatorname{rang}A=6-4=2$, no el rango.
  fb: |-
    $\operatorname{rang}A=4$ es el máximo posible con 4 filas, así que $\operatorname{rang}(A\mid B)=4$; como $4<6$, es indeterminado con $6-4=2$ parámetros.
- p: |-
    ¿Cómo es el sistema $x+y=2,\ 2x+2y=5$?
  opciones:
  - t: Incompatible
    ok: true
  - t: |-
      Compatible determinado
    ok: false
    why: |-
      El determinante de $A$ es $0$: no puede ser determinado.
  - t: |-
      Compatible indeterminado
    ok: false
    why: |-
      Que $\det A=0$ no basta: aquí $\operatorname{rang}A=1$ pero $\operatorname{rang}(A\mid B)=2$, y para que fuese indeterminado deberían coincidir.
  - t: |-
      Tiene exactamente dos soluciones
    ok: false
    why: |-
      Un sistema lineal tiene 0, 1 o infinitas soluciones; nunca exactamente dos.
  fb: |-
    La segunda ecuación equivale a $x+y=2{,}5$, que contradice la primera. Con rangos: $\operatorname{rang}A=1\neq2=\operatorname{rang}(A\mid B)$.
- p: |-
    Un sistema homogéneo $AX=0$ tiene matriz ampliada de 4 columnas y $\operatorname{rang}A=2$. ¿Qué se puede afirmar?
  opciones:
  - t: |-
      Solo tiene la solución nula
    ok: false
    why: |-
      Solo la nula exigiría $\operatorname{rang}A=n$; aquí $n=3$ (la ampliada tiene $n+1=4$ columnas) y $\operatorname{rang}A=2<3$, así que hay infinitas soluciones.
  - t: |-
      Es compatible indeterminado con 1 parámetro
    ok: true
  - t: |-
      Es incompatible
    ok: false
    why: |-
      Un homogéneo siempre tiene la solución $X=0$, así que nunca es incompatible.
  - t: |-
      Es compatible indeterminado con 2 parámetros
    ok: false
    why: |-
      Los parámetros son $n-\operatorname{rang}A=3-2=1$; el 2 es el rango, no el número de parámetros.
  fb: |-
    La ampliada tiene $n+1=4$ columnas, luego $n=3$. Es siempre compatible y $\operatorname{rang}A=2<3$: $3-2=1$ parámetro libre.
- p: |-
    Para el sistema $x+y=1,\ x+ay=2$, ¿para qué valor de $a$ es incompatible?
  opciones:
  - t: |-
      $a=0$
    ok: false
    why: |-
      Con $a=0$ el determinante es $-1\neq0$: $A$ es regular y el sistema es determinado.
  - t: |-
      $a=1$
    ok: true
  - t: |-
      $a=2$
    ok: false
    why: |-
      Con $a=2$, $\det A=1\neq0$: determinado, con solución única.
  - t: |-
      Es compatible para todo $a$
    ok: false
    why: |-
      Para $a=1$ el determinante es $0$ y las ecuaciones $x+y=1$, $x+y=2$ se contradicen.
  fb: |-
    $\det A=a-1$. Si $a\neq1$, determinado. Si $a=1$: $\operatorname{rang}A=1$ y $\operatorname{rang}(A\mid B)=2$ (por $x+y=1$ y $x+y=2$), incompatible.
- p: |-
    En $A=LU$ para $A=\begin{pmatrix}1&2\\3&7\end{pmatrix}$ (sin intercambios), ¿cuál es $L$?
  opciones:
  - t: |-
      $\begin{pmatrix}1&0\\3&1\end{pmatrix}$
    ok: true
  - t: |-
      $\begin{pmatrix}1&0\\-3&1\end{pmatrix}$
    ok: false
    why: |-
      El $-3$ es el que se usa en la operación $F_2-3F_1$; en $L$ se escribe el multiplicador con el signo cambiado, $+3$.
  - t: |-
      $\begin{pmatrix}1&2\\0&1\end{pmatrix}$
    ok: false
    why: |-
      Esa es $U$ (el resultado de escalonar), no $L$.
  - t: |-
      $\begin{pmatrix}1&0\\0&1\end{pmatrix}$
    ok: false
    why: |-
      Con $L=I$ sería $A=U$, pero $A$ no es triangular.
  fb: |-
    $F_2\to F_2-3F_1$ da $U=\begin{pmatrix}1&2\\0&1\end{pmatrix}$ y el multiplicador $3$ va a $L$: $LU=\begin{pmatrix}1&2\\3&7\end{pmatrix}$.
- p: |-
    Con $A=\begin{pmatrix}0&1\\1&0\end{pmatrix}$ y $B=(2,3)^t$ se usa $PA=LU$ con $P=A$. ¿Cuál es la solución de $AX=B$?
  opciones:
  - t: |-
      $X=(3,2)^t$
    ok: true
  - t: |-
      $X=(2,3)^t$
    ok: false
    why: |-
      Es el resultado de resolver $LY=B$ sin permutar $B$: hay que usar $PB=(3,2)^t$.
  - t: |-
      $X=(0,0)^t$
    ok: false
    why: |-
      Esa es la solución del homogéneo; aquí $B\neq0$ y $A$ es regular con $X=A^{-1}B$.
  - t: |-
      No tiene solución
    ok: false
    why: |-
      $\det A=-1\neq0$: $A$ es regular y el sistema es compatible determinado.
  fb: |-
    $PA=I=LU$ con $L=U=I$, y $LY=PB=(3,2)^t$ da $Y=(3,2)^t=X$. Comprobación: $A(3,2)^t=(2,3)^t$.
capa: true
que_cae_nota: |-
  Los ejercicios de examen de este tema son sobre todo preguntas teóricas cortas de clasificación por rangos y de factorización $LU$; los problemas largos piden discutir y resolver con un parámetro.
motivacion:
  s1: |-
    Tres ecuaciones con tres incógnitas ocupan media página y se vuelven ilegibles si hay que manipularlas. ¿Se pueden guardar todas en una sola igualdad corta, con matrices, para trabajar con ella como si fuera una ecuación de una incógnita?
  s2: |-
    Un sistema puede tener una solución, infinitas o ninguna. ¿Hay una forma de saberlo antes de resolver nada, solo mirando dos números asociados a las matrices? Piensa en dos rectas del plano: ¿cuándo se cortan en un punto, cuándo coinciden y cuándo son paralelas?
  s3: |-
    Si sumas dos ecuaciones de un sistema o multiplicas una por 5, el sistema parece otro. ¿Qué operaciones puedes hacer sobre las ecuaciones sin cambiar las soluciones? Y, ¿para qué sirve transformar un sistema en otro más sencillo?
  s4: |-
    Una recta en $\mathbb R^3$ se puede dar como intersección de dos planos o como «punto + t·dirección». ¿Cómo se pasa de una forma a otra, y cuál conviene para comprobar si un punto está en la recta?
  s5: |-
    Un ordenador no guarda $\tfrac13$ exacto, solo $0{,}3333\ldots$ cortado. Si resuelve un sistema con miles de operaciones, ¿cuánto pueden crecer esos pequeños fallos y cómo se mide el error de un resultado?
  s6: |-
    Resolver un sistema por sustitución a mano se complica en cuanto hay más de tres incógnitas. ¿Existe un procedimiento mecánico, siempre igual, que vaya anulando incógnitas y deje el sistema listo para despejar de abajo arriba?
  s7: |-
    Tras escalonar, aún hay que despejar hacia arriba, con muchas sustituciones. ¿Se puede seguir operando hasta que la solución aparezca directamente leída en la matriz, sin sustituir nada?
  s8: |-
    Imagina que tienes que resolver el mismo sistema con 100 vectores de términos independientes distintos. ¿Hay que repetir todo el escalonamiento cada vez, o se puede hacer una vez y reutilizarlo?
  s9: |-
    La factorización anterior funciona si nunca hace falta intercambiar filas. ¿Qué pasa si aparece un 0 justo donde necesitamos el pivote, y cómo se arregla sin perder la ventaja de reutilizar el trabajo?
  s10: |-
    Ya conoces Gauss, Gauss-Jordan y $LU$. Ante un sistema concreto, ¿cuál escoges? ¿Cambia la respuesta si tienes un solo sistema o muchos con la misma matriz, o si pides la inversa?
consignas:
- animacion: |-
    un sistema $2\times2$ son dos rectas
  consigna: |-
    Cambia los coeficientes de las dos ecuaciones y observa las dos rectas del plano. Prueba a que sean paralelas y luego a que coincidan, fijándote en cómo cambian los rangos de $A$ y de $(A\mid B)$.
  pregunta: |-
    ¿Qué relación entre los dos rangos y el número de incógnitas aparece cuando las rectas se cortan en un único punto?
- animacion: |-
    tres ecuaciones son tres planos
  consigna: |-
    Gira la escena y fíjate en cómo se colocan los tres planos entre sí. Cambia los coeficientes para obtener planos que se cortan en una recta, en un punto o sin punto común, y mira la clasificación por rangos.
  pregunta: |-
    ¿Pueden dos planos ser paralelos y aun así el sistema tener solución?
- animacion: |-
    método de Gauss sobre un sistema
  consigna: |-
    Avanza paso a paso con el control del método y fíjate en qué pivote se usa en cada columna y qué filas se anulan debajo de él. Cuando llegues a la forma escalonada, comprueba que se puede resolver de abajo arriba.
  pregunta: |-
    ¿Por qué cada paso no cambia las soluciones del sistema?
- animacion: |-
    Gauss-Jordan (sistema compatible indeterminado)
  consigna: |-
    Avanza hasta el final y observa cómo, además de anular por debajo, se anula por encima de cada pivote. Fíjate en la columna que queda sin pivote y en cómo aparece como parámetro en la solución.
  pregunta: |-
    ¿Cuántos parámetros libres hay y cómo lo ves en el número de pivotes?
- animacion: |-
    $A=LU$ paso a paso y resolución de $AX=B$
  consigna: |-
    Avanza por los pasos y fíjate en cómo los multiplicadores usados al escalonar se guardan en $L$ y en que $U$ es la matriz escalonada. Después mira cómo se resuelve $AX=B$ en dos pasos, $LY=B$ y $UX=Y$.
  pregunta: |-
    Si cambias solo $B$, ¿qué parte del trabajo no hay que repetir?
- animacion: |-
    cuándo falla la $LU$ sin permutar
  consigna: |-
    Avanza hasta el paso en que el pivote vale 0 y comprueba que no se puede seguir sin intercambiar filas. Observa cómo el intercambio, recogido en la matriz de permutación, permite terminar la factorización.
  pregunta: |-
    ¿En qué momento exacto deja de servir el método sin permutaciones?
tarjetas: true
