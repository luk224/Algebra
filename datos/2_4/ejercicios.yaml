- id: ej2-31
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 2.31, p. 71
    texto: |-
      E p.71
  problema:
  - inter
  - grassmann
  nivel: 1
  titulo: |-
    Ejercicio 2.31 — intersección de dos subespacios de $\mathbb R^3$: ecuaciones y dimensión
  enunciado: |-
    Sabiendo que $L_1=\{(x_1,x_2,x_3)\in\mathbb R^3\mid x_1=0\}$ y $L_2=\langle(-1,0,2),(0,1,1)\rangle$, se pide: A) Ecuaciones del subespacio $L_1\cap L_2$. B) Dimensión del subespacio $L_1\cap L_2$.
  pista: |-
    Un vector de la intersección cumple las condiciones de los dos subespacios a la vez. Pasa $L_2$ a ecuaciones cartesianas, júntalas con la de $L_1$ y cuenta los parámetros libres.
  cuerpo:
  - html: |-
      <p><i>Idea.</i> Un vector está en $L_1\cap L_2$ si cumple <b>a la vez</b> las condiciones de $L_1$ y de $L_2$. Las condiciones que se pueden «juntar» son las <b>ecuaciones cartesianas</b>: lo primero es pasar $L_2$ (dado por generadores) a cartesianas.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Ecuaciones y dimensión de la intersección de un plano dado por una ecuación y otro dado por generadores.
      - - |-
          Cómo lo pienso
        - |-
          La intersección son los vectores que cumplen <b>todas</b> las ecuaciones de los dos. Un subespacio dado por generadores no tiene ecuaciones a la vista: tengo que obtenerlas. Dos planos de $\mathbb R^3$ distintos se cortan en una recta (dimensión 1); lo espero, y lo compruebo.
      - - |-
          Qué uso
        - |-
          <b>Intersección</b> (U p.91): $L_1\cap L_2$ = vectores en ambos; con cartesianas se juntan todas las ecuaciones (generadores $\to$ cartesianas) — <a href="#s2">ver teoría</a>.
      - - |-
          Por dónde empiezo
        - |-
          Paso el plano de generadores a cartesianas (determinante igualado a 0), junto las dos ecuaciones y resuelvo.
  - pasos:
    - |-
      <b>$L_1$ ya está en cartesianas:</b> $x_1=0$.
            <p>Sus vectores son</p>
            $$(0,x_2,x_3)=x_2(0,1,0)+x_3(0,0,1),$$
            <p>y $\{(0,1,0),(0,0,1)\}$ es libre: base, $\operatorname{Dim}L_1=2$ (Def. 2.9 y 2.11, U p.82 y p.87). Es un plano.</p>
    - |-
      <b>$L_2$ en paramétricas</b> (Def. 2.4, U p.71):
            $$\begin{pmatrix}x_1\\x_2\\x_3\end{pmatrix}=\alpha\begin{pmatrix}-1\\0\\2\end{pmatrix}+\beta\begin{pmatrix}0\\1\\1\end{pmatrix}\iff\begin{cases}x_1=-\alpha\\x_2=\beta\\x_3=2\alpha+\beta\end{cases}$$
            <p>Los dos generadores no son proporcionales: libres, $\operatorname{Dim}L_2=2$ (Teor. 2.5, U p.88).</p>
    - |-
      <b>$L_2$ en cartesianas (eliminar parámetros).</b>
            <p>De las dos primeras, $\alpha=-x_1$ y $\beta=x_2$. Sustituyendo en la tercera:</p>
            $$x_3=-2x_1+x_2.$$
            <p><i>Comprobación por rangos:</i> $(x_1,x_2,x_3)\in L_2$ si y solo si añadirlo a los generadores no sube el rango:</p>
            $$\begin{vmatrix}-1&0&2\\0&1&1\\x_1&x_2&x_3\end{vmatrix}=-2x_1+x_2-x_3=0.$$
            <p>Misma ecuación. Comprobamos los generadores: $-2(-1)+0-2=0$ ✓ y $0+1-1=0$ ✓.</p>
    - |-
      <b>A) Ecuaciones de $L_1\cap L_2$</b> (juntar, U p.91, Ej. 2.32):
            $$L_1\cap L_2:\ \begin{cases}x_1=0\\x_3=-2x_1+x_2\end{cases}\iff\begin{cases}x_1=0\\x_3=x_2\end{cases}$$
            <p>(sustituyendo $x_1=0$ en la segunda).</p>
    - |-
      <b>B) Dimensión.</b> Resolviendo: $x_2=\lambda$ libre, $x_1=0$, $x_3=\lambda$; los vectores son $\lambda(0,1,1)$. Luego
            $$L_1\cap L_2=\langle(0,1,1)\rangle,$$
            <p>$\{(0,1,1)\}$ es base (un vector no nulo es libre) y $\operatorname{Dim}(L_1\cap L_2)=1$: una recta. Paramétricas: $x_1=0$, $x_2=\alpha$, $x_3=\alpha$.</p>
    - |-
      <b>Comprobación con Grassmann</b> (U p.95):
            $$L_1+L_2=\langle(0,1,0),(0,0,1),(-1,0,2),(0,1,1)\rangle$$
            <p>tiene rango 3, luego es $\mathbb R^3$, y $3+1=2+2$ ✓.</p>
  - resultado: |-
      $L_1\cap L_2:\ x_1=0,\ x_2=x_3$, de dimensión 1, $=\langle(0,1,1)\rangle$. <i>(Verificado con sympy.)</i>
  - receta: |-
      para intersecar, pasa ambos subespacios a <b>ecuaciones cartesianas</b>, júntalas en un sistema y resuélvelo; el número de parámetros libres es la dimensión de la intersección ($=n-\operatorname{rang}$ del sistema).
  - error: |-
      intentar intersecar «igualando generadores» (decir que la intersección son los generadores comunes). Aquí $(0,1,1)$ sí es generador de $L_2$, pero en general un vector de la intersección no aparece en ninguna lista de generadores (ver 2.37).
  - teoria: |-
      Def. 2.4, U p.71 · Teor. 2.5, U p.88 · intersección, U p.91 · Grassmann, U p.95
- id: ej2-32
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 2.32, p. 72
    texto: |-
      E p.72
  problema:
  - suma
  - directa
  nivel: 2
  titulo: |-
    Ejercicio 2.32 — suma con $H\subset G$: ecuaciones paramétricas y ¿es directa?
  enunciado: |-
    Siendo $H=\{(x_1,x_2,x_3)\in\mathbb R^3\mid x_1=0,\ x_2=x_3\}$ y $G=\{(x_1,x_2,x_3)\in\mathbb R^3\mid x_1=0\}$, se pide: A) Unas ecuaciones paramétricas de $H+G$. B) Comprobar si $H+G$ es suma directa.
  pista: |-
    Compara las ecuaciones de $H$ y de $G$: ¿está uno dentro del otro? Si es así, la suma ya la conoces; para la directa, mira la intersección.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Con $H\subset G$ hallar paramétricas de $H+G$ y decidir si la suma es directa.
      - - |-
          Cómo lo pienso
        - |-
          Me fijo antes que nada en si hay inclusión: si $H\subset G$, sumar $H$ a $G$ no añade nada, $H+G=G$, y la intersección es todo $H$. Una suma directa exige intersección nula; aquí la intersección es $H$, que no es nula.
      - - |-
          Qué uso
        - |-
          <b>Def. 2.12-2.14</b> (U p.93-98): $L_1+L_2=\langle S_1\cup S_2\rangle$; directa $\iff L_1\cap L_2=\{\bar0\}$; suplementarios $L_1\oplus L_2=V$ — <a href="#s4">suma</a>, <a href="#s6">directa</a>, <a href="#s7">suplementarios</a>.
      - - |-
          Por dónde empiezo
        - |-
          Compruebo la inclusión sustituyendo las ecuaciones de $H$ en la de $G$; deduzco la suma y la intersección.
  - pasos:
    - |-
      <b>Observa la inclusión $H\subset G$.</b> Todo vector de $H$ cumple $x_1=0$ (y además $x_2=x_3$), luego cumple la única ecuación de $G$. Entonces:
            $$H\cap G=H,\qquad H\cup G=G.$$
    - |-
      <b>Si $H\subset G$, entonces $H+G=G$</b> (Def. 2.12, U p.93), en dos inclusiones.
            <p><i>$H+G\subset G$:</i> un vector de $H+G$ es $h+g$ con $h\in H\subset G$ y $g\in G$; como $G$ es subespacio (cerrado para la suma, U p.62), $h+g\in G$.</p>
            <p><i>$G\subset H+G$:</i> todo $g\in G$ es $g=0+g$ con $0\in H$.</p>
    - |-
      <b>A) Paramétricas de $H+G=G$.</b> $G$ solo impone $x_1=0$; $x_2,x_3$ son libres:
            $$\begin{cases}x_1=0\\x_2=\alpha\\x_3=\beta\end{cases}\qquad(\alpha,\beta\in\mathbb R),\qquad\operatorname{Dim}(H+G)=2.$$
    - |-
      <b>B) ¿Es directa?</b> Por la caracterización (U p.97) lo es $\iff H\cap G=\{0\}$. Pero
            $$H\cap G=H=\langle(0,1,1)\rangle\neq\{(0,0,0)\}:$$
            <p>contiene, p. ej., $(0,1,1)$. <b>No es suma directa.</b></p>
    - |-
      <b>Comprobación con la definición</b> (Def. 2.13, U p.96): $(0,1,1)\in H+G$ tiene dos descomposiciones:
            $$(0,1,1)=\underbrace{(0,1,1)}_{\in H}+\underbrace{(0,0,0)}_{\in G}=\underbrace{(0,0,0)}_{\in H}+\underbrace{(0,1,1)}_{\in G}.$$
    - |-
      <b>Comprobación con Grassmann</b> (U p.95):
            $$\operatorname{Dim}(H+G)+\operatorname{Dim}(H\cap G)=2+1=3=\operatorname{Dim}H+\operatorname{Dim}G=1+2\ ✓$$
  - resultado: |-
      $H+G=G$, paramétricas $x_1=0,\ x_2=\alpha,\ x_3=\beta$; <b>no</b> es suma directa. <i>(Verificado con sympy.)</i>
  - receta: |-
      antes de calcular nada, mira si un subespacio está contenido en el otro (sus ecuaciones incluyen las del otro). Si $H\subset G$: $H+G=G$ y $H\cap G=H$; la suma solo es directa si $H=\{0\}$.
  - error: |-
      confundir $H+G$ con $H\cup G$ (aquí coinciden porque $H\subset G$, pero en general la unión no es subespacio), o creer que $1+2=3$ es la dimensión de la suma.
  - teoria: |-
      Def. 2.12, U p.93 · Def. 2.13, U p.96 · caracterización, U p.97 · Grassmann, U p.95
- id: ej2-33
  clase: libro
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 2.33, p. 73
    texto: |-
      E p.73
  problema:
  - suma
  nivel: 2
  titulo: |-
    Ejercicio 2.33 — demostrar que $E=F$ y hallar cartesianas
  enunciado: |-
    Sean $E$ el subespacio de $\mathbb R^3$ generado por $(1,0,-1)$ y $(0,1,-1)$ y $F$ el subespacio generado por $(1,1,-2)$, $(2,1,-3)$ y $(0,1,-1)$, se pide: A) Demostrar que $E=F$. B) Ecuaciones cartesianas de $F$.
  pista: |-
    Para probar $E=F$ mira las dimensiones y si los generadores de uno están en el otro (rango). Las cartesianas salen de que $x$ añadido a los generadores no suba el rango.
  cuerpo:
  - html: |-
      <p><i>Idea.</i> Dos subespacios son iguales si cada uno está contenido en el otro. Con dimensiones es más cómodo: si $E\subset F$ y $\operatorname{Dim}E=\operatorname{Dim}F$, entonces $E=F$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Demostrar que dos subespacios, dados por generadores, son iguales, y hallar cartesianas.
      - - |-
          Cómo lo pienso
        - |-
          Dos subespacios son iguales si cada generador de uno está en el otro (o si uno está contenido en el otro y tienen la misma dimensión). Calculo las dimensiones primero: si no coinciden, no pueden ser iguales.
      - - |-
          Qué uso
        - |-
          <b>Igualdad de subespacios</b>: $E=F\iff$ cada generador de uno está en el otro; cartesianas: $n-r$ ecuaciones — <a href="#s1">ver teoría</a>.
      - - |-
          Por dónde empiezo
        - |-
          Dimensiones por rango; compruebo que los generadores de $E$ son combinaciones de los de $F$; cartesianas con un determinante.
  - pasos:
    - |-
      <b>$\operatorname{Dim}E$.</b>
            $$\operatorname{Dim}E=\operatorname{rang}\begin{pmatrix}1&0&-1\\0&1&-1\end{pmatrix}=2$$
            <p>(el menor $\begin{vmatrix}1&0\\0&1\end{vmatrix}=1\neq0$; Teor. 2.5, U p.88).</p>
    - |-
      <b>$\operatorname{Dim}F$.</b> Calculo el determinante de la matriz de generadores:
            $$\det\begin{pmatrix}1&1&-2\\2&1&-3\\0&1&-1\end{pmatrix}=1(-1+3)-1(-2-0)+(-2)(2-0)=2+2-4=0.$$
            <p>Hay un menor $2\times2$ no nulo, $\begin{vmatrix}1&1\\2&1\end{vmatrix}=-1$: rango 2, $\operatorname{Dim}F=2$. (Dependencia explícita: $(0,1,-1)=2(1,1,-2)-(2,1,-3)$.)</p>
    - |-
      <b>$E\subset F$: los generadores de $E$ están en $F$.</b> $(0,1,-1)$ es un generador de $F$. Para $(1,0,-1)$ busco $a(1,1,-2)+b(2,1,-3)+c(0,1,-1)=(1,0,-1)$. Una solución es $a=-1$, $b=1$, $c=0$:
            $$-(1,1,-2)+(2,1,-3)=(1,0,-1)\ ✓$$
            <p>(hay infinitas, porque los generadores de $F$ son dependientes). Como $E$ es el <b>menor</b> subespacio que contiene a esos dos vectores (Teor. 2.8, U p.91) y $F$ es un subespacio que los contiene, $E\subset F$.</p>
    - |-
      <b>Igualdad.</b> $(1,0,-1),(0,1,-1)$ son dos vectores libres de $F$ y $\operatorname{Dim}F=2$: por el Teor. 2.6 (U p.88) forman una base de $F$. Por tanto $F=E$. ∎
            <p><i>Alternativa por rangos:</i> $\operatorname{rang}(E)=\operatorname{rang}(F)=\operatorname{rang}(E\cup F)=2$ (los 5 vectores juntos tienen rango 2): si al juntar los generadores el rango no sube, cada subespacio está contenido en el otro.</p>
    - |-
      <b>B) Cartesianas de $F(=E)$.</b> Con la base $\{(1,0,-1),(0,1,-1)\}$, $(x_1,x_2,x_3)\in F$ si el rango no sube al añadirlo:
            $$\begin{vmatrix}1&0&-1\\0&1&-1\\x_1&x_2&x_3\end{vmatrix}=1\cdot(x_3+x_2)+(-1)(0-x_1)=x_1+x_2+x_3=0.$$
            <p>Equivalentemente: paramétricas $x_1=\alpha$, $x_2=\beta$, $x_3=-\alpha-\beta$, luego $x_3=-x_1-x_2$. Comprobación con los generadores de $F$:</p>
            $$1+1-2=0,\qquad2+1-3=0,\qquad0+1-1=0\ ✓$$
  - resultado: |-
      $E=F$, y $F:\ x_1+x_2+x_3=0$. <i>(Verificado con sympy.)</i>
  - receta: |-
      para probar $E=F$: (i) calcula ambas dimensiones por rango; (ii) comprueba que los generadores de uno están en el otro (o que el rango de todos juntos no sube); (iii) misma dimensión + inclusión $\Rightarrow$ igualdad.
  - error: |-
      pensar que $E\neq F$ porque tienen distinto número de generadores (2 frente a 3), o comprobar solo que las dimensiones coinciden: dos planos distintos de $\mathbb R^3$ tienen la misma dimensión y no son iguales.
  - teoria: |-
      Teor. 2.5 y 2.6, U p.88 · Teor. 2.8, U p.91 · cartesianas, U p.71
- id: ej2-34
  clase: libro
