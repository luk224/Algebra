  problema:
  - suma
  nivel: 2
  titulo: |-
    Ejercicio 2.33 — demostrar que $E=F$ y hallar cartesianas
  enunciado: |-
    Sean $E$ el subespacio de $\mathbb R^3$ generado por $(1,0,-1)$ y $(0,1,-1)$ y $F$ el subespacio generado por $(1,1,-2)$, $(2,1,-3)$ y $(0,1,-1)$, se pide: A) Demostrar que $E=F$. B) Ecuaciones cartesianas de $F$.
  pista: |-
    Para probar $E=F$ mira las dimensiones y si los generadores de uno están en el otro (rango). Las cartesianas salen de que $x$ añadido a los generadores no suba el rango.
  cuerpo:
  - html: |-
      <p><i>Idea.</i> Dos subespacios son iguales si cada uno está contenido en el otro. Con dimensiones es más cómodo: si $E\subset F$ y $\operatorname{Dim}E=\operatorname{Dim}F$, entonces $E=F$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Demostrar que dos subespacios, dados por generadores, son iguales, y hallar cartesianas.
      - - |-
          Cómo lo pienso
        - |-
          Dos subespacios son iguales si cada generador de uno está en el otro (o si uno está contenido en el otro y tienen la misma dimensión). Calculo las dimensiones primero: si no coinciden, no pueden ser iguales.
      - - |-
          Qué uso
        - |-
          $E=F\iff$ cada generador de uno está en el otro (o: mismas dimensiones y una inclusión). Cartesianas: $n-r$ ecuaciones, $x\in\langle S\rangle\iff\operatorname{rang}(S\mid x)=r$.
      - - |-
          Por dónde empiezo
        - |-
          Dimensiones por rango; compruebo que los generadores de $E$ son combinaciones de los de $F$; cartesianas con un determinante.
  - pasos:
    - |-
      <b>$\operatorname{Dim}E$.</b>
            $$\operatorname{Dim}E=\operatorname{rang}\begin{pmatrix}1&0&-1\\0&1&-1\end{pmatrix}=2$$
            <p>(el menor $\begin{vmatrix}1&0\\0&1\end{vmatrix}=1\neq0$; Teor. 2.5, U p.88).</p>
    - |-
      <b>$\operatorname{Dim}F$.</b> Calculo el determinante de la matriz de generadores:
            $$\det\begin{pmatrix}1&1&-2\\2&1&-3\\0&1&-1\end{pmatrix}=1(-1+3)-1(-2-0)+(-2)(2-0)=2+2-4=0.$$
            <p>Hay un menor $2\times2$ no nulo, $\begin{vmatrix}1&1\\2&1\end{vmatrix}=-1$: rango 2, $\operatorname{Dim}F=2$. (Dependencia explícita: $(0,1,-1)=2(1,1,-2)-(2,1,-3)$.)</p>
    - |-
      <b>$E\subset F$: los generadores de $E$ están en $F$.</b> $(0,1,-1)$ es un generador de $F$. Para $(1,0,-1)$ busco $a(1,1,-2)+b(2,1,-3)+c(0,1,-1)=(1,0,-1)$. Una solución es $a=-1$, $b=1$, $c=0$:
            $$-(1,1,-2)+(2,1,-3)=(1,0,-1)\ ✓$$
            <p>(hay infinitas, porque los generadores de $F$ son dependientes). Como $E$ es el <b>menor</b> subespacio que contiene a esos dos vectores (Teor. 2.8, U p.91) y $F$ es un subespacio que los contiene, $E\subset F$.</p>
    - |-
      <b>Igualdad.</b> $(1,0,-1),(0,1,-1)$ son dos vectores libres de $F$ y $\operatorname{Dim}F=2$: por el Teor. 2.6 (U p.88) forman una base de $F$. Por tanto $F=E$. ∎
            <p><i>Alternativa por rangos:</i> $\operatorname{rang}(E)=\operatorname{rang}(F)=\operatorname{rang}(E\cup F)=2$ (los 5 vectores juntos tienen rango 2): si al juntar los generadores el rango no sube, cada subespacio está contenido en el otro.</p>
    - |-
      <b>B) Cartesianas de $F(=E)$.</b> Con la base $\{(1,0,-1),(0,1,-1)\}$, $(x_1,x_2,x_3)\in F$ si el rango no sube al añadirlo:
            $$\begin{vmatrix}1&0&-1\\0&1&-1\\x_1&x_2&x_3\end{vmatrix}=1\cdot(x_3+x_2)+(-1)(0-x_1)=x_1+x_2+x_3=0.$$
            <p>Equivalentemente: paramétricas $x_1=\alpha$, $x_2=\beta$, $x_3=-\alpha-\beta$, luego $x_3=-x_1-x_2$. Comprobación con los generadores de $F$:</p>
            $$1+1-2=0,\qquad2+1-3=0,\qquad0+1-1=0\ ✓$$
  - resultado: |-
      $E=F$, y $F:\ x_1+x_2+x_3=0$. <i>(Verificado con sympy.)</i>
  - receta: |-
      para probar $E=F$: (i) calcula ambas dimensiones por rango; (ii) comprueba que los generadores de uno están en el otro (o que el rango de todos juntos no sube); (iii) misma dimensión + inclusión $\Rightarrow$ igualdad.
  - error: |-
      pensar que $E\neq F$ porque tienen distinto número de generadores (2 frente a 3), o comprobar solo que las dimensiones coinciden: dos planos distintos de $\mathbb R^3$ tienen la misma dimensión y no son iguales.
  - teoria: |-
      Teor. 2.5 y 2.6, U p.88 · Teor. 2.8, U p.91 · cartesianas, U p.71
