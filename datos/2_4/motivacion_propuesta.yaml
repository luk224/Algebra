motivacion:
  s1: |-
    Tienes dos vectores $u,w$ en un conjunto $S$ y quieres un subespacio que los contenga. Si $S=\{(1,0,0),(0,1,0)\}$, ¿qué es lo mínimo que hay que añadir para que se pueda sumar y escalar sin salir? ¿Habrá un «más pequeño» posible?
  s2: |-
    Dos planos por el origen en $\mathbb R^3$, ¿dónde se cortan: en un punto, una recta, un plano...? ¿Y la intersección de dos subespacios, seguirá siendo siempre un subespacio?
  s3: |-
    Una recta horizontal y una vertical por el origen en $\mathbb R^2$: junta todos sus puntos. Suma $(1,0)$ y $(0,1)$, ¿sigues dentro del conjunto? ¿Se puede «unir» subespacios y seguir teniendo un subespacio?
  s4: |-
    Si la unión de subespacios no sirve, ¿cómo construir el subespacio más pequeño que contenga a la vez a $U_1$ y a $U_2$? Piensa en sumar todo lo que se pueda obtener tomando un vector de cada uno.
  s5: |-
    Un plano y otro plano de $\mathbb R^3$ (dimensión 2 cada uno) se cortan en una recta. ¿Por qué no hay $2+2=4$ dimensiones en la suma, si $\mathbb R^3$ solo tiene 3? ¿Qué relación guardan las cuatro dimensiones?
  s6: |-
    Dado un vector $v$ de $U_1+U_2$, ¿se puede escribir como $u_1+u_2$ de una sola manera, o de varias? Compara el eje $x_3$ con el plano $x_3=0$ frente a dos planos que se cortan.
  s7: |-
    En $\mathbb R^3$ el plano $x_3=0$ y el eje $x_3$ lo reparten todo sin solaparse. ¿Todo subespacio tiene un «complementario» así? ¿Es único? ¿Cómo hallarlo?
consignas:
  - animacion: "Interactivo: la unión de dos rectas"
    consigna: |-
      Mueve las direcciones de las dos rectas y elige un vector $u$ en $L_1$ y un vector $w$ en $L_2$. Fíjate en dónde cae $u+w$ respecto de las dos rectas.
    pregunta: |-
      ¿Cuándo, y solo cuándo, la unión de las dos rectas es un subespacio?
  - animacion: "Interactivo 3D: intersección de dos planos"
    consigna: |-
      Gira la figura y cambia los coeficientes de los dos planos; fíjate en qué conjunto forma la intersección. Prueba a hacer que los planos coincidan.
    pregunta: |-
      ¿Qué dimensión tiene la intersección cuando los planos son distintos? ¿Y cuando son el mismo?
  - animacion: "Interactivo 3D: un plano y una recta"
    consigna: |-
      Cambia $v$ y observa cómo se cierra el paralelogramo $u_1+u_2$ sobre el plano y la recta. Luego elige el preset «La recta está en el plano» y vuelve a mirar las descomposiciones de $v$.
    pregunta: |-
      ¿Por qué en el primer caso hay una sola descomposición y en el segundo infinitas?
