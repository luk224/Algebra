esencial:
  intro: |-
    Cuatro operaciones entre subespacios (intersección, unión, suma, suma directa) y una fórmula que las une, la de Grassmann.
  items:
  - |-
    <b>Intersección</b> $U_1\cap U_2$: vectores que están en los dos; <b>siempre es subespacio</b>. Se calcula juntando las ecuaciones cartesianas de ambos (si hay generadores, pásalos antes a cartesianas).
  - |-
    <b>Unión</b> $U_1\cup U_2$: <b>en general no es subespacio</b> (la suma de un vector de cada uno se sale). Solo lo es si $U_1\subset U_2$ o $U_2\subset U_1$.
  - |-
    <b>Suma</b> $U_1+U_2=\{u_1+u_2\}$: el menor subespacio que contiene a la unión. Una base se obtiene escalonando los generadores de los dos juntos.
  - |-
    <b>Grassmann:</b> $\operatorname{Dim}(U_1+U_2)+\operatorname{Dim}(U_1\cap U_2)=\operatorname{Dim}U_1+\operatorname{Dim}U_2$. Con tres dimensiones justificadas, despejas la cuarta.
  - |-
    <b>Suma directa</b> $\iff U_1\cap U_2=\{0\}$ (descomposición única). <b>Suplementarios</b> en $V$: además $\operatorname{Dim}U_1+\operatorname{Dim}U_2=\operatorname{Dim}V$; el suplementario existe pero <b>no es único</b>.
tipos:
- id: inter
  nombre: |-
    Calcular una intersección
  receta: |-
    Junta las condiciones de los dos subespacios y resuelve el sistema homogéneo.
  senal: |-
    El enunciado pide «$U_1\cap U_2$», «vectores comunes» o «ecuaciones/base de la intersección».
  pasos:
  - |-
    Escribe cada subespacio en ecuaciones cartesianas (si viene por generadores, elimina parámetros o usa el determinante).
  - |-
    Junta todas las ecuaciones en un único sistema homogéneo.
  - |-
    Resuelve: los parámetros libres dan las paramétricas y su número es la dimensión.
  - |-
    Comprueba que los vectores obtenidos cumplen las ecuaciones de los dos subespacios (y con Grassmann, si puedes).
  ejemplo: |-
    $U=\{x_1=0\}$ y $W=\langle(1,1,0),(0,1,1)\rangle$. Cartesiana de $W$: $\begin{vmatrix}x_1&x_2&x_3\\1&1&0\\0&1&1\end{vmatrix}=x_1-x_2+x_3=0$. Junto con $x_1=0$ queda $x_2=x_3$: $U\cap W=\langle(0,1,1)\rangle$, y $(0,1,1)$ es el segundo generador de $W$.
  fallos: |-
    Buscar generadores comunes en lugar de vectores comunes · Escribir $\{(0,1,1)\}$ en vez de $\langle(0,1,1)\rangle$ · No comprobar el resultado en las dos ecuaciones
- id: suma
  nombre: |-
    Suma de subespacios: base y ecuaciones
  receta: |-
    Une los generadores, escalona y quédate con las filas no nulas.
  senal: |-
    Piden «$U_1+U_2$», una base, una dimensión o unas ecuaciones de la suma; o «demostrar que $E=F$».
  pasos:
  - |-
    Escribe una base (o generadores) de cada subespacio.
  - |-
    Pon todos los vectores por filas en una matriz y escalona.
  - |-
    Las filas no nulas son una base de $U_1+U_2$; su número es la dimensión.
  - |-
    Si piden cartesianas, pásalas desde esa base (el vector $x$ añadido no sube el rango).
  ejemplo: |-
    $U=\langle(1,0,1,0),(0,1,0,1)\rangle$, $W=\langle(1,1,1,1),(0,0,1,0)\rangle$. Como $(1,1,1,1)=(1,0,1,0)+(0,1,0,1)$ sale una fila nula: $U+W$ tiene base $\{(1,0,1,0),(0,1,0,1),(0,0,1,0)\}$ y dimensión 3.
  fallos: |-
    Creer que $\operatorname{Dim}(U_1+U_2)=\operatorname{Dim}U_1+\operatorname{Dim}U_2$ · Confundir suma con unión · Dar como base los generadores sin quitar los ligados
- id: grassmann
  nombre: |-
    Dimensiones y fórmula de Grassmann
  receta: |-
    Calcula tres dimensiones con rangos y despeja la cuarta.
  senal: |-
    Piden «dimensión» de la suma o la intersección, estudios con parámetro, o posibles dimensiones sin vectores concretos.
  pasos:
  - |-
    Halla $\operatorname{Dim}U_1$ y $\operatorname{Dim}U_2$ (rango de sus generadores o $n-$ nº de ecuaciones independientes).
  - |-
    Halla $\operatorname{Dim}(U_1+U_2)$ como rango de todos los generadores juntos.
  - |-
    Despeja: $\operatorname{Dim}(U_1\cap U_2)=\operatorname{Dim}U_1+\operatorname{Dim}U_2-\operatorname{Dim}(U_1+U_2)$.
  - |-
    Sin vectores concretos, acota: $\max(\operatorname{Dim}U_1,\operatorname{Dim}U_2)\le\operatorname{Dim}(U_1+U_2)\le\operatorname{Dim}V$.
  ejemplo: |-
    En $\mathbb R^5$, $\operatorname{Dim}U=3$ y $\operatorname{Dim}W=4$. Como $4\le\operatorname{Dim}(U+W)\le5$, la intersección tiene $3+4-\operatorname{Dim}(U+W)\in\{2,3\}$.
  fallos: |-
    Escribir Grassmann con $\operatorname{Dim}V$ o con la unión · Suponer $U_1+U_2=V$ sin probarlo · Olvidar que los generadores pueden ser ligados al contar la dimensión
  series:
  - tipo: grass
    titulo: |-
      Fórmula de Grassmann
    n: 5
- id: directa
  nombre: |-
    ¿La suma es directa?
  receta: |-
    La suma es directa si y solo si la intersección es $\{0\}$.
  senal: |-
    Aparece «suma directa», «$\oplus$», «descomposición única» o «distintas formas de escribir $v=u_1+u_2$».
  pasos:
  - |-
    Calcula $U_1\cap U_2$ (o $\operatorname{Dim}$ con Grassmann).
  - |-
    Si es $\{0\}$ la suma es directa y $\operatorname{Dim}(U_1\oplus U_2)=\operatorname{Dim}U_1+\operatorname{Dim}U_2$; si no, no lo es.
  - |-
    Para descomponer un vector, impón $v=u_1+u_2$ con $u_i\in U_i$ y resuelve; en suma directa sale una sola solución.
  ejemplo: |-
    $U=\langle(1,0,0),(0,1,0)\rangle$ y $W=\langle(1,1,1)\rangle$: $(a,b,0)=t(1,1,1)\Rightarrow t=0$, luego $U\cap W=\{0\}$. La suma es directa y de dimensión $2+1=3$: $U\oplus W=\mathbb R^3$.
  fallos: |-
    Decir «es directa» porque $\operatorname{Dim}U_1+\operatorname{Dim}U_2\le n$ · Aplicar el criterio por parejas a tres o más sumandos · Olvidar que una recta dentro de un plano no es suma directa con él
- id: suplementario
  nombre: |-
    Suplementarios: comprobar o construir
  receta: |-
    Suplementario = intersección nula y dimensiones que suman $\operatorname{Dim}V$; se construye completando una base.
  senal: |-
    «¿Son suplementarios?», «halla un suplementario de…», «$V=U_1\oplus U_2$».
  pasos:
  - |-
    Para comprobar: verifica $U_1\cap U_2=\{0\}$ y $\operatorname{Dim}U_1+\operatorname{Dim}U_2=\operatorname{Dim}V$.
  - |-
    Para construir: toma una base de $U$ y complétala a una base de $V$ añadiendo vectores canónicos.
  - |-
    Los vectores añadidos generan un suplementario; comprueba con el rango o el determinante que la lista completa es base.
  ejemplo: |-
    $U=\langle(1,1,0)\rangle\subset\mathbb R^3$. Añado $(0,1,0),(0,0,1)$: $\det\begin{pmatrix}1&1&0\\0&1&0\\0&0&1\end{pmatrix}=1\neq0$ es base, y $\langle(0,1,0),(0,0,1)\rangle$ es un suplementario de $U$.
  fallos: |-
    Hablar de «el» suplementario como si fuera único · Añadir un vector canónico sin ver que ya está en $U$ · Tomar el complemento conjuntista $V\setminus U$
quiz:
- p: |-
    Dos planos distintos de $\mathbb R^3$ por el origen se cortan en…
  opciones:
  - t: |-
      Solo el vector $0$
    ok: false
    why: |-
      Entonces la suma tendría dimensión $2+2=4>3$, imposible en $\mathbb R^3$.
  - t: |-
      Una recta
    ok: true
  - t: |-
      Un plano
    ok: false
    why: |-
      Eso solo pasa si los planos coinciden, y son distintos.
  - t: |-
      Depende de los planos
    ok: false
    why: |-
      No: Grassmann fija el resultado, porque la suma de dos planos distintos es todo $\mathbb R^3$.
  fb: |-
    Dos planos distintos suman $\mathbb R^3$ (dimensión 3), luego $\operatorname{Dim}(U_1\cap U_2)=2+2-3=1$: una recta.
- p: |-
    En $\mathbb R^6$, $\operatorname{Dim}U_1=3$, $\operatorname{Dim}U_2=4$ y $\operatorname{Dim}(U_1\cap U_2)=2$. ¿Cuánto vale $\operatorname{Dim}(U_1+U_2)$?
  opciones:
  - t: '7'
    ok: false
    why: |-
      Has sumado $3+4$ sin restar la intersección (y además la suma no puede superar $\operatorname{Dim}\mathbb R^6=6$).
  - t: '5'
    ok: true
  - t: '6'
    ok: false
    why: |-
      Solo valdría 6 si la intersección tuviera dimensión 1; no basta con que la suma «llene» el espacio.
  - t: '2'
    ok: false
    why: |-
      Confundes suma con intersección: la suma contiene a $U_2$, luego su dimensión es al menos 4.
  fb: |-
    Grassmann: $\operatorname{Dim}(U_1+U_2)=3+4-2=5$.
- p: |-
    En $\mathbb R^2$, $U_1=\langle(1,0)\rangle$ y $U_2=\langle(0,1)\rangle$. ¿Es $U_1\cup U_2$ un subespacio?
  opciones:
  - t: |-
      Sí, porque $U_1$ y $U_2$ lo son
    ok: false
    why: |-
      La unión de subespacios no hereda la propiedad: hay que mirar si es cerrada para la suma.
  - t: |-
      No: $(1,0)+(0,1)=(1,1)$ no está en ninguno de los dos
    ok: true
  - t: |-
      No, porque no contiene al vector $0$
    ok: false
    why: |-
      Sí lo contiene ($0$ está en los dos ejes); el fallo es otro: no es cerrada para la suma.
  - t: |-
      Sí, porque su suma es $\mathbb R^2$
    ok: false
    why: |-
      Confundes unión con suma: la suma sí es $\mathbb R^2$, pero la unión es solo la «cruz» de los dos ejes.
  fb: |-
    La unión no es cerrada para la suma: $(1,1)\notin U_1\cup U_2$. Solo sería subespacio si uno contuviera al otro.
- p: |-
    En $\mathbb R^3$, $U=\{x_3=0\}$ y $W=\langle(1,1,0)\rangle$. ¿Es directa la suma $U+W$?
  opciones:
  - t: |-
      Sí, porque $2+1\le3$
    ok: false
    why: |-
      El tamaño no decide: hay que mirar la intersección.
  - t: |-
      No, porque $W\subset U$ y $U\cap W=W\neq\{0\}$
    ok: true
  - t: |-
      Sí, porque son suplementarios
    ok: false
    why: |-
      Serían suplementarios con intersección nula; aquí $W$ está dentro de $U$.
  - t: |-
      No, porque $U+W=\mathbb R^3$
    ok: false
    why: |-
      Falso: $U+W=U$, de dimensión 2. Lo que impide la suma directa es la intersección no nula.
  fb: |-
    $(1,1,0)$ cumple $x_3=0$, luego $W\subset U$ y $U\cap W=W$ (recta). Con intersección no nula, hay infinitas descomposiciones.
- p: |-
    En $\mathbb R^3$, $U=\langle(1,0,0)\rangle$. ¿Cuál de estos subespacios es un suplementario de $U$?
  opciones:
  - t: |-
      $\langle(2,0,0)\rangle$
    ok: false
    why: |-
      Es la misma recta que $U$: intersección no nula y dimensiones que suman 2.
  - t: |-
      $\langle(0,1,0)\rangle$
    ok: false
    why: |-
      Intersección nula, pero $1+1=2\neq3$: la suma es solo un plano.
  - t: |-
      $\langle(1,1,0),(0,1,0)\rangle$
    ok: false
    why: |-
      Contiene a $(1,1,0)-(0,1,0)=(1,0,0)$, que está en $U$: la intersección no es $\{0\}$.
  - t: |-
      $\langle(0,1,0),(0,0,1)\rangle$
    ok: true
  fb: |-
    $\{(1,0,0),(0,1,0),(0,0,1)\}$ es base de $\mathbb R^3$: intersección nula y $1+2=3$.
- p: |-
    $U=\langle(1,1,0),(0,1,1)\rangle$ y $W=\langle(1,2,1)\rangle$ en $\mathbb R^3$. ¿Cuánto vale $\operatorname{Dim}(U+W)$?
  opciones:
  - t: '3'
    ok: false
    why: |-
      Has sumado $2+1$ sin ver que $(1,2,1)=(1,1,0)+(0,1,1)\in U$.
  - t: '2'
    ok: true
  - t: '1'
    ok: false
    why: |-
      La suma contiene a $U$, que ya tiene dimensión 2.
  - t: '4'
    ok: false
    why: |-
      Ninguna suma en $\mathbb R^3$ supera la dimensión 3.
  fb: |-
    $W\subset U$, luego $U+W=U$ (dimensión 2) y la intersección es $W$ (dimensión 1): $2+1=2+1$.
capa: true
motivacion:
  s1: |-
    Tienes dos vectores $u,w$ en un conjunto $S$ y quieres un subespacio que los contenga. Si $S=\{(1,0,0),(0,1,0)\}$, ¿qué es lo mínimo que hay que añadir para que se pueda sumar y escalar sin salir? ¿Habrá un «más pequeño» posible?
  s2: |-
    Dos planos por el origen en $\mathbb R^3$, ¿dónde se cortan: en un punto, una recta, un plano...? ¿Y la intersección de dos subespacios, seguirá siendo siempre un subespacio?
  s3: |-
    Una recta horizontal y una vertical por el origen en $\mathbb R^2$: junta todos sus puntos. Suma $(1,0)$ y $(0,1)$, ¿sigues dentro del conjunto? ¿Se puede «unir» subespacios y seguir teniendo un subespacio?
  s4: |-
    Si la unión de subespacios no sirve, ¿cómo construir el subespacio más pequeño que contenga a la vez a $U_1$ y a $U_2$? Piensa en sumar todo lo que se pueda obtener tomando un vector de cada uno.
  s5: |-
    Un plano y otro plano de $\mathbb R^3$ (dimensión 2 cada uno) se cortan en una recta. ¿Por qué no hay $2+2=4$ dimensiones en la suma, si $\mathbb R^3$ solo tiene 3? ¿Qué relación guardan las cuatro dimensiones?
  s6: |-
    Dado un vector $v$ de $U_1+U_2$, ¿se puede escribir como $u_1+u_2$ de una sola manera, o de varias? Compara el eje $x_3$ con el plano $x_3=0$ frente a dos planos que se cortan.
  s7: |-
    En $\mathbb R^3$ el plano $x_3=0$ y el eje $x_3$ lo reparten todo sin solaparse. ¿Todo subespacio tiene un «complementario» así? ¿Es único? ¿Cómo hallarlo?
consignas:
- animacion: |-
    Interactivo: la unión de dos rectas
  consigna: |-
    Mueve las direcciones de las dos rectas y elige un vector $u$ en $L_1$ y un vector $w$ en $L_2$. Fíjate en dónde cae $u+w$ respecto de las dos rectas.
  pregunta: |-
    ¿Cuándo, y solo cuándo, la unión de las dos rectas es un subespacio?
- animacion: |-
    Interactivo 3D: intersección de dos planos
  consigna: |-
    Gira la figura y cambia los coeficientes de los dos planos; fíjate en qué conjunto forma la intersección. Prueba a hacer que los planos coincidan.
  pregunta: |-
    ¿Qué dimensión tiene la intersección cuando los planos son distintos? ¿Y cuando son el mismo?
- animacion: |-
    Interactivo 3D: un plano y una recta
  consigna: |-
    Cambia $v$ y observa cómo se cierra el paralelogramo $u_1+u_2$ sobre el plano y la recta. Luego elige el preset «La recta está en el plano» y vuelve a mirar las descomposiciones de $v$.
  pregunta: |-
    ¿Por qué en el primer caso hay una sola descomposición y en el segundo infinitas?
tarjetas: true
