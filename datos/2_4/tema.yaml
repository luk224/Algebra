h1: |-
  Operaciones entre subespacios. Suma directa
resumen: |-
  Los subespacios también se pueden <b>combinar</b>: la <b>intersección</b> (lo que tienen en común), la <b>suma</b> (todo lo que se alcanza usando los dos a la vez) y la <b>suma directa</b> (la suma sin redundancia, donde cada vector se descompone de una sola manera). La fórmula de <b>Grassmann</b> liga las cuatro dimensiones en juego y es la herramienta estrella del tema.
