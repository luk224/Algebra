motivacion:
  s1: |-
    ¿Qué tienen en común una flecha del plano, un polinomio y una función? Si solo sabemos sumarlos y estirarlos, ¿podemos tratarlos igual que a los vectores de $\mathbb R^2$?
  s2: |-
    Podemos inventar una «suma» y un «producto por números» en casi cualquier conjunto, pero no siempre se comportan bien: ¿qué reglas mínimas hay que exigirles para poder razonar como con los vectores de $\mathbb R^2$?
  s3: |-
    En $\mathbb R^3$, una recta que pasa por el origen es un mundo cerrado: sumas dos de sus vectores y sigues en ella. Y una recta que no pasa por el origen, ¿también? ¿Cómo comprobarlo sin revisar infinitos vectores?
  s4: |-
    Te dan un conjunto como $\{(x,y,z): x+y+z=0\}$ o $\{(x,y): xy\ge 0\}$ y te preguntan si es subespacio. ¿Existe un procedimiento fijo que sirva siempre, y qué contraejemplo sencillo basta para decir que no?
  s5: |-
    Un plano de $\mathbb R^3$ puede darse con una ecuación o como todas las combinaciones de dos vectores. ¿Cómo pasar de una descripción a otra? Y si cortas o juntas dos planos por el origen, ¿sigues teniendo un subespacio?
