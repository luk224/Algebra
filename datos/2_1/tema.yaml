kicker: |-
  Módulo 2 · Espacios vectoriales · Tema 2.1
h1: |-
  Espacios vectoriales. Subespacios
resumen: |-
  Hasta ahora un «vector» era una lista de números. Aquí se da el salto: un vector es <b>cualquier objeto</b> (una función, un polinomio, una matriz…) que se pueda sumar y multiplicar por números cumpliendo ocho reglas. Aprenderás a reconocer cuándo un conjunto con sus operaciones es un espacio vectorial y, sobre todo, a decidir en dos líneas si un subconjunto es un <b>subespacio</b>.
