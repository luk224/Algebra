h1: |-
  Cónicas
resumen: |-
  Te dan una ecuación de segundo grado en $x_1,x_2$, como $5x_1^2-3x_1x_2+x_2^2-3x_1+2x_2-5=0$, y hay que decir <b>qué curva es</b> (elipse, hipérbola, parábola o alguna degenerada) y <b>dónde está</b>. Aprenderás dos caminos que deben coincidir: <b>mover los ejes</b> (un giro que elimina $x_1x_2$ y una traslación que elimina los términos lineales, hasta la <i>ecuación reducida</i>) y <b>clasificar sin dibujar</b>, con tres números que no cambian al mover los ejes (los <i>invariantes métricos</i> $|A|$, $a_{11}+a_{22}$ y $A_{00}$).
