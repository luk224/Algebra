- id: ej6-26
  clase: libro
  titulo: |-
    Ejercicio 6.26 — valores propios de la parte cuadrática de $x_1^2+x_2^2+2x_1x_2-4x_1-1=0$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.26, p. 223
    texto: |-
      E p.223
  cuerpo:
  - enun: |-
      Calcúlense los valores propios de la matriz de la parte cuadrática de la cónica $x_1^2+x_2^2+2x_1x_2-4x_1-1=0$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Valores propios de la parte cuadrática de una cónica.
      - - |-
          Cómo lo pienso
        - |-
          La parte cuadrática es $x_1^2+x_2^2+2x_1x_2$: su matriz es $\begin{pmatrix}1&1\\1&1\end{pmatrix}$, que tiene filas iguales. Intuyo un valor propio $0$.
      - - |-
          Qué uso
        - |-
          <b>Ecuación matricial (U p.271-280):</b> $a_{11}x_1^2+2a_{12}x_1x_2+a_{22}x_2^2+2a_{01}x_1+2a_{02}x_2+a_{00}=0\iff(1\ x_1\ x_2)A\,(1\ x_1\ x_2)^t=0$, con $A$ simétrica $3\times3$ y parte cuadrática $A_{00}$ ($2\times2$). <b>Invariantes métricos:</b> $|A|$, $|A_{00}|$ y $a_{11}+a_{22}=\operatorname{tr}A_{00}$.
      - - |-
          Por dónde empiezo
        - |-
          Escribo $A_{00}$ y resuelvo $|A_{00}-\lambda I|=0$.
  - pasos:
    - |-
      <b>Separar la parte cuadrática</b> (U p.279): son los términos de grado 2, $f_2=x_1^2+2x_1x_2+x_2^2$. Los términos $-4x_1$ (lineal) y $-1$ (constante) no intervienen.
    - |-
      <p><b>Su matriz:</b> $a_{11}=1$, $a_{22}=1$ y el coeficiente de $x_1x_2$ es $2a_{12}=2$, luego $a_{12}=1$:</p>
            $$M=\begin{pmatrix}1&1\\1&1\end{pmatrix}$$
            <p>y $f_2=(x_1\ x_2)M(x_1\ x_2)^t$.</p>
    - |-
      <p><b>Polinomio característico:</b></p>
            $$|M-\lambda I|=\begin{vmatrix}1-\lambda&1\\1&1-\lambda\end{vmatrix}=(1-\lambda)^2-1=\lambda^2-2\lambda=\lambda(\lambda-2).$$
    - |-
      <b>Valores propios:</b> $\lambda_1=0$, $\lambda_2=2$.
    - |-
      <b>Qué significa.</b> Un valor propio nulo equivale a $A_{00}=|M|=0\cdot2=0$: la cónica <b>no tiene centro</b> (parábola o rectas paralelas). Aquí $|A|=-4\neq0$, así que es una <b>parábola</b>. Control: traza $0+2=2=a_{11}+a_{22}$ ✓.
  - receta: |-
      quita los términos de grado $\le1$, pon la <b>mitad</b> del coeficiente de $x_1x_2$ fuera de la diagonal y resuelve $\lambda^2-(\text{traza})\lambda+|M|=0$.
  - error: |-
      poner $a_{12}=2$ (el coeficiente entero) en lugar de $1$, o meter $-4x_1$ en la matriz $2\times2$.
- id: ej6-27a
  clase: libro
  titulo: |-
    Ejercicio 6.27, apartado A — partes cuadrática, lineal y constante de $x_1^2+x_2^2+2x_1x_2-4x_2-1=0$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.27 A, p. 224
    texto: |-
      E p.224
  cuerpo:
  - enun: |-
      Dada la cónica $x_1^2+x_2^2+2x_1x_2-4x_2-1=0$, se pide: A) Descomponer la ecuación en parte cuadrática, parte lineal y parte constante y dar las expresiones matriciales de dichas componentes. B) Obtener la ecuación de la cónica referida a una base cuyos vectores sean paralelos a los ejes de la cónica dada. <i>(El apartado B está en el <a href="#ej6-27b">Bloque III</a>.)</i>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Descomponer la ecuación en parte cuadrática, lineal y constante, y escribirlas con matrices.
      - - |-
          Cómo lo pienso
        - |-
          Cada parte tiene su matriz: la cuadrática $A_{00}$ ($2\times2$), la lineal con los coeficientes de $x_1,x_2$ (la mitad en cada posición) y la constante.
      - - |-
          Qué uso
        - |-
          <b>Ecuación matricial (U p.271-280):</b> $a_{11}x_1^2+2a_{12}x_1x_2+a_{22}x_2^2+2a_{01}x_1+2a_{02}x_2+a_{00}=0\iff(1\ x_1\ x_2)A\,(1\ x_1\ x_2)^t=0$, con $A$ simétrica $3\times3$ y parte cuadrática $A_{00}$ ($2\times2$). <b>Invariantes métricos:</b> $|A|$, $|A_{00}|$ y $a_{11}+a_{22}=\operatorname{tr}A_{00}$.
      - - |-
          Por dónde empiezo
        - |-
          Leo los coeficientes de la ecuación y los distribuyo.
  - pasos:
    - |-
      <p><b>Parte cuadrática:</b></p>
            $$f_2=x_1^2+x_2^2+2x_1x_2=(x_1\ x_2)\begin{pmatrix}1&1\\1&1\end{pmatrix}\begin{pmatrix}x_1\\x_2\end{pmatrix}$$
            <p>(la misma matriz que en el E 6.26).</p>
    - |-
      <p><b>Parte lineal:</b></p>
            $$f_1=-4x_2=(0\ \ -4)\begin{pmatrix}x_1\\x_2\end{pmatrix}.$$
            <p>En la notación de U, $f_1=2(a_{01}\ a_{02})\binom{x_1}{x_2}$ con $a_{01}=0$ y $a_{02}=-2$.</p>
    - |-
      <b>Parte constante:</b> $a_{00}=-1$.
    - |-
      <p><b>Control con la matriz completa:</b></p>
            $$A=\begin{pmatrix}-1&0&-2\\0&1&1\\-2&1&1\end{pmatrix},$$
            <p>$|A|=-4$ y $A_{00}=0$ ⇒ <b>parábola</b>.</p>
  - receta: |-
      agrupar por grado (2, 1, 0); la parte lineal se escribe como producto fila por columna con $2a_{0i}$ como coeficientes.
- id: ej6-25a
  clase: libro
  titulo: |-
    Ejercicio 6.25, apartado A — ecuación matricial e invariantes de $x_1^2+4x_2^2-4x_1-16x_2+19=0$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.25 A, p. 223
    texto: |-
      E p.223
  cuerpo:
  - enun: |-
      Si $x_1^2+4x_2^2-4x_1-16x_2+19=0$ es la ecuación de una cónica, se pide: A) Encontrar su ecuación matricial, explicar qué son los invariantes métricos y calcularlos en este caso. B) Clasificar esta cónica. <i>(El apartado B está en el <a href="#ej6-25b">Bloque II</a>.)</i>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Ecuación matricial e invariantes de una cónica.
      - - |-
          Cómo lo pienso
        - |-
          Construyo $A$ de orden 3 con la constante, la mitad de los lineales y la parte cuadrática; los invariantes son $|A|$, $|A_{00}|$ y la traza de $A_{00}$.
      - - |-
          Qué uso
        - |-
          <b>Ecuación matricial (U p.271-280):</b> $a_{11}x_1^2+2a_{12}x_1x_2+a_{22}x_2^2+2a_{01}x_1+2a_{02}x_2+a_{00}=0\iff(1\ x_1\ x_2)A\,(1\ x_1\ x_2)^t=0$, con $A$ simétrica $3\times3$ y parte cuadrática $A_{00}$ ($2\times2$). <b>Invariantes métricos:</b> $|A|$, $|A_{00}|$ y $a_{11}+a_{22}=\operatorname{tr}A_{00}$.
      - - |-
          Por dónde empiezo
        - |-
          Matriz $A$ y tres números.
  - pasos:
    - |-
      <b>Coeficientes</b> (comparando con (6.3)): $a_{11}=1$, $a_{22}=4$, $2a_{12}=0\Rightarrow a_{12}=0$, $2a_{01}=-4\Rightarrow a_{01}=-2$, $2a_{02}=-16\Rightarrow a_{02}=-8$, $a_{00}=19$.
    - |-
      <b>Ecuación matricial</b> (Def. 6.17): $$(1\ \ x_1\ \ x_2)\begin{pmatrix}19&-2&-8\\-2&1&0\\-8&0&4\end{pmatrix}\begin{pmatrix}1\\x_1\\x_2\end{pmatrix}=0.$$ Control: al multiplicar sale $19+2(-2)x_1+2(-8)x_2+x_1^2+4x_2^2$ ✓.
    - |-
      <b>Qué son los invariantes métricos</b> (U Def. 6.19): parámetros que no varían al cambiar de sistema de coordenadas mediante un giro o una traslación. Son $|A|$, $a_{11}+a_{22}$ y $A_{00}=a_{11}a_{22}-a_{12}^2$.
    - |-
      <p><b>Cálculo.</b> $|A|$ por la 3.ª columna (tiene un 0):</p>
            $$|A|=-8\begin{vmatrix}-2&1\\-8&0\end{vmatrix}+4\begin{vmatrix}19&-2\\-2&1\end{vmatrix}=-8(8)+4(19-4)=-64+60=-4.$$
            <p>Traza $=1+4=5$.</p>
            $$A_{00}=\begin{vmatrix}1&0\\0&4\end{vmatrix}=4.$$
  - html: |-
      <div class="recipe"><b>Receta (Bloque I):</b> (1) divide entre 2 los coeficientes de $x_1x_2$, $x_1$, $x_2$; (2) $a_{00}$ arriba a la izquierda; (3) $|A|$, traza de $M$ y $|M|$.</div>
  - error: |-
      no dividir entre 2 (sale $a_{01}=-4$ en vez de $-2$) o poner $a_{00}$ abajo a la derecha.
- id: ej6-25b
  clase: libro
  titulo: |-
    Ejercicio 6.25, apartado B — clasificar $x_1^2+4x_2^2-4x_1-16x_2+19=0$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.25 B, p. 223
    texto: |-
      E p.223
  cuerpo:
  - enun: |-
      B) Clasificar esta cónica (la del <a href="#ej6-25a">apartado A</a>).
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Clasificar una cónica.
      - - |-
          Cómo lo pienso
        - |-
          La parte cuadrática $x_1^2+4x_2^2$ es definida positiva: $|A_{00}|>0$, elipse o similar. Falta $|A|$ para saber si es real, imaginaria o un punto.
      - - |-
          Qué uso
        - |-
          <b>Clasificación (cuadro de U p.286):</b> $|A_{00}|>0$ elipse (real, imaginaria o punto), $|A_{00}|<0$ hipérbola (o dos rectas secantes), $|A_{00}|=0$ parábola (o rectas paralelas/doble). Es no degenerada $\iff|A|\neq0$.
      - - |-
          Por dónde empiezo
        - |-
          Calculo $|A|$ y la traza de $A_{00}$ y uso el cuadro.
  - pasos:
    - |-
      <b>Datos del apartado A:</b> $|A|=-4$, traza $5$, $A_{00}=4$.
    - |-
      $|A|\neq0\Rightarrow\operatorname{rang}A=3\Rightarrow$ <b>no degenerada</b>.
    - |-
      $A_{00}=4\neq0\Rightarrow$ tiene <b>centro</b>, y como $A_{00}>0$, es una <b>elipse</b> (real o imaginaria).
    - |-
      $(a_{11}+a_{22})|A|=5\cdot(-4)=-20<0\Rightarrow$ <b>elipse real</b>. Es la del E 6.28 (centro $(2,2)$, semiejes $1$ y $\tfrac12$).
  - html: |-
      <div class="recipe"><b>Receta (Bloque II):</b> $|A|$ → ¿degenerada?; $A_{00}$ → elipse ($>0$), hipérbola ($<0$), parábola ($=0$); si elipse, signo de $(a_{11}+a_{22})|A|$ (negativo = real). Si $|A|=0$, rango de $A$ y la rama «rango 2/1».</div>
  - error: |-
      ver solo $A_{00}>0$ y decir «elipse real» (puede ser imaginaria: $x_1^2+x_2^2+1=0$).
- id: ej6-30
  clase: libro
  titulo: |-
    Ejercicio 6.30 — ¿parábola, elipse imaginaria o hipérbola? $x_1^2+4x_2^2-6x_1+8x_2+9=0$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.30, p. 226
    texto: |-
      E p.226
  cuerpo:
  - enun: |-
      La cónica $x_1^2+4x_2^2-6x_1+8x_2+9=0$ es: A) Una parábola. B) Una elipse imaginaria. C) Una hipérbola.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Decidir si una ecuación es parábola, elipse imaginaria o hipérbola.
      - - |-
          Cómo lo pienso
        - |-
          Antes de calcular miro la parte cuadrática: $x_1^2+4x_2^2$ definida positiva descarta parábola e hipérbola.
      - - |-
          Qué uso
        - |-
          <b>Clasificación (cuadro de U p.286):</b> $|A_{00}|>0$ elipse (real, imaginaria o punto), $|A_{00}|<0$ hipérbola (o dos rectas secantes), $|A_{00}|=0$ parábola (o rectas paralelas/doble). Es no degenerada $\iff|A|\neq0$.
      - - |-
          Por dónde empiezo
        - |-
          Calculo $|A|$ y la traza para elegir entre elipse real, imaginaria o punto.
  - pasos:
    - |-
      <p><b>Matriz:</b> $a_{11}=1$, $a_{22}=4$, $a_{12}=0$, $a_{01}=-3$, $a_{02}=4$, $a_{00}=9$:</p>
            $$A=\begin{pmatrix}9&-3&4\\-3&1&0\\4&0&4\end{pmatrix}.$$
    - |-
      <p><b>$|A|$</b> por la 2.ª fila:</p>
            $$|A|=-(-3)\begin{vmatrix}-3&4\\0&4\end{vmatrix}+1\cdot\begin{vmatrix}9&4\\4&4\end{vmatrix}=3(-12)+(36-16)=-36+20=-16.$$
            <p>$A_{00}=1\cdot4-0=4$.</p>
    - |-
      <b>Clasificación:</b> $|A|\neq0$ ⇒ no degenerada; $A_{00}=4>0$ ⇒ elipse; $(1+4)(-16)=-80<0$ ⇒ <b>elipse real</b>.
    - |-
      <b>Opciones:</b> A) falsa (una parábola exige $A_{00}=0$). B) falsa (la elipse imaginaria exige $(a_{11}+a_{22})|A|>0$). C) falsa (la hipérbola exige $A_{00}<0$).
    - |-
      <p><b>Comprobación sin invariantes</b> (completando cuadrados):</p>
            $$(x_1-3)^2-9+4(x_2+1)^2-4+9=0\iff(x_1-3)^2+4(x_2+1)^2=4\iff\dfrac{(x_1-3)^2}{4}+\dfrac{(x_2+1)^2}{1}=1:$$
            <p>elipse real de centro $(3,-1)$ y semiejes $2$ y $1$.</p>
  - receta: |-
      la del bloque; en un test, descarta cada opción con la condición que le falta.
  - error: |-
      marcar «elipse imaginaria» por ver $A_{00}>0$ sin calcular el signo de $(a_{11}+a_{22})|A|$.
- id: ej6-28
  clase: libro
  titulo: |-
    Ejercicio 6.28 — ecuación reducida de $x_1^2+4x_2^2-4x_1-16x_2+19=0$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.28, p. 225
    texto: |-
      E p.225
  cuerpo:
  - enun: |-
      Si $x_1^2+4x_2^2-4x_1-16x_2+19=0$ es la ecuación de una cónica, se pide encontrar la ecuación reducida de la cónica dada.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Ecuación reducida de una cónica.
      - - |-
          Cómo lo pienso
        - |-
          Parte cuadrática diagonal: no hay giro, solo traslación. Completo cuadrados en cada variable.
      - - |-
          Qué uso
        - |-
          <b>Ecuación reducida:</b> girar (diagonalizar $A_{00}$ ortogonalmente) y trasladar (completar cuadrados). Elipse $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$, hipérbola $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$, parábola $y^2=2px$.
      - - |-
          Por dónde empiezo
        - |-
          Completar cuadrados y dividir.
  - pasos:
    - |-
      <b>¿Hace falta giro?</b> El giro sirve para eliminar $x_1x_2$. Aquí $a_{12}=0$: los ejes de la cónica ya son paralelos a los coordenados, <b>no hay giro</b> y se pasa al paso 2.
    - |-
      <p><b>Completar cuadrados</b> en cada variable: $x_1^2-4x_1=(x_1-2)^2-4$ (se suma y resta $(\tfrac42)^2=4$);</p>
            $$4x_2^2-16x_2=4(x_2^2-4x_2)=4\big[(x_2-2)^2-4\big]=4(x_2-2)^2-16.$$
            <p>Sustituyendo: $(x_1-2)^2-4+4(x_2-2)^2-16+19=(x_1-2)^2+4(x_2-2)^2-1=0$.</p>
    - |-
      <b>Traslación:</b> $x_1'=x_1-2$, $x_2'=x_2-2$ (el nuevo origen es el centro $(2,2)$).
    - |-
      <p><b>Ecuación reducida:</b></p>
            $$x_1'^2+4x_2'^2=1\iff\dfrac{x_1'^2}{1^2}+\dfrac{x_2'^2}{(1/2)^2}=1:$$
            <p><b>elipse</b> (Def. 6.18 con $p=1$), $a=1$, $b=\tfrac12$.</p>
    - |-
      <b>Elementos</b> (propio): centro $(2,2)$; eje mayor horizontal; $c=\sqrt{1-\tfrac14}=\tfrac{\sqrt3}2$; focos $(2\pm\tfrac{\sqrt3}2,\,2)$; vértices $(1,2)$, $(3,2)$, $(2,\tfrac32)$, $(2,\tfrac52)$.
    - |-
      <b>Control con invariantes:</b> la reducida $x_1'^2+4x_2'^2-1=0$ tiene $|A'|=\det\operatorname{diag}(-1,1,4)=-4$, traza $5$ y $A_{00}=4$: los mismos que en el E 6.25 ✓.
  - receta: |-
      sin $x_1x_2$, solo traslación: completa cuadrados en $x_1$ y en $x_2$, escribe $x_i'=x_i-(\text{centro})$ y divide por el término independiente hasta llegar a la forma $\frac{x_1^2}{a^2}+\frac{x_2^2}{b^2}=1$.
  - error: |-
      completar mal un cuadrado con coeficiente: $4x_2^2-16x_2=4\big[(x_2-2)^2-4\big]$, no $4(x_2-2)^2-4$.
- id: ej6-27b
  clase: libro
  titulo: |-
    Ejercicio 6.27, apartado B — ecuación de $x_1^2+x_2^2+2x_1x_2-4x_2-1=0$ en una base paralela a sus ejes
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.27 B, p. 224
    texto: |-
      E p.224
  cuerpo:
  - enun: |-
      B) Obtener la ecuación de la cónica referida a una base cuyos vectores sean paralelos a los ejes de la cónica dada (cónica del <a href="#ej6-27a">apartado A</a>).
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Ecuación de la cónica en una base paralela a sus ejes.
      - - |-
          Cómo lo pienso
        - |-
          La parte cuadrática tiene un valor propio $0$ (parábola) y otro $2$. Los ejes son los vectores propios de $A_{00}$.
      - - |-
          Qué uso
        - |-
          <b>Ecuación reducida:</b> girar (diagonalizar $A_{00}$ ortogonalmente) y trasladar (completar cuadrados). Elipse $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$, hipérbola $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$, parábola $y^2=2px$.
      - - |-
          Por dónde empiezo
        - |-
          Diagonalizo $A_{00}$ y sustituyo.
  - pasos:
    - |-
      <b>Por qué diagonalizar.</b> Los ejes de la cónica son las direcciones en que la parte cuadrática no tiene término cruzado: las direcciones propias de $M$. Como $M$ es simétrica, admite una base <b>ortonormal</b> de vectores propios y $P^tMP$ es diagonal.
    - |-
      <b>Valores propios</b> (del E 6.26): $\lambda_1=0$, $\lambda_2=2$.
    - |-
      <b>Vectores propios.</b> $\lambda=0$: $Mx=0\iff x_1+x_2=0$ ⇒ $(1,-1)$. $\lambda=2$: $(M-2I)x=0\iff-x_1+x_2=0$ ⇒ $(1,1)$. Son ortogonales ($1-1=0$). Normalizando ($\|\cdot\|=\sqrt2$): $$P=\begin{pmatrix}\tfrac1{\sqrt2}&\tfrac1{\sqrt2}\\-\tfrac1{\sqrt2}&\tfrac1{\sqrt2}\end{pmatrix},\qquad P^tMP=\begin{pmatrix}0&0\\0&2\end{pmatrix}.$$ $\det P=\tfrac12+\tfrac12=1$: es un giro.
    - |-
      <p><b>Cambio $x=Py$.</b> Parte cuadrática: $0\cdot y_1^2+2y_2^2$. Parte lineal:</p>
            $$(0\ \ -4)P=\big(\tfrac4{\sqrt2},\,-\tfrac4{\sqrt2}\big)=(2\sqrt2,\,-2\sqrt2),$$
            <p>o sea $2\sqrt2\,y_1-2\sqrt2\,y_2$. Constante $-1$ (el giro no la cambia).</p>
    - |-
      <b>Ecuación en la base de los ejes:</b> $\ 2y_2^2+2\sqrt2\,y_1-2\sqrt2\,y_2-1=0$.
    - |-
      <p><b>Ampliación (terminar la reducción).</b> $2(y_2^2-\sqrt2\,y_2)=2\big(y_2-\tfrac{\sqrt2}2\big)^2-1$, luego</p>
            $$2\big(y_2-\tfrac{\sqrt2}2\big)^2+2\sqrt2\big(y_1-\tfrac1{\sqrt2}\big)=0.$$
            <p>Con $y_1''=y_1-\tfrac1{\sqrt2}$, $y_2''=y_2-\tfrac{\sqrt2}2$: $y_2''^2=-\sqrt2\,y_1''$, una <b>parábola</b> ($2p=-\sqrt2$; abre hacia $y_1$ negativo). Vértice en $y=(\tfrac1{\sqrt2},\tfrac{\sqrt2}2)$, o sea $x=Py=(1,0)$ (comprobación: $1+0+0-0-1=0$ ✓). Invariantes: $|A|=-4\neq0$, $A_{00}=0$ ✓.</p>
  - receta: |-
      (1) valores propios de $M$; (2) vectores propios <b>unitarios</b> con $\det P=1$; (3) $x=Py$: diagonalizar la parte cuadrática y transformar la parte lineal con $2(a_{01}\ a_{02})P$; (4) completar cuadrados y trasladar.
  - error: |-
      usar $P$ sin normalizar: entonces $P^tMP=\operatorname{diag}(0,4)\neq\operatorname{diag}(0,2)$ y la cónica se deforma.
- id: ej6-29
  clase: libro
  titulo: |-
    Ejercicio 6.29 — ¿para qué $m$ es degenerada $x_1^2+x_2^2-2x_1+2mx_1x_2-1=0$?
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.29, p. 225
    texto: |-
      E p.225
  cuerpo:
  - enun: |-
      La cónica $x_1^2+x_2^2-2x_1+2mx_1x_2-1=0$ será degenerada si: A) $m=5$. B) $m=2$. C) $m=|\sqrt2|$.
  - html: |-
      <p>La opción C, «$m=|\sqrt2|$», es solo $m=\sqrt2$, que es verdadera porque $\sqrt2$ es uno de los valores que anulan $|A|$ (probablemente se quiso escribir $|m|=\sqrt2$).</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Valores de $m$ para que la cónica sea degenerada.
      - - |-
          Qué se usa
        - |-
          <b>Condiciones con parámetros:</b> degenerada $\iff|A|=0$; parábola $\iff|A_{00}|=0$ y $|A|\neq0$; elipse real $\iff|A_{00}|>0$ y $|A|\cdot\operatorname{tr}A_{00}<0$.
      - - Plan
        - |-
          Imponer $|A|=0$.
  - pasos:
    - |-
      <b>Criterio</b> (U p.286): degenerada $\iff|A|=0$.
    - |-
      <b>Matriz:</b> $a_{11}=a_{22}=1$, $2a_{12}=2m\Rightarrow a_{12}=m$, $2a_{01}=-2\Rightarrow a_{01}=-1$, $a_{02}=0$, $a_{00}=-1$: $$A=\begin{pmatrix}-1&-1&0\\-1&1&m\\0&m&1\end{pmatrix}.$$
    - |-
      <p><b>Determinante completo</b> (por la 1.ª fila):</p>
            $$|A|=-1\begin{vmatrix}1&m\\m&1\end{vmatrix}-(-1)\begin{vmatrix}-1&m\\0&1\end{vmatrix}+0=-(1-m^2)+(-1)=m^2-2.$$
    - |-
      <p>$|A|=0\iff m=\pm\sqrt2$. Además el menor</p>
            $$\begin{vmatrix}-1&-1\\-1&1\end{vmatrix}=-2\neq0$$
            <p>⇒ $\operatorname{rang}A\ge2$ siempre (nunca es recta doble).</p>
    - |-
      <b>Opciones.</b> A) $m=5$: $|A|=23\neq0$, no degenerada: <b>falsa</b>. B) $m=2$: $|A|=2\neq0$: <b>falsa</b>. C) $m=\sqrt2$: $|A|=0$: <b>verdadera</b>.
    - |-
      <p><b>Qué degenerada es</b> (propio). Con $m=\pm\sqrt2$: rango 2 y $A_{00}=1-m^2=-1<0$ ⇒ <b>dos rectas reales secantes</b>. Para $m=\sqrt2$:</p>
            $$\big(x_1+(\sqrt2-1)x_2+\sqrt2-1\big)\big(x_1+(\sqrt2+1)x_2-\sqrt2-1\big)=0,$$
            <p>que se cortan en $(-1,\sqrt2)$.</p>
  - receta: |-
      degenerada ⇒ calcula $|A|$ como polinomio en el parámetro y resuelve $|A|=0$; después comprueba cada opción.
  - error: |-
      mirar solo $A_{00}$ (que vale $1-m^2$): la degeneración la decide $|A|$, no $A_{00}$.
- id: ej6-31
  clase: libro
  titulo: |-
    Ejercicio 6.31 — parábola con $1+x_1^2+2\lambda x_1x_2+\mu x_2^2+2\alpha x_2=0$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.31, p. 226
    texto: |-
      E p.226
  cuerpo:
  - enun: |-
      Dada la cónica de ecuación $1+x_1^2+2\lambda x_1x_2+\mu x_2^2+2\alpha x_2=0$, se pide calcular el valor de $\alpha$ para que sea una parábola.
  - html: |-
      <p>La respuesta es <b>$\alpha\neq0$</b> (y, además, $\mu=\lambda^2$).</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Valor de $\alpha$ para que sea parábola.
      - - |-
          Cómo lo pienso
        - |-
          Parábola ⇔ $|A_{00}|=0$ (y no degenerada). Esa condición es independiente de $\alpha$ si $\alpha$ solo aparece en la parte lineal. Luego $\alpha$ interviene en $|A|\neq0$.
      - - |-
          Qué uso
        - |-
          <b>Condiciones con parámetros:</b> degenerada $\iff|A|=0$; parábola $\iff|A_{00}|=0$ y $|A|\neq0$; elipse real $\iff|A_{00}|>0$ y $|A|\cdot\operatorname{tr}A_{00}<0$.
      - - |-
          Por dónde empiezo
        - |-
          Impongo $|A_{00}|=0$ y $|A|\neq0$.
  - pasos:
    - |-
      <b>Condiciones de parábola</b> (cuadro de U): $\operatorname{rang}A=3$ (es decir, $|A|\neq0$) <b>y</b> $A_{00}=0$. Las dos hacen falta: con $A_{00}=0$ y $|A|=0$ serían rectas paralelas.
    - |-
      <p><b>Matriz:</b> $a_{00}=1$, $a_{01}=0$, $a_{02}=\alpha$, $a_{11}=1$, $a_{12}=\lambda$, $a_{22}=\mu$:</p>
            $$A=\begin{pmatrix}1&0&\alpha\\0&1&\lambda\\\alpha&\lambda&\mu\end{pmatrix}.$$
    - |-
      $$|A|=1(\mu-\lambda^2)-0+\alpha(0-\alpha)=\mu-\lambda^2-\alpha^2$$
            <p>y $A_{00}=\mu-\lambda^2$.</p>
    - |-
      $A_{00}=0\iff\mu=\lambda^2$. Sustituyendo, $|A|=-\alpha^2$, que es $\neq0\iff\alpha\neq0$.
    - |-
      <b>Resultado:</b> es parábola $\iff\mu=\lambda^2$ y $\alpha\neq0$. Lo que se pide de $\alpha$: <b>$\alpha\neq0$</b> (con $\mu=\lambda^2$).
    - |-
      <b>Qué pasa si $\alpha=0$</b> (propio). $1+(x_1+\lambda x_2)^2=0$: sin puntos reales; rango 2, $A_{00}=0$, $A_{11}+A_{22}=\lambda^2+1>0$ ⇒ par de <b>rectas paralelas imaginarias</b>.
  - html: |-
      <div class="recipe"><b>Receta (con parámetro):</b> escribe $A$ y $A_{00}$ en función del parámetro, traduce el tipo pedido al cuadro (parábola: $A_{00}=0$ y $|A|\neq0$) y resuelve; revisa los valores frontera.</div>
  - error: |-
      imponer solo $A_{00}=0$ (olvida que con $|A|=0$ son rectas paralelas).
- id: ej6-32
  clase: libro
  titulo: |-
    Ejercicio 6.32 — elipse real con $a\,x_1^2+a\,x_2^2+2b\,x_1x_2-a=0$
  fuentes:
  - l: E
    ref: |-
      Ejercicios de Álgebra, Ej. 6.32, p. 227
    texto: |-
      E p.227
  cuerpo:
  - enun: |-
      Para que la cónica de ecuación $a\,x_1^2+a\,x_2^2+2b\,x_1x_2-a=0$ represente una elipse real se debe verificar: A) $|a|=|b|$. B) $|a|>|b|$. C) $|a|\ge|b|$.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Condición para elipse real con dos parámetros.
      - - |-
          Cómo lo pienso
        - |-
          Elipse real ⇔ $|A_{00}|>0$ y $|A|\cdot\operatorname{tr}A_{00}<0$. Aquí la ecuación no tiene términos lineales, la constante es $-a$.
      - - |-
          Qué uso
        - |-
          <b>Condiciones con parámetros:</b> degenerada $\iff|A|=0$; parábola $\iff|A_{00}|=0$ y $|A|\neq0$; elipse real $\iff|A_{00}|>0$ y $|A|\cdot\operatorname{tr}A_{00}<0$.
      - - |-
          Por dónde empiezo
        - |-
          Calculo $|A_{00}|$, $|A|$ y la traza.
  - pasos:
    - |-
      <b>Condiciones de elipse real</b> (cuadro de U): $|A|\neq0$, $A_{00}>0$ y $(a_{11}+a_{22})|A|<0$.
    - |-
      <p><b>Matriz</b> (no hay parte lineal):</p>
            $$A=\begin{pmatrix}-a&0&0\\0&a&b\\0&b&a\end{pmatrix}.$$
    - |-
      $|A|=-a(a^2-b^2)$ (bloque diagonal) y $A_{00}=a^2-b^2$.
    - |-
      $A_{00}>0\iff a^2>b^2\iff|a|>|b|$ (y esto obliga a $a\neq0$). Entonces $|A|=-a(a^2-b^2)\neq0$ ✓.
    - |-
      $(a_{11}+a_{22})|A|=2a\cdot(-a)(a^2-b^2)=-2a^2(a^2-b^2)<0$ cuando $|a|>|b|$ ✓.
    - |-
      <b>Conclusión:</b> elipse real $\iff|a|>|b|$. <b>Respuesta B.</b>
    - |-
      <b>Por qué A y C fallan.</b> Si $|a|=|b|\neq0$: $b=a$ da $a\big[(x_1+x_2)^2-1\big]=0$ y $b=-a$ da $a\big[(x_1-x_2)^2-1\big]=0$: <b>dos rectas paralelas</b> (degenerada). A es falsa y C incluye ese caso, luego también falsa.
    - |-
      <p><b>Ejemplo de E</b> ($a=2$, $b=-1$): $2x_1^2+2x_2^2-2x_1x_2-2=0$;</p>
            $$M=\begin{pmatrix}2&-1\\-1&2\end{pmatrix}$$
            <p>con valores propios $1$ y $3$ ⇒ reducida $y_1^2+3y_2^2=2$, elipse centrada en el origen con ejes en las direcciones $(1,1)$ y $(-1,1)$. Pruébala en la animación.</p>
  - receta: |-
      escribe $A$ y $A_{00}$ con el parámetro, traduce «elipse real» a tres condiciones y resuélvelas juntas; comprueba los casos frontera.
  - error: |-
      imponer solo $A_{00}>0$ y olvidar el signo de $(a_{11}+a_{22})|A|$.
- id: ej-propio-1
  clase: propio
  titulo: |-
    Propio P1 — elipse sin giro: centro, semiejes, vértices y focos de $4x_1^2+9x_2^2-8x_1+36x_2+4=0$
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio; método de E 6.28 y elementos de la elipse U p. 273; verificado con sympy
    texto: propio
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Centro, semiejes, vértices y focos de una elipse sin giro.
      - - |-
          Cómo lo pienso
        - |-
          No hay término cruzado: sin giro. Completo cuadrados para trasladar al centro.
      - - |-
          Qué uso
        - |-
          <b>Ecuación reducida:</b> girar (diagonalizar $A_{00}$ ortogonalmente) y trasladar (completar cuadrados). Elipse $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$, hipérbola $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$, parábola $y^2=2px$.
      - - |-
          Por dónde empiezo
        - |-
          Completar cuadrados y leer semiejes, focos $c^2=a^2-b^2$.
  - pasos:
    - |-
      <p><b>Invariantes:</b></p>
            $$A=\begin{pmatrix}4&-4&18\\-4&4&0\\18&0&9\end{pmatrix},$$
            <p>$|A|=-1296$, $A_{00}=36>0$ y $(4+9)|A|<0$ ⇒ <b>elipse real</b>.</p>
    - |-
      $a_{12}=0$ ⇒ <b>sin giro</b>. Completar: $4(x_1^2-2x_1)=4(x_1-1)^2-4$; $9(x_2^2+4x_2)=9(x_2+2)^2-36$. Queda $4(x_1-1)^2+9(x_2+2)^2-36=0$.
    - |-
      Dividiendo entre $36$: $\dfrac{(x_1-1)^2}{9}+\dfrac{(x_2+2)^2}{4}=1$. Centro $(1,-2)$, $a=3$ (horizontal), $b=2$, $c=\sqrt{9-4}=\sqrt5$.
    - |-
      <b>Vértices</b> $(-2,-2)$, $(4,-2)$, $(1,0)$, $(1,-4)$; <b>focos</b> $(1\pm\sqrt5,-2)$.
    - |-
      <b>Control:</b> $|A|/A_{00}=-1296/36=-36$ es la constante de $4x_1''^2+9x_2''^2-36=0$ ✓.
  - receta: |-
      la del E 6.28; después, $c^2=a^2-b^2$ y los focos sobre el eje mayor.
- id: ej-propio-2
  clase: propio
  titulo: |-
    Propio P2 — hipérbola con giro: $x_1^2+4x_1x_2+x_2^2-6x_1-6x_2+3=0$
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio; método de U Ej. 6.31 p. 283-284; verificado con sympy
    texto: propio
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Reducir una hipérbola con giro.
      - - |-
          Cómo lo pienso
        - |-
          Término cruzado ⇒ giro. Diagonalizo $A_{00}$; con valores propios de distinto signo es hipérbola.
      - - |-
          Qué uso
        - |-
          <b>Ecuación reducida:</b> girar (diagonalizar $A_{00}$ ortogonalmente) y trasladar (completar cuadrados). Elipse $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$, hipérbola $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$, parábola $y^2=2px$. <b>Clasificación (cuadro de U p.286):</b> $|A_{00}|>0$ elipse (real, imaginaria o punto), $|A_{00}|<0$ hipérbola (o dos rectas secantes), $|A_{00}|=0$ parábola (o rectas paralelas/doble). Es no degenerada $\iff|A|\neq0$.
      - - |-
          Por dónde empiezo
        - |-
          Giro por vectores propios y traslación.
  - pasos:
    - |-
      <p><b>Clasificar:</b></p>
            $$A=\begin{pmatrix}3&-3&-3\\-3&1&2\\-3&2&1\end{pmatrix},$$
            <p>$|A|=9\neq0$, $A_{00}=1-4=-3<0$ ⇒ <b>hipérbola</b>.</p>
    - |-
      <p><b>Giro:</b></p>
            $$M=\begin{pmatrix}1&2\\2&1\end{pmatrix},$$
            <p>$\lambda^2-2\lambda-3=0\Rightarrow\lambda_1=3,\lambda_2=-1$; $u_1=\tfrac1{\sqrt2}(1,1)$, $u_2=\tfrac1{\sqrt2}(-1,1)$;</p>
            $$P=\tfrac1{\sqrt2}\begin{pmatrix}1&-1\\1&1\end{pmatrix},$$
            <p>$\det P=1$ (giro de 45°).</p>
    - |-
      <b>Parte lineal:</b> $(-6\ \ -6)P=(-6\sqrt2\ \ 0)$. Ecuación: $3x_1'^2-x_2'^2-6\sqrt2\,x_1'+3=0$.
    - |-
      <b>Traslación:</b> $3(x_1'^2-2\sqrt2x_1')=3(x_1'-\sqrt2)^2-6$ ⇒ $3(x_1'-\sqrt2)^2-x_2'^2=3$ ⇒ $x_1''^2-\dfrac{x_2''^2}{3}=1$: hipérbola con $a=1$, $b=\sqrt3$, $c=\sqrt{1+3}=2$.
    - |-
      <p><b>Elementos en coordenadas originales</b> ($x=Px'$): centro $x'=(\sqrt2,0)\Rightarrow x=(1,1)$; vértices</p>
            $$x'_1=\sqrt2\pm1\Rightarrow x=\big(1\pm\tfrac1{\sqrt2},1\pm\tfrac1{\sqrt2}\big);$$
            <p>focos $x'_1=\sqrt2\pm2\Rightarrow x=(1\pm\sqrt2,1\pm\sqrt2)$. Asíntotas $x_2''=\pm\sqrt3\,x_1''$, que pasan por el centro $(1,1)$.</p>
    - |-
      <p><b>Comprobación de la definición:</b> en el punto $(1,1+\sqrt3)$ de la cónica,</p>
            $$|d_1-d_2|=\sqrt{7+2\sqrt6}-\sqrt{7-2\sqrt6}=(\sqrt6+1)-(\sqrt6-1)=2=2a$$
            <p>✓. Control: $|A|/A_{00}=-3$ ✓.</p>
  - receta: |-
      la de la Def. 6.18 con giro; el $\lambda$ positivo manda en el eje transverso si $d$ tiene el signo opuesto.
- id: ej-propio-3
  clase: propio
  titulo: |-
    Propio P3 — parábola con giro: vértice, foco y directriz de $x_1^2+2x_1x_2+x_2^2-8x_1+8x_2=0$
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio; método de U p. 281-282 y definición de parábola U p. 274-275; verificado con sympy
    texto: propio
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Vértice, foco y directriz de una parábola con giro.
      - - |-
          Cómo lo pienso
        - |-
          $|A_{00}|=0$: parábola. El eje es la dirección del vector propio de $0$.
      - - |-
          Qué uso
        - |-
          <b>Ecuación reducida:</b> girar (diagonalizar $A_{00}$ ortogonalmente) y trasladar (completar cuadrados). Elipse $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$, hipérbola $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$, parábola $y^2=2px$.
      - - |-
          Por dónde empiezo
        - |-
          Giro, traslación al vértice y parámetro $p$.
  - pasos:
    - |-
      <p><b>Clasificar:</b></p>
            $$A=\begin{pmatrix}0&-4&4\\-4&1&1\\4&1&1\end{pmatrix},$$
            <p>$|A|=-64\neq0$, $A_{00}=0$ ⇒ <b>parábola</b>.</p>
    - |-
      <p><b>Giro:</b></p>
            $$M=\begin{pmatrix}1&1\\1&1\end{pmatrix},$$
            <p>$\lambda_1=2$ con $u_1=\tfrac1{\sqrt2}(1,1)$ y $\lambda_2=0$ con $u_2=\tfrac1{\sqrt2}(-1,1)$;</p>
            $$P=\tfrac1{\sqrt2}\begin{pmatrix}1&-1\\1&1\end{pmatrix}.$$
    - |-
      <b>Parte lineal:</b> $(-8\ \ 8)P=(0\ \ 8\sqrt2)$. Ecuación: $2x_1'^2+8\sqrt2\,x_2'=0\iff x_1'^2=-4\sqrt2\,x_2'$. Ya es reducida (pasa por el origen): no hace falta trasladar.
    - |-
      <p>Def. 6.18 con $2p=-4\sqrt2$, $p=-2\sqrt2$: vértice $(0,0)$; foco $(0,\tfrac p2)=(0,-\sqrt2)$ en $x'$ ⇒ $x=P(0,-\sqrt2)^t=(1,-1)$; directriz</p>
            $$x_2'=-\tfrac p2=\sqrt2\iff\tfrac{-x_1+x_2}{\sqrt2}=\sqrt2\iff x_2-x_1=2.$$
    - |-
      <b>Comprobación de la definición:</b> $(8,0)$ está en la cónica ($64-64=0$); su distancia al foco es $\sqrt{49+1}=5\sqrt2$ y a la directriz $\tfrac{|0-8-2|}{\sqrt2}=5\sqrt2$ ✓.
  - receta: |-
      parábola ⇒ un valor propio es 0; el eje de la parábola es la dirección de ese vector propio.
- id: ej-propio-4
  clase: propio
  titulo: |-
    Propio P4 — las degeneradas, una por una
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio; cuadro de U p. 286 con el criterio corregido A11 + A22; verificado con sympy
    texto: propio
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Reconocer las cónicas degeneradas.
      - - |-
          Qué se usa
        - |-
          <b>Clasificación (cuadro de U p.286):</b> $|A_{00}|>0$ elipse (real, imaginaria o punto), $|A_{00}|<0$ hipérbola (o dos rectas secantes), $|A_{00}|=0$ parábola (o rectas paralelas/doble). Es no degenerada $\iff|A|\neq0$.
      - - Plan
        - |-
          Calcular $|A|$ y $|A_{00}|$ en cada caso.
  - pasos:
    - |-
      <p><b>a) $x_1^2-4x_2^2-2x_1+1=0$.</b></p>
            $$A=\begin{pmatrix}1&-1&0\\-1&1&0\\0&0&-4\end{pmatrix},$$
            <p>$|A|=0$, rango 2, $A_{00}=-4<0$ ⇒ <b>rectas reales secantes</b>: $(x_1-1)^2=4x_2^2$, o sea $(x_1-2x_2-1)(x_1+2x_2-1)=0$.</p>
    - |-
      <b>b) $x_1^2+x_2^2-2x_1+1=0$.</b> Rango 2, $A_{00}=1>0$ ⇒ rectas imaginarias secantes: <b>un punto</b>: $(x_1-1)^2+x_2^2=0\Rightarrow(1,0)$.
    - |-
      <p><b>c) Familia $x_1^2+2x_1x_2+x_2^2+2x_1+2x_2+k=0$</b>, o sea $(x_1+x_2+1)^2=1-k$.</p>
            $$A=\begin{pmatrix}k&1&1\\1&1&1\\1&1&1\end{pmatrix}:$$
            <p>$|A|=0$ siempre (dos filas iguales) y $A_{00}=0$. Si $k\neq1$, rango 2 ⇒ rectas paralelas; $A_{11}+A_{22}=2(k-1)$: $k<1$ ⇒ <b>reales</b> ($x_1+x_2+1=\pm\sqrt{1-k}$; p. ej. $k=0$: $(x_1+x_2)(x_1+x_2+2)=0$); $k>1$ ⇒ <b>imaginarias</b>. Si $k=1$, rango 1 ⇒ <b>recta doble</b> $(x_1+x_2+1)^2=0$.</p>
    - |-
      <b>d) Contraejemplo al criterio de U con $A_{11}$.</b> $x_1^2-1=0$ (rectas $x_1=\pm1$) y $x_1^2+1=0$ (sin puntos) tienen ambas $A_{11}=a_{00}a_{22}-a_{02}^2=0$: el criterio con $A_{11}$ no decide. Pero $A_{22}=a_{00}a_{11}-a_{01}^2$ vale $-1$ y $+1$: con $A_{11}+A_{22}$ sí se distingue.
  - receta: |-
      $|A|=0$ ⇒ rango; con rango 2, $A_{00}$ separa secantes (reales, punto) de paralelas; en paralelas, $A_{11}+A_{22}$.
- id: ej-propio-5
  clase: propio
  titulo: |-
    Propio P5 — clasificar para <b>todo</b> valor del parámetro: $kx_1^2+x_2^2+2x_1+1=0$
  fuentes:
  - l: P
    ref: |-
      Ejemplo propio; modelo: U Ej. 6.36 p. 287-288 y E 6.31-6.32; verificado con sympy
    texto: propio
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Clasificar para todo valor del parámetro.
      - - |-
          Qué se usa
        - |-
          <b>Condiciones con parámetros:</b> degenerada $\iff|A|=0$; parábola $\iff|A_{00}|=0$ y $|A|\neq0$; elipse real $\iff|A_{00}|>0$ y $|A|\cdot\operatorname{tr}A_{00}<0$. <b>Clasificación (cuadro de U p.286):</b> $|A_{00}|>0$ elipse (real, imaginaria o punto), $|A_{00}|<0$ hipérbola (o dos rectas secantes), $|A_{00}|=0$ parábola (o rectas paralelas/doble). Es no degenerada $\iff|A|\neq0$.
      - - Plan
        - |-
          Invariantes en función de $k$ y casos frontera.
  - pasos:
    - |-
      $$A=\begin{pmatrix}1&1&0\\1&k&0\\0&0&1\end{pmatrix}:$$
            <p>$|A|=k-1$, $A_{00}=k$, traza $k+1$.</p>
    - |-
      <b>Casos:</b>
            <ul>
              <li>$k>1$: $|A|>0$, $A_{00}>0$ y $(k+1)(k-1)>0$ ⇒ <b>elipse imaginaria</b>. Control $k=2$: $2(x_1+\tfrac12)^2+x_2^2+\tfrac12=0$, sin puntos.</li>
              <li>$k=1$: $|A|=0$, rango 2, $A_{00}=1>0$ ⇒ <b>un punto</b>: $(x_1+1)^2+x_2^2=0\Rightarrow(-1,0)$.</li>
              <li>$0&lt;k&lt;1$: $|A|<0$, $A_{00}>0$ y $(k+1)(k-1)<0$ ⇒ <b>elipse real</b>. Control $k=\tfrac12$: $\tfrac12(x_1+2)^2+x_2^2=1$.</li>
              <li>$k=0$: $|A|=-1\neq0$ y $A_{00}=0$ ⇒ <b>parábola</b> $x_2^2=-2x_1-1$.</li>
              <li>$k<0$: $|A|<0$ y $A_{00}<0$ ⇒ <b>hipérbola</b>.</li>
            </ul>
    - |-
      <b>Moraleja:</b> el parámetro puede cruzar tres fronteras distintas ($A_{00}=0$, $|A|=0$ y el signo de $(a_{11}+a_{22})|A|$); hay que estudiar cada una. <i>(Recórrelo con los botones «P5» de la animación.)</i>
  - receta: |-
      escribe $|A|$, $A_{00}$ y la traza como polinomios en $k$; marca en la recta real los valores donde se anulan y estudia cada tramo y cada valor frontera.
- id: ex-feb20b-6
  clase: examen
  titulo: |-
    Feb. 2020 (tipo B), ejercicio 6 — definir y citar los invariantes métricos de una cónica
  fuentes:
  - l: X
    ref: |-
      Feb. 2020 (tipo B), ejercicio 6
    texto: |-
      X Feb. 2020 (B) ej. 6
  cuerpo:
  - enun: |-
      Se pide definir y citar los invariantes métricos de una cónica $\mathcal C$. Nota: utilice su ecuación analítica.
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué me piden
        - |-
          Definir y citar los invariantes métricos.
      - - |-
          Cómo lo pienso
        - |-
          Son los números que no cambian bajo giros y traslaciones: $|A|$, $|A_{00}|$, $\operatorname{tr}A_{00}$.
      - - |-
          Qué uso
        - |-
          <b>Ecuación matricial (U p.271-280):</b> $a_{11}x_1^2+2a_{12}x_1x_2+a_{22}x_2^2+2a_{01}x_1+2a_{02}x_2+a_{00}=0\iff(1\ x_1\ x_2)A\,(1\ x_1\ x_2)^t=0$, con $A$ simétrica $3\times3$ y parte cuadrática $A_{00}$ ($2\times2$). <b>Invariantes métricos:</b> $|A|$, $|A_{00}|$ y $a_{11}+a_{22}=\operatorname{tr}A_{00}$.
      - - |-
          Por dónde empiezo
        - |-
          Enuncio con la ecuación matricial.
  - pasos:
    - |-
      <p><b>Ecuación analítica</b> (U Def. 6.16):</p>
            $$a_{11}x_1^2+2a_{12}x_1x_2+a_{22}x_2^2+2a_{01}x_1+2a_{02}x_2+a_{00}=0,$$
            <p>con matriz asociada $A$ (Def. 6.17) y matriz de la parte cuadrática</p>
            $$M=\begin{pmatrix}a_{11}&a_{12}\\a_{12}&a_{22}\end{pmatrix}.$$
    - |-
      <b>Definición</b> (U Def. 6.19): son los parámetros que no varían al pasar de un sistema de coordenadas a otro mediante un giro o una traslación.
    - |-
      <b>Cuáles son:</b> $|A|$ (determinante de la matriz de la cónica); $a_{11}+a_{22}$ (traza de $M$); $A_{00}=a_{11}a_{22}-a_{12}^2$ (adjunto de $a_{00}$ en $A$, igual al determinante de $M$).
    - |-
      <p><b>Ampliación (por qué lo son).</b> Un giro $x=Px'$ ($P$ ortogonal con $\det P=1$) seguido de una traslación se escribe $X=NX''$ con</p>
            $$N=\begin{pmatrix}1&0\\ c&P\end{pmatrix}$$
            <p>($c$ = vector de la traslación en coordenadas originales, de modo que $x=c+Px''$; por bloques). Entonces $X^tAX=X''^t(N^tAN)X''$, así que la matriz nueva es $A''=N^tAN$, con $|A''|=|N|^2|A|=(\det P)^2|A|=|A|$; y el bloque cuadrático nuevo es $P^tMP=P^{-1}MP$ (la traslación no toca los términos de grado 2), semejante a $M$ ⇒ misma traza y mismo determinante. Además $\operatorname{rang}A''=\operatorname{rang}A$, porque $N$ es regular.</p>
  - receta: |-
      escribe la ecuación analítica y la matriz; da los tres invariantes con su fórmula en términos de los $a_{ij}$; añade una línea de por qué no cambian.
  - error: |-
      citar solo «el determinante» y olvidar la traza de $M$ y $A_{00}$, o confundir $|A|$ (matriz $3\times3$) con $|M|$.
- id: ex-feb18b-pb
  clase: examen
  titulo: |-
    Feb. 2018 (tipo B), problema b) — invariantes de $5x_1^2-3x_1x_2+x_2^2-3x_1+2x_2-5=0$
  fuentes:
  - l: X
    ref: |-
      Feb. 2018 (tipo B), problema, apartado b) (1 punto)
    texto: |-
      X Feb. 2018 (B) pb. b)
  cuerpo:
  - enun: |-
      Calcular los invariantes de la cónica $5x_1^2-3x_1x_2+x_2^2-3x_1+2x_2-5=0$.
  - html: |-
      <div class="box warn"><span class="h">Referencia</span><p>Es el Ejemplo 6.30; sus invariantes están en U <b>Ej. 6.32</b> (p.285).</p></div>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Calcular los invariantes de una cónica.
      - - |-
          Qué se usa
        - |-
          <b>Ecuación matricial (U p.271-280):</b> $a_{11}x_1^2+2a_{12}x_1x_2+a_{22}x_2^2+2a_{01}x_1+2a_{02}x_2+a_{00}=0\iff(1\ x_1\ x_2)A\,(1\ x_1\ x_2)^t=0$, con $A$ simétrica $3\times3$ y parte cuadrática $A_{00}$ ($2\times2$). <b>Invariantes métricos:</b> $|A|$, $|A_{00}|$ y $a_{11}+a_{22}=\operatorname{tr}A_{00}$.
      - - Plan
        - |-
          Matriz $A$ y los tres números.
  - pasos:
    - |-
      <b>Coeficientes:</b> $a_{11}=5$, $2a_{12}=-3\Rightarrow a_{12}=-\tfrac32$, $a_{22}=1$, $2a_{01}=-3\Rightarrow a_{01}=-\tfrac32$, $2a_{02}=2\Rightarrow a_{02}=1$, $a_{00}=-5$.
    - |-
      <p><b>Matriz:</b></p>
            $$A=\begin{pmatrix}-5&-\tfrac32&1\\-\tfrac32&5&-\tfrac32\\1&-\tfrac32&1\end{pmatrix}$$
            <p>(es la de U Ej. 6.29, p.278).</p>
    - |-
      <p><b>$|A|$</b> (Sarrus): diagonales</p>
            $$(-5)(5)(1)+(-\tfrac32)(-\tfrac32)(1)+(1)(-\tfrac32)(-\tfrac32)=-25+\tfrac94+\tfrac94=-\tfrac{41}2;$$
            <p>antidiagonales</p>
            $$(1)(5)(1)+(-5)(-\tfrac32)(-\tfrac32)+(-\tfrac32)(-\tfrac32)(1)=5-\tfrac{45}4+\tfrac94=-4.$$
            <p>$|A|=-\tfrac{41}2-(-4)=-\tfrac{33}2$.</p>
    - |-
      <b>Traza</b> $=5+1=6$. <b>$A_{00}$</b> $=5\cdot1-\tfrac94=\tfrac{11}4$. (Coincide con U Ej. 6.32, p.285.)
    - |-
      <b>Extra para «debidamente justificado»</b> (qué cónica es): $|A|\neq0$ ⇒ rango 3; $A_{00}>0$ ⇒ tipo elipse; $(a_{11}+a_{22})|A|=6\cdot(-\tfrac{33}2)=-99<0$ ⇒ <b>elipse real</b> (U Ej. 6.33, p.287). Su ecuación reducida está más abajo (ampliación, Bloque III).
  - html: |-
      <div class="recipe"><b>Receta (Bloque I):</b> (1) compara con (6.3) dividiendo entre 2 los coeficientes de $x_1x_2$, $x_1$ y $x_2$; (2) $a_{00}$ arriba a la izquierda; (3) $|A|$, traza de $M$ y $|M|$.</div>
  - error: |-
      no dividir entre 2 (sale $a_{01}=-3$ en vez de $-\tfrac32$) o poner $a_{00}$ abajo a la derecha.
- id: ex-feb19b-6
  clase: examen
  titulo: |-
    Feb. 2019 (tipo B), ejercicio 6 — clasificar $x_1^2+4x_2^2-6x_1+8x_2+9=0$
  fuentes:
  - l: X
    ref: |-
      Feb. 2019 (tipo B), ejercicio 6
    texto: |-
      X Feb. 2019 (B) ej. 6
  cuerpo:
  - enun: |-
      Clasificar la cónica de ecuación $x_1^2+4x_2^2-6x_1+8x_2+9=0$.
  - html: |-
      <p>Es la cónica del <a href="#ej6-30">E 6.30</a>.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Clasificar una cónica.
      - - |-
          Qué se usa
        - |-
          <b>Clasificación (cuadro de U p.286):</b> $|A_{00}|>0$ elipse (real, imaginaria o punto), $|A_{00}|<0$ hipérbola (o dos rectas secantes), $|A_{00}|=0$ parábola (o rectas paralelas/doble). Es no degenerada $\iff|A|\neq0$.
      - - Plan
        - |-
          Invariantes y cuadro.
  - pasos:
    - |-
      $$A=\begin{pmatrix}9&-3&4\\-3&1&0\\4&0&4\end{pmatrix},$$
            <p>$|A|=-16\neq0$ ⇒ rango 3, no degenerada.</p>
    - |-
      $A_{00}=4>0$ ⇒ elipse; $(a_{11}+a_{22})|A|=5(-16)<0$ ⇒ <b>elipse real</b>.
    - |-
      <b>Opcional (añade valor):</b> reducida $\dfrac{x_1''^2}{4}+x_2''^2=1$ con $x_1''=x_1-3$, $x_2''=x_2+1$. Centro $(3,-1)$; $a=2$, $b=1$, $c=\sqrt{4-1}=\sqrt3$; focos $(3\pm\sqrt3,-1)$; vértices $(1,-1)$, $(5,-1)$, $(3,0)$, $(3,-2)$.
  - html: |-
      <div class="recipe"><b>Receta (Bloque II):</b> $|A|$ → ¿degenerada?; $A_{00}$ → elipse/hipérbola/parábola; si elipse, signo de $(a_{11}+a_{22})|A|$. Si $|A|=0$: rango y la rama «rango 2/1».</div>
  - error: |-
      decir «elipse» sin aclarar si es real o imaginaria.
- id: ex-sep17-6
  clase: examen
  titulo: |-
    Sept. 2017 (tipo A1), ejercicio 6 — ¿qué cónica es $x_2^2+2x_1x_2+x_1^2-2x_2+x_1+1=0$?
  fuentes:
  - l: X
    ref: |-
      Sept. 2017 (tipo A1), ejercicio 6 (test: acierto +1, fallo −0,33)
    texto: |-
      X Sept. 2017 (A1) ej. 6
  cuerpo:
  - enun: |-
      La cónica de ecuación $x_2^2+2x_1x_2+x_1^2-2x_2+x_1+1=0$ es: A) Una parábola; B) Una elipse; C) Una recta doble; D) Ninguna de las anteriores.
  - html: |-
      <p>La segunda opción («Una elipse») es la B. Es la cónica del Ej. 6.34 de U (p.287); la respuesta correcta es «A) es cierta».</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Decidir qué cónica es entre varias opciones.
      - - |-
          Qué se usa
        - |-
          <b>Clasificación (cuadro de U p.286):</b> $|A_{00}|>0$ elipse (real, imaginaria o punto), $|A_{00}|<0$ hipérbola (o dos rectas secantes), $|A_{00}|=0$ parábola (o rectas paralelas/doble). Es no degenerada $\iff|A|\neq0$.
      - - Plan
        - |-
          $|A_{00}|=0$ y $|A|$.
  - pasos:
    - |-
      <p><b>Coeficientes:</b> $a_{11}=1$, $a_{22}=1$, $a_{12}=1$, $a_{01}=\tfrac12$, $a_{02}=-1$, $a_{00}=1$:</p>
            $$A=\begin{pmatrix}1&\tfrac12&-1\\\tfrac12&1&1\\-1&1&1\end{pmatrix}.$$
    - |-
      <p><b>$|A|$</b> (Sarrus):</p>
            $$1\cdot1\cdot1+\tfrac12\cdot1\cdot(-1)+(-1)\cdot\tfrac12\cdot1-\big[(-1)\cdot1\cdot(-1)+1\cdot1\cdot1+1\cdot\tfrac12\cdot\tfrac12\big]=(1-\tfrac12-\tfrac12)-(1+1+\tfrac14)=-\tfrac94\neq0$$
            <p>⇒ rango 3, no degenerada (descarta C: una recta doble tiene rango 1).</p>
    - |-
      <b>$A_{00}$</b> $=1\cdot1-1^2=0$ ⇒ <b>parábola</b> (descarta B, que exigiría $A_{00}>0$). Respuesta <b>A</b>.
    - |-
      <p><b>Comprobación por reducción</b> (opcional):</p>
            $$M=\begin{pmatrix}1&1\\1&1\end{pmatrix},$$
            <p>valores propios $2$ y $0$ con $u_1=\tfrac1{\sqrt2}(1,1)$, $u_2=\tfrac1{\sqrt2}(-1,1)$;</p>
            $$P=\tfrac1{\sqrt2}\begin{pmatrix}1&-1\\1&1\end{pmatrix}$$
            <p>($\det P=1$, giro de 45°). La ecuación queda $2y_1^2-\tfrac{\sqrt2}2y_1-\tfrac{3\sqrt2}2y_2+1=0$ y, completando,</p>
            $$2\big(y_1-\tfrac{\sqrt2}8\big)^2=\tfrac{3\sqrt2}2\big(y_2-\tfrac{5\sqrt2}{16}\big),$$
            <p>es decir $y_1''^2=\tfrac{3\sqrt2}{4}\,y_2''$: parábola de vértice $(x_1,x_2)=(-\tfrac3{16},\tfrac7{16})$.</p>
  - receta: |-
      en un test, calcula $|A|$ y $A_{00}$ y descarta opciones con la condición que le falta a cada una.
  - error: |-
      concluir «parábola» con $A_{00}=0$ sin comprobar $|A|\neq0$ (podrían ser rectas paralelas).
- id: ex-ene22-pa
  clase: examen
  titulo: |-
    Ene. 2022 (tipo A1), problema a) — ecuación reducida de $x_1^2+4x_2^2-4x_1-16x_2+19=0$
  fuentes:
  - l: X
    ref: |-
      Ene. 2022 (tipo A1), problema, apartado a) (2 puntos)
    texto: |-
      X Ene. 2022 (A1) pb. a)
  cuerpo:
  - enun: |-
      Calcular la ecuación reducida de la cónica $x_1^2+4x_2^2-4x_1-16x_2+19=0$ (2 puntos).
  - html: |-
      <div class="box warn"><span class="h">Nota</span><p>Es exactamente el <a href="#ej6-28">E 6.28</a>.</p></div>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Ecuación reducida de una cónica.
      - - |-
          Qué se usa
        - |-
          <b>Ecuación reducida:</b> girar (diagonalizar $A_{00}$ ortogonalmente) y trasladar (completar cuadrados). Elipse $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$, hipérbola $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$, parábola $y^2=2px$.
      - - Plan
        - |-
          Giro y traslación.
  - pasos:
    - |-
      No hay término $x_1x_2$ ($a_{12}=0$) ⇒ <b>no se necesita giro</b>.
    - |-
      <b>Completar cuadrados:</b> $(x_1-2)^2+4(x_2-2)^2-1=0$.
    - |-
      <b>Traslación</b> $x_1'=x_1-2$, $x_2'=x_2-2$ ⇒ <b>$x_1'^2+4x_2'^2=1$</b>, elipse de centro $(2,2)$ y semiejes $1$ y $\tfrac12$.
    - |-
      <b>Comprobación por invariantes</b> (recomendable en un problema): $|A|=-4$, $A_{00}=4>0$, $5\cdot(-4)<0$ ⇒ elipse real ✓.
  - receta: |-
      la del E 6.28; escribe siempre el cambio de variables.
  - error: |-
      dar solo «$x_1^2+4x_2^2=1$» sin indicar que son coordenadas trasladadas.
- id: ex-feb18b-red
  clase: propio
  titulo: |-
    Ampliación de Feb. 2018 (B), problema b) — ecuación reducida de $5x_1^2-3x_1x_2+x_2^2-3x_1+2x_2-5=0$
  fuentes:
  - l: P
    ref: |-
      Ampliación propia del problema de Feb. 2018 (B); el examen solo pide los invariantes; método de U Ej. 6.31 p. 283-284; verificado con sympy
    texto: propio
  cuerpo:
  - enun: |-
      (El examen solo pide los invariantes; se reduce aquí como ejemplo completo de giro + traslación con valores propios racionales.)
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Reducir una cónica completa con giro y traslación.
      - - |-
          Qué se usa
        - |-
          <b>Ecuación reducida:</b> girar (diagonalizar $A_{00}$ ortogonalmente) y trasladar (completar cuadrados). Elipse $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$, hipérbola $\frac{x^2}{a^2}-\frac{y^2}{b^2}=1$, parábola $y^2=2px$.
      - - Plan
        - |-
          Valores propios racionales y completar cuadrados.
  - pasos:
    - |-
      <p><b>Giro.</b></p>
            $$M=\begin{pmatrix}5&-\tfrac32\\-\tfrac32&1\end{pmatrix}:$$
            $$\lambda^2-6\lambda+\tfrac{11}4=0\Rightarrow\lambda=\tfrac{6\pm5}2,$$
            <p>o sea $\lambda_1=\tfrac{11}2$ y $\lambda_2=\tfrac12$.</p>
    - |-
      <p><b>Vectores propios.</b> $\lambda_1$: $-\tfrac12x_1-\tfrac32x_2=0\Rightarrow(3,-1)$. $\lambda_2$: $\tfrac92x_1-\tfrac32x_2=0\Rightarrow(1,3)$.</p>
            $$P=\tfrac1{\sqrt{10}}\begin{pmatrix}3&1\\-1&3\end{pmatrix},$$
            <p>$\det P=1$.</p>
    - |-
      <p><b>Parte lineal:</b></p>
            $$(-3\ \ 2)P=\big(-\tfrac{11}{\sqrt{10}}\ \ \tfrac3{\sqrt{10}}\big).$$
            <p>Ecuación:</p>
            $$\tfrac{11}2y_1^2+\tfrac12y_2^2-\tfrac{11}{\sqrt{10}}y_1+\tfrac3{\sqrt{10}}y_2-5=0$$
            <p>(con $y=x'$ las coordenadas giradas).</p>
    - |-
      <p><b>Completar cuadrados:</b></p>
            $$\tfrac{11}2\big(y_1-\tfrac1{\sqrt{10}}\big)^2-\tfrac{11}{20}+\tfrac12\big(y_2+\tfrac3{\sqrt{10}}\big)^2-\tfrac9{20}-5=0\Rightarrow\tfrac{11}2y_1''^2+\tfrac12y_2''^2=6\Rightarrow\dfrac{y_1''^2}{12/11}+\dfrac{y_2''^2}{12}=1.$$
    - |-
      <p><b>Centro</b></p>
            $$y=(\tfrac1{\sqrt{10}},-\tfrac3{\sqrt{10}})\Rightarrow x=Py=(0,-1).$$
            <p>Semiejes $\sqrt{12/11}$ (en la dirección $(3,-1)$) y $2\sqrt3$ (dirección $(1,3)$); $c^2=12-\tfrac{12}{11}=\tfrac{120}{11}$.</p>
    - |-
      <b>Control con invariantes:</b> la reducida $\operatorname{diag}(-6,\tfrac{11}2,\tfrac12)$ da $|A'|=-6\cdot\tfrac{11}4=-\tfrac{33}2$ ✓, traza $6$ ✓ y $A_{00}=\tfrac{11}4$ ✓ (y $d=|A|/A_{00}=-6$ ✓). <i>(Cárgalo en la animación con «Feb. 2018 B».)</i>
  - html: |-
      <div class="recipe"><b>Receta (Bloque III):</b> (1) valores y vectores propios unitarios de $M$ ⇒ $P$ con $\det P=1$; (2) $X=PY$: parte cuadrática $\lambda_1y_1^2+\lambda_2y_2^2$ y parte lineal $2(a_{01}\ a_{02})P\,Y$; (3) completar cuadrados y trasladar; (4) llevar a la forma de la Def. 6.18; (5) controlar con los invariantes.</div>
  - error: |-
      olvidar transformar la parte lineal al girar (solo se diagonaliza la cuadrática).
- id: ex-feb19a-6
  clase: examen
  titulo: |-
    Feb. 2019 (tipo A), ejercicio 6 — ¿para qué $\alpha$ es parábola $1+x_1^2+2x_1x_2+x_2^2+2\alpha x_2=0$?
  fuentes:
  - l: X
    ref: |-
      Feb. 2019 (tipo A), ejercicio 6
    texto: |-
      X Feb. 2019 (A) ej. 6
  cuerpo:
  - enun: |-
      Determinar, si es posible, los valores de $\alpha\in\mathbb R$ para que la ecuación $1+x_1^2+2x_1x_2+x_2^2+2\alpha x_2=0$ defina una parábola.
  - html: |-
      <p>Es el <a href="#ej6-31">E 6.31</a> con $\lambda=\mu=1$ (ya cumple $\mu=\lambda^2$); $|A|=-\alpha^2$.</p>
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Valores de $\alpha$ para parábola.
      - - |-
          Qué se usa
        - |-
          <b>Condiciones con parámetros:</b> degenerada $\iff|A|=0$; parábola $\iff|A_{00}|=0$ y $|A|\neq0$; elipse real $\iff|A_{00}|>0$ y $|A|\cdot\operatorname{tr}A_{00}<0$.
      - - Plan
        - |-
          $|A_{00}|=0$ y $|A|\neq0$.
  - pasos:
    - |-
      $$A=\begin{pmatrix}1&0&\alpha\\0&1&1\\\alpha&1&1\end{pmatrix};$$
            <p>$A_{00}=1\cdot1-1^2=0$ para todo $\alpha$ (la parte cuadrática es $(x_1+x_2)^2$).</p>
    - |-
      $|A|=1(1-1)-0+\alpha(0-\alpha)=-\alpha^2$.
    - |-
      Parábola $\iff|A|\neq0\iff$ <b>$\alpha\neq0$</b>.
    - |-
      Si $\alpha=0$: $(x_1+x_2)^2=-1$, rectas paralelas imaginarias (rango 2, $A_{11}=A_{22}=1>0$).
  - html: |-
      <div class="recipe"><b>Receta (Bloque IV):</b> escribe $A$ y $A_{00}$ en función del parámetro; traduce «parábola» a ($A_{00}=0$ y $|A|\neq0$) y resuelve; revisa los valores frontera.</div>
  - error: |-
      responder «para todo $\alpha$» porque $A_{00}=0$ siempre, sin ver que $|A|=-\alpha^2$ se anula en $\alpha=0$.
