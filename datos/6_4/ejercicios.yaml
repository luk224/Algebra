  problema:
  - param
  nivel: 3
  titulo: |-
    Feb. 2019 (tipo A), ejercicio 6 — ¿para qué $\alpha$ es parábola $1+x_1^2+2x_1x_2+x_2^2+2\alpha x_2=0$?
  enunciado: |-
    Determinar, si es posible, los valores de $\alpha\in\mathbb R$ para que la ecuación $1+x_1^2+2x_1x_2+x_2^2+2\alpha x_2=0$ defina una parábola.
  pista: |-
    Parábola exige $A_{00}=0$ y $|A|\neq0$. Aquí la parte cuadrática ya cumple lo primero; calcula $|A|$ en función de $\alpha$ y mira qué valores lo hacen distinto de cero.
  cuerpo:
  - plan:
      titulo: |-
        Antes de calcular
      filas:
      - - |-
          Qué se pide
        - |-
          Valores de $\alpha$ para parábola.
      - - |-
          Qué se usa
        - |-
          <b>Condiciones con parámetros:</b> parábola $\iff|A_{00}|=0,\ |A|\neq0$ — <a href="#s4">ver teoría</a>.
      - - Plan
        - |-
          $|A_{00}|=0$ y $|A|\neq0$.
  - redaccion:
    - |-
      <p>Matriz asociada:</p>
      $$A=\begin{pmatrix}1&0&\alpha\\0&1&1\\\alpha&1&1\end{pmatrix}.$$
      <p>$A_{00}=1\cdot1-1^2=0$ para todo $\alpha$ (la parte cuadrática es $(x_1+x_2)^2$).</p>
    - |-
      <p>Determinante:</p>
      $$|A|=1(1-1)-0+\alpha(0-\alpha)=-\alpha^2.$$
    - |-
      Parábola $\iff A_{00}=0$ y $|A|\neq0\iff$ <b>$\alpha\neq0$</b>.
    - |-
      Para $\alpha=0$ la ecuación es $(x_1+x_2)^2=-1$: rectas paralelas imaginarias (rango 2), no parábola.
  - comentarios:
    - |-
      Es el <a href="#ej6-31">E 6.31</a> con $\lambda=\mu=1$ (ya cumple $\mu=\lambda^2$); $|A|=-\alpha^2$.
    - |-
      En $\alpha=0$: rango 2 con $A_{11}=A_{22}=1>0$, lo que corresponde a rectas paralelas imaginarias.
  - receta: |-
      escribe $A$ y $A_{00}$ en función del parámetro; traduce «parábola» a ($A_{00}=0$ y $|A|\neq0$) y resuelve; revisa los valores frontera.
  - error: |-
      responder «para todo $\alpha$» porque $A_{00}=0$ siempre, sin ver que $|A|=-\alpha^2$ se anula en $\alpha=0$.
